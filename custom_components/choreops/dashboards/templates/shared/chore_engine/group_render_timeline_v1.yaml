{%- set tl = namespace(total=0, idx=0) -%}
{%- for tl_group in button_groups -%}
	{%- if tl_group.buttons | length > 0 -%}
		{%- set tl.total = tl.total + 1 -%}
	{%- endif -%}
{%- endfor -%}
{%- for group in button_groups -%}
	{%- set ns.group_cards = [] -%}
	{%- if group.buttons | length > 0 -%}
		{%- set tl.idx = tl.idx + 1 -%}
		{%- set g_name = group.name | replace('!!!!!!!!!!! ', '') | replace(' !!!!!!!!!!!', '') -%}
		{%- set g_name_safe = g_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
		{%- set is_overdue = 'alert' in group.icon or 'overdue' in g_name | lower -%}
		{%- set g_color = 'var(--error-color)' if is_overdue else 'var(--primary-color)' -%}
		{%- set g_rail_top = '50%' if tl.idx == 1 else '0px' -%}

		{{
			{
				'type': 'custom:button-card',
				'show_name': false,
				'show_icon': false,
				'tap_action': {'action': 'none'},
				'hold_action': {'action': 'none'},
				'custom_fields': {
					'label': "<div style='display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:" ~ g_color ~ ";'><ha-icon icon='" ~ group.icon ~ "' style='width:16px;height:16px;--mdc-icon-size:16px;color:" ~ g_color ~ ";display:block;flex:0 0 auto;'></ha-icon><span style='white-space:nowrap;'>" ~ g_name_safe ~ "</span><span style='flex:1;height:1px;background:color-mix(in srgb, " ~ g_color ~ " 30%, var(--divider-color));'></span><span style='min-width:18px;padding:1px 8px;border-radius:999px;text-align:center;background:color-mix(in srgb, " ~ g_color ~ " 14%, var(--card-background-color));'>" ~ (group.buttons | length) | string ~ "</span></div>",
					'rail': "<div style='position:relative;width:100%;height:100%;'><div style='position:absolute;left:calc(50% - 1px);width:2px;top:" ~ g_rail_top ~ ";bottom:-8px;background:var(--divider-color);'></div></div>"
				},
				'styles': {
					'card': [
						{'background': 'transparent'},
						{'box-shadow': 'none'},
						{'border': 'none'},
						{'border-radius': '0px'},
						{'padding': '0px'},
						{'min-height': 'unset'},
						{'overflow': 'visible'},
						{'margin': '0px'}
					],
					'grid': [
						{'grid-template-areas': '". rail label"'},
						{'grid-template-columns': '62px 22px minmax(0, 1fr)'},
						{'column-gap': '0px'},
						{'align-items': 'center'}
					],
					'custom_fields': {
						'label': [
							{'justify-self': 'stretch'},
							{'padding': '6px 0px 2px 14px'},
							{'overflow': 'visible'}
						],
						'rail': [
							{'align-self': 'stretch'},
							{'justify-self': 'stretch'},
							{'height': '100%'},
							{'overflow': 'visible'}
						]
					}
				}
			}
		}},

		{%- for chore_sensor_id in group.buttons -%}
			{%- set ns.group_cards = ns.group_cards + [
				{
					'type': 'custom:button-card',
					'template': chore_row_template_name,
					'entity': chore_sensor_id,
					'variables': {
						'translation_sensor_eid': translation_sensor,
						'pref_show_chore_description': pref_show_chore_description,
						'pref_claim_accent': pref_claim_accent,
						'pref_due_accent': pref_due_accent,
						'pref_overdue_accent': pref_overdue_accent,
						'pref_steal_accent': pref_steal_accent,
						'pref_standby_accent': pref_standby_accent,
						'pref_points_precision': pref_points_precision,
						'gamification_enabled': gamification_enabled,
						'points_label': points_label,
						'points_icon': points_icon,
						'timeline_group_id': (group.id | default('', true) | string),
						'timeline_first': false,
						'timeline_last': (tl.idx == tl.total and loop.last)
					}
				}
			] -%}
		{%- endfor -%}

		{{
			{
				'type': 'grid',
				'columns': 1,
				'square': false,
				'cards': ns.group_cards
			}
		}},
	{%- endif -%}
{%- endfor -%}
