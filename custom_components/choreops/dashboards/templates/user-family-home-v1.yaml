<#-- ============================================= --#>
<#-- ChoreOps Dashboard Template - FAMILY HOME --#>
<#-- Template Schema Version: 1                --#>
<#-- ============================================= --#>
<#--                                             --#>
<#-- Family Home: tappable person cards, family  --#>
<#-- goals tiles, and family achievements on one --#>
<#-- page. Person cards open the Family Hub page --#>
<#-- of that person (family-hub-<name>).         --#>
<#-- OUTPUT: Full dashboard document with root keys --#>
<#--                                             --#>
<#-- No injection needed (added automatically as the first tab with Family Hub) --#>
<#-- ============================================= --#>

<#-- Label strips card, used twice: spot 'top' holds only the Important strip, spot 'rest' every other label --#>
<% macro label_strips(spot) %>
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== LABEL STRIPS: labeled goal badges and today's labeled chores, one strip per label ===== --#}
              {%- set helpers = integration_entities('choreops')
                | select('search', '^sensor\\.')
                | list
                | expand
                | selectattr('attributes.purpose', 'defined')
                | selectattr('attributes.purpose', 'eq', 'purpose_dashboard_helper')
                | list -%}
              {%- set pref_users = << home.user_names >> -%}
              {%- if pref_users | length > 0 -%}
                {%- set helpers = helpers | selectattr('attributes.user_name', 'in', pref_users) | list -%}
              {%- endif -%}
              {%- set tsensor = ((helpers | first).attributes.get('dashboard_helpers') or {}).get('translation_sensor_eid') if helpers else none -%}
              {%- set ui = (state_attr(tsensor, 'ui_translations') if tsensor else {}) or {} -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set ns = namespace(b={}, c={}, colors={}) -%}
              {%- for h in helpers -%}
                {%- set uname = (h.attributes.get('user_name') or '') | string -%}
                {%- if uname == '' -%}{%- continue -%}{%- endif -%}
                {#-- Badges: the same periodic/daily/special badges as Goals, but only the labeled ones --#}
                {%- for badge in (h.attributes.get('badges') or []) -%}
                  {%- set blabel = ((badge.get('labels') or [{}]) | first) if badge is mapping else {} -%}
                  {%- set blabel = blabel if blabel is mapping else {} -%}
                  {%- set lname = (blabel.get('name') or '') | string -%}
                  {%- if lname != '' and badge.get('eid') not in ['', 'None', 'unknown', 'unavailable', none] and (badge.get('badge_type') | string | lower) in ['periodic', 'daily', 'special_occasion'] -%}
                    {%- set be = badge.get('eid') -%}
                    {%- set ba = states[be].attributes | default({}, true) -%}
                    {%- set rs = ba.get('reset_schedule') if ba.get('reset_schedule') is mapping else {} -%}
                    {%- set bname = (ba.get('badge_name') or badge.get('name') or state_attr(be, 'friendly_name') or '') | string -%}
                    {%- set status = (ba.get('status') or badge.get('status') or 'in_progress') | string | lower -%}
                    {%- set prog = states(be) | float(default=0) -%}
                    {%- set prog = 0 if prog < 0 else (100 if prog > 100 else prog) -%}
                    {%- set earned = status in ['earned', 'completed'] -%}
                    {%- set t_req = ba.get('today_chores_required') | int(default=0) -%}
                    {%- if not earned and t_req > 0 and (ba.get('threshold_value') | float(default=0)) <= 1 -%}
                      {%- set prog = [100, (ba.get('today_chores_done') | int(default=0)) * 100 / t_req] | min -%}
                    {%- endif -%}
                    {%- set b_end = ((ba.get('end_date') or rs.get('end_date') or '') | string) | regex_replace('T.*$', '') -%}
                    {%- set dl = (((as_timestamp(b_end ~ 'T12:00:00') - as_timestamp(today ~ 'T12:00:00')) / 86400) | round(0) | int) if b_end | length > 0 else 999 -%}
                    {%- if blabel.get('color') and lname not in ns.colors -%}{%- set ns.colors = ns.colors | combine({lname: blabel.get('color') | string}) -%}{%- endif -%}
                    {%- set grp = ns.b.get(lname, {}) -%}
                    {%- set cur = grp.get(bname, {'name': bname, 'icon': (ba.get('icon') or 'mdi:medal-outline') | string, 'own': (badge.get('color') or '') | string, 'left': dl, 'people': []}) -%}
                    {%- set cur = cur | combine({'people': cur.people + [{'u': uname, 'p': prog, 'e': earned}]}) -%}
                    {%- set ns.b = ns.b | combine({lname: grp | combine({bname: cur})}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {#-- Chores: labeled chores that belong to today (due today, overdue, or done today) --#}
                {%- for ch in (h.attributes.get('chores') or []) -%}
                  {%- set clabel = ((ch.get('labels') or [{}]) | first) if ch is mapping else {} -%}
                  {%- set clabel = clabel if clabel is mapping else {} -%}
                  {%- set lname = (clabel.get('name') or '') | string -%}
                  {%- set cst = (ch.get('state') or '') | string | lower if ch is mapping else '' -%}
                  {%- if lname != '' and ch.get('primary_group') == 'today' and cst not in ['not_my_turn', 'standby', 'paused'] -%}
                    {%- set kind = 'done' if cst in ['approved', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'] else ('claimed' if cst in ['claimed', 'claimed_in_part'] else ('overdue' if cst in ['overdue', 'missed'] else 'due')) -%}
                    {%- if clabel.get('color') and lname not in ns.colors -%}{%- set ns.colors = ns.colors | combine({lname: clabel.get('color') | string}) -%}{%- endif -%}
                    {%- set cname = (ch.get('name') or '') | string -%}
                    {%- set grp = ns.c.get(lname, {}) -%}
                    {%- set cur = grp.get(cname, {'name': cname, 'people': []}) -%}
                    {%- set cur = cur | combine({'people': cur.people + [{'u': uname, 'k': kind}]}) -%}
                    {%- set ns.c = ns.c | combine({lname: grp | combine({cname: cur})}) -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- set kcol = {'done': 'var(--success-color)', 'claimed': 'var(--primary-color)', 'due': 'var(--warning-color)', 'overdue': 'var(--error-color)'} -%}
              {#-- An "Important" label (any case) gets its own strip at the top of the Family column; the rest sit under the person cards --#}
              {%- set spot = '<< spot >>' -%}
              {%- for lname in ((ns.b.keys() | list) + (ns.c.keys() | list)) | unique | sort(case_sensitive=false) -%}
                {%- if (lname | lower | trim == 'important') != (spot == 'top') -%}{%- continue -%}{%- endif -%}
                {%- set col = ns.colors.get(lname) or 'var(--primary-color)' -%}
                {%- set esc_l = lname | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                {#-- Badge chips: soonest ending first, finished last (same order as Goals) --#}
                {%- set items = namespace(l=[]) -%}
                {%- for qn, q in ns.b.get(lname, {}).items() -%}
                  {%- set top = (q.people | map(attribute='p') | list | max) if q.people else 0 -%}
                  {%- set alldone = q.people | length > 0 and (q.people | selectattr('e') | list | length) == (q.people | length) -%}
                  {%- set items.l = items.l + [q | combine({'top': top, 'alldone': alldone, 'key': [(1 if alldone else 0), (1 if q.left >= 999 else 0), (q.left if q.left < 999 else 0), (100 - top), qn | lower]})] -%}
                {%- endfor -%}
                {%- set bx = namespace(v='') -%}
                {%- for q in items.l | sort(attribute='key') -%}
                  {%- set icol = q.own or col -%}
                  {%- set urgent = (not q.alldone) and q.left >= 0 and q.left <= 3 -%}
                  {%- set ttxt = (ui.get('ends_today', 'Ends today') if q.left == 0 else (ui.get('one_day_left', '1 day left') if q.left == 1 else (q.left ~ ' ' ~ ui.get('days_left', 'days left')))) if (q.left < 999 and q.left >= 0) else ui.get('no_end', 'no end') -%}
                  {%- set dots = namespace(v='') -%}
                  {%- for pp in (q.people | selectattr('e') | list) + (q.people | rejectattr('e') | list) -%}
                    {%- set dots.v = dots.v ~ "<span style='width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;" ~ ("background:var(--success-color);color:#fff;" if pp.e else ("background:var(--primary-color);color:#fff;" if pp.p > 0 else "border:1.5px solid var(--divider-color);color:var(--secondary-text-color);")) ~ "'>" ~ ('✓' if pp.e else (pp.u[:1] | upper)) ~ "</span>" -%}
                  {%- endfor -%}
                  {%- set bx.v = bx.v ~ "<div style='flex:0 0 auto;min-width:150px;max-width:220px;border-radius:12px;background:color-mix(in srgb," ~ col ~ " 12%,var(--card-background-color));border:1px solid color-mix(in srgb," ~ col ~ " 30%,transparent);padding:6px 8px;box-sizing:border-box;'>"
                    ~ "<div style='display:flex;align-items:center;gap:6px;'><div style='width:22px;height:22px;border-radius:7px;background:" ~ icol ~ ";display:flex;align-items:center;justify-content:center;flex:0 0 auto;'><ha-icon icon='" ~ q.icon ~ "' style='width:14px;height:14px;--mdc-icon-size:14px;color:#fff;display:block;'></ha-icon></div>"
                    ~ "<div style='font-size:12px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" ~ (q.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;')) ~ "</div></div>"
                    ~ "<div style='height:4px;border-radius:3px;background:var(--divider-color);margin:6px 0;'><div style='height:4px;border-radius:3px;width:" ~ (100 if q.alldone else (q.top | round(0) | int)) ~ "%;background:" ~ ('var(--success-color)' if q.alldone else col) ~ ";'></div></div>"
                    ~ "<div style='display:flex;align-items:center;justify-content:space-between;gap:6px;'><span style='display:inline-flex;gap:3px;'>" ~ dots.v ~ "</span>"
                    ~ "<span style='display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;white-space:nowrap;color:" ~ ('var(--warning-color)' if urgent else 'var(--secondary-text-color)') ~ ";'><ha-icon icon='mdi:clock-outline' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" ~ ttxt ~ "</span></div></div>" -%}
                {%- endfor -%}
                {#-- Chore pills: who still owes it, in its state color; green tick when everyone is done --#}
                {%- set cx = namespace(v='', done=0, n=0) -%}
                {%- for cn, c in ns.c.get(lname, {}).items() | sort(attribute='0') -%}
                  {%- set kinds = c.people | map(attribute='k') | list -%}
                  {%- set alldone = kinds | reject('eq', 'done') | list | length == 0 -%}
                  {%- set worst = 'done' if alldone else ('overdue' if 'overdue' in kinds else ('due' if 'due' in kinds else 'claimed')) -%}
                  {%- set cx.n = cx.n + 1 -%}
                  {%- set cx.done = cx.done + (1 if alldone else 0) -%}
                  {%- set owe = namespace(v='') -%}
                  {%- for pp in c.people | rejectattr('k', 'eq', 'done') -%}
                    {%- set owe.v = owe.v ~ "<span style='width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;background:" ~ kcol[pp.k] ~ ";'>" ~ (pp.u[:1] | upper) ~ "</span>" -%}
                  {%- endfor -%}
                  {%- set cx.v = cx.v ~ "<span style='display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px " ~ ('8px' if alldone else '4px') ~ " 3px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb," ~ kcol[worst] ~ " 14%,transparent);color:" ~ kcol[worst] ~ ";'>" ~ ('✓ ' if alldone else '') ~ (cn | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;')) ~ owe.v ~ "</span>" -%}
                {%- endfor -%}
                {%- set count_txt = (cx.done ~ '/' ~ cx.n ~ ' ' ~ (ui.get('chores', 'Chores') | lower) ~ ' ' ~ (ui.get('done', 'Done') | lower)) if cx.n > 0 else '' -%}
                {%- set html = "<div style='width:100%;text-align:left;'>"
                  ~ "<div style='display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;'><span style='display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:" ~ col ~ ";'><span style='width:8px;height:8px;border-radius:50%;background:" ~ col ~ ";'></span>" ~ esc_l ~ "</span>"
                  ~ "<span style='font-size:10.5px;font-weight:700;color:var(--secondary-text-color);white-space:nowrap;'>" ~ count_txt ~ "</span></div>"
                  ~ (("<div style='display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;'>" ~ bx.v ~ "</div>") if bx.v else '')
                  ~ (("<div style='display:flex;flex-wrap:wrap;gap:5px;margin-top:" ~ ('7px' if bx.v else '0') ~ ";'>" ~ cx.v ~ "</div>") if cx.v else '')
                  ~ "</div>" -%}
                {{
                  {
                    'type': 'custom:button-card',
                    'show_name': false,
                    'show_icon': false,
                    'tap_action': {'action': 'none'},
                    'hold_action': {'action': 'none'},
                    'custom_fields': {'content': html},
                    'styles': {
                      'card': [
                        {'padding': '8px 10px'},
                        {'border-radius': '14px'},
                        {'box-shadow': 'none'},
                        {'cursor': 'default'},
                        {'border': '1px solid color-mix(in srgb, ' ~ col ~ ' 45%, transparent)'},
                        {'background': 'linear-gradient(90deg, color-mix(in srgb, ' ~ col ~ ' 16%, var(--card-background-color)), var(--card-background-color))'}
                      ],
                      'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                      'custom_fields': {'content': [{'width': '100%'}, {'overflow': 'hidden'}]}
                    }
                  }
                }},
              {%- endfor -%}
<% endmacro %>

views:
- title: << t.get('home', 'Home') >>
  path: home
  max_columns: 3
  sections:
    - type: grid
      cards:
        - type: heading
          heading: << t.get('family', 'Family') >>
          heading_style: title
          icon: mdi:account-group
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== SUMMARY + OPSCENTER ===== --#}
              {%- set pref_dashboard_path = '' -%}  {#-- Optional: dashboard URL path (for example 'dashboard-choreops'). Leave empty to use paths relative to this dashboard. --#}
              {%- set helpers = integration_entities('choreops')
                | select('search', '^sensor\\.')
                | list
                | expand
                | selectattr('attributes.purpose', 'defined')
                | selectattr('attributes.purpose', 'eq', 'purpose_dashboard_helper')
                | list -%}
              {%- set pref_users = << home.user_names >> -%}
              {%- if pref_users | length > 0 -%}
                {%- set helpers = helpers | selectattr('attributes.user_name', 'in', pref_users) | list -%}
              {%- endif -%}
              {%- set tsensor = ((helpers | first).attributes.get('dashboard_helpers') or {}).get('translation_sensor_eid') if helpers else none -%}
              {%- set ui = (state_attr(tsensor, 'ui_translations') if tsensor else {}) or {} -%}
              {%- set t = namespace(over=0, due=0, worst='', worst_n=0, pending_c=0, pending_r=0, people=0) -%}
              {%- for h in helpers -%}
                {%- set ha = h.attributes -%}
                {%- set uname = (ha.get('user_name') or '') | string -%}
                {%- if uname == '' -%}{%- continue -%}{%- endif -%}
                {%- set total_sensor = (ha.get('core_sensors') or {}).get('chores_eid') -%}
                {%- set o = (state_attr(total_sensor, 'chore_stat_current_overdue') | int(default=0)) if total_sensor else 0 -%}
                {%- set d = (state_attr(total_sensor, 'chore_stat_current_due_today') | int(default=0)) if total_sensor else 0 -%}
                {%- set t.over = t.over + o -%}
                {%- set t.due = t.due + d -%}
                {%- set t.people = t.people + 1 -%}
                {%- if o > t.worst_n -%}
                  {%- set t.worst = uname -%}{%- set t.worst_n = o -%}
                {%- endif -%}
                {%- set pa = ha.get('pending_approvals') or {} -%}
                {%- set t.pending_c = t.pending_c + ((pa.get('chores') or []) | length if pa is mapping else 0) -%}
                {%- set t.pending_r = t.pending_r + ((pa.get('rewards') or []) | length if pa is mapping else 0) -%}
              {%- endfor -%}
              {%- if t.people > 0 -%}
                {%- if t.over > 0 -%}
                  {%- set col = 'var(--error-color)' -%}{%- set ic = 'mdi:alert-octagon' -%}
                  {%- set head = (t.due | string) ~ ' ' ~ (ui.get('due_today', 'Due Today') | lower) ~ ' · ' ~ (t.over | string) ~ ' ' ~ (ui.get('overdue', 'Overdue') | lower) -%}
                  {%- set sub = ui.get('most_overdue', 'Most overdue') ~ ': ' ~ (t.worst | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;')) ~ ' (' ~ (t.worst_n | string) ~ ')' -%}
                {%- elif t.due > 0 -%}
                  {%- set col = 'var(--warning-color)' -%}{%- set ic = 'mdi:calendar-clock' -%}
                  {%- set head = (t.due | string) ~ ' ' ~ (ui.get('due_today', 'Due Today') | lower) -%}
                  {%- set sub = ui.get('nothing_overdue', 'Nothing overdue') -%}
                {%- else -%}
                  {%- set col = 'var(--success-color)' -%}{%- set ic = 'mdi:check-circle' -%}
                  {%- set head = ui.get('everyone_caught_up', 'All caught up') -%}
                  {%- set sub = ui.get('nothing_due_right_now', 'Nothing due or overdue right now') -%}
                {%- endif -%}
                {%- set html = "<div style='display:flex;align-items:center;gap:10px;text-align:left;'><ha-icon icon='" ~ ic ~ "' style='width:22px;height:22px;--mdc-icon-size:22px;color:" ~ col ~ ";flex:none;'></ha-icon><div style='flex:1;min-width:0;'><div style='font-size:14px;font-weight:700;'>" ~ head ~ "</div><div style='font-size:11px;opacity:.7;'>" ~ sub ~ "</div></div></div>" -%}
                {%- set bcol = 'color-mix(in srgb,' ~ col ~ ' 45%, var(--divider-color))' -%}
                {%- set bg = 'color-mix(in srgb,' ~ col ~ ' 10%, var(--card-background-color))' -%}
                {{
                  {
                    'type': 'custom:button-card',
                    'show_name': false,
                    'show_icon': false,
                    'tap_action': ({'action': 'navigate', 'navigation_path': ((('/' ~ pref_dashboard_path ~ '/') if pref_dashboard_path else '') ~ 'family-hub-' ~ (t.worst | slugify))} if t.worst != '' else {'action': 'none'}),
                    'hold_action': {'action': 'none'},
                    'custom_fields': {'content': html},
                    'styles': {
                      'card': [
                        {'padding': '12px'},
                        {'border-radius': '16px'},
                        {'box-shadow': 'none'},
                        {'border': '1px solid ' ~ bcol},
                        {'background': bg}
                      ],
                      'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                      'custom_fields': {'content': [{'width': '100%'}]}
                    }
                  }
                }},
                {%- set pend = t.pending_c + t.pending_r -%}
                {%- if pend > 0 -%}
                  {%- set col = 'var(--primary-color)' -%}
                  {%- set parts = [] -%}
                  {%- set head = ui.get('parents', 'Parents') -%}
                  {%- set sub = ((t.pending_c | string) ~ ' ' ~ ((ui.get('chore', 'Chore') if t.pending_c == 1 else ui.get('chores', 'Chores')) | lower)) ~ ((' · ' ~ (t.pending_r | string) ~ ' ' ~ ((ui.get('reward', 'Reward') if t.pending_r == 1 else ui.get('rewards', 'Rewards')) | lower)) if t.pending_r > 0 else '') ~ ' ' ~ (ui.get('waiting_for_approval', 'Waiting for approval') | lower) -%}
                  {%- set html = "<div style='display:flex;align-items:center;gap:10px;text-align:left;'><ha-icon icon='mdi:shield-check-outline' style='width:22px;height:22px;--mdc-icon-size:22px;color:" ~ col ~ ";flex:none;'></ha-icon><div style='flex:1;min-width:0;'><div style='font-size:14px;font-weight:700;'>" ~ head ~ "</div><div style='font-size:11px;opacity:.7;'>" ~ sub ~ "</div></div><span style='font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--error-color);color:#fff;'>" ~ (pend | string) ~ "</span></div>" -%}
                  {%- set bcol = col -%}
                  {%- set bg = 'color-mix(in srgb,' ~ col ~ ' 8%, var(--card-background-color))' -%}
                  {{
                    {
                      'type': 'custom:button-card',
                      'show_name': false,
                      'show_icon': false,
                      'tap_action': {'action': 'navigate', 'navigation_path': ((('/' ~ pref_dashboard_path ~ '/') if pref_dashboard_path else '') ~ 'admin')},
                      'hold_action': {'action': 'none'},
                      'custom_fields': {'content': html},
                      'styles': {
                      'card': [
                        {'padding': '12px'},
                        {'border-radius': '16px'},
                        {'box-shadow': 'none'},
                        {'border': '1px solid ' ~ bcol},
                        {'background': bg}
                      ],
                      'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                      'custom_fields': {'content': [{'width': '100%'}]}
                    }
                    }
                  }},
                {%- endif -%}
              {%- endif -%}
<< label_strips('top') >>
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 2
          card_param: cards
          filter:
            template: |-
              {#-- ===== PERSON CARDS ===== --#}
              {#-- 1. User Configuration --#}
              {%- set pref_dashboard_path = '' -%}  {#-- Optional: dashboard URL path (for example 'dashboard-choreops'). Leave empty to use paths relative to this dashboard. --#}
              {%- set pref_points_precision = 'fixed_0' -%}  {#-- Allowed: fixed_0, fixed_1, fixed_2 --#}
              {#-- 2. Dynamic Lookups & Validations --#}
              {%- set helpers = integration_entities('choreops')
                | select('search', '^sensor\\.')
                | list
                | expand
                | selectattr('attributes.purpose', 'defined')
                | selectattr('attributes.purpose', 'eq', 'purpose_dashboard_helper')
                | list -%}
              {%- set pref_users = << home.user_names >> -%}
              {%- if pref_users | length > 0 -%}
                {%- set helpers = helpers | selectattr('attributes.user_name', 'in', pref_users) | list -%}
              {%- endif -%}
              {%- set tsensor = ((helpers | first).attributes.get('dashboard_helpers') or {}).get('translation_sensor_eid') if helpers else none -%}
              {%- set ui = (state_attr(tsensor, 'ui_translations') if tsensor else {}) or {} -%}
              {%- set hour_now = now().hour -%}
              {#-- 3. Render one tappable card per person --#}
              {%- for h in helpers -%}
                {%- set ha = h.attributes -%}
                {%- set uname = (ha.get('user_name') or '') | string -%}
                {%- if uname == '' -%}{%- continue -%}{%- endif -%}
                {%- set core = ha.get('core_sensors') or {} -%}
                {%- set points_sensor = core.get('points_eid') -%}
                {%- set total_sensor = core.get('chores_eid') -%}
                {%- set badge_sensor = core.get('badges_eid') -%}
                {%- set tsensor = (ha.get('dashboard_helpers') or {}).get('translation_sensor_eid') -%}
                {%- set ui = (state_attr(tsensor, 'ui_translations') if tsensor else {}) or {} -%}
                {%- set gam = ha.get('gamification_enabled') | default(false, true) -%}
                {%- set pts = (states(points_sensor) | float(default=0)) if points_sensor else 0 -%}
                {%- set pts_txt = ('%.2f' | format(pts)) if pref_points_precision == 'fixed_2' else (('%.1f' | format(pts)) if pref_points_precision == 'fixed_1' else ((pts | round(0) | int) | string)) -%}
                {%- set overdue = (state_attr(total_sensor, 'chore_stat_current_overdue') | int(default=0)) if total_sensor else 0 -%}
                {%- set due = (state_attr(total_sensor, 'chore_stat_current_due_today') | int(default=0)) if total_sensor else 0 -%}
                {%- set rank = ((states(badge_sensor) if badge_sensor else 'None') or 'None') -%}
                {%- if ha.get('chores_paused') | bool(false) -%}
                  {%- set sc = 'var(--warning-color)' -%}{%- set si = 'mdi:pause-circle-outline' -%}{%- set st = ui.get('chores_are_paused', 'Paused') -%}
                {%- elif overdue > 0 -%}
                  {%- set sc = 'var(--error-color)' -%}{%- set si = 'mdi:alert-octagon' -%}{%- set st = ui.get('overdue', 'Overdue') ~ ': ' ~ overdue -%}
                {%- elif due > 0 -%}
                  {%- set sc = 'var(--warning-color)' -%}{%- set si = 'mdi:calendar-clock' -%}{%- set st = ui.get('due_today', 'Due Today') ~ ': ' ~ due -%}
                {%- else -%}
                  {%- set sc = 'var(--success-color)' -%}{%- set si = 'mdi:check-circle' -%}{%- set st = ui.get('all_caught_up', 'All Caught Up!') -%}
                {%- endif -%}
                {%- set greet = ui.get('good_morning', 'Good morning') if hour_now < 12 else (ui.get('good_afternoon', 'Good afternoon') if hour_now < 18 else ui.get('good_evening', 'Good evening')) -%}
                {%- set nm = uname | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                {%- set rank_html = ("<span style='font-size:10px;background:var(--secondary-background-color);padding:2px 8px;border-radius:999px;border:1px solid var(--divider-color);display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'><ha-icon icon='mdi:medal-outline' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" ~ rank ~ "</span>") if rank not in ['None', 'unknown', 'Unknown', 'unavailable'] else '' -%}
                {%- set pts_html = ("<div style='display:inline-flex;align-items:center;gap:2px;color:var(--primary-color);font-size:15px;font-weight:800;white-space:nowrap;'><ha-icon icon='" ~ ((state_attr(points_sensor, 'icon') if points_sensor else none) or 'mdi:star-circle') ~ "' style='width:16px;height:16px;--mdc-icon-size:16px;display:block;'></ha-icon>" ~ pts_txt ~ "</div>") if gam else '' -%}
                {%- set cu = ha.get('caught_up_streak') or {} -%}
                {%- set cu_n = cu.get('count', 0) | int(0) -%}
                {%- set cu_best = cu.get('best', 0) | int(0) -%}
                {%- set cu_open = (overdue + due) > 0 -%}
                {%- set cu_broken = cu_n == 0 and cu_best > 0 and overdue > 0 -%}
                {%- set fl_col = 'var(--secondary-text-color)' if (cu_open or cu_broken) else 'var(--warning-color)' -%}
                {%- set cu_risk = cu_open and cu_n > 0 -%}
                {%- set cu_txt = (cu_n | string) ~ ' ' ~ (ui.get('days', 'days') if cu_n != 1 else ui.get('day', 'day')) ~ (' ⚠' if cu_risk else '') -%}
                {#-- Streak sits above the points so the chip row never wraps --#}
                {%- set flame_html = ("<span style='display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:800;line-height:1;color:" ~ fl_col ~ ";white-space:nowrap;'><ha-icon icon='mdi:fire' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" ~ cu_txt ~ "</span>") if (cu_n > 0 or cu_broken) else '' -%}
                {%- set html = "<div style='width:100%;text-align:left;position:relative;'>"
                  ~ "<div style='display:flex;align-items:center;gap:8px;'>"
                  ~ "<div style='width:36px;height:36px;border-radius:50%;background:var(--primary-color);color:var(--text-primary-color,#fff);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex:0 0 auto;'>" ~ (nm[:1] | upper) ~ "</div>"
                  ~ "<div style='flex:1;min-width:0;'><div style='font-size:15px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" ~ nm ~ "</div></div>"
                  ~ "<div style='display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto;'>" ~ flame_html ~ pts_html ~ "</div></div>"
                  ~ "<div style='display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:4px;margin-top:8px;'>" ~ rank_html
                  ~ "<span style='display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:" ~ sc ~ ";background:color-mix(in srgb," ~ sc ~ " 14%,transparent);padding:2px 8px;border-radius:999px;'><ha-icon icon='" ~ si ~ "' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" ~ st ~ "</span></div>"
                  ~ "</div>" -%}
                {{
                  {
                    'type': 'custom:button-card',
                    'show_name': false,
                    'show_icon': false,
                    'tap_action': {'action': 'navigate', 'navigation_path': ((('/' ~ pref_dashboard_path ~ '/') if pref_dashboard_path else '') ~ 'family-hub-' ~ (uname | slugify))},
                    'hold_action': {'action': 'none'},
                    'custom_fields': {'content': html},
                    'styles': {
                      'card': [
                        {'padding': '10px'},
                        {'border-radius': '16px'},
                        {'border': '1px solid color-mix(in srgb, var(--primary-color) 25%, var(--divider-color))'},
                        {'background': 'linear-gradient(135deg, color-mix(in srgb, var(--primary-color) 21%, var(--card-background-color)), color-mix(in srgb, var(--primary-color) 6%, var(--card-background-color)))'},
                        {'box-shadow': 'none'}
                      ],
                      'grid': [
                        {'grid-template-areas': '"content"'},
                        {'grid-template-columns': '1fr'}
                      ],
                      'custom_fields': {'content': [{'width': '100%'}]}
                    }
                  }
                }},
              {%- endfor -%}
<< label_strips('rest') >>
    - type: grid
      cards:
        - type: heading
          heading: << t.get('this_week_heading', 'This week') >>
          heading_style: title
          icon: mdi:podium
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== WEEKLY LEADERBOARD ===== --#}
              {%- set pref_dashboard_path = '' -%}  {#-- Optional: dashboard URL path (for example 'dashboard-choreops'). Leave empty to use paths relative to this dashboard. --#}
              {%- set helpers = integration_entities('choreops')
                | select('search', '^sensor\\.')
                | list
                | expand
                | selectattr('attributes.purpose', 'defined')
                | selectattr('attributes.purpose', 'eq', 'purpose_dashboard_helper')
                | list -%}
              {%- set pref_users = << home.user_names >> -%}
              {%- if pref_users | length > 0 -%}
                {%- set helpers = helpers | selectattr('attributes.user_name', 'in', pref_users) | list -%}
              {%- endif -%}
              {%- set tsensor = ((helpers | first).attributes.get('dashboard_helpers') or {}).get('translation_sensor_eid') if helpers else none -%}
              {%- set ui = (state_attr(tsensor, 'ui_translations') if tsensor else {}) or {} -%}
              {%- set lb_psensor = ((helpers | first).attributes.get('core_sensors') or {}).get('points_eid') if helpers else none -%}
              {%- set lb_plabel = ((state_attr(lb_psensor, 'unit_of_measurement') if lb_psensor else none) or '') | string -%}
              {#-- A custom points name (for example Stars) replaces the word Points --#}
              {%- set lb_head = (lb_plabel ~ ' ' ~ (ui.get('earned', 'Earned') | lower)) if (lb_plabel and (lb_plabel | lower) != (ui.get('points', 'Points') | lower)) else ui.get('points_earned', 'Points earned') -%}
              {%- set lb = namespace(rows=[], top=0) -%}
              {%- for h in helpers -%}
                {%- set ha = h.attributes -%}
                {%- set uname = (ha.get('user_name') or '') | string -%}
                {%- if uname == '' -%}{%- continue -%}{%- endif -%}
                {%- set total_sensor = (ha.get('core_sensors') or {}).get('chores_eid') -%}
                {%- set wk = (state_attr(total_sensor, 'chore_stat_points_week') | float(default=0)) if total_sensor else 0 -%}
                {%- set lb.rows = lb.rows + [{'name': uname, 'pts': wk}] -%}
                {%- if wk > lb.top -%}{%- set lb.top = wk -%}{%- endif -%}
              {%- endfor -%}
              {%- if lb.rows | length > 0 -%}
                {%- set rows_html = namespace(v='') -%}
                {%- for r in lb.rows | sort(attribute='pts', reverse=true) -%}
                  {%- set nm = r.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                  {%- set pct = ((r.pts / lb.top * 100) | round(0) | int) if lb.top > 0 else 0 -%}
                  {%- set crown = '&#128081;' if (loop.first and r.pts > 0) else '' -%}
                  {%- set rows_html.v = rows_html.v ~ "<div style='display:flex;align-items:center;gap:8px;margin-top:8px;'><span style='width:18px;font-size:14px;text-align:center;'>" ~ crown ~ "</span><span style='width:28px;height:28px;border-radius:50%;background:var(--primary-color);color:var(--text-primary-color,#fff);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none;'>" ~ (r.name[:1] | upper) ~ "</span><span style='width:64px;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" ~ nm ~ "</span><div style='flex:1;height:9px;border-radius:999px;background:var(--divider-color);overflow:hidden;'><div style='height:100%;width:" ~ (pct | string) ~ "%;border-radius:999px;background:" ~ ('var(--warning-color)' if (loop.first and r.pts > 0) else 'var(--primary-color)') ~ ";'></div></div><span style='width:40px;text-align:right;font-size:12px;font-weight:800;'>" ~ ('%g' | format(r.pts | round(1))) ~ "</span></div>" -%}
                {%- endfor -%}
                {%- set html = "<div style='width:100%;text-align:left;'><div style='display:flex;align-items:center;'><div style='font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;'>" ~ (lb_head | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;')) ~ "</div></div>" ~ rows_html.v ~ "</div>" -%}
                {%- set bcol = 'var(--divider-color)' -%}
                {%- set bg = 'var(--card-background-color)' -%}
                {{
                  {
                    'type': 'custom:button-card',
                    'show_name': false,
                    'show_icon': false,
                    'tap_action': {'action': 'none'},
                    'hold_action': {'action': 'none'},
                    'custom_fields': {'content': html},
                    'styles': {
                      'card': [
                        {'padding': '12px'},
                        {'border-radius': '16px'},
                        {'box-shadow': 'none'},
                        {'border': '1px solid ' ~ bcol},
                        {'background': bg}
                      ],
                      'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                      'custom_fields': {'content': [{'width': '100%'}]}
                    }
                  }
                }},
              {%- endif -%}
    - type: grid
      cards:
        - type: heading
          heading: << t.get('goals_heading', 'Goals') >>
          heading_style: title
          icon: mdi:flag-checkered
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 2
          card_param: cards
          filter:
            template: |-
              {#-- Goal names, top to bottom. Type them comma-separated in the helper input_text.choreops_goal_order (no regenerate needed); the list below is the fallback. Goals not listed follow, daily goals first. --#}
              {%- set pref_raw = states('input_text.choreops_goal_order') | string -%}
              {%- set pref_order = (pref_raw.split(',') | map('trim') | reject('eq', '') | list) if pref_raw not in ['unknown', 'unavailable', 'none', ''] else ['Perfect Week', 'Expert Brusher', 'Puddins Cook', 'Pooper Scooper'] -%}
              {%- set pref_urgent_days = 3 -%}
              {%- set pref_dashboard_path = '' -%}  {#-- Optional: your dashboard URL path (for example 'dashboard-choreops'). Leave empty to use paths relative to this dashboard. --#}
              {%- set helpers = integration_entities('choreops')
                | select('search', '^sensor\\.')
                | list
                | expand
                | selectattr('attributes.purpose', 'defined')
                | selectattr('attributes.purpose', 'eq', 'purpose_dashboard_helper')
                | list -%}
              {%- set pref_users = << home.user_names >> -%}
              {%- if pref_users | length > 0 -%}
                {%- set helpers = helpers | selectattr('attributes.user_name', 'in', pref_users) | list -%}
              {%- endif -%}
              {%- set tsensor = ((helpers | first).attributes.get('dashboard_helpers') or {}).get('translation_sensor_eid') if helpers else none -%}
              {%- set ui = (state_attr(tsensor, 'ui_translations') if tsensor else {}) or {} -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set ns = namespace(q={}) -%}
              {%- for h in helpers -%}
                {%- set uname = (h.attributes.get('user_name') or '') | string -%}
                {%- for badge in (h.attributes.get('badges') or []) -%}
                  {#-- Labeled badges live in their label strip under the Family cards --#}
                  {%- if badge is mapping and not badge.get('labels') and badge.get('eid') not in ['', 'None', 'unknown', 'unavailable', none] and (badge.get('badge_type') | string | lower) in ['periodic', 'daily', 'special_occasion'] -%}
                    {%- set be = badge.get('eid') -%}
                    {%- set ba = states[be].attributes | default({}, true) -%}
                    {%- set rs = ba.get('reset_schedule') if ba.get('reset_schedule') is mapping else {} -%}
                    {%- set bname = (ba.get('badge_name') or badge.get('name') or state_attr(be, 'friendly_name') or '') | string -%}
                    {%- set status = (ba.get('status') or badge.get('status') or 'in_progress') | string | lower -%}
                    {%- set prog = states(be) | float(default=0) -%}
                    {%- set prog = 0 if prog < 0 else (100 if prog > 100 else prog) -%}
                    {%- set earned = status in ['earned', 'completed'] -%}
                    {#-- "N chores a day" goals move with today's chore count, like the ring on the person page --#}
                    {%- set t_req = ba.get('today_chores_required') | int(default=0) -%}
                    {%- if not earned and t_req > 0 and (ba.get('threshold_value') | float(default=0)) <= 1 -%}
                      {%- set prog = [100, (ba.get('today_chores_done') | int(default=0)) * 100 / t_req] | min -%}
                    {%- endif -%}
                    {%- set b_end = ((ba.get('end_date') or rs.get('end_date') or '') | string) | regex_replace('T.*$', '') -%}
                    {%- set b_start = ((ba.get('start_date') or rs.get('start_date') or '') | string) | regex_replace('T.*$', '') -%}
                    {%- set dl = (((as_timestamp(b_end ~ 'T12:00:00') - as_timestamp(today ~ 'T12:00:00')) / 86400) | round(0) | int) if b_end | length > 0 else 999 -%}
                    {%- set cur = ns.q.get(bname, {'name': bname, 'icon': (ba.get('icon') or 'mdi:medal-outline') | string, 'left': dl, 'future': (b_start | length > 0 and b_start > today), 'people': []}) -%}
                    {#-- Goals with a daily part (day/streak goals, "N chores a day", daily badges) say whether today's part is done --#}
                    {%- set b_tt = (ba.get('target_type') or '') | string | lower -%}
                    {%- set b_days = ba.get('days_done') if (ba.get('days_done') is iterable and ba.get('days_done') is not string) else [] -%}
                    {%- set dly = t_req > 0 or b_tt.startswith(('days_', 'streak_')) or (badge.get('badge_type') | string | lower) == 'daily' -%}
                    {%- set td = earned or (t_req > 0 and (ba.get('today_chores_done') | int(default=0)) >= t_req) or today in b_days -%}
                    {#-- Chore and points count goals also get each person's count, for the leader line and medals --#}
                    {%- set b_thr = ba.get('threshold_value') | float(default=0) -%}
                    {%- set b_cnt = (b_thr if earned else (prog * b_thr / 100)) | round(0) | int -%}
                    {%- set cur = cur | combine({'people': cur.people + [{'u': uname, 'p': prog, 'e': earned, 'd': dly, 't': td, 'c': b_cnt, 'tod': today in b_days}], 'tt': b_tt, 'thr': b_thr | round(0) | int}) -%}
                    {%- set ns.q = ns.q | combine({bname: cur}) -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- set items = namespace(l=[]) -%}
              {%- for qn, q in ns.q.items() -%}
                {%- set top = (q.people | map(attribute='p') | list | max) if q.people else 0 -%}
                {%- set alldone = q.people | length > 0 and (q.people | selectattr('e') | list | length) == (q.people | length) -%}
                {%- set items.l = items.l + [q | combine({'top': top, 'alldone': alldone, 'key': [(pref_order.index(qn) if qn in pref_order else 99), (0 if (q.people | selectattr('d') | list) else 1), (1 if alldone else 0), (1 if q.left >= 999 else 0), (q.left if q.left < 999 else 0), (100 - top), qn | lower]})] -%}
              {%- endfor -%}
              {%- for q in items.l | sort(attribute='key') -%}
                {%- set acc = 'var(--success-color)' if q.alldone else '#8b5cf6' -%}
                {%- set acc2 = '#86efac' if q.alldone else '#ec4899' -%}
                {%- set urgent = (not q.alldone) and q.left >= 0 and q.left <= pref_urgent_days -%}
                {%- set tcol = 'var(--warning-color)' if urgent else 'var(--secondary-text-color)' -%}
                {%- set ttxt = (ui.get('ends_today', 'Ends today') if q.left == 0 else (ui.get('one_day_left', '1 day left') if q.left == 1 else (q.left ~ ' ' ~ ui.get('days_left', 'days left')))) if (q.left < 999 and q.left >= 0) else ui.get('no_end', 'no end') -%}
                {%- set clock = ("<span style='display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:" ~ tcol ~ ";white-space:nowrap;'><ha-icon icon='mdi:clock-outline' style='width:12px;height:12px;--mdc-icon-size:12px;--ha-icon-display:block;margin:0;display:block;'></ha-icon>" ~ ttxt ~ "</span>") if (q.left < 999 and q.left >= 0) else ("<span style='font-size:10px;color:var(--secondary-text-color);'>" ~ ui.get('no_end', 'no end') ~ "</span>") -%}
                {#-- Count goals (chores or points) name the leader and give the top 3 a medal --#}
                {%- set cgoal = (q.get('tt') or '') in ['chore_count', 'points', 'points_chores', 'points_all_time'] and not (q.people | selectattr('d') | list) -%}
                {%- set topc = (q.people | map(attribute='c') | max) if q.people else 0 -%}
                {%- set leaders = (q.people | selectattr('c', 'eq', topc) | map(attribute='u') | map('replace', '&', '&amp;') | map('replace', '<', '&lt;') | map('replace', '>', '&gt;') | list) if topc > 0 else [] -%}
                {%- set lead_html = ("<span style='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:800;color:var(--warning-color);'>🏆 " ~ (leaders | join(' &amp; ')) ~ ' ' ~ (ui.get('leader_lead', 'lead') if (leaders | length) > 1 else ui.get('leader_leads', 'leads')) ~ " · " ~ topc ~ "/" ~ q.thr ~ "</span>") if (cgoal and leaders) else '' -%}
                {#-- Race track: every person sits where their own progress is --#}
                {%- set rp = namespace(l=[]) -%}
                {%- for pp in q.people -%}
                  {%- set rp.l = rp.l + [pp | combine({'pos': 100 if pp.e else (pp.p | round(0) | int)})] -%}
                {%- endfor -%}
                {#-- People within a dot's width of each other share one spot (the leftmost); they alternate above
                     and below the track and step a whole dot apart, so no initial covers another --#}
                {%- set mk = namespace(v='', anchor=-100, kk=0) -%}
                {%- for pp in rp.l | sort(attribute='pos') -%}
                  {%- if pp.pos - mk.anchor >= 14 -%}
                    {%- set mk.anchor = pp.pos -%}
                    {%- set mk.kk = 0 -%}
                  {%- else -%}
                    {%- set mk.kk = mk.kk + 1 -%}
                  {%- endif -%}
                  {%- set lead = pp.p > 0 and pp.p == q.top -%}
                  {%- set pc = 'var(--success-color)' if pp.e else ('var(--warning-color)' if lead else 'var(--primary-color)') -%}
                  {%- set nm = pp.u | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                  {%- set lane_top = -22 if mk.kk % 2 == 0 else 7 -%}
                  {%- set place = (q.people | selectattr('c', 'gt', pp.c) | list | length) + 1 -%}
                  {#-- The top 3 get a medal in a fixed 12px box pinned to the dot's corner, so every device lines it up the same --#}
                  {%- set medal = ("<span style='position:absolute;right:-7px;top:-8px;width:12px;height:12px;font-size:10px;line-height:12px;text-align:center;'>" ~ {1: '🥇', 2: '🥈', 3: '🥉'}[place] ~ "</span>") if (cgoal and pp.c > 0 and place <= 3) else '' -%}
                  {#-- On count goals a green tick under the dot shows who added to it today --#}
                  {%- set medal = medal ~ (("<span style='position:absolute;left:50%;bottom:-8px;margin-left:-4px;width:8px;height:8px;border-radius:50%;background:var(--success-color);color:#fff;font-size:6px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;'>✓</span>") if (cgoal and pp.tod) else '') -%}
                  {%- set lane_off = (mk.kk // 2) * 19 * (-1 if mk.anchor > 80 else 1) -%}
                  {%- set mk.v = mk.v ~ "<div style='position:absolute;left:calc(" ~ (94 if mk.anchor > 94 else mk.anchor) ~ "% - 8px + " ~ lane_off ~ "px);top:" ~ lane_top ~ "px;border:1.5px solid var(--card-background-color);border-radius:50%;'><div style='width:16px;height:16px;border-radius:50%;background:" ~ pc ~ ";color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:" ~ (1 if (pp.p > 0 or pp.e) else 0.45) ~ ";'>" ~ (nm[:1] | upper) ~ "</div>" ~ medal ~ "</div>" -%}
                {%- endfor -%}
                {%- set done_n = q.people | selectattr('e') | list | length -%}
                {#-- Footer: a chip per person, finished people first as green ticks; on goals with a daily part
                     a dot under the chip shows today's part done (green) or not yet (red); on other goals a
                     green dot shows the person added to it today, and nothing shows otherwise --#}
                {%- set ft = namespace(v='') -%}
                {%- for pp in (q.people | selectattr('e') | list) + (q.people | rejectattr('e') | list) -%}
                {%- set tdot = ("<span style='position:absolute;left:5.5px;bottom:-6px;width:5px;height:5px;border-radius:50%;background:" ~ ('var(--success-color)' if pp.t else 'var(--error-color)') ~ ";'></span>") if ((pp.d or pp.t) and not pp.e) else '' -%}
                {%- set ft.v = ft.v ~ ("<span style='position:relative;display:inline-flex;'><span style='width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;" ~ ("background:var(--success-color);color:#fff;" if pp.e else "border:1.5px solid var(--divider-color);color:var(--secondary-text-color);") ~ "'>" ~ ('✓' if pp.e else (pp.u[:1] | upper)) ~ "</span>" ~ tdot ~ "</span>") -%}
                {%- endfor -%}
                {%- set foot = "<span style='display:inline-flex;gap:3px;align-items:center;'>" ~ ft.v ~ "</span>" -%}
                {%- set ticks = namespace(v='') -%}
                {%- for tk in [25, 50, 75] -%}
                  {%- set ticks.v = ticks.v ~ "<div style='position:absolute;left:" ~ tk ~ "%;top:-2px;width:1.5px;height:10px;background:var(--divider-color);opacity:0.9;'></div>" -%}
                {%- endfor -%}
                {%- set lead_user = (q.people | sort(attribute='p', reverse=true) | map(attribute='u') | first) | default('', true) -%}
                {%- set nav_path = ((('/' ~ pref_dashboard_path ~ '/') if pref_dashboard_path else '') ~ 'family-hub-' ~ (lead_user | slugify)) -%}
                {%- set qname = q.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                {%- set fillw = 100 if q.alldone else (q.top | round(0) | int) -%}
                {%- set html = "<div style='position:relative;overflow:hidden;border-radius:16px;text-align:left;border:1px solid " ~ (('var(--warning-color)') if urgent else ('color-mix(in srgb,' ~ acc ~ ' 40%,transparent)')) ~ ";background:linear-gradient(90deg,color-mix(in srgb," ~ acc ~ " 16%,transparent),transparent);'>"
                  ~ "<div style='display:flex;flex-direction:column;gap:7px;padding:9px 10px;'>"
                  ~ "<div style='display:flex;align-items:center;gap:8px;'><div style='width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg," ~ acc ~ "," ~ acc2 ~ ");display:flex;align-items:center;justify-content:center;flex:0 0 auto;'><ha-icon icon='" ~ q.icon ~ "' style='width:16px;height:16px;--mdc-icon-size:16px;--ha-icon-display:block;margin:0;color:#fff;display:block;'></ha-icon></div>"
                  ~ "<div style='flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.15;color:var(--primary-text-color);'>" ~ qname ~ "</div></div>"
                  ~ "<div style='position:relative;height:48px;'><div style='position:relative;height:6px;border-radius:4px;background:var(--divider-color);margin:22px 16px 0 8px;'>"
                  ~ "<div style='position:absolute;left:0;top:0;bottom:0;width:" ~ fillw ~ "%;border-radius:4px;background:linear-gradient(90deg," ~ acc ~ "," ~ acc2 ~ ");'></div>"
                  ~ ticks.v ~ mk.v
                  ~ "<div style='position:absolute;right:-15px;top:-9px;font-size:12px;line-height:1;'>🏁</div></div></div>"
                  ~ "<div style='display:flex;align-items:center;justify-content:space-between;gap:6px;'>" ~ (lead_html if cgoal else foot) ~ clock ~ "</div>"
                  ~ "</div></div>" -%}
                {{
                  {
                    'type': 'custom:button-card',
                    'show_name': false,
                    'show_icon': false,
                    'tap_action': {'action': 'navigate', 'navigation_path': nav_path} if lead_user else {'action': 'none'},
                    'hold_action': {'action': 'none'},
                    'custom_fields': {'content': html},
                    'styles': {
                      'card': [
                        {'background': 'transparent'},
                        {'box-shadow': 'none'},
                        {'border': 'none'},
                        {'padding': '0px'},
                        {'min-height': 'unset'}
                      ],
                      'grid': [
                        {'grid-template-areas': '"content"'},
                        {'grid-template-columns': '1fr'}
                      ],
                      'custom_fields': {
                        'content': [{'width': '100%'}]
                      }
                    }
                  }
                }},
              {%- endfor -%}
    - type: grid
      cards:
        - type: heading
          heading: << t.get('family_goals_heading', 'Family Goals') >>
          heading_style: title
          icon: mdi:trophy
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== FAMILY ACHIEVEMENTS ===== --#}
              {#-- 1. User Configuration --#}
              {#-- 2. Dynamic Lookups & Validations --#}
              {%- set helpers = integration_entities('choreops')
                | select('search', '^sensor\\.')
                | list
                | expand
                | selectattr('attributes.purpose', 'defined')
                | selectattr('attributes.purpose', 'eq', 'purpose_dashboard_helper')
                | list -%}
              {%- set tsensor = ((helpers | first).attributes.get('dashboard_helpers') or {}).get('translation_sensor_eid') if helpers else none -%}
              {%- set ui = (state_attr(tsensor, 'ui_translations') if tsensor else {}) or {} -%}
              {#-- 3. Render --#}
              {%- set family_sensors = integration_entities('choreops')
                  | select('search', '^sensor\\.')
                  | list
                  | expand
                  | selectattr('attributes.family_contributions', 'defined')
                  | map(attribute='entity_id')
                  | list -%}
              {#-- Goals that track people (day streaks, everyone-contributes) go first, then the scoreboards --#}
              {%- set fsort = namespace(top=[], rest=[], seen=[]) -%}
              {%- for fe0 in family_sensors -%}
                {%- set fkey = (state_attr(fe0, 'achievement_name') or fe0) | string -%}
                {%- if fkey in fsort.seen -%}{%- continue -%}{%- endif -%}
                {%- set fsort.seen = fsort.seen + [fkey] -%}
                {%- if (state_attr(fe0, 'type') or '') | string | lower in ['family_caught_up_days', 'family_active_days', 'family_everyone_contributes'] -%}
                  {%- set fsort.top = fsort.top + [fe0] -%}
                {%- else -%}
                  {%- set fsort.rest = fsort.rest + [fe0] -%}
                {%- endif -%}
              {%- endfor -%}
              {#-- Same kinds sit together: day streaks, everyone-contributes, then the scoreboards, with the one-day record last --#}
              {%- set ford = namespace(v=[]) -%}
              {%- for ot in ['family_caught_up_days', 'family_active_days', 'family_everyone_contributes', 'family_points_total', 'family_chore_total', 'family_chores_in_day'] -%}
                {%- for fe1 in fsort.top + fsort.rest -%}
                  {%- if ((state_attr(fe1, 'type') or '') | string | lower) == ot -%}{%- set ford.v = ford.v + [fe1] -%}{%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- for fe1 in fsort.top + fsort.rest -%}{%- if fe1 not in ford.v -%}{%- set ford.v = ford.v + [fe1] -%}{%- endif -%}{%- endfor -%}
              {#-- Goal names, top to bottom. Type them comma-separated in the helper input_text.choreops_family_goal_order (no regenerate needed); the list below is the fallback. Goals not listed follow in the kind order above. --#}
              {%- set pref_raw = states('input_text.choreops_family_goal_order') | string -%}
              {%- set pref_order = (pref_raw.split(',') | map('trim') | reject('eq', '') | list) if pref_raw not in ['unknown', 'unavailable', 'none', ''] else ['Perfect Week', 'This Months Family Stars', 'Total Monthly Chores', 'Most chores completed'] -%}
              {%- set pord = namespace(v=[]) -%}
              {%- for pn in pref_order -%}
                {%- for fe2 in ford.v -%}
                  {%- if ((state_attr(fe2, 'achievement_name') or '') | string) == pn and fe2 not in pord.v -%}{%- set pord.v = pord.v + [fe2] -%}{%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- for fe2 in ford.v -%}{%- if fe2 not in pord.v -%}{%- set pord.v = pord.v + [fe2] -%}{%- endif -%}{%- endfor -%}
              {%- for fe in pord.v -%}
                {%- if states(fe) not in ['unknown', 'unavailable'] -%}
                  {%- set fname = state_attr(fe, 'achievement_name') | default(ui.get('family_goal', 'Family Goal'), true) | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                  {%- set fdesc = state_attr(fe, 'description') | default('', true) | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                  {%- set ficon = state_attr(fe, 'icon') or 'mdi:trophy' -%}
                  {%- set ftype = (state_attr(fe, 'type') or '') | string | lower -%}
                  {#-- Day-streak goals count shared days, so they show a level track and no per-person rows --#}
                  {%- set fstreak = ftype in ['family_caught_up_days', 'family_active_days'] -%}
                  {%- set fgrid = fstreak or ftype == 'family_everyone_contributes' -%}
                  {%- set funit = (' ' ~ ui.get('days', 'days')) if fstreak else '' -%}
                  {#-- Time left: only goals that run on the calendar day have a known end (midnight) --#}
                  {%- set secs_left = 86400 - (now().hour * 3600 + now().minute * 60 + now().second) -%}
                  {%- set hrs_left = (secs_left // 3600) | int -%}
                  {%- set mins_left = ((secs_left % 3600) // 60) | int -%}
                  {%- set time_txt = (((hrs_left ~ ui.get('hours_short', 'h') ~ ' ' ~ mins_left ~ ui.get('minutes_short', 'm')) if hrs_left > 0 else (mins_left ~ ui.get('minutes_short', 'm'))) ~ ' ' ~ ui.get('left', 'left')) if ftype in ['family_caught_up_days', 'family_active_days', 'family_chores_in_day'] else '' -%}
                  {%- set time_col = 'var(--warning-color)' if hrs_left < 3 else 'var(--secondary-text-color)' -%}
                  {%- set time_html = ("<div style='display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:10px;font-weight:800;color:" ~ time_col ~ ";white-space:nowrap;'><ha-icon icon='mdi:clock-outline' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" ~ time_txt ~ "</div>") if time_txt else '' -%}
                  {%- set flevels = (state_attr(fe, 'family_levels') or []) | map('float', 0) | list -%}
                  {%- set frewards = (state_attr(fe, 'family_level_rewards') or []) | map('float', 0) | list -%}
                  {%- set flevel = state_attr(fe, 'family_level') | int(0) -%}
                  {%- set fcount = flevels | length -%}
                  {%- set fnext = state_attr(fe, 'family_next_target') | float(0) -%}
                  {%- set ftarget = (fnext if fnext > 0 else (state_attr(fe, 'target_value') | float(0))) | round(0) | int -%}
                  {%- set freward = state_attr(fe, 'family_next_reward') | float(0) | round(0) | int -%}
                  {%- set fmult = state_attr(fe, 'family_top_multiplier') | float(1) -%}
                  {%- set ftotal = state_attr(fe, 'family_total') | float(0) | round(0) | int -%}
                  {#-- A goal that reset for a new period keeps its reached levels but starts a new total, so only call it done while the total is still at the last level --#}
                  {%- set fraw_done = fcount > 0 and flevel >= fcount -%}
                  {%- set fdone = fraw_done and ftotal >= ((flevels | last) | float(0)) -%}
                  {%- set elevel = (fcount - 1) if (fraw_done and not fdone) else flevel -%}
                  {#-- Day-streak goals follow the CURRENT streak: when it breaks, the levels shown start over --#}
                  {%- set scnt = namespace(v=0) -%}
                  {%- if fstreak -%}
                    {%- for lv0 in flevels -%}
                      {%- if lv0 <= ftotal -%}
                        {%- set scnt.v = scnt.v + 1 -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {%- set streak_reset = fstreak and flevel > scnt.v -%}
                  {%- set fdone = ((scnt.v >= fcount and fcount > 0) if fstreak else fdone) -%}
                  {%- set elevel = (scnt.v if fstreak else elevel) -%}
                  {%- set ftarget = (((flevels[elevel] if elevel < fcount else (flevels | last)) | round(0) | int) if (fstreak and fcount > 0) else ftarget) -%}
                  {%- set freward = (((frewards[elevel] | round(0) | int) if elevel < (frewards | length) else 0) if (fstreak and fcount > 0) else freward) -%}
                  {%- set fshares = state_attr(fe, 'family_level_contributions') or state_attr(fe, 'family_contributions') or {} -%}
                  {%- set wtarget = ((flevels | last) if (fdone and fcount > 0) else ftarget) | float(1) | round(0) | int -%}
                  {%- set pidx = (elevel - 1) if not fdone else (fcount - 2) -%}
                  {%- set fprev = ((flevels[pidx] | round(0) | int) if (fcount > 1 and pidx >= 0) else 0) -%}
                  {%- set wspan = [wtarget - fprev, 1] | max -%}
                  {%- set winto = [[ftotal - fprev, 0] | max, wspan] | min -%}
                  {%- set bpct = 100 if fdone else (((winto / wspan) * 100) | round(1)) -%}
                  {%- set togo = [ftarget - ftotal, 0] | max -%}
                  {%- set ftop = (fshares.values() | map('float', 0) | list | max) if fshares else 0 -%}
                  {%- set ntop = (fshares.values() | map('float', 0) | select('equalto', ftop) | list | length) if fshares else 0 -%}
                  {#-- A hex colour, not a CSS variable: the frame appends alpha digits to it --#}
                  {%- set accent = '#4caf50' if fdone else '#8b5cf6' -%}
                  {%- set accent2 = '#86efac' if fdone else '#ec4899' -%}
                  {%- set fbanner = "<div style='font-size:10px;font-weight:800;letter-spacing:0.6px;color:var(--warning-color);margin-bottom:3px;'>" ~ ((ui.get('streak_reset', 'Streak reset') if streak_reset else ui.get('new_period', 'New period')) ~ ' · ' ~ ui.get('levels_reset', 'Levels reset')) | upper ~ "</div>" if ((fraw_done and not fdone and not fstreak) or streak_reset) else '' -%}
                  {%- set lvl_txt = (ui.get('level', 'Level') ~ ' ' ~ (elevel + 1) ~ ' ' ~ ui.get('of', 'of') ~ ' ' ~ fcount) if (fcount > 1 and not fdone) else (('✓ ' ~ ui.get('all', 'All') ~ ' ' ~ fcount ~ ' ' ~ ui.get('levels', 'levels')) if (fdone and fcount > 1) else '') -%}
                  {%- set sub = ('🎉 ' ~ ui.get('all_levels_complete', 'All levels complete')) if fdone else ('<b style="color:' ~ accent ~ ';">' ~ togo ~ ((' ' ~ ui.get('day', 'day')) if (funit and togo == 1) else funit) ~ ' ' ~ ui.get('to_go', 'to go') ~ '</b>' ~ ((' · +' ~ freward ~ ' ⭐ ' ~ ui.get('each', 'each')) if freward > 0 else '')) -%}
                  {%- set mult_html = ("<div style='font-size:11px;font-weight:700;color:var(--warning-color);line-height:1.35;'>🏆 " ~ ui.get('top_contributor', 'Top contributor') ~ " ×" ~ ('%g' | format(fmult)) ~ "</div>") if (fmult > 1 and not fdone) else '' -%}
                  {#-- Finish date or repeat: pace and days left; a dashed line on the bar marks where an even pace would be now --#}
                  {%- set fdays = state_attr(fe, 'family_days_left') -%}
                  {%- set fpace = (state_attr(fe, 'family_pace') or '') | string -%}
                  {%- set ffin = state_attr(fe, 'family_finished') | default(false, true) -%}
                  {%- set fend = (state_attr(fe, 'family_end_date') or '') | string -%}
                  {%- set fdeadline = (state_attr(fe, 'family_deadline') or '') | string -%}
                  {%- set fend_txt = (as_timestamp(fend ~ 'T12:00:00') | timestamp_custom('%b %d')) if (ffin and fend) else fend -%}
                  {%- set pace_col = {'ahead': 'var(--success-color)', 'on_track': 'var(--primary-color)', 'behind': 'var(--warning-color)'}.get(fpace, '') -%}
                  {%- set pace_word = {'ahead': ui.get('ahead_of_pace', 'Ahead of pace'), 'on_track': ui.get('on_track', 'On track'), 'behind': ui.get('behind_pace', 'Behind pace')}.get(fpace, '') -%}
                  {%- set days_txt = '' if (fdays is none or ffin) else (ui.get('ends_today', 'Ends today') if (fdays | int(0)) <= 1 else ((fdays | int(0)) ~ ' ' ~ (ui.get('days_left_this_week', 'days left this week') if fdeadline == 'week' else (ui.get('days_left_this_month', 'days left this month') if fdeadline == 'month' else ui.get('days_left', 'days left'))))) -%}
                  {%- set pace_bits = ((["<b style='color:" ~ pace_col ~ ";'>" ~ pace_word ~ "</b>"]) if pace_word else []) + ([days_txt] if days_txt else []) -%}
                  {%- set pace_txt = ("<b>" ~ ui.get('finished', 'Finished') ~ ' ' ~ fend_txt ~ "</b> · " ~ ui.get('counting_stopped', 'counting stopped')) if ffin else (pace_bits | join(' · ')) -%}
                  {%- set pace_html = ("<div style='font-size:11px;color:var(--secondary-text-color);line-height:1.35;'>" ~ pace_txt ~ "</div>") if pace_txt else '' -%}
                  {%- set fexp = state_attr(fe, 'family_pace_expected') -%}
                  {%- set tick_pct = (([[(fexp | float(0)) - fprev, 0] | max, wspan] | min) / wspan * 100) | round(1) if (pace_word and fexp is not none and not fdone) else none -%}
                  {%- set tick_html = ("<div style='position:absolute;bottom:0;height:22px;left:" ~ tick_pct ~ "%;border-left:2px dashed " ~ pace_col ~ ";opacity:0.9;'></div><div style='position:absolute;bottom:2px;left:calc(" ~ tick_pct ~ "% + 4px);font-size:9px;font-weight:800;color:" ~ pace_col ~ ";'>" ~ ui.get('pace', 'pace') ~ "</div>") if tick_pct is not none else '' -%}
                  {%- set tile = "<div style='width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg," ~ accent ~ "," ~ accent2 ~ ");display:flex;align-items:center;justify-content:center;flex:0 0 auto;'><ha-icon icon='" ~ ficon ~ "' style='width:22px;height:22px;--mdc-icon-size:22px;color:#fff;display:block;'></ha-icon></div>" -%}

                  {%- set frecord = state_attr(fe, 'family_record') | float(0) | round(0) | int -%}
                  {%- set frecord_day = state_attr(fe, 'family_record_day') or '' -%}
                  {%- set frecord_top = state_attr(fe, 'family_record_top') or [] -%}
                  {%- set frecord_top_total = state_attr(fe, 'family_record_top_total') | float(0) | round(0) | int -%}
                  {%- set rec_html = ("<div style='text-align:center;font-size:11px;color:var(--secondary-text-color);margin:6px 0 2px 0;'>🏆 " ~ ui.get('record', 'Record') ~ ": <b style='color:var(--primary-text-color);'>" ~ frecord ~ funit ~ "</b>" ~ ((" · " ~ (frecord_top | join(', ')) ~ ((" <b style='color:var(--primary-text-color);'>" ~ frecord_top_total ~ "</b>") if frecord_top_total > 0 else '')) if frecord_top else '') ~ ((" · " ~ frecord_day) if frecord_day else '') ~ "</div>") if frecord > 0 else '' -%}

                  {%- if fgrid -%}
                    {#-- Who is in: a check for everyone who has done their part, the count for the rest --#}
                    {%- set cchips = namespace(v='') -%}
                    {%- if ftype == 'family_everyone_contributes' -%}
                      {%- for pname, pts in fshares.items() | sort(attribute='1', reverse=true) -%}
                        {%- set p = pts | float(0) | round(0) | int -%}
                        {%- set p_ok = p >= wtarget -%}
                        {%- set pname_safe = pname | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                        {%- set cchips.v = cchips.v ~ "<div style='display:flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:11px;font-weight:700;color:var(--primary-text-color);'><span style='width:20px;height:20px;border-radius:50%;background:" ~ ('var(--success-color)' if p_ok else 'var(--divider-color)') ~ ";display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;'>" ~ ("<ha-icon icon='mdi:check-bold' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" if p_ok else p) ~ "</span>" ~ pname_safe ~ "<span style='opacity:0.6;font-weight:600;'>" ~ p ~ "/" ~ wtarget ~ "</span></div>" -%}
                      {%- endfor -%}
                    {%- elif ftype == 'family_caught_up_days' -%}
                      {%- set cstat = state_attr(fe, 'family_caught_up_today') or {} -%}
                      {%- for pname, ptxt in cstat.items() -%}
                        {%- set p_ok = ((ptxt.open | int(1)) == 0 and not ptxt.overdue) if ptxt is mapping else ((ptxt | string).startswith('0 still') and 'overdue' not in (ptxt | string)) -%}
                        {%- set pname_safe = pname | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                        {%- set cchips.v = cchips.v ~ "<div style='display:flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:11px;font-weight:700;color:var(--primary-text-color);'><span style='width:20px;height:20px;border-radius:50%;background:" ~ ('var(--success-color)' if p_ok else 'var(--divider-color)') ~ ";display:flex;align-items:center;justify-content:center;color:#fff;'><ha-icon icon='" ~ ('mdi:check-bold' if p_ok else 'mdi:close') ~ "' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon></span>" ~ pname_safe ~ "</div>" -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {#-- Level track: one node per level, green line fills as levels are reached --#}
                    {%- set nodes = namespace(v='') -%}
                    {#-- Show at most 5 levels; the window slides so the current level sits in the middle with 2 before and 2 after --#}
                    {%- set wcnt = [fcount, 5] | min -%}
                    {%- set cidx = (fcount - 1) if fdone else elevel -%}
                    {%- set wstart = [[cidx - 2, 0] | max, fcount - wcnt] | min -%}
                    {%- if fcount > 1 -%}
                      {%- for lv in flevels -%}
                        {%- if loop.index0 >= wstart and loop.index0 < wstart + wcnt -%}
                        {%- set n_reached = fdone or loop.index <= elevel -%}
                        {%- set n_cur = (not fdone) and loop.index == elevel + 1 -%}
                        {%- set n_col = 'var(--success-color)' if n_reached else ('#8b5cf6' if n_cur else 'var(--divider-color)') -%}
                        {%- set n_rw = (frewards[loop.index0] | round(0) | int) if loop.index0 < (frewards | length) else 0 -%}
                        {%- set nodes.v = nodes.v ~ "<div style='position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;'><div style='width:34px;height:34px;border-radius:50%;border:3px solid " ~ n_col ~ ";background:var(--card-background-color);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ ('mdi:check' if n_reached else 'mdi:star') ~ "' style='width:17px;height:17px;--mdc-icon-size:17px;color:" ~ n_col ~ ";display:block;'></ha-icon></div><div style='font-size:11px;font-weight:800;margin-top:4px;color:" ~ ('var(--primary-text-color)' if n_cur else 'var(--secondary-text-color)') ~ ";'>" ~ (lv | round(0) | int) ~ funit ~ "</div>" ~ ("<div style='font-size:10px;color:var(--secondary-text-color);'>+" ~ n_rw ~ " ⭐</div>" if n_rw > 0 else '') ~ "</div>" -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {%- set tfrac = 1 if fdone else (0 if elevel == 0 else ([([elevel - wstart - 1 + bpct / 100, 0] | max) / ([wcnt - 1, 1] | max), 1] | min)) -%}
                    {%- set tinset = 'calc(100% / ' ~ (wcnt * 2) ~ ')' -%}
                    {#-- Pace on the level track: between the two levels the even-pace total falls between --#}
                    {%- set fexp_v = fexp | float(0) -%}
                    {%- set pk = namespace(n=0) -%}
                    {%- for lv1 in flevels -%}{%- if lv1 <= fexp_v -%}{%- set pk.n = pk.n + 1 -%}{%- endif -%}{%- endfor -%}
                    {%- set pk_lo = (flevels[pk.n - 1] if pk.n > 0 else 0) | float(0) -%}
                    {%- set pk_hi = (flevels[pk.n] if pk.n < fcount else pk_lo) | float(0) -%}
                    {%- set pk_part = ((fexp_v - pk_lo) / (pk_hi - pk_lo)) if pk_hi > pk_lo else 0 -%}
                    {%- set tpos = ([[((pk.n - 1 + pk_part - wstart) if pk.n > 0 else 0) / ([wcnt - 1, 1] | max), 0] | max, 1] | min) -%}
                    {%- set pace_lbl = "<span style='position:absolute;left:4px;top:13px;font-size:9px;font-weight:800;color:" ~ pace_col ~ ";white-space:nowrap;'>" ~ ui.get('pace', 'pace') ~ "</span>" -%}
                    {%- set fui_v = "<div style='text-align:left;padding:14px 10px;border-radius:18px;margin:2px 0 4px 0;background:linear-gradient(135deg," ~ accent ~ "18," ~ accent2 ~ "10);border:1px solid " ~ accent ~ "66;'>"
                      ~ "<div style='display:flex;align-items:center;gap:10px;padding:0 4px;margin-bottom:12px;'>" ~ tile
                      ~ "<div style='flex:1;min-width:0;'>" ~ fbanner ~ "<div style='font-size:16px;font-weight:800;line-height:1.15;color:var(--primary-text-color);'>" ~ fname ~ "</div><div style='font-size:12px;color:var(--secondary-text-color);line-height:1.3;'>" ~ (fdesc if fdesc else sub) ~ "</div>" ~ pace_html ~ "</div>"
                      ~ "<div style='text-align:right;flex:0 0 auto;'><div style='font-size:20px;font-weight:800;line-height:1;color:var(--primary-text-color);'>" ~ ftotal ~ "</div><div style='font-size:10px;opacity:0.65;margin-top:2px;'>/ " ~ wtarget ~ funit ~ "</div>" ~ time_html ~ "</div></div>"
                      ~ (("<div style='position:relative;display:flex;margin-bottom:8px;'><div style='position:absolute;left:" ~ tinset ~ ";right:" ~ tinset ~ ";top:15px;height:4px;border-radius:4px;background:var(--divider-color);'></div><div style='position:absolute;left:" ~ tinset ~ ";width:calc((100% - 2 * " ~ tinset ~ ") * " ~ ('%.3f' | format(tfrac)) ~ ");top:15px;height:4px;border-radius:4px;background:var(--success-color);'></div>" ~ (("<div style='position:absolute;left:calc(" ~ tinset ~ " + (100% - 2 * " ~ tinset ~ ") * " ~ ('%.3f' | format(tpos)) ~ ");top:6px;height:22px;border-left:2px dashed " ~ pace_col ~ ";opacity:0.9;'>" ~ pace_lbl ~ "</div>") if tick_pct is not none else '') ~ nodes.v ~ "</div>") if fcount > 1 else ("<div style='position:relative;margin:0 4px 8px 4px;'><div style='height:14px;border-radius:999px;background:var(--divider-color);overflow:hidden;'><div style='width:" ~ bpct ~ "%;height:100%;border-radius:999px;background:linear-gradient(90deg," ~ accent ~ "," ~ accent2 ~ ");'></div></div>" ~ (("<div style='position:absolute;left:" ~ tick_pct ~ "%;top:-3px;bottom:-3px;border-left:2px dashed " ~ pace_col ~ ";opacity:0.9;'></div>") if tick_pct is not none else '') ~ "</div>"))
                      ~ ("<div style='text-align:center;font-size:12px;color:var(--secondary-text-color);'>" ~ sub ~ "</div>" if fdesc else '')
                      ~ (("<div style='text-align:center;'>" ~ mult_html ~ "</div>") if mult_html else '')
                      ~ rec_html
                      ~ ("<div style='display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px;'>" ~ cchips.v ~ "</div>" if cchips.v else '')
                      ~ "</div>" -%}
                  {%- else -%}
                    {#-- Scoreboard: goal fill row on top, one fill row per contributor underneath --#}
                    {%- set rows = namespace(v='') -%}
                    {%- for pname, pts in fshares.items() | sort(attribute='1', reverse=true) -%}
                      {%- set p = pts | float(0) | round(0) | int -%}
                      {%- set ppct = ([((p / ftop) * 100) | round(0) | int, 100] | min) if ftop > 0 else 0 -%}
                      {%- set lead = (p > 0 and (pts | float(0)) == ftop and ntop == 1) -%}
                      {%- set pcol = 'var(--warning-color)' if lead else 'var(--primary-color)' -%}
                      {%- set pname_safe = pname | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                      {%- set rows.v = rows.v ~ "<div style='position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--divider-color);'>"
                        ~ "<div style='position:absolute;left:0;top:0;bottom:0;width:" ~ ppct ~ "%;background:linear-gradient(90deg,color-mix(in srgb," ~ pcol ~ " 34%,transparent),color-mix(in srgb," ~ pcol ~ " 10%,transparent));'></div>"
                        ~ "<div style='position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px;'><div style='width:20px;height:20px;border-radius:50%;background:" ~ pcol ~ ";color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;'>" ~ (pname_safe[:1] | upper) ~ "</div>"
                        ~ "<span style='flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--primary-text-color);'>" ~ pname_safe ~ (' 🏆' if lead else '') ~ "</span><b style='font-size:12px;color:var(--primary-text-color);'>" ~ p ~ "</b></div></div>" -%}
                    {%- endfor -%}
                    {#-- Scoreboard header: level and what is left, then the reward and top contributor bonus, then days left (no pace) --#}
                    {%- set sb_lvl = ((lvl_txt ~ ' · ') if lvl_txt else '') ~ (sub if fdone else ('<b style="color:' ~ accent ~ ';">' ~ togo ~ ' ' ~ ui.get('to_go', 'to go') ~ '</b>')) -%}
                    {%- set sb_rw_bits = (["<span style='white-space:nowrap;'>+" ~ freward ~ ' ⭐ ' ~ ui.get('each', 'each') ~ (' ·' if (fmult > 1) else '') ~ '</span>'] if (freward > 0 and not fdone) else []) + (["<b style='color:var(--warning-color);white-space:nowrap;'>🏆 " ~ ui.get('top_contributor', 'Top contributor') ~ " ×" ~ ('%g' | format(fmult)) ~ "</b>"] if (fmult > 1 and not fdone) else []) -%}
                    {%- set sb_rw = ("<div style='font-size:11px;color:var(--secondary-text-color);line-height:1.35;white-space:nowrap;'>" ~ (sb_rw_bits | join(' ')) ~ "</div>") if sb_rw_bits else '' -%}
                    {%- set sb_bits = [pace_txt] if ffin else ([days_txt] if days_txt else []) -%}
                    {%- set sb_meta = ("<div style='font-size:11px;color:var(--secondary-text-color);line-height:1.35;'>" ~ (sb_bits | join(' · ')) ~ "</div>") if sb_bits else '' -%}
                    {#-- All levels done: a top-earner banner with ranked chips replaces the rows --#}
                    {%- set win = namespace(names=[], av='', chips='') -%}
                    {%- set win_html = '' -%}
                    {%- if fdone and ftop > 0 -%}
                      {%- set w_psensor = ((helpers | first).attributes.get('core_sensors') or {}).get('points_eid') if helpers else none -%}
                      {%- set w_plabel = ((state_attr(w_psensor, 'unit_of_measurement') if w_psensor else none) or '') | string -%}
                      {%- set wunit = (((w_plabel | lower) if (w_plabel and (w_plabel | lower) != (ui.get('points', 'Points') | lower)) else ui.get('points_unit', 'points')) | replace('&', '&amp;') | replace('<', '&lt;')) if ftype == 'family_points_total' else (ui.get('chores_unit', 'chores') if ftype in ['family_chore_total', 'family_chores_in_day'] else '') -%}
                      {%- for pname, pts in fshares.items() | sort(attribute='1', reverse=true) -%}
                        {%- set pv = pts | float(0) -%}
                        {%- set pname_safe = pname | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                        {%- if pv == ftop -%}
                          {%- set win.names = win.names + [pname_safe] -%}
                          {%- set win.av = win.av ~ "<div style='width:40px;height:40px;border-radius:50%;background:var(--warning-color);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;" ~ ("margin-left:-14px;border:2px solid var(--card-background-color);" if win.av else '') ~ "'>" ~ (pname_safe[:1] | upper) ~ "</div>" -%}
                        {%- else -%}
                          {%- set place = (fshares.values() | map('float', 0) | select('gt', pv) | list | length) + 1 -%}
                          {%- set medal = {2: '🥈 ', 3: '🥉 '}.get(place, '') -%}
                          {%- set win.chips = win.chips ~ "<span style='display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:12px;font-weight:700;color:var(--primary-text-color);" ~ ('' if medal else 'opacity:0.7;') ~ "'>" ~ medal ~ pname_safe ~ ' ' ~ (pv | round(0) | int) ~ "</span>" -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set win_line = (win.names | join(' &amp; ')) ~ ' · ' ~ (ftop | round(0) | int) ~ ((' ' ~ wunit) if wunit else '') ~ ((' ' ~ ui.get('each', 'each')) if (win.names | length) > 1 else '') -%}
                      {%- set win_bonus = ("<div style='font-size:11px;color:var(--secondary-text-color);'>🏆 " ~ ui.get('top_contributor', 'Top contributor') ~ " ×" ~ ('%g' | format(fmult)) ~ "</div>") if fmult > 1 else '' -%}
                      {%- set win_html = "<div style='display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--warning-color) 35%,transparent),color-mix(in srgb,var(--warning-color) 10%,transparent));border:1px solid color-mix(in srgb,var(--warning-color) 50%,transparent);'><div style='display:flex;flex:0 0 auto;'>" ~ win.av ~ "</div><div style='flex:1;min-width:0;'><div style='font-size:11px;font-weight:800;letter-spacing:0.4px;color:var(--warning-color);'>🏆 " ~ ((ui.get('top_earners', 'Top earners') if (win.names | length) > 1 else ui.get('top_earner', 'Top earner')) | upper) ~ "</div><div style='font-size:16px;font-weight:800;line-height:1.2;color:var(--primary-text-color);'>" ~ win_line ~ "</div>" ~ win_bonus ~ "</div></div>" ~ (("<div style='display:flex;flex-wrap:wrap;gap:6px;justify-content:center;'>" ~ win.chips ~ "</div>") if win.chips else '') -%}
                    {%- endif -%}
                    {%- set fui_v = "<div style='text-align:left;padding:10px;border-radius:18px;margin:2px 0 4px 0;background:linear-gradient(135deg," ~ accent ~ "18," ~ accent2 ~ "10);border:1px solid " ~ accent ~ "66;'>"
                      ~ "<div style='position:relative;overflow:hidden;border-radius:16px;margin-bottom:6px;border:1px solid " ~ accent ~ "88;'>"
                      ~ "<div style='position:absolute;left:0;top:0;bottom:0;width:" ~ bpct ~ "%;background:linear-gradient(90deg," ~ accent ~ "77," ~ accent2 ~ "33);'></div>"
                      ~ "<div style='position:relative;display:flex;align-items:center;gap:12px;padding:12px;'>" ~ tile
                      ~ "<div style='flex:1;min-width:0;'>" ~ fbanner ~ "<div style='font-size:15px;font-weight:700;line-height:1.2;color:var(--primary-text-color);'>" ~ fname ~ "</div>" ~ ("<div style='font-size:11px;color:var(--secondary-text-color);line-height:1.35;'>" ~ fdesc ~ "</div>" if fdesc else '') ~ "<div style='font-size:11px;color:var(--secondary-text-color);line-height:1.35;'>" ~ sb_lvl ~ "</div>" ~ sb_rw ~ sb_meta ~ "</div>"
                      ~ "<div style='flex:0 0 auto;text-align:right;'><div style='display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:13px;font-weight:800;color:var(--primary-text-color);white-space:nowrap;'>" ~ ftotal ~ "<span style='opacity:0.6;font-weight:600;'>/" ~ wtarget ~ "</span></div><br>" ~ time_html ~ "</div></div></div>"
                      ~ rec_html ~ (win_html if win_html else ("<div style='display:grid;grid-template-columns:1fr 1fr;gap:4px;'>" ~ rows.v ~ "</div>")) ~ "</div>" -%}
                  {%- endif -%}

                  {{
                    {
                      'type': 'custom:button-card',
                      'show_name': false,
                      'show_icon': false,
                      'tap_action': {'action': 'none'},
                      'hold_action': {'action': 'none'},
                      'custom_fields': {'content': fui_v},
                      'styles': {
                        'card': [
                          {'background': 'transparent'},
                          {'box-shadow': 'none'},
                          {'border': 'none'},
                          {'padding': '0px'},
                          {'min-height': 'unset'}
                        ],
                        'grid': [
                          {'grid-template-areas': '"content"'},
                          {'grid-template-columns': '1fr'}
                        ],
                        'custom_fields': {
                          'content': [{'width': '100%'}]
                        }
                      }
                    }
                  }},
                {%- endif -%}
              {%- endfor -%}
