                    {%- set cp_opts = (state_attr(chore_select_entity, 'options') or []) | reject('in', ['None', '──────────']) | list -%}
                    {%- set cp_all = (mgmt_sa_admin.get('quick-actions', {}) if mgmt_sa_admin is mapping else {}).get('picker-all', false) | bool(false) -%}
                    {%- set cp_limit = 8 -%}
                    {%- set cp_show = cp_opts if cp_all else cp_opts[:cp_limit] -%}
                    {%- set cp_cards = namespace(items=[]) -%}
                    {%- for cp_opt in cp_show -%}
                      {%- set cp_off = cp_opt.startswith('⊘ ') -%}
                      {%- set cp_core = chore_core(cp_opt, known_users.n) | string | trim -%}
                      {%- set cp_row = namespace(state='', eid='') -%}
                      {%- for cp_item in helper_chore_items -%}
                        {%- if cp_row.eid == '' and (cp_item.name | default('', true) | string | trim) == cp_core -%}
                          {%- set cp_row.state = cp_item.state | default('', true) | string -%}
                          {%- set cp_row.eid = cp_item.eid | default('', true) | string -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set cp_state_key = 'completed' if cp_row.state in ['approved', 'already_approved'] else 'completed_in_part' if cp_row.state == 'approved_in_part' else cp_row.state -%}
                      {%- set cp_color = 'var(--disabled-text-color)' if cp_off else ('var(--primary-color)' if cp_state_key in ['pending', ''] else status_color_map.get(cp_state_key, 'var(--primary-color)')) -%}
                      {%- set cp_due = state_attr(cp_row.eid, 'due_date') if cp_row.eid != '' else none -%}
                      {%- set cp_due_txt = (as_timestamp(cp_due) | timestamp_custom('%a %I:%M %p', true)) if cp_due not in [none, '', 'None', 'unknown', 'unavailable'] else '' -%}
                      {%- set cp_status = (ui.get('not_assigned', 'Not assigned')) if cp_off else (status_map.get(cp_state_key, cp_state_key | title) if cp_state_key != '' else '') -%}
                      {%- set cp_label = cp_status ~ (' · ' ~ cp_due_txt if cp_due_txt != '' and not cp_off else '') -%}
