<#-- ============================================= --#>
<#-- ChoreOps Dashboard Template - ADMIN (Family Hub) --#>
<#-- Template Schema Version: 1                --#>
<#-- Integration: 1.0.0 (Schema 100)           --#>
<#-- ============================================= --#>
<#--                                             --#>
<#-- OpsCenter for the Family Hub: compact shared  --#>
<#-- admin with approvals, management tabs, quick --#>
<#-- actions, family goals and reward pools       --#>
<#-- OUTPUT: Full dashboard document with root keys --#>
<#--                                             --#>
<#-- No injection needed                         --#>
<#--                                             --#>
<#-- All HA Jinja2 {{ }} syntax is preserved as-is --#>
<#-- ============================================= --#>

views:
- title: << t.get('parents', 'Parents') >>
  path: admin
  max_columns: 3
  sections:
    - type: grid
      cards:
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== APPROVAL BOARD ===== --#}

              << template_snippets.meta_stamp >>


              {#-- 1. User Configuration --#}

              << template_snippets.user_override_helper >>

              {%- set pref_ui_control_key_root = 'admin-shared/approval-center' -%}

              {%- set pref_default_header_collapsed = false -%}

              {%- set pref_primary_tint_mix_pct = 14 -%}

              {%- set pref_show_header_background = true -%}

              {%- set pref_show_header_thin_border = true -%}

              {%- set pref_claim_accent = '#a957fa' -%}

              {#-- 2. Dynamic Lookups & Validations --#}

              {# shared_admin_translation_sensor_eid comes from the admin setup snippet #}

              << template_snippets.admin_setup_shared >>

              << template_snippets.admin_validation_missing_selector >>

              {%- set pref_ui_control_key_root = (pref_ui_control_key_root | default('admin-shared/approval-center') | string) -%}
              {%- set pref_ui_control_key_root_segments = pref_ui_control_key_root.split('/') | reject('equalto', '') | list -%}
              {%- if pref_ui_control_key_root_segments | length == 0 -%}
                {%- set pref_ui_control_key_root_segments = ['admin-shared', 'approval-center'] -%}
              {%- endif -%}
              {%- set pref_ui_control_key_root = pref_ui_control_key_root_segments | join('/') -%}
              {%- set pref_default_header_collapsed = (pref_default_header_collapsed | default('false') | string | lower) == 'true' -%}
              {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
              {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
              {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
              {%- if pref_primary_tint_mix_pct < 0 -%}
                {%- set pref_primary_tint_mix_pct = 0 -%}
              {%- elif pref_primary_tint_mix_pct > 100 -%}
                {%- set pref_primary_tint_mix_pct = 100 -%}
              {%- endif -%}
              {%- if not skip_render -%}

                {#-- 3. Initialize Variables --#}

                {%- set ns = namespace(
                  lanes=[],
                  chore_groups=[],
                  reward_groups=[],
                  all_ids=[],
                  total_chore_pending=0,
                  total_reward_pending=0,
                  pending_user_count=0,
                  summary_helper=summary_helper
                ) -%}
                {%- if ns.summary_helper in ['', None, 'None'] -%}
                  {{ {
                    'type': 'markdown',
                    'content': "⚠️ **Dashboard configuration error**\n\nCannot find any dashboard helper entities for this shared admin view.\n\nCheck Settings → Integrations → ChoreOps and verify at least one user is configured."
                  } }},
                  {%- set skip_render = true -%}
                {%- endif -%}
              {%- endif -%}

              {%- if not skip_render -%}

                {#-- 4. Collect Data --#}

                {%- set ui = shared_admin_ui -%}
                {%- set integration_entry_id = state_attr(shared_admin_helper_eid, 'integration_entry_id') if shared_admin_helper_eid not in ['', None, 'None'] else '' -%}
                {%- set ui_control_key_root = pref_ui_control_key_root -%}
                {%- set ui_control_key_header_collapsed = ui_control_key_root ~ '/header-collapse' -%}
                {%- set shared_admin_ui_root = namespace(current=ui_root.shared_admin if ui_root.shared_admin is mapping else {}) -%}
                {%- for segment in ui_control_key_root.split('/') -%}
                  {%- if shared_admin_ui_root.current is mapping -%}
                    {%- set shared_admin_ui_root.current = shared_admin_ui_root.current.get(segment, {}) -%}
                  {%- else -%}
                    {%- set shared_admin_ui_root.current = {} -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set has_header_collapsed_override = shared_admin_ui_root.current is mapping and 'header-collapse' in shared_admin_ui_root.current -%}

                {#-- 5. Build Display --#}

                {%- for helper_state in helper_sensor_entities -%}
                {%- set helper_entity_id = helper_state.entity_id -%}
                {%- set helper_attrs = helper_state.attributes -%}
                {%- set helper_name = helper_attrs.user_name | default(helper_state.name, true) -%}
                {%- set dashboard_helpers = helper_attrs.dashboard_helpers | default({}, true) -%}
                {%- set pending_approvals = helper_attrs.pending_approvals | default({}, true) -%}
                {%- set pending_chore_data = pending_approvals.get('chores', []) | default([], true) -%}
                {%- set pending_reward_data = pending_approvals.get('rewards', []) | default([], true) -%}
                {%- set helper_chore_items_ns = namespace(items=helper_attrs.chores | default([], true)) -%}
                {%- set helper_chore_helper_eids = dashboard_helpers.get('chore_helper_eids', []) if dashboard_helpers is mapping else [] -%}
                {%- if helper_chore_helper_eids is iterable and helper_chore_helper_eids is not string -%}
                  {%- for chore_helper_eid in helper_chore_helper_eids | list -%}
                    {%- if chore_helper_eid not in ['', None, 'None'] and states(chore_helper_eid) not in ['unknown', 'unavailable'] -%}
                      {%- set helper_chore_items_ns.items = helper_chore_items_ns.items + (state_attr(chore_helper_eid, 'chores') | default([], true)) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set helper_chore_items = helper_chore_items_ns.items -%}
                {%- set helper_reward_items = helper_attrs.rewards | default([], true) -%}
                {%- set chore_count = pending_chore_data | count -%}
                {%- set reward_count = pending_reward_data | count -%}
                {%- set total_count = chore_count + reward_count -%}
                {%- if total_count > 0 -%}
                  {%- set ns.total_chore_pending = ns.total_chore_pending + chore_count -%}
                  {%- set ns.total_reward_pending = ns.total_reward_pending + reward_count -%}
                  {%- set ns.pending_user_count = ns.pending_user_count + 1 -%}
                  {%- set combined_summary = "<div style='display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1;'><span style='font-size:16px;font-weight:700;'>" ~ total_count ~ "</span><span style='margin-top:4px;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--secondary-text-color);'>" ~ ui.get('approvals', 'err-approvals') ~ "</span></div>" -%}
                  
                  {%- set row_ns = namespace(cards=[], rcards=[], c_ids=[], r_ids=[]) -%}
                  {%- for entry in pending_chore_data -%}
                    {%- set approve_eid = (entry.approve_button_eid if entry.approve_button_eid not in [None, 'None', ''] else '') | default('') -%}
                    {%- set return_eid = (entry.disapprove_button_eid if entry.disapprove_button_eid not in [None, 'None', ''] else '') | default('') -%}
                    {%- set chore_match = helper_chore_items | selectattr('name', 'eq', entry.chore_name) | list -%}
                    {%- set chore_eid = chore_match[0].eid if chore_match | count > 0 else '' -%}
                    {%- set item_icon = (state_attr(chore_eid, 'icon') if chore_eid not in ['', None, 'None'] else None) or 'mdi:broom' -%}
                    {%- set claimed_at_iso = state_attr(chore_eid, 'last_claimed') if chore_eid not in ['', None, 'None'] else None -%}
                    {%- set last_completed_iso = state_attr(chore_eid, 'last_completed') if chore_eid not in ['', None, 'None'] else None -%}
                    {%- set claimed_at_display = (as_timestamp(claimed_at_iso) | timestamp_custom('%Y-%m-%d %-I:%M%p', true)) if claimed_at_iso not in ['', None, 'None'] else '' -%}
                    {%- set last_completed_display = (as_timestamp(last_completed_iso) | timestamp_custom('%Y-%m-%d', true)) if last_completed_iso not in ['', None, 'None'] else '' -%}
                    {%- set meta_text = ui.get('chore_claimed', 'err-chore_claimed') ~ ': ' ~ claimed_at_display if claimed_at_display != '' else ui.get('chore', 'err-chore') -%}
                    {%- if last_completed_display != '' -%}
                      {%- set meta_text = meta_text ~ ' • ' ~ ui.get('last', 'err-last') ~ ': ' ~ last_completed_display -%}
                    {%- endif -%}
                    {%- if approve_eid != '' or return_eid != '' -%}
                      {%- set row_ns.cards = row_ns.cards + [{
                        'type': 'custom:button-card',
                        'entity': approve_eid if approve_eid != '' else return_eid,
                        'show_name': False,
                        'show_icon': False,
                        'show_label': False,
                        'show_state': False,
                        'tap_action': {'action': 'none'},
                        'hold_action': {'action': 'more-info'},
                        'styles': {
                          'card': [
                            {'padding': '9px 12px'},
                            {'border-radius': '16px'},
                            {'box-shadow': 'none'},
                            {'border': '1px solid color-mix(in srgb, ' ~ pref_claim_accent ~ ' 14%, var(--divider-color))'},
                            {'background-color': 'var(--card-background-color)'},
                            {'border-left': '3px solid ' ~ pref_claim_accent}
                          ],
                          'grid': [
                            {'grid-template-areas': '"kind title btn_return btn_approve" "kind meta btn_return btn_approve"'},
                            {'grid-template-columns': '36px minmax(0, 1fr) 42px 42px'},
                            {'grid-template-rows': 'min-content min-content'},
                            {'column-gap': '10px'},
                            {'row-gap': '2px'},
                            {'align-items': 'center'}
                          ],
                          'custom_fields': {
                            'kind': [
                              {'align-self': 'center'},
                              {'justify-self': 'center'}
                            ],
                            'title': [
                              {'justify-self': 'start'},
                              {'min-width': '0'},
                              {'width': '100%'},
                              {'text-align': 'left'},
                              {'font-size': '14px'},
                              {'font-weight': '700'},
                              {'line-height': '1.25'},
                              {'overflow': 'hidden'},
                              {'text-overflow': 'ellipsis'},
                              {'white-space': 'nowrap'}
                            ],
                            'meta': [
                              {'justify-self': 'start'},
                              {'min-width': '0'},
                              {'width': '100%'},
                              {'text-align': 'left'},
                              {'font-size': '11px'},
                              {'color': 'var(--secondary-text-color)'},
                              {'line-height': '1.2'},
                              {'overflow': 'hidden'},
                              {'text-overflow': 'ellipsis'},
                              {'white-space': 'nowrap'}
                            ],
                            'btn_return': [
                              {'justify-self': 'end'},
                              {'align-self': 'center'}
                            ],
                            'btn_approve': [
                              {'justify-self': 'end'},
                              {'align-self': 'center'}
                            ]
                          }
                        },
                        'custom_fields': {
                          'kind': "<div style='width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, " ~ pref_claim_accent ~ " 8%, transparent);border:1px solid color-mix(in srgb, " ~ pref_claim_accent ~ " 24%, transparent);'><ha-icon icon='" ~ item_icon ~ "' style='width:18px;height:18px;color:" ~ pref_claim_accent ~ ";transform:translateY(-3px);'></ha-icon></div>",
                          'title': entry.chore_name | default('', true),
                          'meta': meta_text,
                          'btn_return': {
                            'card': {
                              'type': 'custom:button-card',
                              'entity': return_eid if return_eid != '' else approve_eid,
                              'icon': 'mdi:undo-variant',
                              'show_name': False,
                              'show_icon': True,
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'button.press',
                                'data': {
                                  'entity_id': return_eid
                                }
                              },
                              'hold_action': {'action': 'more-info'},
                              'styles': {
                                'card': [
                                  {'width': '36px'},
                                  {'height': '36px'},
                                  {'border-radius': '50%'},
                                  {'background-color': 'rgba(244, 67, 54, 0.08)'},
                                  {'border': '1px solid rgba(244, 67, 54, 0.28)'},
                                  {'box-shadow': 'none'},
                                  {'display': 'flex' if return_eid != '' else 'none'}
                                ],
                                'icon': [
                                  {'width': '18px'},
                                  {'color': 'var(--error-color)'}
                                ]
                              }
                            }
                          },
                          'btn_approve': {
                            'card': {
                              'type': 'custom:button-card',
                              'entity': approve_eid if approve_eid != '' else return_eid,
                              'icon': 'mdi:check-bold',
                              'show_name': False,
                              'show_icon': True,
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'button.press',
                                'data': {
                                  'entity_id': approve_eid
                                }
                              },
                              'hold_action': {'action': 'more-info'},
                              'styles': {
                                'card': [
                                  {'width': '36px'},
                                  {'height': '36px'},
                                  {'border-radius': '50%'},
                                  {'background-color': 'rgba(76, 175, 80, 0.10)'},
                                  {'border': '1px solid rgba(76, 175, 80, 0.30)'},
                                  {'box-shadow': 'none'},
                                  {'display': 'flex' if approve_eid != '' else 'none'}
                                ],
                                'icon': [
                                  {'width': '18px'},
                                  {'color': 'var(--success-color)'}
                                ]
                              }
                            }
                          }
                        }
                      }] -%}
                      {%- if approve_eid != '' -%}{%- set row_ns.c_ids = row_ns.c_ids + [approve_eid] -%}{%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- for entry in pending_reward_data -%}
                    {%- set approve_eid = (entry.approve_button_eid if entry.approve_button_eid not in [None, 'None', ''] else '') | default('') -%}
                    {%- set return_eid = (entry.disapprove_button_eid if entry.disapprove_button_eid not in [None, 'None', ''] else '') | default('') -%}
                    {%- set reward_match = helper_reward_items | selectattr('name', 'eq', entry.reward_name) | list -%}
                    {%- set reward_eid = reward_match[0].eid if reward_match | count > 0 else '' -%}
                    {%- set item_icon = (state_attr(reward_eid, 'icon') if reward_eid not in ['', None, 'None'] else None) or 'mdi:gift-outline' -%}
                    {%- set requested_at_iso = state_attr(reward_eid, 'last_claimed') if reward_eid not in ['', None, 'None'] else None -%}
                    {%- set last_approved_iso = state_attr(reward_eid, 'last_approved') if reward_eid not in ['', None, 'None'] else None -%}
                    {%- set requested_at_display = (as_timestamp(requested_at_iso) | timestamp_custom('%Y-%m-%d %-I:%M%p', true)) if requested_at_iso not in ['', None, 'None'] else '' -%}
                    {%- set last_approved_display = (as_timestamp(last_approved_iso) | timestamp_custom('%Y-%m-%d', true)) if last_approved_iso not in ['', None, 'None'] else '' -%}
                    {%- set meta_text = ui.get('reward_requested', 'err-reward_requested') ~ ': ' ~ requested_at_display if requested_at_display != '' else ui.get('reward', 'err-reward') -%}
                    {%- if last_approved_display != '' -%}
                      {%- set meta_text = meta_text ~ ' • ' ~ ui.get('last', 'err-last') ~ ': ' ~ last_approved_display -%}
                    {%- endif -%}
                    {%- if approve_eid != '' or return_eid != '' -%}
                      {%- set row_ns.rcards = row_ns.rcards + [{
                        'type': 'custom:button-card',
                        'entity': approve_eid if approve_eid != '' else return_eid,
                        'show_name': False,
                        'show_icon': False,
                        'show_label': False,
                        'show_state': False,
                        'tap_action': {'action': 'none'},
                        'hold_action': {'action': 'more-info'},
                        'styles': {
                          'card': [
                            {'padding': '9px 12px'},
                            {'border-radius': '16px'},
                            {'box-shadow': 'none'},
                            {'border': '1px solid color-mix(in srgb, ' ~ pref_claim_accent ~ ' 14%, var(--divider-color))'},
                            {'background-color': 'var(--card-background-color)'},
                            {'border-left': '3px solid ' ~ pref_claim_accent}
                          ],
                          'grid': [
                            {'grid-template-areas': '"kind title btn_return btn_approve" "kind meta btn_return btn_approve"'},
                            {'grid-template-columns': '36px minmax(0, 1fr) 42px 42px'},
                            {'grid-template-rows': 'min-content min-content'},
                            {'column-gap': '10px'},
                            {'row-gap': '2px'},
                            {'align-items': 'center'}
                          ],
                          'custom_fields': {
                            'kind': [
                              {'align-self': 'center'},
                              {'justify-self': 'center'}
                            ],
                            'title': [
                              {'justify-self': 'start'},
                              {'min-width': '0'},
                              {'width': '100%'},
                              {'text-align': 'left'},
                              {'font-size': '14px'},
                              {'font-weight': '700'},
                              {'line-height': '1.25'},
                              {'overflow': 'hidden'},
                              {'text-overflow': 'ellipsis'},
                              {'white-space': 'nowrap'}
                            ],
                            'meta': [
                              {'justify-self': 'start'},
                              {'min-width': '0'},
                              {'width': '100%'},
                              {'text-align': 'left'},
                              {'font-size': '11px'},
                              {'color': 'var(--secondary-text-color)'},
                              {'line-height': '1.2'},
                              {'overflow': 'hidden'},
                              {'text-overflow': 'ellipsis'},
                              {'white-space': 'nowrap'}
                            ],
                            'btn_return': [
                              {'justify-self': 'end'},
                              {'align-self': 'center'}
                            ],
                            'btn_approve': [
                              {'justify-self': 'end'},
                              {'align-self': 'center'}
                            ]
                          }
                        },
                        'custom_fields': {
                          'kind': "<div style='width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, " ~ pref_claim_accent ~ " 8%, transparent);border:1px solid color-mix(in srgb, " ~ pref_claim_accent ~ " 24%, transparent);'><ha-icon icon='" ~ item_icon ~ "' style='width:18px;height:18px;color:" ~ pref_claim_accent ~ ";transform:translateY(-3px);'></ha-icon></div>",
                          'title': (entry.reward_name | default('', true)) ~ ((" <span style='font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;background:color-mix(in srgb, var(--warning-color) 18%, transparent);color:var(--warning-color);white-space:nowrap;'>" ~ reward_match[0].cost ~ "</span>") if reward_match | count > 0 and reward_match[0].cost not in [none, '', 'None'] else ''),
                          'meta': meta_text,
                          'btn_return': {
                            'card': {
                              'type': 'custom:button-card',
                              'entity': return_eid if return_eid != '' else approve_eid,
                              'icon': 'mdi:undo-variant',
                              'show_name': False,
                              'show_icon': True,
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'button.press',
                                'data': {
                                  'entity_id': return_eid
                                }
                              },
                              'hold_action': {'action': 'more-info'},
                              'styles': {
                                'card': [
                                  {'width': '36px'},
                                  {'height': '36px'},
                                  {'border-radius': '50%'},
                                  {'background-color': 'rgba(244, 67, 54, 0.08)'},
                                  {'border': '1px solid rgba(244, 67, 54, 0.28)'},
                                  {'box-shadow': 'none'},
                                  {'display': 'flex' if return_eid != '' else 'none'}
                                ],
                                'icon': [
                                  {'width': '18px'},
                                  {'color': 'var(--error-color)'}
                                ]
                              }
                            }
                          },
                          'btn_approve': {
                            'card': {
                              'type': 'custom:button-card',
                              'entity': approve_eid if approve_eid != '' else return_eid,
                              'icon': 'mdi:check-bold',
                              'show_name': False,
                              'show_icon': True,
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'button.press',
                                'data': {
                                  'entity_id': approve_eid
                                }
                              },
                              'hold_action': {'action': 'more-info'},
                              'styles': {
                                'card': [
                                  {'width': '36px'},
                                  {'height': '36px'},
                                  {'border-radius': '50%'},
                                  {'background-color': 'rgba(76, 175, 80, 0.10)'},
                                  {'border': '1px solid rgba(76, 175, 80, 0.30)'},
                                  {'box-shadow': 'none'},
                                  {'display': 'flex' if approve_eid != '' else 'none'}
                                ],
                                'icon': [
                                  {'width': '18px'},
                                  {'color': 'var(--success-color)'}
                                ]
                              }
                            }
                          }
                        }
                      }] -%}
                      {%- if approve_eid != '' -%}{%- set row_ns.r_ids = row_ns.r_ids + [approve_eid] -%}{%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- for kind in ['chores', 'rewards'] -%}
                    {%- set k_cards = row_ns.cards if kind == 'chores' else row_ns.rcards -%}
                    {%- set k_ids = row_ns.c_ids if kind == 'chores' else row_ns.r_ids -%}
                    {%- if k_cards | length > 0 -%}
                      {%- set k_noun = (ui.get('chores', 'chores') if kind == 'chores' else ui.get('rewards', 'rewards')) | lower -%}
                      {%- set k_name_safe = helper_name | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                      {%- set who_html = "<div style='display:flex;align-items:center;gap:10px;text-align:left;'><div style='width:28px;height:28px;border-radius:50%;background:var(--primary-color);color:var(--text-primary-color,#fff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto;'>" ~ (k_name_safe[:1] | upper) ~ "</div><div style='min-width:0;'><div style='font-size:15px;font-weight:800;line-height:1.1;'>" ~ k_name_safe ~ "</div><div style='font-size:11px;opacity:.65;'>" ~ (k_cards | length) ~ ' ' ~ k_noun ~ "</div></div></div>" -%}
                      {%- set approve_all_card = {
                        'type': 'custom:button-card',
                        'entity': k_ids[0] if k_ids | length > 0 else helper_entity_id,
                        'show_name': True,
                        'show_icon': False,
                        'show_state': False,
                        'name': (ui.get('approve_all', 'Approve all') if k_cards | length > 1 else ui.get('approve', 'Approve')),
                        'tap_action': {
                          'action': 'call-service',
                          'service': 'choreops.approve_all_pending',
                          'data': {'entity_id': k_ids},
                          'confirmation': {'text': (ui.get('approve', 'Approve') ~ ' ' ~ (k_ids | length) ~ ' ' ~ k_noun ~ ' · ' ~ helper_name ~ '?')}
                        } if k_ids | length > 0 else {'action': 'none'},
                        'hold_action': {'action': 'none'},
                        'styles': {
                          'card': [
                            {'padding': '5px 12px'},
                            {'border-radius': '999px'},
                            {'border': '1.5px solid var(--success-color)'},
                            {'background': 'transparent'},
                            {'box-shadow': 'none'},
                            {'min-height': 'unset'},
                            {'display': 'flex' if k_ids | length > 0 else 'none'}
                          ],
                          'name': [
                            {'font-size': '12px'},
                            {'font-weight': '700'},
                            {'color': 'var(--success-color)'},
                            {'white-space': 'nowrap'}
                          ]
                        }
                      } -%}
                      {%- set group_card = {
                        'type': 'custom:button-card',
                        'entity': helper_entity_id,
                        'show_name': False,
                        'show_icon': False,
                        'show_label': False,
                        'show_state': False,
                        'tap_action': {'action': 'none'},
                        'hold_action': {'action': 'none'},
                        'custom_fields': {
                          'who': who_html,
                          'btn': {'card': approve_all_card},
                          'rows': {'card': {'type': 'grid', 'columns': 1, 'square': False, 'cards': k_cards}}
                        },
                        'styles': {
                          'card': [
                            {'padding': '10px 10px 3px 10px'},
                            {'border-radius': '16px'},
                            {'box-shadow': 'none'},
                            {'border': '1px solid color-mix(in srgb, ' ~ pref_claim_accent ~ ' 16%, var(--divider-color))'},
                            {'background-color': 'color-mix(in srgb, var(--primary-color) 4%, var(--card-background-color))'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"who btn" "rows rows"'},
                            {'grid-template-columns': 'minmax(0, 1fr) auto'},
                            {'grid-template-rows': 'min-content min-content'},
                            {'row-gap': '8px'},
                            {'align-items': 'center'}
                          ],
                          'custom_fields': {
                            'who': [{'justify-self': 'start'}],
                            'btn': [{'justify-self': 'end'}],
                            'rows': [{'width': '100%'}]
                          }
                        }
                      } -%}
                      {%- set ns.all_ids = ns.all_ids + k_ids -%}
                      {%- if kind == 'chores' -%}
                        {%- set ns.chore_groups = ns.chore_groups + [group_card] -%}
                      {%- else -%}
                        {%- set ns.reward_groups = ns.reward_groups + [group_card] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- endfor -%}

                {#-- 6. Render --#}

                {%- set total_pending = ns.total_chore_pending + ns.total_reward_pending -%}
                {%- set header_collapsed = shared_admin_ui_root.current['header-collapse'] if has_header_collapsed_override else (false if total_pending > 0 else pref_default_header_collapsed) -%}
                {%- set header_collapsed = (header_collapsed | string | lower) == 'true' -%}
                {%- set show_summary_count = header_collapsed or total_pending == 0 -%}
                {%- set collapsed_summary = "<div style='display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1;'><span style='font-size:16px;font-weight:700;'>" ~ total_pending ~ "</span><span style='margin-top:4px;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--secondary-text-color);'>" ~ ui.get('approvals', 'err-approvals') ~ "</span></div>" -%}
              {%- set summary_card = {
                'type': 'custom:button-card',
                'entity': ns.summary_helper if ns.summary_helper not in ['', None, 'None'] else None,
                'show_name': True,
                'show_label': True,
                'show_state': False,
                'show_icon': True,
                'icon': 'mdi:clipboard-check-multiple-outline',
                'icon_color': pref_claim_accent,
                'name': ui.get('approval_center', 'err-approval_center'),
                'label': ui.get('review_chores_and_rewards_waiting_for_approval', 'err-review_chores_and_rewards_waiting_for_approval'),
                'tap_action': ({
                  'action': 'call-service',
                  'service': 'choreops.manage_ui_control',
                  'data': {
                    'config_entry_id': integration_entry_id,
                    'ui_control_target': 'shared_admin',
                    'ui_control_action': 'remove',
                    'key': ui_control_key_header_collapsed
                  }
                } if header_collapsed and integration_entry_id not in ['', none] else {
                  'action': 'call-service',
                  'service': 'choreops.manage_ui_control',
                  'data': {
                    'config_entry_id': integration_entry_id,
                    'ui_control_target': 'shared_admin',
                    'ui_control_action': 'update',
                    'key': ui_control_key_header_collapsed,
                    'value': true
                  }
                } if integration_entry_id not in ['', none] else {
                  'action': 'none'
                }),
                'hold_action': {'action': 'more-info'} if ns.summary_helper not in ['', None, 'None'] else {'action': 'none'},
                'custom_fields': {
                  'approval_count': collapsed_summary,
                  'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                },
                'styles': {
                  'card': [
                    {'padding': '10px 14px'},
                    {'border-radius': '16px'},
                    {'box-shadow': 'none'},
                    {'border': ('1px solid color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--divider-color))') if header_collapsed and pref_show_header_thin_border else 'none' if header_collapsed else '1px solid color-mix(in srgb, ' ~ pref_claim_accent ~ ' 18%, var(--divider-color))'},
                    {'background-color': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--card-background-color))') if header_collapsed and pref_show_header_background else 'transparent' if header_collapsed else 'color-mix(in srgb, var(--secondary-background-color) 72%, var(--card-background-color))'}
                  ],
                  'grid': [
                    {'grid-template-areas': '"i n approval_count toggle"' if show_summary_count else '"i n toggle" "i l toggle"'},
                    {'grid-template-columns': '32px minmax(0, 1fr) auto min-content' if show_summary_count else '32px minmax(0, 1fr) min-content'},
                    {'grid-template-rows': 'min-content' if show_summary_count else 'min-content min-content'},
                    {'column-gap': '14px'},
                    {'row-gap': '2px'},
                    {'align-items': 'center'}
                  ],
                  'name': [
                    {'justify-self': 'start'},
                    {'font-size': '14px'},
                    {'font-weight': '700'},
                    {'line-height': '1.2'},
                    {'text-transform': 'uppercase'}
                  ],
                  'label': [
                    {'display': 'none' if show_summary_count else 'block'},
                    {'justify-self': 'start'},
                    {'font-size': '12px'},
                    {'line-height': '1.35'},
                    {'white-space': 'normal'},
                    {'color': 'var(--secondary-text-color)'}
                  ],
                  'icon': [
                    {'width': '24px'},
                    {'height': '24px'},
                    {'align-self': 'center'}
                  ],
                  'custom_fields': {
                    'approval_count': [
                      {'justify-self': 'end'},
                      {'text-align': 'right'},
                      {'line-height': '1'},
                      {'white-space': 'nowrap'},
                      {'display': 'block' if show_summary_count else 'none'},
                      {'padding': '4px 0 0 0' if show_summary_count else '0'}
                    ],
                    'toggle': [
                      {'justify-self': 'end'},
                      {'align-self': 'center'}
                    ]
                  }
                }
              } -%}
              {{ summary_card }},
              {%- if header_collapsed -%}
              {%- else -%}
                {%- if total_pending > 0 -%}
                  {%- set tile_html = namespace(v='') -%}
                  {%- for t in [[ns.total_chore_pending, ui.get('chores', 'Chores'), pref_claim_accent], [ns.total_reward_pending, ui.get('rewards', 'Rewards'), 'var(--warning-color)'], [ns.pending_user_count, ui.get('people', 'People'), 'var(--primary-text-color)']] -%}
                    {%- set tile_html.v = tile_html.v ~ "<div style='background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:14px;padding:10px 4px;text-align:center;'><div style='font-size:22px;font-weight:800;color:" ~ t[2] ~ ";line-height:1.1;'>" ~ t[0] ~ "</div><div style='font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.65;margin-top:2px;'>" ~ t[1] ~ "</div></div>" -%}
                  {%- endfor -%}
                  {{-
                    {
                      'type': 'custom:button-card',
                      'show_name': False,
                      'show_icon': False,
                      'tap_action': {'action': 'none'},
                      'hold_action': {'action': 'none'},
                      'custom_fields': {'tiles': "<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;'>" ~ tile_html.v ~ "</div>"},
                      'styles': {
                        'card': [{'padding': '0'}, {'background': 'transparent'}, {'border': 'none'}, {'box-shadow': 'none'}, {'min-height': 'unset'}, {'margin-top': '4px'}],
                        'grid': [{'grid-template-areas': '"tiles"'}, {'grid-template-columns': '1fr'}],
                        'custom_fields': {'tiles': [{'width': '100%'}]}
                      }
                    }
                  }},
                  {%- if ns.all_ids | length > 0 -%}
                  {{-
                    {
                      'type': 'custom:button-card',
                      'entity': ns.all_ids[0],
                      'show_name': True,
                      'show_label': True,
                      'show_icon': True,
                      'show_state': False,
                      'icon': 'mdi:check-all',
                      'name': ui.get('approve_all', 'Approve all') ~ ' (' ~ (ns.all_ids | length) ~ ')',
                      'label': (ns.total_chore_pending | string) ~ ' ' ~ ui.get('chores', 'Chores') | lower ~ ' · ' ~ (ns.total_reward_pending | string) ~ ' ' ~ ui.get('rewards', 'Rewards') | lower ~ ' · ' ~ (ns.pending_user_count | string) ~ ' ' ~ (ui.get('people', 'People') | lower),
                      'tap_action': {
                        'action': 'call-service',
                        'service': 'choreops.approve_all_pending',
                        'data': {'entity_id': ns.all_ids},
                        'confirmation': {'text': (ui.get('approve_all_confirm', 'Approve {count} pending item(s) for everyone?') | replace('{count}', (ns.all_ids | length) | string))}
                      },
                      'hold_action': {'action': 'none'},
                      'styles': {
                        'card': [{'padding': '12px 14px'}, {'border-radius': '16px'}, {'box-shadow': 'none'}, {'margin-top': '4px'}, {'background': 'var(--success-color)'}, {'border': 'none'}],
                        'grid': [{'grid-template-areas': '"i n" "i l"'}, {'grid-template-columns': '32px 1fr'}, {'column-gap': '12px'}, {'align-items': 'center'}],
                        'icon': [{'width': '24px'}, {'color': '#fff'}],
                        'name': [{'justify-self': 'start'}, {'font-size': '14px'}, {'font-weight': '800'}, {'color': '#fff'}],
                        'label': [{'justify-self': 'start'}, {'font-size': '11px'}, {'color': 'rgba(255,255,255,0.85)'}, {'text-transform': 'none'}]
                      }
                    }
                  }},
                  {%- endif -%}
                  {%- for section in [['chores', ui.get('chores', 'Chores'), ns.chore_groups], ['rewards', ui.get('rewards', 'Rewards'), ns.reward_groups]] -%}
                    {%- if section[2] | length > 0 -%}
                      {{-
                        {
                          'type': 'custom:button-card',
                          'name': section[1],
                          'show_name': True,
                          'show_icon': False,
                          'tap_action': {'action': 'none'},
                          'hold_action': {'action': 'none'},
                          'styles': {
                            'card': [{'padding': '10px 4px 0 4px'}, {'background': 'transparent'}, {'border': 'none'}, {'box-shadow': 'none'}, {'min-height': 'unset'}],
                            'name': [{'justify-self': 'start'}, {'font-size': '11px'}, {'font-weight': '700'}, {'letter-spacing': '1px'}, {'text-transform': 'uppercase'}, {'opacity': '0.6'}]
                          }
                        }
                      }},
                      {%- for group in section[2] -%}
                        {{ group }},
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endif -%}
              {%- endif -%}

        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== BONUSES AND PENALTIES (QUICK APPLY) ===== --#}
              << template_snippets.user_override_helper >>

              << template_snippets.admin_setup_shared >>
              {%- set ui = shared_admin_ui -%}

              {%- set helpers = helper_sensor_entities -%}
              {%- set pref_bp_ui_control_key_root = 'admin-shared/bonuses-penalties' -%}
              {%- set pref_bp_default_collapsed = true -%}
              {%- set bp_key = pref_bp_ui_control_key_root ~ '/header-collapse' -%}
              {%- set bp_entry_id = state_attr(shared_admin_helper_eid, 'integration_entry_id') if shared_admin_helper_eid not in ['', none, 'None'] else '' -%}
              {%- set bp_ui = namespace(current=ui_root.shared_admin if ui_root.shared_admin is mapping else {}) -%}
              {%- for segment in pref_bp_ui_control_key_root.split('/') -%}
                {%- if bp_ui.current is mapping -%}
                  {%- set bp_ui.current = bp_ui.current.get(segment, {}) -%}
                {%- else -%}
                  {%- set bp_ui.current = {} -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set bp_has_override = bp_ui.current is mapping and 'header-collapse' in bp_ui.current -%}
              {%- set bp_collapsed = bp_ui.current['header-collapse'] if bp_has_override else pref_bp_default_collapsed -%}
              {%- set bp_collapsed = (bp_collapsed | string | lower) == 'true' -%}
              {%- set bp_names = namespace(b=[], p=[]) -%}
              {%- for h in helpers -%}
                {%- for item in (h.attributes.get('bonuses') or []) -%}
                  {%- if item is mapping and item.get('name') not in bp_names.b -%}{%- set bp_names.b = bp_names.b + [item.get('name')] -%}{%- endif -%}
                {%- endfor -%}
                {%- for item in (h.attributes.get('penalties') or []) -%}
                  {%- if item is mapping and item.get('name') not in bp_names.p -%}{%- set bp_names.p = bp_names.p + [item.get('name')] -%}{%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{-
                {
                  'type': 'custom:button-card',
                  'show_name': true,
                  'show_label': true,
                  'show_state': false,
                  'show_icon': true,
                  'icon': 'mdi:scale-balance',
                  'name': ui.get('bonuses_and_penalties', 'Bonuses & Penalties'),
                  'label': ((bp_names.b | length) ~ ' ' ~ (ui.get('bonuses', 'Bonuses') | lower) ~ ' · ' ~ (bp_names.p | length) ~ ' ' ~ (ui.get('penalties', 'Penalties') | lower)) if bp_collapsed else ui.get('tap_a_name_to_apply', 'Tap a name to apply'),
                  'tap_action': ({
                    'action': 'call-service',
                    'service': 'choreops.manage_ui_control',
                    'data': {
                      'config_entry_id': bp_entry_id,
                      'ui_control_target': 'shared_admin',
                      'ui_control_action': 'update',
                      'key': bp_key,
                      'value': false
                    }
                  } if bp_collapsed and bp_entry_id not in ['', none] else {
                    'action': 'call-service',
                    'service': 'choreops.manage_ui_control',
                    'data': {
                      'config_entry_id': bp_entry_id,
                      'ui_control_target': 'shared_admin',
                      'ui_control_action': 'remove',
                      'key': bp_key
                    }
                  } if bp_entry_id not in ['', none] else {
                    'action': 'none'
                  }),
                  'hold_action': {'action': 'none'},
                  'custom_fields': {
                    'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if bp_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                  },
                  'styles': {
                    'card': [
                      {'margin-top': '12px'},
                      {'padding': '10px 14px'},
                      {'border-radius': '16px'},
                      {'box-shadow': 'none'},
                      {'border': '1px solid color-mix(in srgb, var(--primary-color) 14%, var(--divider-color))'},
                      {'background-color': 'color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))'}
                    ],
                    'grid': [
                      {'grid-template-areas': '"i n toggle" "i l toggle"'},
                      {'grid-template-columns': '32px minmax(0, 1fr) min-content'},
                      {'grid-template-rows': 'min-content min-content'},
                      {'column-gap': '14px'},
                      {'row-gap': '2px'},
                      {'align-items': 'center'}
                    ],
                    'icon': [{'width': '24px'}, {'height': '24px'}, {'align-self': 'center'}],
                    'name': [{'justify-self': 'start'}, {'text-align': 'left'}, {'font-size': '14px'}, {'font-weight': '700'}, {'line-height': '1.2'}, {'text-transform': 'uppercase'}],
                    'label': [{'justify-self': 'start'}, {'text-align': 'left'}, {'font-size': '12px'}, {'opacity': '0.7'}],
                    'custom_fields': {'toggle': [{'justify-self': 'end'}, {'align-self': 'center'}]}
                  }
                }
              }},
              {%- if not bp_collapsed -%}
              {%- for kind in ['bonuses', 'penalties'] -%}
                {%- set good = kind == 'bonuses' -%}
                {%- set col = 'var(--success-color)' if good else 'var(--error-color)' -%}
                {%- set ns = namespace(q={}) -%}
                {%- for h in helpers -%}
                  {%- set uname = (h.attributes.get('user_name') or '') | string -%}
                  {%- for item in (h.attributes.get(kind) or []) -%}
                    {%- if item is mapping and item.get('eid') not in ['', 'None', 'unknown', 'unavailable', none] -%}
                      {%- set iname = (item.get('name') or '') | string | trim -%}
                      {%- set cur = ns.q.get(iname, {'name': iname, 'points': (item.get('points', 0) | float(default=0)) | abs, 'icon': (item.get('icon') or state_attr(item.get('eid'), 'icon') or ('mdi:gift' if good else 'mdi:alert-octagon-outline')) | string, 'people': []}) -%}
                      {%- set cur = cur | combine({'people': cur.people + [{'u': uname, 'eid': item.get('eid')}]}) -%}
                      {%- set ns.q = ns.q | combine({iname: cur}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {%- if ns.q | length > 0 -%}
                  {{-
                    {
                      'type': 'custom:button-card',
                      'show_name': false,
                      'show_icon': false,
                      'tap_action': {'action': 'none'},
                      'custom_fields': {'content': "<div style='text-align:left;font-size:11px;font-weight:800;letter-spacing:0.7px;text-transform:uppercase;color:" ~ col ~ ";margin:8px 2px 0 2px;'>" ~ (ui.get('bonuses', 'Bonuses') if good else ui.get('penalties', 'Penalties')) ~ "</div>"},
                      'styles': {
                        'card': [{'background': 'transparent'}, {'box-shadow': 'none'}, {'border': 'none'}, {'padding': '0px'}, {'min-height': 'unset'}],
                        'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                        'custom_fields': {'content': [{'width': '100%'}]}
                      }
                    }
                  }},
                  {%- for iname, q in ns.q.items() | sort(attribute='1.points', reverse=true) -%}
                    {%- set qname = q.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                    {%- set pts_txt = ('%g' | format(q.points)) -%}
                    {%- set label = "<div style='display:flex;align-items:center;gap:10px;text-align:left;'><div style='width:34px;height:34px;border-radius:11px;background:" ~ col ~ ";display:flex;align-items:center;justify-content:center;flex:0 0 auto;'><ha-icon icon='" ~ q.icon ~ "' style='width:19px;height:19px;--mdc-icon-size:19px;color:#fff;display:block;'></ha-icon></div><div style='min-width:0;'><div style='font-size:14px;font-weight:700;line-height:1.2;color:var(--primary-text-color);'>" ~ qname ~ "</div><div style='font-size:11px;color:var(--secondary-text-color);'><b style='color:" ~ col ~ ";'>" ~ ('+' if good else '−') ~ pts_txt ~ "</b> ⭐ · " ~ (ui.get('tap_a_name_to_apply', 'Tap a name to apply') | lower) ~ "</div></div></div>" -%}
                    {%- set fields = namespace(d={'label': label}, areas='label', cols='1fr') -%}
                    {%- for pp in q.people -%}
                      {%- set key = 'p' ~ loop.index -%}
                      {%- set fields.areas = fields.areas ~ ' ' ~ key -%}
                      {%- set fields.cols = fields.cols ~ ' 30px' -%}
                      {%- set fields.d = fields.d | combine({key: {'card': {
                        'type': 'custom:button-card',
                        'name': (pp.u[:1] | upper),
                        'show_name': true,
                        'show_icon': false,
                        'tap_action': {
                          'action': 'call-service',
                          'service': 'button.press',
                          'target': {'entity_id': pp.eid},
                          'confirmation': {'text': (ui.get('apply_to_confirm', 'Apply {item} to {name}?') | replace('{item}', (q.name) | string) | replace('{name}', (pp.u) | string))}
                        },
                        'styles': {
                          'card': [
                            {'width': '30px'}, {'height': '30px'}, {'min-height': '30px'}, {'padding': '0px'},
                            {'border-radius': '50%'}, {'box-shadow': 'none'},
                            {'background': 'color-mix(in srgb, ' ~ col ~ ' 22%, transparent)'},
                            {'border': '1.5px solid ' ~ col}
                          ],
                          'name': [{'font-size': '12px'}, {'font-weight': '800'}, {'color': 'var(--primary-text-color)'}]
                        }
                      }}}) -%}
                    {%- endfor -%}
                    {{-
                      {
                        'type': 'custom:button-card',
                        'show_name': false,
                        'show_icon': false,
                        'tap_action': {'action': 'none'},
                        'custom_fields': fields.d,
                        'styles': {
                          'card': [
                            {'background': 'linear-gradient(90deg, color-mix(in srgb, ' ~ col ~ ' 18%, transparent), color-mix(in srgb, ' ~ col ~ ' 5%, transparent))'},
                            {'border': '1px solid color-mix(in srgb, ' ~ col ~ ' 40%, transparent)'},
                            {'border-radius': '16px'},
                            {'box-shadow': 'none'},
                            {'padding': '8px 12px'},
                            {'min-height': 'unset'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"' ~ fields.areas ~ '"'},
                            {'grid-template-columns': fields.cols},
                            {'column-gap': '5px'},
                            {'align-items': 'center'}
                          ],
                          'custom_fields': {'label': [{'justify-self': 'start'}, {'min-width': '0'}]}
                        }
                      }
                    }},
                  {%- endfor -%}
                {%- endif -%}
              {%- endfor -%}
              {%- endif -%}
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== FAMILY GOALS (RESET) ===== --#}
              << template_snippets.user_override_helper >>

              << template_snippets.admin_setup_shared >>
              {%- set ui = shared_admin_ui -%}

              {%- set pref_fg_ui_control_key_root = 'admin-shared/family-goals' -%}
              {%- set pref_fg_default_collapsed = true -%}
              {%- set fg_key = pref_fg_ui_control_key_root ~ '/header-collapse' -%}
              {%- set fg_entry_id = state_attr(shared_admin_helper_eid, 'integration_entry_id') if shared_admin_helper_eid not in ['', none, 'None'] else '' -%}
              {%- set fg_ui = namespace(current=ui_root.shared_admin if ui_root.shared_admin is mapping else {}) -%}
              {%- for segment in pref_fg_ui_control_key_root.split('/') -%}
                {%- if fg_ui.current is mapping -%}
                  {%- set fg_ui.current = fg_ui.current.get(segment, {}) -%}
                {%- else -%}
                  {%- set fg_ui.current = {} -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set fg_has_override = fg_ui.current is mapping and 'header-collapse' in fg_ui.current -%}
              {%- set fg_collapsed = fg_ui.current['header-collapse'] if fg_has_override else pref_fg_default_collapsed -%}
              {%- set fg_collapsed = (fg_collapsed | string | lower) == 'true' -%}
              {#-- Family goals come straight from the shared admin helper (no per-person lookups) --#}
              {%- set fg = namespace(goals={}) -%}
              {%- for g in (state_attr(shared_admin_helper_eid, 'family_goals') or []) -%}
                {%- if g is mapping and g.get('name') -%}
                  {%- set fg.goals = fg.goals | combine({g.get('name'): g}) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if fg.goals | length > 0 -%}
              {{-
                {
                  'type': 'custom:button-card',
                  'show_name': true,
                  'show_label': true,
                  'show_state': false,
                  'show_icon': true,
                  'icon': 'mdi:flag-checkered',
                  'name': ui.get('family_goals_and_achievements', 'Family goals & achievements'),
                  'label': ((fg.goals | length) ~ ' ' ~ ((ui.get('goal', 'Goal') if fg.goals | length == 1 else ui.get('goals', 'Goals')) | lower)) if fg_collapsed else ui.get('reset_a_goal', 'Reset a goal to start it over'),
                  'tap_action': ({
                    'action': 'call-service',
                    'service': 'choreops.manage_ui_control',
                    'data': {
                      'config_entry_id': fg_entry_id,
                      'ui_control_target': 'shared_admin',
                      'ui_control_action': 'update',
                      'key': fg_key,
                      'value': false
                    }
                  } if fg_collapsed and fg_entry_id not in ['', none] else {
                    'action': 'call-service',
                    'service': 'choreops.manage_ui_control',
                    'data': {
                      'config_entry_id': fg_entry_id,
                      'ui_control_target': 'shared_admin',
                      'ui_control_action': 'remove',
                      'key': fg_key
                    }
                  } if fg_entry_id not in ['', none] else {
                    'action': 'none'
                  }),
                  'hold_action': {'action': 'none'},
                  'custom_fields': {
                    'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if fg_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                  },
                  'styles': {
                    'card': [
                      {'margin-top': '12px'},
                      {'padding': '10px 14px'},
                      {'border-radius': '16px'},
                      {'box-shadow': 'none'},
                      {'border': '1px solid color-mix(in srgb, var(--primary-color) 14%, var(--divider-color))'},
                      {'background-color': 'color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))'}
                    ],
                    'grid': [
                      {'grid-template-areas': '"i n toggle" "i l toggle"'},
                      {'grid-template-columns': '32px minmax(0, 1fr) min-content'},
                      {'grid-template-rows': 'min-content min-content'},
                      {'column-gap': '14px'},
                      {'row-gap': '2px'},
                      {'align-items': 'center'}
                    ],
                    'icon': [{'width': '24px'}, {'height': '24px'}, {'align-self': 'center'}],
                    'name': [{'justify-self': 'start'}, {'text-align': 'left'}, {'font-size': '14px'}, {'font-weight': '700'}, {'line-height': '1.2'}, {'text-transform': 'uppercase'}],
                    'label': [{'justify-self': 'start'}, {'text-align': 'left'}, {'font-size': '12px'}, {'opacity': '0.7'}],
                    'custom_fields': {'toggle': [{'justify-self': 'end'}, {'align-self': 'center'}]}
                  }
                }
              }},
              {%- if not fg_collapsed -%}
              {%- for gname, g in fg.goals.items() -%}
                {%- set gtotal = g.get('total', 0) | float(0) | round(0) | int -%}
                {%- set gtarget = g.get('target', 0) | float(0) | round(0) | int -%}
                {%- set gicon = 'mdi:trophy' -%}
                {%- set gsafe = gname | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                {%- set gprogress = (gtotal ~ ' / ' ~ gtarget) if gtarget > 0 else (gtotal | string) -%}
                {%- set gsub = gprogress -%}
                {{-
                  {
                    'type': 'custom:button-card',
                    'show_name': false,
                    'show_icon': false,
                    'tap_action': {'action': 'none'},
                    'custom_fields': {
                      'label': "<div style='display:flex;align-items:center;gap:10px;text-align:left;'><div style='width:34px;height:34px;border-radius:11px;background:var(--primary-color);display:flex;align-items:center;justify-content:center;flex:none;'><ha-icon icon='" ~ gicon ~ "' style='width:20px;height:20px;--mdc-icon-size:20px;color:#fff;'></ha-icon></div><div style='min-width:0;'><div style='font-size:14px;font-weight:700;color:var(--primary-text-color);white-space:normal;'>" ~ gsafe ~ "</div><div style='font-size:12px;color:var(--secondary-text-color);'>" ~ gsub ~ "</div></div></div>",
                      'reset': {'card': {
                        'type': 'custom:button-card',
                        'name': ui.get('reset', 'Reset'),
                        'icon': 'mdi:restart',
                        'show_name': true,
                        'show_icon': true,
                        'tap_action': {
                          'action': 'call-service',
                          'service': 'choreops.reset_family_goal',
                          'data': {
                            'goal_name': gname,
                            'config_entry_id': fg_entry_id
                          },
                          'confirmation': {'text': (ui.get('reset_goal_confirm', 'Reset {goal}? Progress and awards start over from zero. Points already paid are not taken back.') | replace('{goal}', (gname) | string))}
                        },
                        'styles': {
                          'card': [
                            {'padding': '6px 10px'}, {'border-radius': '12px'}, {'box-shadow': 'none'},
                            {'background': 'color-mix(in srgb, var(--error-color) 14%, transparent)'},
                            {'border': '1.5px solid var(--error-color)'}
                          ],
                          'grid': [{'grid-template-areas': '"i n"'}, {'grid-template-columns': 'min-content min-content'}, {'column-gap': '4px'}],
                          'icon': [{'width': '16px'}, {'color': 'var(--error-color)'}],
                          'name': [{'font-size': '12px'}, {'font-weight': '800'}, {'color': 'var(--error-color)'}]
                        }
                      }}
                    },
                    'styles': {
                      'card': [
                        {'background': 'color-mix(in srgb, var(--primary-color) 6%, var(--card-background-color))'},
                        {'border': '1px solid var(--divider-color)'},
                        {'border-radius': '16px'},
                        {'box-shadow': 'none'},
                        {'padding': '8px 12px'},
                        {'min-height': 'unset'}
                      ],
                      'grid': [
                        {'grid-template-areas': '"label reset"'},
                        {'grid-template-columns': '1fr auto'},
                        {'column-gap': '8px'},
                        {'align-items': 'center'}
                      ],
                      'custom_fields': {'label': [{'justify-self': 'start'}, {'min-width': '0'}]}
                    }
                  }
                }},
              {%- endfor -%}
              {%- endif -%}
              {%- endif -%}
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== REWARD POOLS ===== --#}
              << template_snippets.user_override_helper >>

              << template_snippets.admin_setup_shared >>
              {%- set ui = shared_admin_ui -%}

              {%- set pref_rp_ui_control_key_root = 'admin-shared/reward-pools' -%}
              {%- set pref_rp_default_collapsed = true -%}
              {%- set pref_rp_accent = '#8b5cf6' -%}
              {%- set rp_key = pref_rp_ui_control_key_root ~ '/header-collapse' -%}
              {%- set rp_entry_id = state_attr(shared_admin_helper_eid, 'integration_entry_id') if shared_admin_helper_eid not in ['', none, 'None'] else '' -%}
              {%- set rp_ui = namespace(current=ui_root.shared_admin if ui_root.shared_admin is mapping else {}) -%}
              {%- for segment in pref_rp_ui_control_key_root.split('/') -%}
                {%- if rp_ui.current is mapping -%}
                  {%- set rp_ui.current = rp_ui.current.get(segment, {}) -%}
                {%- else -%}
                  {%- set rp_ui.current = {} -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set rp_has_override = rp_ui.current is mapping and 'header-collapse' in rp_ui.current -%}
              {%- set rp_collapsed = rp_ui.current['header-collapse'] if rp_has_override else pref_rp_default_collapsed -%}
              {%- set rp_collapsed = (rp_collapsed | string | lower) == 'true' -%}
              {#-- Pooled rewards appear in every person's reward list; find each one once by name --#}
              {%- set rp_psensor = ((helper_sensor_entities | first).attributes.get('core_sensors') or {}).get('points_eid') if helper_sensor_entities else none -%}
              {%- set rp_plabel = ((state_attr(rp_psensor, 'unit_of_measurement') if rp_psensor else none) or '') | string -%}
              {%- set rp_unit = ((rp_plabel | lower) if (rp_plabel and (rp_plabel | lower) != (ui.get('points', 'Points') | lower)) else (ui.get('points', 'Points') | lower)) | replace('&', '&amp;') | replace('<', '&lt;') -%}
              {%- set rp = namespace(pools={}) -%}
              {%- for h in helper_sensor_entities -%}
                {%- for rw in (h.attributes.get('rewards') or []) -%}
                  {%- set rw_eid = rw.get('eid') if rw is mapping else rw -%}
                  {%- if rw_eid not in ['', 'None', 'unknown', 'unavailable', none] and states(rw_eid) not in ['unknown', 'unavailable'] and state_attr(rw_eid, 'pooled') -%}
                    {%- set rw_name = (rw.get('name') if rw is mapping else none) or state_attr(rw_eid, 'reward_name') or ui.get('family_reward', 'Family reward') -%}
                    {%- if rw_name not in rp.pools -%}
                      {%- set rp.pools = rp.pools | combine({rw_name: rw_eid}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- set rp_ready = namespace(n=0) -%}
              {%- for pn, pe in rp.pools.items() -%}
                {%- if state_attr(pe, 'pool_full') and (state_attr(pe, 'pool_total') | float(0)) > 0 -%}
                  {%- set rp_ready.n = rp_ready.n + 1 -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if rp.pools | length > 0 -%}
              {{-
                {
                  'type': 'custom:button-card',
                  'show_name': true,
                  'show_label': true,
                  'show_state': false,
                  'show_icon': true,
                  'icon': 'mdi:gift-outline',
                  'name': ui.get('reward_pools', 'Reward pools'),
                  'label': ((rp.pools | length) ~ ' ' ~ ((ui.get('pool', 'Pool') if rp.pools | length == 1 else ui.get('pools', 'Pools')) | lower) ~ ((' · ' ~ rp_ready.n ~ ' ' ~ (ui.get('ready', 'Ready') | lower)) if rp_ready.n > 0 else '')) if rp_collapsed else ui.get('reward_pools_hint', 'Approve, refund or fix contributions'),
                  'tap_action': ({
                    'action': 'call-service',
                    'service': 'choreops.manage_ui_control',
                    'data': {
                      'config_entry_id': rp_entry_id,
                      'ui_control_target': 'shared_admin',
                      'ui_control_action': 'update',
                      'key': rp_key,
                      'value': false
                    }
                  } if rp_collapsed and rp_entry_id not in ['', none] else {
                    'action': 'call-service',
                    'service': 'choreops.manage_ui_control',
                    'data': {
                      'config_entry_id': rp_entry_id,
                      'ui_control_target': 'shared_admin',
                      'ui_control_action': 'remove',
                      'key': rp_key
                    }
                  } if rp_entry_id not in ['', none] else {
                    'action': 'none'
                  }),
                  'hold_action': {'action': 'none'},
                  'custom_fields': {
                    'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if rp_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                  },
                  'styles': {
                    'card': [
                      {'margin-top': '12px'},
                      {'padding': '10px 14px'},
                      {'border-radius': '16px'},
                      {'box-shadow': 'none'},
                      {'border': '1px solid color-mix(in srgb, ' ~ pref_rp_accent ~ ' 30%, var(--divider-color))'},
                      {'background-color': 'color-mix(in srgb, ' ~ pref_rp_accent ~ ' 14%, var(--card-background-color))'}
                    ],
                    'grid': [
                      {'grid-template-areas': '"i n toggle" "i l toggle"'},
                      {'grid-template-columns': '32px minmax(0, 1fr) min-content'},
                      {'grid-template-rows': 'min-content min-content'},
                      {'column-gap': '14px'},
                      {'row-gap': '2px'},
                      {'align-items': 'center'}
                    ],
                    'icon': [{'width': '24px'}, {'height': '24px'}, {'align-self': 'center'}],
                    'name': [{'justify-self': 'start'}, {'text-align': 'left'}, {'font-size': '14px'}, {'font-weight': '700'}, {'line-height': '1.2'}, {'text-transform': 'uppercase'}],
                    'label': [{'justify-self': 'start'}, {'text-align': 'left'}, {'font-size': '12px'}, {'opacity': '0.7'}],
                    'custom_fields': {'toggle': [{'justify-self': 'end'}, {'align-self': 'center'}]}
                  }
                }
              }},
              {%- if not rp_collapsed -%}
              {%- for pname, peid in rp.pools.items() -%}
                {%- set ptotal = state_attr(peid, 'pool_total') | float(0) -%}
                {%- set premain = state_attr(peid, 'pool_remaining') | float(0) -%}
                {%- set ptarget = ptotal + premain -%}
                {%- set pfull = state_attr(peid, 'pool_full') and ptotal > 0 -%}
                {%- set ppct = ((ptotal / ptarget * 100) | round(0) | int) if ptarget > 0 else 0 -%}
                {%- set pcontrib = state_attr(peid, 'pool_contributions') or {} -%}
                {%- set pcol = 'var(--success-color)' if pfull else pref_rp_accent -%}
                {%- set picon = state_attr(peid, 'icon') or 'mdi:gift-outline' -%}
                {%- set psafe = pname | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                {%- set head_html = "<div style='display:flex;align-items:center;gap:10px;text-align:left;'><div style='width:36px;height:36px;border-radius:11px;background:" ~ pcol ~ ";display:flex;align-items:center;justify-content:center;flex:none;'><ha-icon icon='" ~ picon ~ "' style='width:20px;height:20px;--mdc-icon-size:20px;color:#fff;'></ha-icon></div><div style='flex:1;min-width:0;'><div style='font-size:14px;font-weight:700;color:var(--primary-text-color);'>" ~ psafe ~ "</div><div style='font-size:11px;color:var(--secondary-text-color);'>" ~ ((ui.get('full', 'Full') ~ ' · ' ~ ui.get('waiting_for_you', 'waiting for you')) if pfull else ((('%g' | format(premain | round(2))) ~ ' ' ~ ui.get('to_go', 'to go')) if ptotal > 0 else ui.get('nobody_chipped_in', 'Nobody has chipped in'))) ~ "</div></div><span style='font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:0.5px;background:color-mix(in srgb, " ~ pcol ~ " 25%, transparent);color:" ~ pcol ~ ";'>" ~ ((ui.get('ready', 'Ready') if pfull else ui.get('filling', 'Filling')) | upper) ~ "</span></div>" -%}
                {%- set bar_html = "<div style='height:10px;border-radius:999px;background:var(--divider-color);overflow:hidden;margin-top:2px;'><div style='height:100%;width:" ~ (ppct if ppct < 100 else 100) ~ "%;background:" ~ pcol ~ ";border-radius:999px;'></div></div><div style='display:flex;justify-content:space-between;font-size:11px;color:var(--secondary-text-color);margin-top:4px;'><span>" ~ ('%g' | format(ptotal | round(2))) ~ " " ~ ui.get('of', 'of') ~ " " ~ ('%g' | format(ptarget | round(2))) ~ " " ~ rp_unit ~ "</span><span>" ~ ppct ~ "%</span></div>" -%}
                {%- set chip_cards = namespace(c=[]) -%}
                {%- for cname, camt in pcontrib.items() -%}
                  {%- if camt | float(0) > 0 -%}
                    {%- set chip_cards.c = chip_cards.c + [{
                      'type': 'custom:button-card',
                      'name': cname ~ ' ' ~ ('%g' | format(camt | float(0) | round(2))) ~ '  ↩',
                      'show_name': true,
                      'show_icon': false,
                      'tap_action': {
                        'action': 'call-service',
                        'service': 'choreops.refund_reward_pool',
                        'data': {'config_entry_id': rp_entry_id, 'reward_name': pname, 'user_name': cname},
                        'confirmation': {'text': (ui.get('refund_one_confirm', 'Refund {name}? Give {name} their {points} points back from {pool}. Everyone else keeps their points in the pool.') | replace('{name}', (cname) | string) | replace('{points}', ('%g' | format(camt | float(0) | round(2))) | string) | replace('{pool}', (pname) | string))}
                      },
                      'styles': {
                        'card': [{'padding': '6px 10px'}, {'border-radius': '999px'}, {'box-shadow': 'none'}, {'border': '1px solid var(--divider-color)'}, {'min-height': 'unset'}, {'width': 'auto'}],
                        'name': [{'font-size': '12px'}, {'font-weight': '700'}, {'white-space': 'nowrap'}]
                      }
                    }] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set act_cards = [
                  {
                    'type': 'custom:button-card',
                    'name': '✔ ' ~ ui.get('approve', 'Approve') ~ ' · ' ~ ui.get('delivered', 'delivered'),
                    'show_name': true,
                    'show_icon': false,
                    'tap_action': ({
                      'action': 'call-service',
                      'service': 'choreops.approve_reward_pool',
                      'data': {'config_entry_id': rp_entry_id, 'reward_name': pname},
                      'confirmation': {'text': (ui.get('pool_delivered_confirm', 'Mark {pool} as delivered? The pool is emptied so the family can save up again.') | replace('{pool}', (pname) | string))}
                    }) if pfull else {'action': 'none'},
                    'styles': {
                      'card': [{'padding': '9px'}, {'border-radius': '12px'}, {'box-shadow': 'none'}, ({'background': 'var(--success-color)'}) if pfull else {'background': 'transparent'}, {'border': '1px solid var(--success-color)'} if pfull else {'border': '1px dashed var(--divider-color)'}],
                      'name': [{'font-size': '12px'}, {'font-weight': '800'}, {'color': '#fff'} if pfull else {'color': 'var(--disabled-text-color)'}]
                    }
                  },
                  {
                    'type': 'custom:button-card',
                    'name': '↩ ' ~ ui.get('refund_all', 'Refund all'),
                    'show_name': true,
                    'show_icon': false,
                    'tap_action': ({
                      'action': 'call-service',
                      'service': 'choreops.refund_reward_pool',
                      'data': {'config_entry_id': rp_entry_id, 'reward_name': pname},
                      'confirmation': {'text': (ui.get('pool_cancel_confirm', 'Cancel {pool} and give everyone their points back?') | replace('{pool}', (pname) | string))}
                    }) if ptotal > 0 else {'action': 'none'},
                    'styles': {
                      'card': [{'padding': '9px'}, {'border-radius': '12px'}, {'box-shadow': 'none'}, {'background': 'color-mix(in srgb, var(--error-color) 12%, transparent)'} if ptotal > 0 else {'background': 'transparent'}, {'border': '1.5px solid var(--error-color)'} if ptotal > 0 else {'border': '1px dashed var(--divider-color)'}],
                      'name': [{'font-size': '12px'}, {'font-weight': '800'}, {'color': 'var(--error-color)'} if ptotal > 0 else {'color': 'var(--disabled-text-color)'}]
                    }
                  }
                ] -%}
                {{-
                  {
                    'type': 'custom:button-card',
                    'show_name': false,
                    'show_icon': false,
                    'tap_action': {'action': 'none'},
                    'custom_fields': {
                      'head': head_html,
                      'bar': bar_html,
                      'chips': {'card': {'type': 'grid', 'columns': 2, 'square': false, 'cards': chip_cards.c}} if chip_cards.c | length > 0 else '',
                      'acts': {'card': {'type': 'grid', 'columns': 2, 'square': false, 'cards': act_cards}}
                    },
                    'styles': {
                      'card': [
                        {'background': 'linear-gradient(135deg, color-mix(in srgb, ' ~ pcol ~ ' 14%, transparent), var(--card-background-color))' if pfull else 'var(--card-background-color)'},
                        {'border': '1px solid ' ~ (pcol if pfull else 'var(--divider-color)')},
                        {'border-radius': '16px'},
                        {'box-shadow': 'none'},
                        {'padding': '12px'},
                        {'min-height': 'unset'}
                      ],
                      'grid': [
                        {'grid-template-areas': '"head" "bar" "chips" "acts"'},
                        {'grid-template-columns': '1fr'},
                        {'row-gap': '8px'}
                      ],
                      'custom_fields': {'head': [{'width': '100%'}], 'bar': [{'width': '100%'}], 'chips': [{'width': '100%'}], 'acts': [{'width': '100%'}]}
                    }
                  }
                }},
              {%- endfor -%}
              {%- endif -%}
              {%- endif -%}
    - type: grid
      cards:
        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== MANAGEMENT ===== --#}

              << template_snippets.meta_stamp >>


              {#-- 1. User Configuration --#}

              << template_snippets.user_override_helper >>

              {%- set pref_selector_ui_control_key_root = 'admin-shared/admin-target-selector' -%}

              {%- set pref_selector_default_header_collapsed = false -%}

              {%- set pref_selector_primary_tint_mix_pct = 14 -%}

              {%- set pref_selector_show_header_background = true -%}

              {%- set pref_selector_show_header_thin_border = true -%}

              {%- set pref_selector_column_count = 3 -%}


              {#-- 2. Dynamic Lookups & Validations --#}

              << template_snippets.admin_setup_shared >>

              << template_snippets.admin_validation_missing_selector >>

              {%- set pref_selector_ui_control_key_root = (pref_selector_ui_control_key_root | default('admin-shared/admin-target-selector') | string) -%}
              {%- set pref_selector_ui_control_key_root_segments = pref_selector_ui_control_key_root.split('/') | reject('equalto', '') | list -%}
              {%- if pref_selector_ui_control_key_root_segments | length == 0 -%}
                {%- set pref_selector_ui_control_key_root_segments = ['admin-shared', 'admin-target-selector'] -%}
              {%- endif -%}
              {%- set pref_selector_ui_control_key_root = pref_selector_ui_control_key_root_segments | join('/') -%}
              {%- set pref_selector_default_header_collapsed = (pref_selector_default_header_collapsed | default('false') | string | lower) == 'true' -%}
              {%- set pref_selector_primary_tint_mix_pct = pref_selector_primary_tint_mix_pct | int(default=14) -%}
              {%- set pref_selector_show_header_background = (pref_selector_show_header_background | default('true') | string | lower) == 'true' -%}
              {%- set pref_selector_show_header_thin_border = (pref_selector_show_header_thin_border | default('true') | string | lower) == 'true' -%}
              {%- if pref_selector_primary_tint_mix_pct < 0 -%}
                {%- set pref_selector_primary_tint_mix_pct = 0 -%}
              {%- elif pref_selector_primary_tint_mix_pct > 100 -%}
                {%- set pref_selector_primary_tint_mix_pct = 100 -%}
              {%- endif -%}
              {%- set pref_selector_column_count = pref_selector_column_count | int(default=3) -%}
              {%- if pref_selector_column_count < 1 -%}
                {%- set pref_selector_column_count = 1 -%}
              {%- endif -%}

              {%- if not skip_render -%}

                {#-- 3. Initialize Variables --#}

                {%- set ui = shared_admin_ui -%}
                {%- if summary_helper in ['', None, 'None'] -%}
                  {{ {
                    'type': 'markdown',
                    'content': "⚠️ **Dashboard configuration error**\n\nCannot find any dashboard helper entities for this shared admin view.\n\nCheck Settings → Integrations → ChoreOps and verify at least one user is configured."
                  } }},
                  {%- set skip_render = true -%}
                {%- endif -%}
              {%- endif -%}

              {%- if not skip_render -%}

                {#-- 4. Collect Data --#}

                {%- set integration_entry_id = state_attr(shared_admin_helper_eid, 'integration_entry_id') if shared_admin_helper_eid not in ['', None, 'None'] else '' -%}
                {%- set ui_control_key_root = pref_selector_ui_control_key_root -%}
                {%- set ui_control_key_header_collapsed = ui_control_key_root ~ '/header-collapse' -%}
                {%- set shared_admin_ui_root = namespace(current=ui_root.shared_admin if ui_root.shared_admin is mapping else {}) -%}
                {%- for segment in ui_control_key_root.split('/') -%}
                  {%- if shared_admin_ui_root.current is mapping -%}
                    {%- set shared_admin_ui_root.current = shared_admin_ui_root.current.get(segment, {}) -%}
                  {%- else -%}
                    {%- set shared_admin_ui_root.current = {} -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set has_header_collapsed_override = shared_admin_ui_root.current is mapping and 'header-collapse' in shared_admin_ui_root.current -%}
                {%- set selected_user_display = selected_user_name if has_selected_user else '' -%}
                {%- set selected_dashboard_helpers = state_attr(selected_dashboard_helper, 'dashboard_helpers') or {} if selected_dashboard_helper not in ['', None, 'None'] and states(selected_dashboard_helper) not in ['unknown', 'unavailable'] else {} -%}
                {%- set selected_helper_chores_ns = namespace(items=state_attr(selected_dashboard_helper, 'chores') | default([], true) if selected_dashboard_helper not in ['', None, 'None'] and states(selected_dashboard_helper) not in ['unknown', 'unavailable'] else []) -%}
                {%- set selected_chore_helper_eids = selected_dashboard_helpers.get('chore_helper_eids', []) if selected_dashboard_helpers is mapping else [] -%}
                {%- if selected_chore_helper_eids is iterable and selected_chore_helper_eids is not string -%}
                  {%- for chore_helper_eid in selected_chore_helper_eids | list -%}
                    {%- if chore_helper_eid not in ['', None, 'None'] and states(chore_helper_eid) not in ['unknown', 'unavailable'] -%}
                      {%- set selected_helper_chores_ns.items = selected_helper_chores_ns.items + (state_attr(chore_helper_eid, 'chores') | default([], true)) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set selected_helper_chores = selected_helper_chores_ns.items -%}
                {%- set overdue_chore_count = selected_helper_chores | selectattr('state', 'eq', 'overdue') | list | count -%}
                {%- set show_reset_all_overdue_card = has_selected_user and overdue_chore_count > 0 and integration_entry_id not in ['', None, 'None'] -%}
                {%- set ns = namespace(chips=[]) -%}
                {%- set header_collapsed = shared_admin_ui_root.current['header-collapse'] if has_header_collapsed_override else pref_selector_default_header_collapsed -%}
                {%- set header_collapsed = (header_collapsed | string | lower) == 'true' -%}
                {%- set selector_label = ui.get('viewing_selected_user', 'err-viewing_selected_user') if has_selected_user else ui.get('choose_user_for_admin_actions', 'err-choose_user_for_admin_actions') -%}
                {%- set selector_status_label = ui.get('active', 'err-active') if has_selected_user else '' -%}
                {%- set selector_status_color = 'var(--primary-color)' if has_selected_user else 'var(--secondary-text-color)' -%}

                {#-- 5. Build Display --#}

                {%- set selector_summary_card = {
                  'type': 'custom:button-card',
                  'entity': admin_selector_eid,
                  'show_name': True,
                  'show_label': True,
                  'show_state': False,
                  'show_icon': True,
                  'icon': 'mdi:account-cog-outline',
                  'name': ui.get('management', 'err-management'),
                  'label': selector_label,
                  'tap_action': ({
                    'action': 'call-service',
                    'service': 'choreops.manage_ui_control',
                    'data': {
                      'config_entry_id': integration_entry_id,
                      'ui_control_target': 'shared_admin',
                      'ui_control_action': 'update',
                      'key': ui_control_key_header_collapsed,
                      'value': not header_collapsed
                    }
                  } if integration_entry_id not in ['', none] else {
                    'action': 'none'
                  }),
                  'hold_action': {'action': 'more-info'},
                  'custom_fields': {
                    'target': ("<div style='display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1;'><span style='font-size:16px;font-weight:700;color:var(--primary-text-color);'>" ~ selected_user_display ~ "</span><span style='margin-top:4px;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:" ~ selector_status_color ~ ";'>" ~ selector_status_label ~ "</span></div>") if has_selected_user else '',
                    'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                  },
                  'styles': {
                    'card': [
                      {'margin-top': '12px'},
                      {'padding': '10px 14px'},
                      {'border-radius': '16px'},
                      {'box-shadow': 'none'},
                      {'border': ('1px solid color-mix(in srgb, var(--primary-color) ' ~ pref_selector_primary_tint_mix_pct|string ~ '%, var(--divider-color))') if header_collapsed and pref_selector_show_header_thin_border else 'none' if header_collapsed else ('1px solid color-mix(in srgb, var(--primary-color) ' ~ pref_selector_primary_tint_mix_pct|string ~ '%, var(--divider-color))') if pref_selector_show_header_thin_border else 'none'},
                      {'background-color': ('color-mix(in srgb, var(--primary-color) ' ~ pref_selector_primary_tint_mix_pct|string ~ '%, var(--card-background-color))') if header_collapsed and pref_selector_show_header_background else 'transparent'}
                    ],
                    'grid': [
                      {'grid-template-areas': '"i n target toggle" "i l target toggle"' if has_selected_user else '"i n toggle" "i l toggle"'},
                      {'grid-template-columns': '32px minmax(0, 1fr) auto min-content' if has_selected_user else '32px minmax(0, 1fr) min-content'},
                      {'grid-template-rows': 'min-content min-content'},
                      {'column-gap': '14px'},
                      {'row-gap': '2px'},
                      {'align-items': 'center'}
                    ],
                    'icon': [
                      {'width': '24px'},
                      {'height': '24px'},
                      {'align-self': 'center'}
                    ],
                    'name': [
                      {'justify-self': 'start'},
                      {'text-align': 'left'},
                      {'font-size': '14px'},
                      {'font-weight': '700'},
                      {'line-height': '1.2'},
                      {'text-transform': 'uppercase'}
                    ],
                    'label': [
                      {'justify-self': 'start'},
                      {'text-align': 'left'},
                      {'font-size': '12px'},
                      {'line-height': '1.35'},
                      {'color': 'var(--secondary-text-color)'},
                      {'white-space': 'normal'}
                    ],
                    'custom_fields': {
                      'target': [
                        {'justify-self': 'end'},
                        {'align-self': 'center'},
                        {'text-align': 'right'},
                        {'display': 'block' if has_selected_user else 'none'}
                      ],
                      'toggle': [
                        {'justify-self': 'end'},
                        {'align-self': 'center'}
                      ]
                    }
                  }
                } -%}

                {%- set none_chip = {
                  'type': 'custom:button-card',
                  'entity': admin_selector_eid,
                  'show_name': True,
                  'show_label': False,
                  'show_state': False,
                  'show_icon': False,
                  'name': ui.get('clear_selection', 'err-clear_selection'),
                  'tap_action': {'action': 'none'} if not has_selected_user else {
                    'action': 'multi-actions',
                    'actions': [
                      {
                        'action': 'call-service',
                        'service': 'select.select_option',
                        'data': {
                          'entity_id': admin_selector_eid,
                          'option': 'None'
                        }
                      },
                      {
                        'action': 'call-service',
                        'service': 'choreops.manage_ui_control',
                        'data': {
                          'config_entry_id': integration_entry_id,
                          'ui_control_target': 'shared_admin',
                          'ui_control_action': 'remove',
                          'key': ui_control_key_header_collapsed
                        }
                      }
                    ]
                  },
                  'hold_action': {'action': 'more-info'},
                  'styles': {
                    'card': [
                      {'padding': '10px'},
                      {'border-radius': '12px'},
                      {'box-shadow': 'none'},
                      {'border': '2px solid var(--primary-color)' if not has_selected_user else '1px solid var(--divider-color)'},
                      {'background-color': 'rgba(var(--rgb-primary-color), 0.1)' if not has_selected_user else 'var(--card-background-color)'}
                    ],
                    'name': [
                      {'font-size': '13px'},
                      {'font-weight': '700'}
                    ]
                  }
                } -%}

                {%- for helper_state in helper_sensor_entities -%}
                  {%- set helper_name = helper_state.attributes.user_name | default(helper_state.name, true) -%}
                  {%- set chip_is_selected = helper_name == selected_user_name -%}
                  {%- set chip_pts_eid = (helper_state.attributes.get('core_sensors') or {}).get('points_eid') -%}
                  {%- set chip_pts = (states(chip_pts_eid) | float(default=0) | round(0) | int) if chip_pts_eid else none -%}
                  {%- set chip_initial = ((helper_name | string)[:1] | upper) | replace('&', '&amp;') | replace('<', '&lt;') -%}
                  {%- set chip_card = {
                    'type': 'custom:button-card',
                    'entity': admin_selector_eid,
                    'show_name': True,
                    'show_label': True,
                    'show_state': False,
                    'show_icon': False,
                    'name': helper_name,
                    'label': ('★ ' ~ chip_pts | string) if chip_pts is not none else ' ',
                    'custom_fields': {
                      'avatar': "<div style='width:26px;height:26px;border-radius:50%;background:var(--primary-color);color:var(--text-primary-color,#fff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;'>" ~ chip_initial ~ "</div>"
                    },
                    'tap_action': {
                      'action': 'call-service',
                      'service': 'select.select_option',
                      'data': {
                        'entity_id': admin_selector_eid,
                        'option': 'None' if chip_is_selected else helper_name
                      }
                    },
                    'hold_action': {'action': 'more-info'},
                    'styles': {
                      'card': [
                        {'padding': '6px 2px'},
                        {'border-radius': '12px'},
                        {'box-shadow': 'none'},
                        {'border': '2px solid var(--primary-color)' if chip_is_selected else '1px solid var(--divider-color)'},
                        {'background-color': 'color-mix(in srgb, var(--primary-color) 10%, var(--card-background-color))' if chip_is_selected else 'var(--card-background-color)'}
                      ],
                      'grid': [
                        {'grid-template-areas': '"avatar" "n" "l"'},
                        {'grid-template-columns': '1fr'},
                        {'row-gap': '1px'},
                        {'justify-items': 'center'}
                      ],
                      'custom_fields': {'avatar': [{'justify-self': 'center'}]},
                      'name': [
                        {'font-size': '11.5px'},
                        {'font-weight': '700'},
                        {'overflow': 'hidden'},
                        {'text-overflow': 'ellipsis'},
                        {'white-space': 'nowrap'},
                        {'max-width': '100%'}
                      ],
                      'label': [
                        {'font-size': '10px'},
                        {'color': 'var(--secondary-text-color)'},
                        {'min-height': '12px'}
                      ]
                    }
                  } -%}
                  {%- set ns.chips = ns.chips + [chip_card] -%}
                {%- endfor -%}

                {#-- 6. Render --#}

                {%- set mgmt_sa = ui_root.shared_admin if ui_root.shared_admin is mapping else {} -%}
                {%- set mgmt_sa_admin = mgmt_sa.get('admin-shared', {}) -%}
                {%- set mgmt_tab = (mgmt_sa_admin.get('management-tab', 'chores') if mgmt_sa_admin is mapping else 'chores') | string -%}
                {%- set tab_ns = namespace(cards=[]) -%}
                {%- for tab_key, tab_icon, tab_label in [('chores', 'mdi:broom', ui.get('chores', 'Chores')), ('economy', 'mdi:star-circle-outline', ui.get('economy', 'Economy')), ('system', 'mdi:cog-outline', ui.get('system', 'System'))] -%}
                  {%- set tab_active = mgmt_tab == tab_key -%}
                  {%- set tab_ns.cards = tab_ns.cards + [{
                    'type': 'custom:button-card',
                    'entity': admin_selector_eid,
                    'show_name': True,
                    'show_label': False,
                    'show_state': False,
                    'show_icon': True,
                    'icon': tab_icon,
                    'name': tab_label,
                    'tap_action': {
                      'action': 'call-service',
                      'service': 'choreops.manage_ui_control',
                      'data': {
                        'config_entry_id': integration_entry_id,
                        'ui_control_target': 'shared_admin',
                        'ui_control_action': 'update',
                        'key': 'admin-shared/management-tab',
                        'value': tab_key
                      }
                    },
                    'hold_action': {'action': 'none'},
                    'styles': {
                      'card': [
                        {'padding': '6px 4px'},
                        {'border-radius': '999px'},
                        {'box-shadow': 'none'},
                        {'border': 'none'},
                        {'background-color': 'var(--primary-color)' if tab_active else 'transparent'}
                      ],
                      'grid': [
                        {'grid-template-areas': '"i n"'},
                        {'grid-template-columns': 'min-content min-content'},
                        {'column-gap': '6px'},
                        {'justify-content': 'center'},
                        {'align-items': 'center'}
                      ],
                      'icon': [
                        {'width': '16px'},
                        {'color': 'var(--text-primary-color)' if tab_active else 'var(--secondary-text-color)'}
                      ],
                      'name': [
                        {'font-size': '12.5px'},
                        {'font-weight': '700'},
                        {'color': 'var(--text-primary-color)' if tab_active else 'var(--primary-text-color)'}
                      ]
                    }
                  }] -%}
                {%- endfor -%}

                {{ selector_summary_card }},
                {%- if header_collapsed -%}
                {%- else -%}
                {{ {
                  'type': 'grid',
                  'columns': (ns.chips | length) if (ns.chips | length) in [2, 3, 4, 5] else pref_selector_column_count,
                  'square': False,
                  'cards': ns.chips
                } }},
                {%- if has_selected_user -%}
                {{ {
                  'type': 'grid',
                  'columns': 3,
                  'square': False,
                  'cards': tab_ns.cards
                } }},
                {%- endif -%}
                {%- endif -%}
              {%- endif -%}

        - type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== QUICK ACTIONS ===== --#}
              << template_snippets.user_override_helper >>

              {#-- Points tab reasons. The first list shows while adding stars, the second while removing them. The tapped text is saved as the reason in Points history. --#}
              {%- set pref_points_reasons_add = ['Helped out', 'Good behavior', 'Extra effort', 'Kindness', 'Missed credit', 'Gift'] -%}
              {%- set pref_points_reasons_remove = ['Correction', 'Cashed out', 'Rule broken', 'Attitude'] -%}
              {%- set pref_points_reasons_add = pref_points_reasons_add if (pref_points_reasons_add is iterable and pref_points_reasons_add is not string and pref_points_reasons_add | length > 0) else ['Adjustment'] -%}
              {%- set pref_points_reasons_remove = pref_points_reasons_remove if (pref_points_reasons_remove is iterable and pref_points_reasons_remove is not string and pref_points_reasons_remove | length > 0) else ['Adjustment'] -%}

              << template_snippets.admin_setup_shared >>
              {%- set ui = shared_admin_ui -%}

              {%- set qa_entry_id = state_attr(shared_admin_helper_eid, 'integration_entry_id') if shared_admin_helper_eid not in ['', none, 'None'] else '' -%}
              {%- set qa_sa = ui_root.shared_admin if ui_root.shared_admin is mapping else {} -%}
              {%- set qa_admin = qa_sa.get('admin-shared', {}) -%}
              {%- set qa_admin = qa_admin if qa_admin is mapping else {} -%}
              {%- set qa_tab = (qa_admin.get('management-tab', 'chores')) | string if has_selected_user else 'system' -%}
              {%- set qa_open = qa_admin.get('quick-actions', {}) -%}
              {%- set qa_open = qa_open if qa_open is mapping else {} -%}
              {%- set qa_user_ok = has_selected_user and has_selected_dashboard_helper -%}
              {%- set qa_ok = (qa_user_ok and qa_entry_id not in ['', none]) or (qa_tab == 'system' and qa_entry_id not in ['', none]) -%}
              {%- if qa_ok -%}
                {#-- Gather this person's chores (same sources the Management card uses) --#}
                {%- set qa_chores = namespace(items=state_attr(selected_dashboard_helper, 'chores') | default([], true)) -%}
                {%- set qa_helpers = state_attr(selected_dashboard_helper, 'dashboard_helpers') or {} -%}
                {%- set qa_chore_eids = qa_helpers.get('chore_helper_eids', []) if qa_helpers is mapping else [] -%}
                {%- if qa_chore_eids is iterable and qa_chore_eids is not string -%}
                  {%- for qa_eid in qa_chore_eids | list -%}
                    {%- if qa_eid not in ['', none, 'None'] and states(qa_eid) not in ['unknown', 'unavailable'] -%}
                      {%- set qa_chores.items = qa_chores.items + (state_attr(qa_eid, 'chores') | default([], true)) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set qa_overdue = qa_chores.items | selectattr('state', 'eq', 'overdue') | list -%}
                {%- set qa_paused = state_attr(selected_dashboard_helper, 'chores_paused') | bool(false) -%}
                {%- set qa_paused_until = state_attr(selected_dashboard_helper, 'chores_paused_until') -%}
                {%- set qa_gam = state_attr(selected_dashboard_helper, 'gamification_enabled') | default(false, true) -%}
                {%- set qa_pbuttons = (state_attr(selected_dashboard_helper, 'points_buttons') | default([], true)) if qa_user_ok else [] -%}
                {%- set qa_achievements = (state_attr(selected_dashboard_helper, 'achievements') | default([], true)) if qa_user_ok else [] -%}
                {%- set qa_bonuses = (state_attr(selected_dashboard_helper, 'bonuses') | default([], true)) if qa_user_ok else [] -%}
                {%- set qa_penalties = (state_attr(selected_dashboard_helper, 'penalties') | default([], true)) if qa_user_ok else [] -%}
                {%- set qa_badges = (state_attr(selected_dashboard_helper, 'badges') | default([], true)) if qa_user_ok else [] -%}
                {%- set qa_specs = namespace(items=[]) -%}

                {%- if qa_tab == 'chores' -%}
                  {%- set qa_reset_actions = namespace(a=[]) -%}
                  {%- for oc in qa_overdue -%}
                    {%- set qa_reset_actions.a = qa_reset_actions.a + [{'action': 'call-service', 'service': 'choreops.reset_overdue_chores', 'data': {'config_entry_id': qa_entry_id, 'chore_name': oc.name, 'user_name': selected_user_name}}] -%}
                  {%- endfor -%}
                  {%- set qa_specs.items = [
                    {
                      'icon': 'mdi:play-circle-outline' if qa_paused else 'mdi:pause-circle-outline',
                      'name': ui.get('resume_chores', 'Resume chores') if qa_paused else ui.get('pause_chores', 'Pause chores'),
                      'label': (ui.get('paused', 'Paused') ~ ((' · ' ~ ui.get('back', 'back') ~ ' ' ~ (as_timestamp(qa_paused_until) | timestamp_custom('%a %I:%M %p', true))) if qa_paused_until not in ['', none, 'None', 'unknown', 'unavailable'] else '')) if qa_paused else ui.get('stops_overdue_stats', 'Stops overdue stats'),
                      'color': 'var(--warning-color)' if qa_paused else 'var(--primary-color)',
                      'tint': qa_paused,
                      'tap': {'action': 'call-service', 'service': 'choreops.pause_user_chores', 'data': {'config_entry_id': qa_entry_id, 'user_name': selected_user_name, 'paused': not qa_paused}, 'confirmation': {'text': (ui.get('resume_chores_confirm', 'Resume chores for {name}?') | replace('{name}', (selected_user_name) | string)) if qa_paused else (ui.get('pause_chores_confirm', 'Pause chores for {name}?') | replace('{name}', (selected_user_name) | string))}}
                    },
                    {
                      'icon': 'mdi:restore-alert',
                      'name': ui.get('reset_overdue', 'Reset overdue'),
                      'label': ((qa_overdue | length | string) ~ ' ' ~ (ui.get('overdue', 'Overdue') | lower)) if qa_overdue | length > 0 else ui.get('nothing_overdue', 'Nothing overdue'),
                      'color': 'var(--warning-color)',
                      'tint': qa_overdue | length > 0,
                      'badge': (qa_overdue | length | string) if qa_overdue | length > 0 else '',
                      'tap': {'action': 'multi-actions', 'actions': qa_reset_actions.a, 'confirmation': {'text': (ui.get('reset_overdue_confirm', 'Reset {count} overdue chore(s) for {name} back to pending?') | replace('{count}', (qa_overdue | length) | string) | replace('{name}', (selected_user_name) | string))}} if qa_overdue | length > 0 else {'action': 'none'}
                    },
                    {
                      'icon': 'mdi:calendar-arrow-right',
                      'name': ui.get('shift_dates', 'Shift dates'),
                      'label': ui.get('move_due_dates_forward', 'Move due dates forward'),
                      'color': 'var(--primary-color)',
                      'tap': {'action': 'call-service', 'service': 'choreops.reschedule_chores_after', 'data': {'config_entry_id': qa_entry_id, 'after': now().isoformat(), 'user_names': [selected_user_name]}, 'confirmation': {'text': (ui.get('shift_dates_confirm', "Move {name}'s due dates forward to after now?") | replace('{name}', (selected_user_name) | string))}}
                    },
                    {
                      'icon': 'mdi:skip-next-circle-outline',
                      'name': ui.get('skip_next_due', 'Skip next due'),
                      'label': ui.get('hide_list', 'Hide list') if qa_open.get('skip-open', false) else ui.get('pick_a_chore_to_skip', 'Pick a chore to skip'),
                      'color': 'var(--primary-color)',
                      'tint': qa_open.get('skip-open', false),
                      'tap': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': {'config_entry_id': qa_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'update', 'key': 'admin-shared/quick-actions/skip-open', 'value': not (qa_open.get('skip-open', false) | bool(false))}}
                    }
                  ] -%}
                  {%- set qa_specs.items = qa_specs.items + [{
                    'icon': 'mdi:format-list-bulleted',
                    'name': ui.get('all_chores_action', 'All chores'),
                    'label': ui.get('hide_list', 'Hide list') if (qa_open.get('allchores-open', false) | bool(false)) else ui.get('pause_or_shift_all', 'Pause or shift all'),
                    'color': 'var(--primary-color)',
                    'tint': (qa_open.get('allchores-open', false) | bool(false)),
                    'tap': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': {'config_entry_id': qa_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'update', 'key': 'admin-shared/quick-actions/allchores-open', 'value': not (qa_open.get('allchores-open', false) | bool(false))}}
                  }] -%}
                                {%- elif qa_tab == 'economy' and qa_gam -%}
                  {%- set qa_specs.items = [
                    {
                      'icon': 'mdi:chart-box-outline',
                      'name': ui.get('activity_report', 'Activity report'),
                      'label': ui.get('posts_to_the_bell', 'Posts to the bell') if qa_user_ok else ui.get('pick_a_person_first', 'Pick a person first'),
                      'color': 'var(--primary-color)',
                      'tap': {'action': 'call-service', 'service': 'choreops.generate_activity_report', 'data': {'config_entry_id': qa_entry_id, 'user_name': selected_user_name, 'report_title': ui.get('activity_report', 'Activity report') ~ ': ' ~ selected_user_name, 'notify_service': 'persistent_notification.create'}, 'confirmation': {'text': (ui.get('activity_report_confirm', 'Post the last 7 days of activity for {name} to the Home Assistant notifications bell?') | replace('{name}', (selected_user_name) | string))}} if qa_user_ok else {'action': 'none'}
                    }
                  ] -%}
                {%- elif qa_tab == 'system' -%}
                  {%- set qa_specs.items = [] -%}
                  {%- if qa_user_ok and qa_gam -%}
                    {%- set qa_specs.items = qa_specs.items + [
                      {'group': 'fix', 'icon': 'mdi:medal-outline', 'name': ui.get('remove_badge', 'Remove badge'), 'label': ui.get('hide_list', 'Hide list') if (qa_open.get('badge-open', false) | bool(false)) else ui.get('take_back_an_award', 'Take back an award'), 'color': 'var(--warning-color)', 'tint': (qa_open.get('badge-open', false) | bool(false)),
                       'tap': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': {'config_entry_id': qa_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'update', 'key': 'admin-shared/quick-actions/badge-open', 'value': not (qa_open.get('badge-open', false) | bool(false))}}},
                      {'group': 'fix', 'icon': 'mdi:wrench-outline', 'name': ui.get('repair_streak', 'Repair streak'), 'label': ui.get('hide_list', 'Hide list') if (qa_open.get('repair-open', false) | bool(false)) else ui.get('fix_a_broken_streak', 'Fix a broken streak'), 'color': 'var(--warning-color)', 'tint': (qa_open.get('repair-open', false) | bool(false)),
                       'tap': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': {'config_entry_id': qa_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'update', 'key': 'admin-shared/quick-actions/repair-open', 'value': not (qa_open.get('repair-open', false) | bool(false))}}}
                    ] -%}
                  {%- endif -%}
                  {%- set qa_specs.items = qa_specs.items + [
                    {'group': 'family', 'icon': 'mdi:restore', 'name': ui.get('reset_all_to_pending', 'Reset all to pending'), 'label': ui.get('clears_claims_and_approvals', 'Clears claims & approvals'), 'color': 'var(--error-color)', 'tint': true,
                     'tap': {'action': 'call-service', 'service': 'choreops.reset_chores_to_pending_state', 'data': {'config_entry_id': qa_entry_id}, 'confirmation': {'text': (ui.get('reset_all_to_pending_confirm', 'Reset EVERY chore for EVERYONE to pending? This clears all claims and approvals.'))}}},
                    {'group': 'family', 'icon': 'mdi:cog-outline', 'name': ui.get('integration_settings', 'Integration settings'), 'label': ui.get('open_choreops_config', 'Open ChoreOps config'), 'color': 'var(--primary-color)', 'tap': {'action': 'url', 'url_path': '/config/integrations/integration/choreops'}},
                    {'group': 'family', 'icon': 'mdi:book-open-page-variant-outline', 'name': ui.get('documentation', 'Documentation'), 'label': ui.get('wiki_and_guides', 'Wiki & guides'), 'color': 'var(--primary-color)', 'tap': {'action': 'url', 'url_path': 'https://github.com/ccpk1/ChoreOps/wiki'}},
                    {'group': 'family', 'icon': 'mdi:heart-outline', 'name': ui.get('support', 'Support'), 'label': ui.get('fund_the_project', 'Fund the project'), 'color': 'var(--primary-color)', 'tap': {'action': 'url', 'url_path': 'https://github.com/sponsors/ccpk1'}}
                  ] -%}
                {%- endif -%}

                {#-- Economy panel: balance, Bonuses / Penalties / Points tabs --#}
                {%- if qa_tab == 'economy' and qa_gam and qa_user_ok -%}
                  {%- set ep_tab = (qa_open.get('econ-tab', 'bonuses')) | string -%}
                  {%- if ep_tab not in ['bonuses', 'penalties', 'points', 'achievements'] -%}
                    {%- set ep_tab = 'bonuses' -%}
                  {%- endif -%}
                  {%- set ep_core = state_attr(selected_dashboard_helper, 'core_sensors') or {} -%}
                  {%- set ep_eid = ep_core.get('points_eid') if ep_core is mapping else none -%}
                  {%- set ep_raw = states(ep_eid) | float(default=0) if ep_eid else 0 -%}
                  {%- set ep_bal = (ep_raw | round(0) | int) | string if ep_raw == (ep_raw | round(0)) else (ep_raw | round(1)) | string -%}
                  {%- set ep_unit = ((state_attr(ep_eid, 'unit_of_measurement') if ep_eid else none) or ui.get('points', 'Points')) | string | replace('&', '&amp;') | replace('<', '&lt;') -%}
                  {%- set ep_mult = (state_attr(ep_eid, 'points_multiplier') | float(default=1)) if ep_eid else 1 -%}
                  {%- set ep_mult_txt = ('%.2f' | format(ep_mult)) | regex_replace('\.?0+$', '') -%}
                  {%- set ep_week = state_attr(ep_eid, 'point_stat_points_net_week') if ep_eid else none -%}
                  {%- set ep_day = state_attr(ep_eid, 'point_stat_avg_per_day_week') if ep_eid else none -%}
                  {%- set ep_chip_style = 'border-radius:14px;padding:4px 10px;font-size:11px;font-weight:600;white-space:nowrap;' -%}
                  {%- set ep_chips = "<span style='" ~ ep_chip_style ~ "background:color-mix(in srgb, var(--primary-color) 14%, transparent);'>x" ~ ep_mult_txt ~ ((' ' ~ ui.get('active', 'Active')) if ep_mult > 1 else '') ~ "</span>" -%}
                  {%- if ep_week not in [none, '', 'None', 'unknown', 'unavailable'] -%}
                    {%- set ep_week_n = ep_week | float(default=0) -%}
                    {%- set ep_chips = ep_chips ~ "<span style='" ~ ep_chip_style ~ "background:color-mix(in srgb, var(--success-color) 12%, transparent);'>" ~ ('+' if ep_week_n >= 0 else '') ~ ('%g' | format(ep_week_n | round(1))) ~ " " ~ ui.get('this_week', 'This Week') ~ "</span>" -%}
                  {%- endif -%}
                  {%- if ep_day not in [none, '', 'None', 'unknown', 'unavailable'] -%}
                    {%- set ep_chips = ep_chips ~ "<span style='" ~ ep_chip_style ~ "background:color-mix(in srgb, var(--warning-color) 12%, transparent);'>" ~ ('%g' | format((ep_day | float(default=0)) | round(1))) ~ " " ~ ui.get('points_per_day', 'Points / Day') ~ "</span>" -%}
                  {%- endif -%}
                  {{-
                    {
                      'type': 'custom:button-card',
                      'show_name': false,
                      'show_icon': false,
                      'show_label': false,
                      'show_state': false,
                      'tap_action': {'action': 'none'},
                      'hold_action': {'action': 'none'},
                      'custom_fields': {
                        'content': "<div style='display:flex;align-items:flex-end;justify-content:space-between;gap:10px;text-align:left;'><div><div style='font-size:10.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;opacity:0.6;'>" ~ ui.get('available', 'Available') ~ " · " ~ (selected_user_name | e) ~ "</div><div style='font-size:34px;font-weight:800;line-height:1.1;'>" ~ ep_bal ~ "</div><div style='font-size:12px;opacity:0.65;'>" ~ ep_unit ~ "</div></div><div style='display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:55%;'>" ~ ep_chips ~ "</div></div>"
                      },
                      'styles': {
                        'card': [
                          {'padding': '12px 14px'},
                          {'border-radius': '16px'},
                          {'box-shadow': 'none'},
                          {'border': '1px solid var(--divider-color)'},
                          {'background-color': 'var(--card-background-color)'}
                        ],
                        'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                        'custom_fields': {'content': [{'width': '100%'}]}
                      }
                    }
                  }},
                  {%- set ep_seg = namespace(c=[]) -%}
                  {%- for ek, el, ei in [('bonuses', ui.get('bonuses', 'Bonuses'), 'mdi:gift-outline'), ('penalties', ui.get('penalties', 'Penalties'), 'mdi:alert-octagon-outline'), ('points', ui.get('points', 'Points'), 'mdi:plus-minus-variant'), ('achievements', ui.get('achievements', 'Achievements'), 'mdi:trophy-award')] -%}
                    {%- set ep_on = ek == ep_tab -%}
                    {%- set ep_seg.c = ep_seg.c + [{
                      'type': 'custom:button-card',
                      'entity': admin_selector_eid,
                      'icon': ei,
                      'name': el,
                      'show_name': true,
                      'show_icon': true,
                      'show_label': false,
                      'show_state': false,
                      'tap_action': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': {'config_entry_id': qa_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'update', 'key': 'admin-shared/quick-actions/econ-tab', 'value': ek}},
                      'hold_action': {'action': 'none'},
                      'styles': {
                        'card': [
                          {'padding': '6px 2px'},
                          {'border-radius': '16px'},
                          {'box-shadow': 'none'},
                          {'border': '1px solid var(--primary-color)' if ep_on else '1px solid transparent'},
                          {'background': 'var(--primary-color)' if ep_on else 'transparent'}
                        ],
                        'grid': [
                          {'grid-template-areas': '"i" "n"'},
                          {'grid-template-columns': '1fr'},
                          {'row-gap': '2px'},
                          {'align-items': 'center'},
                          {'justify-items': 'center'}
                        ],
                        'icon': [{'width': '18px'}, {'color': 'var(--text-primary-color)' if ep_on else 'var(--primary-color)'}],
                        'name': [{'font-size': '11px'}, {'font-weight': '700'}, {'white-space': 'nowrap'}, {'color': 'var(--text-primary-color)' if ep_on else 'var(--primary-text-color)'}]
                      }
                    }] -%}
                  {%- endfor -%}
                  {{-
                    {'type': 'grid', 'columns': 4, 'square': false, 'cards': ep_seg.c}
                  }},
                  {%- set ep_rows = namespace(c=[]) -%}
                  {%- if ep_tab in ['bonuses', 'penalties'] -%}
                    {%- set ep_good = ep_tab == 'bonuses' -%}
                    {%- set ep_col = 'var(--success-color)' if ep_good else 'var(--error-color)' -%}
                    {%- for it in (qa_bonuses if ep_good else qa_penalties) if it is mapping and it.get('eid') not in ['', 'None', 'unknown', 'unavailable', none] -%}
                      {%- set ep_pts = (it.get('points', 0) | float(default=0)) | abs -%}
                      {%- set ep_n = it.get('applied', 0) | float(default=0) -%}
                      {%- set ep_rows.c = ep_rows.c + [{
                        'type': 'custom:button-card',
                        'entity': it.get('eid'),
                        'icon': (state_attr(it.get('eid'), 'icon') or ('mdi:gift-outline' if ep_good else 'mdi:alert-octagon-outline')) | string,
                        'name': (it.get('name') or '') | string,
                        'label': ('+' if ep_good else '−') ~ ('%g' | format(ep_pts)) ~ ' · ' ~ (ui.get('applied', 'Applied') | lower) ~ ' ' ~ ('%g' | format(ep_n)) ~ '×',
                        'show_name': true,
                        'show_icon': true,
                        'show_label': true,
                        'show_state': false,
                        'custom_fields': {'act': "<div style='width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:" ~ ep_col ~ ";border:1.5px solid " ~ ep_col ~ ";background:color-mix(in srgb, " ~ ep_col ~ " 15%, transparent);'>" ~ ('+' if ep_good else '−') ~ "</div>"},
                        'tap_action': {'action': 'call-service', 'service': 'button.press', 'target': {'entity_id': it.get('eid')}, 'confirmation': {'text': ((ui.get('give_to_confirm', 'Give {item} to {name}?') | replace('{item}', (it.get('name') or '') | string) | replace('{name}', (selected_user_name) | string)) if ep_good else (ui.get('apply_to_confirm', 'Apply {item} to {name}?') | replace('{item}', (it.get('name') or '') | string) | replace('{name}', (selected_user_name) | string)))}},
                        'hold_action': {'action': 'none'},
                        'styles': {
                          'card': [
                            {'padding': '8px 12px'},
                            {'border-radius': '14px'},
                            {'box-shadow': 'none'},
                            {'border': '1px solid color-mix(in srgb, ' ~ ep_col ~ ' 35%, var(--divider-color))'},
                            {'background': 'color-mix(in srgb, ' ~ ep_col ~ ' 8%, var(--card-background-color))'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"i n act" "i l act"'},
                            {'grid-template-columns': '34px minmax(0, 1fr) min-content'},
                            {'column-gap': '10px'},
                            {'row-gap': '1px'},
                            {'align-items': 'center'}
                          ],
                          'icon': [{'width': '22px'}, {'color': ep_col}],
                          'name': [{'justify-self': 'start'}, {'font-size': '13px'}, {'font-weight': '700'}, {'text-align': 'left'}],
                          'label': [{'justify-self': 'start'}, {'font-size': '11px'}, {'opacity': '0.7'}],
                          'custom_fields': {'act': [{'justify-self': 'end'}]}
                        }
                      }] -%}
                    {%- endfor -%}
                    {%- if ep_rows.c | length == 0 -%}
                      {%- set ep_rows.c = [{
                        'type': 'custom:button-card',
                        'show_name': true,
                        'show_icon': false,
                        'show_label': false,
                        'show_state': false,
                        'name': (ui.get('none_set_up_yet', 'No {items} set up yet') | replace('{items}', (ui.get(ep_tab, ep_tab) | lower) | string)),
                        'tap_action': {'action': 'none'},
                        'styles': {
                          'card': [{'padding': '14px'}, {'border-radius': '14px'}, {'box-shadow': 'none'}, {'border': '1px dashed var(--divider-color)'}, {'background': 'transparent'}],
                          'name': [{'font-size': '12px'}, {'opacity': '0.65'}]
                        }
                      }] -%}
                    {%- endif -%}
                    {{-
                      {'type': 'grid', 'columns': 1, 'square': false, 'cards': ep_rows.c}
                    }},
                  {%- elif ep_tab == 'achievements' -%}
                    {#-- Achievements are given by hand: tap a gold tile to give it to the selected person --#}
                    {#-- Read the family-wide achievement sensors (one per achievement) so every achievement is listed for everyone --#}
                    {%- set ach_sys = integration_entities('choreops')
                      | select('search', '^sensor\\.')
                      | list
                      | expand
                      | selectattr('attributes.purpose', 'defined')
                      | selectattr('attributes.purpose', 'eq', 'purpose_achievement')
                      | list -%}
                    {%- for it in ach_sys | sort(attribute='attributes.achievement_name') -%}
                      {%- set ach_attrs = it.attributes -%}
                      {%- set ach_name = ((ach_attrs.get('achievement_name') or '') | string) -%}
                      {%- set ach_pts = ach_attrs.get('reward_points', 0) | float(default=0) -%}
                      {%- set ach_n = ((ach_attrs.get('awarded_to') or {}).get(selected_user_name, 0)) | int(default=0) -%}
                      {%- set ach_icon = (ach_attrs.get('icon') or 'mdi:trophy') | string -%}
                      {%- set ach_name_safe = ach_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                      {%- set ach_label = (('+' ~ ('%g' | format(ach_pts)) ~ ' ' ~ ((ep_unit | lower) if ((ep_unit | lower) != (ui.get('points', 'Points') | lower)) else ui.get('points_short', 'pts'))) if ach_pts > 0 else ui.get('no_points', 'no points')) ~ ' · ' ~ ui.get('given', 'given') ~ ' ' ~ ach_n ~ '×' -%}
                      {%- set ach_icon_html = ("<ha-icon icon='" ~ ach_icon ~ "' style='--mdc-icon-size:19px;width:19px;height:19px;color:#d4a017;display:block;'></ha-icon>") if ach_icon[:4] == 'mdi:' else "<span style='font-size:22px;line-height:1;'>🏆</span>" -%}
                      {%- set ach_html = "<div style='display:flex;align-items:center;gap:12px;text-align:left;'><div style='flex:0 0 auto;width:36px;height:36px;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--secondary-background-color);border:2px solid #d4a017;box-shadow:inset 0 0 0 3px rgba(246,211,101,0.22);'>" ~ ach_icon_html ~ "</div><div style='min-width:0;'><div style='font-size:13px;font-weight:700;line-height:1.2;color:var(--primary-text-color);'>" ~ ach_name_safe ~ "</div><div style='font-size:11px;opacity:0.75;color:var(--primary-text-color);'>" ~ ach_label ~ "</div></div></div>" -%}
                      {%- set ep_rows.c = ep_rows.c + [{
                        'type': 'custom:button-card',
                        'entity': it.entity_id,
                        'show_name': false,
                        'show_icon': false,
                        'show_label': false,
                        'show_state': false,
                        'name': ach_name,
                        'label': ach_label,
                        'custom_fields': {'content': ach_html},
                        'tap_action': {'action': 'call-service', 'service': 'choreops.award_achievement', 'data': {'config_entry_id': qa_entry_id, 'user_name': selected_user_name, 'achievement_name': ach_name}, 'confirmation': {'text': (ui.get('give_to_confirm', 'Give {item} to {name}?') | replace('{item}', (ach_name) | string) | replace('{name}', (selected_user_name) | string))}},
                        'hold_action': {'action': 'none'},
                        'styles': {
                          'card': [
                            {'padding': '8px 12px'},
                            {'border-radius': '14px'},
                            {'box-shadow': 'inset 0 0 0 2px color-mix(in srgb, #f6d365 30%, transparent)'},
                            {'border': '2px solid #d4a017'},
                            {'background': 'linear-gradient(135deg, color-mix(in srgb, #f6d365 22%, var(--card-background-color)), var(--card-background-color))'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"content"'},
                            {'grid-template-columns': '1fr'}
                          ],
                          'custom_fields': {
                            'content': [{'width': '100%'}]
                          }
                        }
                      }] -%}
                    {%- endfor -%}
                    {%- if ep_rows.c | length == 0 -%}
                      {%- set ep_rows.c = [{
                        'type': 'custom:button-card',
                        'show_name': true,
                        'show_icon': false,
                        'show_label': false,
                        'show_state': false,
                        'name': ui.get('no_achievements_set_up', 'No achievements set up yet (Settings → ChoreOps → Configure → Manage Achievement)'),
                        'tap_action': {'action': 'none'},
                        'styles': {
                          'card': [{'padding': '14px'}, {'border-radius': '14px'}, {'box-shadow': 'none'}, {'border': '1px dashed var(--divider-color)'}, {'background': 'transparent'}],
                          'name': [{'font-size': '12px'}, {'opacity': '0.65'}, {'white-space': 'normal'}]
                        }
                      }] -%}
                    {%- endif -%}
                    {{-
                      {'type': 'grid', 'columns': 1, 'square': false, 'cards': ep_rows.c}
                    }},
                  {%- else -%}
                    {#-- Points tab: stepper + step size + reason + apply + recent manual changes --#}
                    {%- set pt_amount = qa_open.get('pts-amount', 0) | int(default=0) -%}
                    {%- set pt_step = qa_open.get('pts-step', 100) | int(default=100) -%}
                    {%- if pt_step not in [10, 50, 100, 500] -%}
                      {%- set pt_step = 100 -%}
                    {%- endif -%}
                    {%- set pt_reason = (qa_open.get('pts-reason', '') or '') | string -%}
                    {#-- Reasons follow the direction; a reason picked for the other direction is dropped --#}
                    {%- set pt_reason_list = (pref_points_reasons_remove if pt_amount < 0 else pref_points_reasons_add) | list -%}
                    {%- set pt_reason = pt_reason if pt_reason in pt_reason_list else '' -%}
                    {%- set pt_base = {'config_entry_id': qa_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'update'} -%}
                    {%- set pt_col = 'var(--success-color)' if pt_amount > 0 else ('var(--error-color)' if pt_amount < 0 else 'var(--secondary-text-color)') -%}
                    {%- set pt_amount_txt = ('+' if pt_amount > 0 else '') ~ (pt_amount | string) -%}
                    {%- set pt_after = (ep_raw + pt_amount) -%}
                    {%- set pt_after_txt = (pt_after | round(0) | int) | string if pt_after == (pt_after | round(0)) else (pt_after | round(1)) | string -%}
                    {%- set pt_circle = [{'width': '56px'}, {'height': '56px'}, {'border-radius': '50%'}, {'box-shadow': 'none'}, {'border': '1px solid var(--divider-color)'}, {'background': 'var(--secondary-background-color)'}, {'justify-self': 'center'}] -%}
                    {{-
                      {
                        'type': 'grid', 'columns': 3, 'square': false,
                        'cards': [
                          {
                            'type': 'custom:button-card', 'icon': 'mdi:minus', 'show_name': false, 'show_icon': true,
                            'tap_action': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': dict(pt_base, key='admin-shared/quick-actions/pts-amount', value=(pt_amount - pt_step))},
                            'hold_action': {'action': 'none'},
                            'styles': {'card': pt_circle, 'icon': [{'width': '26px'}, {'color': 'var(--error-color)'}]}
                          },
                          {
                            'type': 'custom:button-card', 'show_name': false, 'show_icon': false,
                            'tap_action': {'action': 'none'}, 'hold_action': {'action': 'none'},
                            'custom_fields': {'content': "<div style='text-align:center;'><div style='font-size:36px;font-weight:800;line-height:1;color:" ~ pt_col ~ ";'>" ~ pt_amount_txt ~ "</div><div style='font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.6;margin-top:4px;'>" ~ ep_unit ~ "</div></div>"},
                            'styles': {'card': [{'box-shadow': 'none'}, {'border': 'none'}, {'background': 'transparent'}, {'padding': '0'}], 'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}]}
                          },
                          {
                            'type': 'custom:button-card', 'icon': 'mdi:plus', 'show_name': false, 'show_icon': true,
                            'tap_action': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': dict(pt_base, key='admin-shared/quick-actions/pts-amount', value=(pt_amount + pt_step))},
                            'hold_action': {'action': 'none'},
                            'styles': {'card': pt_circle, 'icon': [{'width': '26px'}, {'color': 'var(--success-color)'}]}
                          }
                        ]
                      }
                    }},
                    {%- set pt_steps = namespace(c=[]) -%}
                    {%- for sv in [10, 50, 100, 500] -%}
                      {%- set sv_on = sv == pt_step -%}
                      {%- set pt_steps.c = pt_steps.c + [{
                        'type': 'custom:button-card', 'name': '±' ~ sv, 'show_name': true, 'show_icon': false,
                        'tap_action': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': dict(pt_base, key='admin-shared/quick-actions/pts-step', value=sv)},
                        'hold_action': {'action': 'none'},
                        'styles': {
                          'card': [{'padding': '9px 4px'}, {'border-radius': '999px'}, {'box-shadow': 'none'}, {'border': '1px solid var(--primary-color)' if sv_on else '1px solid var(--divider-color)'}, {'background': 'var(--primary-color)' if sv_on else 'var(--secondary-background-color)'}],
                          'name': [{'font-size': '13px'}, {'font-weight': '700'}, {'color': 'var(--text-primary-color)' if sv_on else 'var(--primary-text-color)'}]
                        }
                      }] -%}
                    {%- endfor -%}
                    {{-
                      {'type': 'grid', 'columns': 4, 'square': false, 'cards': pt_steps.c}
                    }},
                    {%- set pt_reasons = namespace(c=[]) -%}
                    {%- for rv in pt_reason_list -%}
                      {%- set rv_on = rv == pt_reason -%}
                      {%- set pt_reasons.c = pt_reasons.c + [{
                        'type': 'custom:button-card', 'name': rv, 'show_name': true, 'show_icon': false,
                        'tap_action': ({'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': {'config_entry_id': qa_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'remove', 'key': 'admin-shared/quick-actions/pts-reason'}} if rv_on else {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': dict(pt_base, key='admin-shared/quick-actions/pts-reason', value=rv)}),
                        'hold_action': {'action': 'none'},
                        'styles': {
                          'card': [{'padding': '9px 4px'}, {'border-radius': '12px'}, {'box-shadow': 'none'}, {'border': '1px solid var(--primary-color)' if rv_on else '1px solid var(--divider-color)'}, {'background': 'color-mix(in srgb, var(--primary-color) 18%, var(--card-background-color))' if rv_on else 'var(--secondary-background-color)'}],
                          'name': [{'font-size': '12px'}, {'font-weight': '700'}, {'color': 'var(--primary-text-color)'}]
                        }
                      }] -%}
                    {%- endfor -%}
                    {{-
                      {
                        'type': 'custom:button-card', 'show_name': true, 'show_icon': false,
                        'name': ui.get('reason_shows_in_history', 'Reason · shows in Points history') ~ ('' if pt_reason else (' (' ~ ui.get('none_picked_saved_as', 'none picked: saved as') ~ ' ' ~ ui.get('adjustment', 'Adjustment') ~ ')')),
                        'tap_action': {'action': 'none'}, 'hold_action': {'action': 'none'},
                        'styles': {
                          'card': [{'padding': '2px 4px'}, {'box-shadow': 'none'}, {'border': 'none'}, {'background': 'transparent'}],
                          'name': [{'justify-self': 'start'}, {'font-size': '11px'}, {'font-weight': '800'}, {'letter-spacing': '.6px'}, {'text-transform': 'uppercase'}, {'opacity': '0.65'}, {'white-space': 'normal'}]
                        }
                      }
                    }},
                    {{-
                      {'type': 'grid', 'columns': 2, 'square': false, 'cards': pt_reasons.c}
                    }},
                    {%- set pt_ready = pt_amount != 0 -%}
                    {%- set pt_verb = (ui.get('add_points_to', 'Add {amount} to {name}') | replace('{amount}', (pt_amount) | string) | replace('{name}', (selected_user_name) | string)) if pt_amount > 0 else (ui.get('remove_points_from', 'Remove {amount} from {name}') | replace('{amount}', (pt_amount | abs) | string) | replace('{name}', (selected_user_name) | string)) -%}
                    {{-
                      {
                        'type': 'custom:button-card',
                        'name': (ui.get('apply', 'Apply') ~ ' ' ~ pt_amount_txt) if pt_ready else ui.get('pick_an_amount_above', 'Pick an amount above'),
                        'label': (selected_user_name ~ ': ' ~ ep_bal ~ ' → ' ~ pt_after_txt) if pt_ready else '',
                        'show_name': true, 'show_icon': false, 'show_label': pt_ready,
                        'tap_action': ({
                          'action': 'call-service',
                          'service': 'choreops.manual_adjust_points',
                          'data': {'config_entry_id': qa_entry_id, 'user_name': selected_user_name, 'amount': pt_amount, 'reason': pt_reason if pt_reason else ui.get('adjustment', 'Adjustment')},
                          'confirmation': {'text': pt_verb ~ '? (' ~ (pt_reason if pt_reason else ui.get('adjustment', 'Adjustment')) ~ ')'}
                        } if pt_ready else {'action': 'none'}),
                        'hold_action': {'action': 'none'},
                        'styles': {
                          'card': [{'padding': '14px'}, {'border-radius': '14px'}, {'box-shadow': 'none'}, {'border': 'none'}, {'background': ('var(--success-color)' if pt_amount > 0 else 'var(--error-color)') if pt_ready else 'var(--secondary-background-color)'}],
                          'grid': [{'grid-template-areas': '"n" "l"'}, {'grid-template-columns': '1fr'}, {'row-gap': '2px'}, {'justify-items': 'center'}],
                          'name': [{'font-size': '15px'}, {'font-weight': '800'}, {'color': '#fff' if pt_ready else 'var(--secondary-text-color)'}],
                          'label': [{'font-size': '11px'}, {'opacity': '0.85'}, {'color': '#fff'}]
                        }
                      }
                    }},
                    {%- set pt_recent = (state_attr(selected_dashboard_helper, 'recent_manual_adjustments') or []) if qa_user_ok else [] -%}
                    {%- if pt_recent | length > 0 -%}
                      {%- set pt_rows = namespace(v='') -%}
                      {%- for it in pt_recent -%}
                        {%- set it_amt = it.get('amount', 0) | float(0) -%}
                        {%- set it_when = (as_datetime(it.get('timestamp')) | as_local) if it.get('timestamp') else none -%}
                        {%- set it_days = (now().date() - it_when.date()).days if it_when else -1 -%}
                        {%- set it_when_txt = '' if it_when is none else ((ui.get('today', 'Today') ~ ' ' ~ it_when.strftime('%-I:%M %p')) if it_days == 0 else ((ui.get('yesterday', 'Yesterday') ~ ' ' ~ it_when.strftime('%-I:%M %p')) if it_days == 1 else (it_when.strftime('%a %-I:%M %p') if it_days < 7 else it_when.strftime('%b %-d')))) -%}
                        {%- set it_col = 'var(--success-color)' if it_amt >= 0 else 'var(--error-color)' -%}
                        {%- set it_name = ((it.get('item_name') or ui.get('adjustment', 'Adjustment')) | string) | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                        {%- set pt_rows.v = pt_rows.v ~ "<div style='display:flex;align-items:center;gap:10px;padding:8px 0;" ~ ('' if loop.first else 'border-top:1px solid var(--divider-color);') ~ "'><ha-icon icon='" ~ ('mdi:plus-circle-outline' if it_amt >= 0 else 'mdi:minus-circle-outline') ~ "' style='width:20px;height:20px;--mdc-icon-size:20px;color:" ~ it_col ~ ";flex:none;'></ha-icon><div style='flex:1;min-width:0;'><div style='font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" ~ it_name ~ "</div><div style='font-size:11px;opacity:.65;'>" ~ it_when_txt ~ "</div></div><div style='font-size:13px;font-weight:800;color:" ~ it_col ~ ";white-space:nowrap;'>" ~ (('+' if it_amt > 0 else '') ~ ('%g' | format(it_amt | round(2)))) ~ "</div></div>" -%}
                      {%- endfor -%}
                      {{-
                        {
                          'type': 'custom:button-card', 'show_name': false, 'show_icon': false,
                          'tap_action': {'action': 'none'}, 'hold_action': {'action': 'none'},
                          'custom_fields': {'content': "<div style='width:100%;text-align:left;'><div style='font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.65;margin-bottom:2px;'>" ~ ui.get('recent_manual_changes', 'Recent manual changes') ~ " · " ~ (selected_user_name | e) ~ "</div>" ~ pt_rows.v ~ "</div>"},
                          'styles': {
                            'card': [{'padding': '12px 14px'}, {'border-radius': '16px'}, {'box-shadow': 'none'}, {'border': '1px solid var(--divider-color)'}, {'background-color': 'var(--card-background-color)'}],
                            'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                            'custom_fields': {'content': [{'width': '100%'}]}
                          }
                        }
                      }},
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}

                {%- if qa_specs.items | length > 0 -%}
                  {%- set qa_group_defs = [
                    ('main', ((ui.get('quick_actions', 'Quick actions') if qa_tab == 'chores' else ui.get('reports', 'Reports')) | upper) ~ ' · ' ~ (selected_user_name | upper)),
                    ('fix', (ui.get('fix_it_tools', 'Fix-it tools') | upper) ~ ' · ' ~ (selected_user_name | upper)),
                    ('family', (ui.get('family_wide', 'Family-wide') ~ ' · ' ~ ui.get('affects_everyone', 'Affects everyone')) | upper)
                  ] -%}
                  {%- for gkey, glabel in qa_group_defs -%}
                    {%- set qa_cards = namespace(c=[]) -%}
                    {%- for sp in qa_specs.items if sp.get('group', 'main') == gkey -%}
                      {%- set qa_cards.c = qa_cards.c + [{
                        'type': 'custom:button-card',
                        'entity': admin_selector_eid,
                        'show_name': true,
                        'show_label': true,
                        'show_state': false,
                        'show_icon': true,
                        'icon': sp.icon,
                        'name': sp.name,
                        'label': sp.label,
                        'tap_action': sp.tap,
                        'hold_action': {'action': 'none'},
                        'custom_fields': {'badge': ("<div style='background:var(--error-color);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:1px 6px;'>" ~ sp.badge ~ "</div>") if sp.get('badge') else ''},
                        'styles': {
                          'card': [
                            {'padding': '7px 9px'},
                            {'border-radius': '12px'},
                            {'box-shadow': 'none'},
                            {'border': '1px solid color-mix(in srgb, ' ~ sp.color ~ ' 45%, var(--divider-color))'},
                            {'background': ('color-mix(in srgb, ' ~ sp.color ~ ' 12%, var(--card-background-color))') if sp.get('tint') else 'var(--card-background-color)'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"i n badge" "i l badge"'},
                            {'grid-template-columns': '26px minmax(0, 1fr) auto'},
                            {'column-gap': '8px'},
                            {'row-gap': '0px'},
                            {'align-items': 'center'}
                          ],
                          'icon': [{'width': '18px'}, {'color': sp.color}],
                          'name': [{'justify-self': 'start'}, {'font-size': '12px'}, {'font-weight': '700'}, {'text-align': 'left'}, {'line-height': '1.25'}],
                          'label': [{'justify-self': 'start'}, {'font-size': '10.5px'}, {'opacity': '0.65'}, {'text-align': 'left'}, {'white-space': 'normal'}, {'line-height': '1.2'}],
                          'custom_fields': {'badge': [{'justify-self': 'end'}, {'align-self': 'start'}]}
                        }
                      }] -%}
                    {%- endfor -%}
                    {%- if qa_cards.c | length > 0 -%}
                      {{-
                        {
                          'type': 'custom:button-card',
                          'show_name': true,
                          'show_icon': false,
                          'show_state': false,
                          'show_label': false,
                          'name': glabel,
                          'tap_action': {'action': 'none'},
                          'hold_action': {'action': 'none'},
                          'styles': {
                            'card': [{'padding': '2px 4px'}, {'box-shadow': 'none'}, {'border': 'none'}, {'background': 'none'}, {'min-height': 'unset'}],
                            'name': [{'justify-self': 'start'}, {'font-size': '10.5px'}, {'font-weight': '700'}, {'letter-spacing': '0.7px'}, {'opacity': '0.65'}]
                          }
                        }
                      }},
                      {{-
                        {
                          'type': 'grid',
                          'columns': 2,
                          'square': false,
                          'cards': qa_cards.c
                        }
                      }},
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}

                {#-- Inline pick-lists --#}
                {%- set qa_pick = namespace(c=[], title='') -%}
                {%- if qa_tab == 'chores' and (qa_open.get('skip-open', false) | bool(false)) -%}
                  {%- set qa_pick.title = ui.get('pick_a_chore_to_skip', 'Pick a chore to skip') | upper -%}
                  {%- for ch in qa_chores.items -%}
                    {%- set qa_pick.c = qa_pick.c + [{'name': ch.name, 'sub': '', 'color': 'var(--divider-color)', 'tap': {'action': 'call-service', 'service': 'choreops.skip_chore_due_date', 'data': {'config_entry_id': qa_entry_id, 'chore_name': ch.name, 'user_name': selected_user_name}, 'confirmation': {'text': (ui.get('skip_next_due_confirm', 'Skip the next due date for {chore}?') | replace('{chore}', (ch.name) | string))}}}] -%}
                  {%- endfor -%}
                {%- elif qa_tab == 'system' and qa_user_ok and (qa_open.get('badge-open', false) | bool(false)) -%}
                  {%- set qa_pick.title = (ui.get('remove_a_badge', 'Remove a badge') | upper) ~ ' · ' ~ (selected_user_name | upper) -%}
                  {%- for bd in qa_badges if bd is mapping and bd.get('earned', false) -%}
                    {%- set qa_pick.c = qa_pick.c + [{'name': bd.get('name'), 'sub': '', 'color': 'var(--warning-color)', 'tap': {'action': 'call-service', 'service': 'choreops.remove_awarded_badges', 'data': {'config_entry_id': qa_entry_id, 'user_name': selected_user_name, 'badge_name': bd.get('name')}, 'confirmation': {'text': (ui.get('remove_badge_confirm', 'Take back {badge} from {name}?') | replace('{badge}', (bd.get('name')) | string) | replace('{name}', (selected_user_name) | string))}}}] -%}
                  {%- endfor -%}
                {%- elif qa_tab == 'system' and qa_user_ok and (qa_open.get('repair-open', false) | bool(false)) -%}
                  {%- set qa_pick.title = (ui.get('repair_a_streak', 'Repair a streak') | upper) ~ ' · ' ~ (selected_user_name | upper) -%}
                  {%- for bd in qa_badges if bd is mapping -%}
                    {%- set qa_pick.c = qa_pick.c + [{'name': bd.get('name'), 'sub': '', 'color': 'var(--warning-color)', 'tap': {'action': 'call-service', 'service': 'choreops.repair_badge_streak', 'data': {'config_entry_id': qa_entry_id, 'user_name': selected_user_name, 'badge_name': bd.get('name')}, 'confirmation': {'text': (ui.get('repair_streak_confirm', 'Restore the streak for {badge} ({name}) to its recent best?') | replace('{badge}', (bd.get('name')) | string) | replace('{name}', (selected_user_name) | string))}}}] -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- if qa_pick.c | length > 0 -%}
                  {%- set qa_pick_cards = namespace(c=[]) -%}
                  {%- for it in qa_pick.c -%}
                    {%- set qa_pick_cards.c = qa_pick_cards.c + [{
                      'type': 'custom:button-card',
                      'entity': admin_selector_eid,
                      'show_name': true,
                      'show_icon': false,
                      'show_label': false,
                      'show_state': false,
                      'name': it.name,
                      'tap_action': it.tap,
                      'hold_action': {'action': 'none'},
                      'styles': {
                        'card': [{'padding': '8px'}, {'border-radius': '12px'}, {'box-shadow': 'none'}, {'border': '1px solid color-mix(in srgb, ' ~ it.color ~ ' 55%, var(--divider-color))'}],
                        'name': [{'font-size': '12px'}, {'font-weight': '700'}, {'white-space': 'normal'}]
                      }
                    }] -%}
                  {%- endfor -%}
                  {{-
                    {
                      'type': 'custom:button-card',
                      'show_name': true,
                      'show_icon': false,
                      'show_state': false,
                      'show_label': false,
                      'name': qa_pick.title,
                      'tap_action': {'action': 'none'},
                      'hold_action': {'action': 'none'},
                      'styles': {
                        'card': [{'padding': '2px 4px'}, {'box-shadow': 'none'}, {'border': 'none'}, {'background': 'none'}, {'min-height': 'unset'}],
                        'name': [{'justify-self': 'start'}, {'font-size': '10.5px'}, {'font-weight': '700'}, {'letter-spacing': '0.7px'}, {'opacity': '0.65'}]
                      }
                    }
                  }},
                  {{-
                    {'type': 'grid', 'columns': 2, 'square': false, 'cards': qa_pick_cards.c}
                  }},
                {%- endif -%}
              {%- endif -%}

    - type: grid
      cards:
        - type: custom:auto-entities
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            template: |-
              {#-- ===== CHORE MANAGEMENT ===== --#}

              << template_snippets.meta_stamp >>


              {#-- 1. User Configuration --#}

              << template_snippets.user_override_helper >>

              {%- set pref_chore_management_ui_control_key_root = 'admin-shared/chore-management' -%}

              {%- set pref_chore_management_default_header_collapsed = true -%}

              {%- set pref_chore_management_primary_tint_mix_pct = 14 -%}

              {%- set pref_chore_management_show_header_background = true -%}

              {%- set pref_chore_management_show_header_thin_border = true -%}

              {%- set pref_claim_accent = '#a957fa' -%}

              {%- set pref_standby_accent = '#5B8DEF' -%}

              {#-- points precision resolves from the selected dashboard helper below --#}

              {%- set pref_chore_selector_column_count = 3 -%}

              {%- set pref_chore_action_column_count = 4 -%}


              {#-- 2. Dynamic Lookups & Validations --#}

              << template_snippets.admin_setup_shared >>

              << template_snippets.admin_validation_missing_selector >>

              {%- set pref_chore_management_ui_control_key_root = (pref_chore_management_ui_control_key_root | default('admin-shared/chore-management') | string) -%}
              {%- set pref_chore_management_ui_control_key_root_segments = pref_chore_management_ui_control_key_root.split('/') | reject('equalto', '') | list -%}
              {%- if pref_chore_management_ui_control_key_root_segments | length == 0 -%}
                {%- set pref_chore_management_ui_control_key_root_segments = ['admin-shared', 'chore-management'] -%}
              {%- endif -%}
              {%- set pref_chore_management_ui_control_key_root = pref_chore_management_ui_control_key_root_segments | join('/') -%}
              {%- set pref_chore_management_default_header_collapsed = (pref_chore_management_default_header_collapsed | default('true') | string | lower) == 'true' -%}
              {%- set pref_chore_management_primary_tint_mix_pct = pref_chore_management_primary_tint_mix_pct | int(default=14) -%}
              {%- set pref_chore_management_show_header_background = (pref_chore_management_show_header_background | default('true') | string | lower) == 'true' -%}
              {%- set pref_chore_management_show_header_thin_border = (pref_chore_management_show_header_thin_border | default('true') | string | lower) == 'true' -%}
              {%- set pref_points_precision = ((state_attr(selected_dashboard_helper, 'dashboard_config') or {}).get('points_precision', 'fixed_0')) if has_selected_dashboard_helper else 'fixed_0' -%}
              {%- set pref_points_precision = pref_points_precision | default('fixed_0') | string | lower -%}
              {%- set pref_chore_selector_column_count = pref_chore_selector_column_count | int(default=3) -%}
              {%- set pref_chore_action_column_count = pref_chore_action_column_count | int(default=4) -%}
              {%- if pref_points_precision not in ['fixed_0', 'adaptive', 'fixed_1', 'fixed_2'] -%}
                {%- set pref_points_precision = 'fixed_0' -%}
              {%- endif -%}
              {%- if pref_chore_management_primary_tint_mix_pct < 0 -%}
                {%- set pref_chore_management_primary_tint_mix_pct = 0 -%}
              {%- elif pref_chore_management_primary_tint_mix_pct > 100 -%}
                {%- set pref_chore_management_primary_tint_mix_pct = 100 -%}
              {%- endif -%}
              {%- if pref_chore_selector_column_count < 1 -%}
                {%- set pref_chore_selector_column_count = 1 -%}
              {%- endif -%}
              {%- if pref_chore_action_column_count < 1 -%}
                {%- set pref_chore_action_column_count = 1 -%}
              {%- endif -%}

              {%- if not skip_render -%}

                {#-- 3. Initialize Variables --#}

                {%- set ui = shared_admin_ui -%}
                {%- if summary_helper in ['', None, 'None'] -%}
                  {{ {
                    'type': 'markdown',
                    'content': "⚠️ **Dashboard configuration error**\n\nCannot find any dashboard helper entities for this shared admin view.\n\nCheck Settings → Integrations → ChoreOps and verify at least one user is configured."
                  } }},
                  {%- set skip_render = true -%}
                {%- endif -%}
              {%- endif -%}

              {%- if not skip_render -%}

                {#-- 4. Collect Data --#}

                {%- set integration_entry_id = state_attr(shared_admin_helper_eid, 'integration_entry_id') if shared_admin_helper_eid not in ['', None, 'None'] else '' -%}
                {%- set ui_control_key_root = pref_chore_management_ui_control_key_root -%}
                {%- set ui_control_key_header_collapsed = ui_control_key_root ~ '/header-collapse' -%}
                {%- set selected_user_ui_root = namespace(current=ui_root.selected_user if ui_root.selected_user is mapping else {}) -%}
                {%- for segment in ui_control_key_root.split('/') -%}
                  {%- if selected_user_ui_root.current is mapping -%}
                    {%- set selected_user_ui_root.current = selected_user_ui_root.current.get(segment, {}) -%}
                  {%- else -%}
                    {%- set selected_user_ui_root.current = {} -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set has_header_collapsed_override = selected_user_ui_root.current is mapping and 'header-collapse' in selected_user_ui_root.current -%}
                {%- set selected_dashboard_helpers = state_attr(selected_dashboard_helper, 'dashboard_helpers') or {} if has_selected_dashboard_helper else {} -%}
                {%- set selected_core_sensors = state_attr(selected_dashboard_helper, 'core_sensors') or {} if has_selected_dashboard_helper else {} -%}
                {%- set chore_select_entity = selected_dashboard_helpers.get('chore_select_eid') if has_selected_dashboard_helper else '' -%}
                {%- set dashboard_date_helper = selected_dashboard_helpers.get('date_helper_eid') if has_selected_dashboard_helper else '' -%}
                {%- set points_sensor = selected_core_sensors.get('points_eid') if has_selected_dashboard_helper else '' -%}
                {%- set selected_chore_name = (states(chore_select_entity) | default('')) if chore_select_entity not in ['', None, 'None'] else '' -%}
                {%- set has_chore_selector = chore_select_entity not in ['', None, 'None'] -%}
                {%- set has_selected_chore = has_selected_dashboard_helper and has_chore_selector and selected_chore_name not in ['None', 'none', '', 'unknown', 'unavailable'] -%}
                {%- set selected_chore_is_unassigned = has_selected_chore and selected_chore_name is string and selected_chore_name.startswith('⊘ ') -%}
                {#-- Chore names can contain parentheses themselves, e.g. "Evening tidy-up (10 min)".
                     Only a trailing "(Name, Name)" group made of real user names is the assignee suffix. --#}
                {%- set known_users = namespace(n=[]) -%}
                {%- for kh in helper_sensor_entities -%}
                  {%- set known_users.n = known_users.n + [(kh.attributes.get('user_name') or kh.name) | string] -%}
                {%- endfor -%}
                {%- macro chore_core(option, users) -%}
                  {%- set cb = option | string -%}
                  {%- if cb.startswith('⊘ ') -%}{%- set cb = cb[2:] -%}{%- endif -%}
                  {%- set ci = cb.rfind(' (') -%}
                  {%- if ci > 0 and cb.endswith(')') and (cb[ci + 2:-1].split(', ') | reject('in', users) | list | length) == 0 -%}
                    {{- cb[:ci] -}}
                  {%- else -%}
                    {{- cb -}}
                  {%- endif -%}
                {%- endmacro -%}
                {%- set selected_chore_core_name = (chore_core(selected_chore_name, known_users.n) | string | trim) if has_selected_chore else '' -%}
                {%- set selected_chore_display = selected_chore_core_name if has_selected_chore else '' -%}
                {%- set helper_chore_items_ns = namespace(items=state_attr(selected_dashboard_helper, 'chores') | default([], true) if has_selected_dashboard_helper else []) -%}
                {%- set selected_chore_helper_eids = selected_dashboard_helpers.get('chore_helper_eids', []) if has_selected_dashboard_helper and selected_dashboard_helpers is mapping else [] -%}
                {%- if selected_chore_helper_eids is iterable and selected_chore_helper_eids is not string -%}
                  {%- for chore_helper_eid in selected_chore_helper_eids | list -%}
                    {%- if chore_helper_eid not in ['', None, 'None'] and states(chore_helper_eid) not in ['unknown', 'unavailable'] -%}
                      {%- set helper_chore_items_ns.items = helper_chore_items_ns.items + (state_attr(chore_helper_eid, 'chores') | default([], true)) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set helper_chore_items = helper_chore_items_ns.items -%}
                {%- set overdue_chore_items = helper_chore_items | selectattr('state', 'eq', 'overdue') | list if has_selected_dashboard_helper else [] -%}
                {%- set overdue_chore_count = overdue_chore_items | count -%}
                {%- set show_reset_all_overdue_card = has_selected_user and overdue_chore_count > 0 and integration_entry_id not in ['', None, 'None'] -%}
                {%- set selected_chore_lookup_name = selected_chore_core_name | string | trim if has_selected_chore else '' -%}
                {%- set selected_chore_sensor_ns = namespace(entity_id='') -%}
                {%- if has_selected_chore -%}
                  {%- for helper_chore in helper_chore_items -%}
                    {%- set helper_chore_name = helper_chore.name | default('', true) | string | trim -%}
                    {%- if selected_chore_sensor_ns.entity_id == '' and helper_chore_name == selected_chore_lookup_name -%}
                      {%- set selected_chore_sensor_ns.entity_id = helper_chore.eid | default('', true) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set selected_chore_sensor = selected_chore_sensor_ns.entity_id -%}
                {%- set has_selected_chore_sensor = selected_chore_sensor not in ['', None, 'None'] and states(selected_chore_sensor) not in ['unknown', 'unavailable'] -%}
                {%- set has_resolved_selected_chore = has_selected_chore and has_selected_chore_sensor -%}
