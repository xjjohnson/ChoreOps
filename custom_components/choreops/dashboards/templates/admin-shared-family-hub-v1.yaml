                            {'font-size': '11px'},
                            {'color': 'var(--secondary-text-color)'},
                            {'white-space': 'nowrap'},
                            {'overflow': 'hidden'},
                            {'text-overflow': 'ellipsis'},
                            {'max-width': '100%'}
                          ],
                          'custom_fields': {'dot': [{'justify-self': 'center'}]}
                        }
                      }] -%}
                    {%- endfor -%}
                    {%- if cp_opts | length > cp_limit -%}
                      {%- set cp_cards.items = cp_cards.items + [{
                        'type': 'custom:button-card',
                        'entity': chore_select_entity,
                        'show_name': True,
                        'show_label': False,
                        'show_state': False,
                        'show_icon': True,
                        'icon': 'mdi:chevron-up' if cp_all else 'mdi:chevron-down',
                        'name': ui.get('show_fewer', 'Show fewer') if cp_all else (ui.get('show_all', 'Show all') ~ ' ' ~ (cp_opts | length)),
                        'tap_action': {'action': 'call-service', 'service': 'choreops.manage_ui_control', 'data': {'config_entry_id': integration_entry_id, 'ui_control_target': 'shared_admin', 'ui_control_action': 'update', 'key': 'admin-shared/quick-actions/picker-all', 'value': not cp_all}},
                        'styles': {
                          'card': [
                            {'padding': '9px 10px'},
                            {'border-radius': '12px'},
                            {'box-shadow': 'none'},
                            {'border': '1px dashed var(--divider-color)'},
                            {'background-color': 'transparent'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"i n"'},
                            {'grid-template-columns': '18px 1fr'},
                            {'column-gap': '6px'},
                            {'align-items': 'center'}
                          ],
                          'icon': [{'width': '16px'}, {'color': 'var(--primary-color)'}],
                          'name': [{'justify-self': 'start'}, {'font-size': '12px'}, {'font-weight': '600'}, {'color': 'var(--primary-color)'}]
                        }
                      }] -%}
                    {%- endif -%}
                    {%- if cp_opts | length > 0 -%}
                    {{-
                      {
                        'type': 'vertical-stack',
                        'cards': [
                          {
                            'type': 'custom:button-card',
                            'entity': chore_select_entity,
                            'show_name': True,
                            'show_label': True,
                            'show_state': False,
                            'show_icon': True,
                            'icon': 'mdi:clipboard-text-search-outline',
                            'name': ui.get('chores', 'Chores'),
                            'label': ui.get('choose_chore_for_admin_actions', 'err-choose_chore_for_admin_actions'),
                            'tap_action': {'action': 'none'},
                            'hold_action': {'action': 'more-info'},
                            'styles': {
                              'card': [
                                {'padding': '10px 14px 4px 14px'},
                                {'box-shadow': 'none'},
                                {'border': 'none'},
                                {'background-color': 'transparent'}
                              ],
                              'grid': [
                                {'grid-template-areas': '"i n" "i l"'},
                                {'grid-template-columns': '26px minmax(0, 1fr)'},
                                {'column-gap': '10px'},
                                {'row-gap': '2px'},
                                {'align-items': 'center'}
                              ],
                              'icon': [{'width': '20px'}, {'height': '20px'}, {'color': 'var(--primary-color)'}],
                              'name': [{'justify-self': 'start'}, {'font-size': '14px'}, {'font-weight': '700'}],
                              'label': [{'justify-self': 'start'}, {'font-size': '12px'}, {'color': 'var(--secondary-text-color)'}, {'white-space': 'normal'}]
                            }
                          },
                          {'type': 'grid', 'columns': 2, 'square': False, 'cards': cp_cards.items}
                        ]
                      }
                    }},
                    {%- else -%}
                    {{-
                      {
                        'type': 'custom:button-card',
                        'entity': chore_select_entity,
                        'show_name': True,
                        'show_icon': True,
                        'show_label': False,
                        'show_state': False,
                        'icon': 'mdi:clipboard-search-outline',
                        'name': ui.get('select_chore_to_manage', 'err-select_chore_to_manage'),
                        'tap_action': {'action': 'more-info'},
                        'styles': {
                          'card': [
                            {'padding': '10px 14px'},
                            {'border-radius': '16px'},
                            {'box-shadow': 'none'},
                            {'border': '1px solid var(--divider-color)'},
                            {'background-color': 'var(--card-background-color)'}
                          ]
                        }
                      }
                    }},
                    {%- endif -%}
                    {%- endif -%}
                  {%- else -%}
                    {{ chore_selector_error_card }},
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
              {%- endif -%}
