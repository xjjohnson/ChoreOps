              {#-- 6. Render Logic --#}

              {%- if has_selected_dashboard_helper and has_selected_user and mgmt_tab == 'chores' -%}
                {#-- ===== ALL CHORES ACTIONS ===== --#}
                {%- set ac_sa = (ui_root.shared_admin if ui_root.shared_admin is mapping else {}).get('admin-shared', {}) -%}
