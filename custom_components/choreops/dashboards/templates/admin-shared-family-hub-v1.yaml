                            {'grid-template-columns': '14px minmax(0, 1fr)'},
                            {'column-gap': '8px'},
                            {'row-gap': '1px'},
                            {'align-items': 'center'}
                          ],
                          'name': [
                            {'justify-self': 'start'},
                            {'font-size': '13px'},
                            {'font-weight': '700'},
                            {'white-space': 'nowrap'},
                            {'overflow': 'hidden'},
                            {'text-overflow': 'ellipsis'},
                            {'max-width': '100%'}
