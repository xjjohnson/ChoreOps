<#-- ============================================= --#>
<#-- ChoreOps Dashboard Template - FAMILY HUB --#>
<#-- Template Schema Version: 1                  --#>
<#-- ============================================= --#>
<#--                                             --#>
<#-- Family Hub dashboard: redesigned Premier layout (greeting hero, timeline chores, progress-fill achievements with family goals) --#>
<#--                                             --#>
<#-- Injection variables (Python << >>):         --#>
<#--   << user.name >> - User display name        --#>
<#--   << user.slug >> - URL-safe slug            --#>
<#--   << user.user_id >> - User identity UUID    --#>
<#--   << integration.entry_id >> - Instance scope ID --#>
<#--                                             --#>
<#-- Snippet tokens: template_snippets.user_setup,                       --#>
<#-- template_snippets.user_validation,                                  --#>
<#-- template_snippets.user_override_helper, template_snippets.meta_stamp --#>
<#-- Stamp format (canonical): META STAMP: {template_id} • {release} • {generated_at} --#>
<#-- Stamp placement: first line inside each card template block after card header comment --#>
<#--                                             --#>
<#-- All HA Jinja2 {{ }} syntax preserved       --#>
<#-- ============================================= --#>

button_card_templates:
  << template_shared.button_card_template_chore_row_v1 >>
  << template_shared.button_card_template_chore_row_kids_v1 >>
  << template_shared.button_card_template_chore_row_timeline_v1 >>
views:
  - max_columns: 3
    title: << user.name >>
    path: family-hub-<< user.slug >>
    subview: true
    type: sections
    sections:
    - type: grid
      column_span: 1
      cards:
        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== WELCOME CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- 1. User Configuration --#}

                  << template_snippets.user_override_helper >>

                  {%- set pref_primary_tint_mix_pct = 14 -%}  {#-- Percent of var(--primary-color) mixed into the welcome-card background when fill is enabled. Allowed: 0-100. --#}

                  {%- set pref_show_header_background = true -%}  {#-- Set to false to remove the welcome-card background fill and leave it transparent. Allowed: true, false. --#}

                  {%- set pref_show_header_thin_border = true -%}  {#-- Set to false to remove the thin outer border line. Accent borders are unaffected. Allowed: true, false. --#}


                  {#-- 2. Dynamic Lookups & Validations --#}

                  {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
                  {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
                  {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
                  {%- if pref_primary_tint_mix_pct < 0 -%}
                    {%- set pref_primary_tint_mix_pct = 0 -%}
                  {%- elif pref_primary_tint_mix_pct > 100 -%}
                    {%- set pref_primary_tint_mix_pct = 100 -%}
                  {%- endif -%}
                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  {%- if not skip_render -%}

                    {#-- 3. Collect Data --#}
                    {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') or {} -%}
                    {%- set dashboard_helpers = state_attr(dashboard_helper, 'dashboard_helpers') or {} -%}
                    {%- set dashboard_config = state_attr(dashboard_helper, 'dashboard_config') or {} -%}
                    {%- set gamification_enabled = state_attr(dashboard_helper, 'gamification_enabled') | default(false, true) -%}
                    {%- set points_sensor = core_sensors.get('points_eid') -%}
                    {%- set total_sensor = core_sensors.get('chores_eid') -%}
                    {%- set highest_badge_entity = core_sensors.get('badges_eid') -%}
                    {%- set pref_points_precision = dashboard_config.get('points_precision', 'fixed_0') if dashboard_config is mapping else 'fixed_0' -%}
                    {%- set pref_points_precision = pref_points_precision | default('fixed_0') | string | lower -%}
                    {%- if pref_points_precision not in ['fixed_0', 'adaptive', 'fixed_1', 'fixed_2'] -%}
                      {%- set pref_points_precision = 'fixed_0' -%}
                    {%- endif -%}
                    {%- set translation_sensor = dashboard_helpers.get('translation_sensor_eid') -%}
                    {%- set ui = state_attr(translation_sensor, 'ui_translations') if translation_sensor else {} -%}
                    {%- set points_value = (states(points_sensor) | float(default=0)) if points_sensor else 0 -%}
                    {%- set points_label = (state_attr(points_sensor, 'unit_of_measurement') if points_sensor else None) or 'Points' -%}
                    {%- set points_icon = (state_attr(points_sensor, 'icon') if points_sensor else None) or 'mdi:star-circle' -%}
                    {%- set points_multiplier = (state_attr(points_sensor, 'points_multiplier') | float(default=1)) if points_sensor else 1 -%}
                    {%- set highest_badge = ((states(highest_badge_entity) if highest_badge_entity else 'None') or 'None') -%}
                    {%- set highest_badge_icon = (state_attr(highest_badge_entity, 'icon') if highest_badge_entity else None) or 'mdi:medal-outline' -%}
                    {%- set overdue_now = (state_attr(total_sensor, 'chore_stat_current_overdue') | int(default=0)) if total_sensor else 0 -%}
                    {%- set due_today_open = (state_attr(total_sensor, 'chore_stat_current_due_today') | int(default=0)) if total_sensor else 0 -%}
                    {%- set chores_paused = state_attr(dashboard_helper, 'chores_paused') | bool(false) -%}

                    {#-- 4. Build Display - essentials minimal --#}
                    {%- set p_icon = points_icon | default('mdi:star', true) -%}
                    {%- set points_value = points_value | round(2) -%}
                    {%- if pref_points_precision == 'adaptive' -%}
                      {%- if points_value == (points_value | int) -%}
                        {%- set points_display = (points_value | int) | string -%}
                      {%- elif points_value == (points_value | round(1)) -%}
                        {%- set points_display = '%.1f' | format(points_value) -%}
                      {%- else -%}
                        {%- set points_display = '%.2f' | format(points_value) -%}
                      {%- endif -%}
                    {%- elif pref_points_precision == 'fixed_1' -%}
                      {%- set points_display = '%.1f' | format(points_value) -%}
                    {%- elif pref_points_precision == 'fixed_2' -%}
                      {%- set points_display = '%.2f' | format(points_value) -%}
                    {%- else -%}
                      {%- set points_display = (points_value | round(0) | int) | string -%}
                    {%- endif -%}
                    {%- set multiplier_display = points_multiplier | int if points_multiplier == (points_multiplier | int) else points_multiplier -%}

                    {%- set rank_pill = '' -%}
                    {%- if highest_badge not in ['None', 'unknown', 'Unknown', 'unavailable'] -%}
                      {%- set mult_text = " <span style='color: var(--warning-color);'>(x" ~ multiplier_display|string ~ ")</span>" if points_multiplier > 1 else '' -%}
                      {%- set rank_pill = "<span style='font-size: 12px; background: var(--secondary-background-color); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--divider-color); display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;'><ha-icon icon='" ~ highest_badge_icon ~ "' style='width: 18px; height: 14px; margin-right: 5px; color: var(--warning-color);'></ha-icon><span style='font-weight: 600; color: var(--primary-text-color);'>" ~ highest_badge ~ mult_text ~ "</span></span>" -%}
                    {%- endif -%}

                    {%- if chores_paused -%}
                      {%- set status_icon = 'mdi:pause-circle-outline' -%}
                      {%- set status_color = 'var(--warning-color)' -%}
                      {%- set status_text = ui.get('chores_are_paused', 'err-chores_are_paused') -%}
                    {%- elif overdue_now > 0 -%}
                      {%- set status_icon = 'mdi:alert-octagon' -%}
                      {%- set status_color = 'var(--error-color)' -%}
                      {%- set status_text = ui.get('overdue', 'err-overdue') ~ ': ' ~ overdue_now|string -%}
                    {%- elif due_today_open > 0 -%}
                      {%- set status_icon = 'mdi:calendar-clock' -%}
                      {%- set status_color = 'var(--warning-color)' -%}
                      {%- set status_text = ui.get('due_today', 'err-due_today') ~ ': ' ~ due_today_open|string -%}
                    {%- else -%}
                      {%- set status_icon = 'mdi:check-circle' -%}
                      {%- set status_color = 'var(--success-color)' -%}
                      {%- set status_text = ui.get('all_caught_up', 'All Caught Up!') -%}
                    {%- endif -%}

                    {%- set cu = state_attr(dashboard_helper, 'caught_up_streak') or {} -%}
                    {%- set cu_n = cu.get('count', 0) | int(0) -%}
                    {%- set cu_best = cu.get('best', 0) | int(0) -%}
                    {%- set cu_open = (overdue_now + due_today_open) > 0 -%}
                    {%- set cu_broken = cu_n == 0 and cu_best > 0 and overdue_now > 0 -%}
                    {%- set cu_col = 'var(--secondary-text-color)' if (cu_open or cu_broken) else 'var(--warning-color)' -%}
                    {%- set cu_txt = (cu_n | string) ~ (' days' if cu_n != 1 else ' day') ~ (' (at risk)' if (cu_open and cu_n > 0) else '') -%}
                    {%- set streak_chip = ("<span style='display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: 1.2; color: " ~ cu_col ~ "; background: color-mix(in srgb, " ~ cu_col ~ " 14%, var(--card-background-color)); padding: 4px 12px; border-radius: 999px;'><ha-icon icon='mdi:fire' style='width: 16px; height: 16px; --mdc-icon-size: 16px; color: " ~ cu_col ~ "; display: block;'></ha-icon><span>" ~ cu_txt ~ "</span></span>") if (cu_n > 0 or cu_broken) else '' -%}
                    {%- set streak_note = ("<span style='font-size: 11px; opacity: 0.65; white-space: nowrap;'>" ~ (('Streak ended. ') if cu_broken else '') ~ 'Best: ' ~ (cu_best | string) ~ (' days' if cu_best != 1 else ' day') ~ "</span>") if cu_best > 0 else '' -%}
                    {%- set name_safe = name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                    {%- set hour_now = now().hour -%}
                    {%- if hour_now < 12 -%}
                      {%- set greeting_text = ui.get('good_morning', ui.get('welcome', 'err-welcome')) -%}
                    {%- elif hour_now < 18 -%}
                      {%- set greeting_text = ui.get('good_afternoon', ui.get('welcome', 'err-welcome')) -%}
                    {%- else -%}
                      {%- set greeting_text = ui.get('good_evening', ui.get('welcome', 'err-welcome')) -%}
                    {%- endif -%}
                    {%- set avatar_initial = (name_safe[:1] | upper) if name_safe else '?' -%}
                    {%- set status_chip =
                      "<span style='display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; line-height: 1.2; color: " ~ status_color ~ "; background: color-mix(in srgb, " ~ status_color ~ " 14%, var(--card-background-color)); padding: 4px 12px; border-radius: 999px;'>"
                      ~ "<ha-icon icon='" ~ status_icon ~ "' style='width: 16px; height: 16px; --mdc-icon-size: 16px; color: " ~ status_color ~ "; display: block;'></ha-icon>"
                      ~ "<span>" ~ status_text ~ "</span></span>"
                    -%}
                    {%- set right_col = "" -%}
                    {%- if gamification_enabled -%}
                      {%- set right_col =
                        "<div style='text-align: right; flex-shrink: 0; margin-left: 12px;'>"
                        ~ "<div style='display: inline-flex; align-items: center; color: var(--primary-color); font-size: 24px; font-weight: 800; line-height: 1; white-space: nowrap;'><ha-icon icon='" ~ p_icon ~ "' style='width: 24px; height: 24px; --mdc-icon-size: 24px; margin-right: 5px; display: block;'></ha-icon>" ~ points_display ~ "</div>"
                        ~ "<div style='font-size: 10px; text-transform: uppercase; font-weight: 700; opacity: 0.65; margin-top: 4px; letter-spacing: 0.5px;'>" ~ points_label ~ "</div>"
                        ~ "</div>"
                      -%}
                    {%- endif -%}

                    {%- set content_html =
                      "<div style='width: 100%; text-align: left;'>"
                      ~ "<div style='display: flex; align-items: center; gap: 12px;'>"
                      ~ "<div style='width: 48px; height: 48px; border-radius: 50%; background: var(--primary-color); color: var(--text-primary-color, #fff); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex: 0 0 auto;'>" ~ avatar_initial ~ "</div>"
                      ~ "<div style='flex: 1; min-width: 0;'>"
                      ~ "<div style='font-size: 12px; font-weight: 700; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.6px; line-height: 1.2;'>" ~ greeting_text ~ "</div>"
                      ~ "<div style='font-size: 20px; font-weight: 700; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;'>" ~ name_safe ~ "</div>"
                      ~ "</div>"
                      ~ right_col
                      ~ "</div>"
                      ~ "<div style='display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px;'>" ~ rank_pill ~ status_chip ~ streak_chip ~ streak_note ~ "</div>"
                      ~ "</div>"
                    -%}

                    {#-- 5. Render --#}
                    {{
                      {
                        'type': 'custom:button-card',
                        'entity': points_sensor if gamification_enabled and points_sensor else total_sensor,
                        'show_name': false,
                        'show_icon': false,
                        'tap_action': {'action': 'more-info'},
                        'styles': {
                          'card': [
                            {'padding': '16px'},
                            {'border-radius': '16px'},
                            {'border': '1px solid color-mix(in srgb, var(--primary-color) 25%, var(--divider-color))' if pref_show_header_thin_border else 'none'},
                            {'background': ('linear-gradient(135deg, color-mix(in srgb, var(--primary-color) ' ~ (pref_primary_tint_mix_pct * 3 // 2)|string ~ '%, var(--card-background-color)), color-mix(in srgb, var(--primary-color) ' ~ (pref_primary_tint_mix_pct // 3)|string ~ '%, var(--card-background-color)))') if pref_show_header_background else 'transparent'},
                            {'box-shadow': 'none'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"content"'},
                            {'grid-template-columns': '1fr'}
                          ],
                          'custom_fields': {
                            'content': [{'width': '100%'}]
                          }
                        },
                        'custom_fields': {
                          'content': content_html
                        }
                      }
                    }},

                  {%- endif -%}

        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== CHORES CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- ═══════════════════════════════════════════════════════════════════════ --#}
                  {#-- PREFERENCE DEFAULTS                                             --#}
                  {#-- ═══════════════════════════════════════════════════════════════════════ --#}
                  {#--                                                                       --#}
                  {#-- Full reference: https://github.com/ccpk1/ChoreOps-Dashboards/blob/main/preferences/user-family-hub-v1.md --#}
                  {#--                                                                       --#}
                  {#-- Groups: Layout & Grid · Time Buckets · Exclude Filters ·              --#}
                  {#--         Include Filters · Labels & Sorting · Display ·                --#}
                  {#--         Colors & Accents · Header & UI Control                        --#}
                  {#-- ═══════════════════════════════════════════════════════════════════════ --#}

                  << template_snippets.user_override_helper >>


                  {#-- ── Layout & Grid ─────────────────────────────────────────────────── --#}

                  {%- set pref_chore_row_variant = 'standard' -%}  {#-- Options: 'standard', 'kids' --#}

                  {%- set pref_chore_engine_layout_mode = 'single' -%}  {#-- Options: 'single', 'responsive' --#}

                  {%- set pref_settings_column_count_mobile = 3 -%}

                  {%- set pref_settings_column_count_wide = 3 -%}

                  {%- set pref_column_count_standard = 1 -%}

                  {%- set pref_column_count_kids = 3 -%}


                  {#-- ── Time Buckets ─────────────────────────────────────────────────── --#}

                  {%- set pref_use_overdue_grouping = true -%}  {#-- Allowed: true, false --#}

                  {%- set pref_today_grouping_mode = 'today_morning' -%}  {#-- Options: 'off', 'today', 'today_morning' --#}

                  {%- set pref_include_daily_recurring_in_today = true -%}  {#-- Allowed: true, false --#}

                  {%- set pref_use_this_week_grouping = true -%}  {#-- Allowed: true, false --#}

                  {%- set pref_use_standby_grouping = true -%}  {#-- Allowed: true, false --#}


                  {#-- ── Exclude Filters ──────────────────────────────────────────────── --#}

                  {%- set pref_exclude_completed = false -%}  {#-- Allowed: true, false --#}

                  {%- set pref_exclude_blocked = false -%}  {#-- Allowed: true, false --#}

                  {%- set pref_exclude_states = [] -%}  {#-- Example: ['completed', 'completed_by_other', 'paused', 'not_my_turn', 'standby', 'missed'] --#}

                  {%- set pref_exclude_nonrecurring_no_due_date = false -%}  {#-- Allowed: true, false --#}

                  {%- set pref_max_due_date_days = 0 -%}  {#-- 0 disables; positive integer hides chores due beyond this many days ahead. --#}

                  {%- set pref_exclude_group_list = [] -%}  {#-- Example: ['later', 'this_week'] --#}

                  {%- set pref_exclude_label_list = [] -%}  {#-- Example: ['junk_label', 'skip_this'] --#}


                  {#-- ── Include Filters (whitelist, Step 0 priority) ─────────────────── --#}

                  {%- set pref_include_label_list = [] -%}  {#-- Example: ['shared_chores', 'kitchen'] --#}

                  {%- set pref_include_group_list = [] -%}  {#-- Values: 'today', 'this_week', 'other'. Example: ['today', 'this_week'] --#}

                  {%- set pref_include_state_list = [] -%}  {#-- Example: ['pending', 'due'] --#}


                  {#-- ── Labels & Sorting ─────────────────────────────────────────────── --#}

                  {%- set pref_use_label_grouping = false -%}  {#-- Allowed: true, false --#}

                  {%- set pref_label_display_order = [] -%}  {#-- Example: ['Kitchen', 'Bedroom', 'Outdoor'] --#}

                  {%- set pref_sort_within_groups = 'by_state_and_date' -%}  {#-- Options: 'default', 'name_asc', 'name_desc', 'date_asc', 'date_desc', 'by_state_and_date' --#}


                  {#-- ── Display ──────────────────────────────────────────────────────── --#}

                  {%- set pref_show_chore_description = false -%}  {#-- Allowed: true, false --#}


                  {#-- ── Colors & Accents ─────────────────────────────────────────────── --#}

                  {%- set pref_claim_accent = '#a957fa' -%}  {#-- Accent color for claimed state highlights. --#}

                  {%- set pref_due_accent = '#ff9800' -%}  {#-- Accent color for due state highlights. --#}

                  {%- set pref_overdue_accent = '#ff4444' -%}  {#-- Accent color for overdue and missed state highlights. --#}

                  {%- set pref_steal_accent = '#F2C94C' -%}  {#-- Accent color for steal-available state highlights. --#}

                  {%- set pref_standby_accent = '#5B8DEF' -%}  {#-- Accent color for standby-available state highlights. --#}


                  {#-- ── Header & UI Control ──────────────────────────────────────────── --#}

                  {%- set pref_ui_control_key_root = 'gamification/chores' -%}  {#-- Slash-delimited key path for per-user UI state. --#}

                  {%- set pref_default_header_collapsed = false -%}  {#-- Allowed: true, false --#}

                  {%- set pref_primary_tint_mix_pct = 14 -%}  {#-- 0-100: percent of var(--primary-color) mixed into header background when fill is enabled. --#}

                  {%- set pref_show_header_background = true -%}  {#-- Set to false to remove header background fill. Allowed: true, false. --#}

                  {%- set pref_show_header_thin_border = true -%}  {#-- Set to false to remove the thin outer border line. Accent borders unaffected. Allowed: true, false. --#}


                  {#-- 2. Dynamic Lookups & Validations --#}

                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  << template_shared.chore_engine/context_v1 >>

                    << template_shared.chore_engine/prepare_groups_v1 >>

                    << template_shared.chore_engine/header_v1 >>

                    {%- if not header_collapsed -%}
                      << template_shared.chore_engine/settings_panel_v1 >>

                      {%- set chore_row_template_name = 'chore_row_kids_v1' if effective_row_variant == 'kids' else 'chore_row_timeline_v1' -%}
                      {%- if effective_row_variant == 'kids' -%}
                        << template_shared.chore_engine/group_render_v1 >>
                      {%- else -%}
                        << template_shared.chore_engine/group_render_timeline_v1 >>
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}

    - type: grid
      column_span: 1
      cards:
        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== SHOWCASE CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- 1. User configuration --#}

                  << template_snippets.user_override_helper >>

                  {%- set pref_primary_tint_mix_pct = 14 -%}

                  {%- set pref_show_header_background = true -%}

                  {%- set pref_show_header_thin_border = true -%}

                  {%- set pref_hide_penalties = false -%}

                  {%- set pref_hide_overviews = false -%}


                  {#-- 2. Dynamic lookups & validations --#}

                  {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
                  {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
                  {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
                  {%- if pref_primary_tint_mix_pct < 0 -%}
                    {%- set pref_primary_tint_mix_pct = 0 -%}
                  {%- elif pref_primary_tint_mix_pct > 100 -%}
                    {%- set pref_primary_tint_mix_pct = 100 -%}
                  {%- endif -%}

                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  {%- if not skip_render -%}

                    {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') or {} -%}
                    {%- set points_sensor = core_sensors.get('points_eid') -%}
                    {%- set all_time_sensor = core_sensors.get('chores_eid') -%}
                    {%- set highest_badge_entity = core_sensors.get('badges_eid') -%}
                    {%- set translation_sensor = (state_attr(dashboard_helper, 'dashboard_helpers') or {}).get('translation_sensor_eid') -%}
                    {%- set ui = (state_attr(translation_sensor, 'ui_translations') if translation_sensor else {}) or {} -%}
                    {%- set gamification_enabled = state_attr(dashboard_helper, 'gamification_enabled') | default(false, true) -%}
                    {%- set ui_control = state_attr(dashboard_helper, 'ui_control') | default({}, true) -%}
                    {%- set ui_control_key_root = 'gamification/showcase' -%}
                    {%- set ui_control_key_settings_open = ui_control_key_root ~ '/settings_open' -%}
                    {%- set ui_control_key_hide_penalties = ui_control_key_root ~ '/hide_penalties' -%}
                    {%- set ui_control_key_hide_overviews = ui_control_key_root ~ '/hide_overviews' -%}
                    {%- set ui_root = namespace(current=ui_control if ui_control is mapping else {}) -%}
                    {%- for segment in ui_control_key_root.split('/') -%}
                      {%- if ui_root.current is mapping -%}
                        {%- set ui_root.current = ui_root.current.get(segment, {}) -%}
                      {%- else -%}
                        {%- set ui_root.current = {} -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set settings_open = ui_root.current.get('settings_open', false) if ui_root.current is mapping else false -%}
                    {%- set settings_open = (settings_open | string | lower) == 'true' -%}
                    {%- set effective_hide_penalties = ui_root.current.get('hide_penalties', pref_hide_penalties) if ui_root.current is mapping else pref_hide_penalties -%}
                    {%- set effective_hide_penalties = (effective_hide_penalties | string | lower) == 'true' -%}
                    {%- set effective_hide_overviews = ui_root.current.get('hide_overviews', pref_hide_overviews) if ui_root.current is mapping else pref_hide_overviews -%}
                    {%- set effective_hide_overviews = (effective_hide_overviews | string | lower) == 'true' -%}
                    {%- set integration_entry_id = state_attr(dashboard_helper, 'integration_entry_id') -%}
                    {%- set dashboard_helper_user_id = state_attr(dashboard_helper, 'user_id') -%}
                    {%- set badge_list = state_attr(dashboard_helper, 'badges') | default([], true) -%}
                    {%- set achievement_list = state_attr(dashboard_helper, 'achievements') | default([], true) -%}
                    {%- set bonus_list = state_attr(dashboard_helper, 'bonuses') | default([], true) -%}
                    {%- set penalty_list = state_attr(dashboard_helper, 'penalties') | default([], true) -%}
                    {%- set highest_badge_attrs = states[highest_badge_entity].attributes | default({}, true) if highest_badge_entity else {} -%}

                      {%- set points_value = (states(points_sensor) | float(default=0)) if points_sensor else 0 -%}
                      {%- set points_earned_all_time_value = (state_attr(points_sensor, 'point_stat_points_earned_all_time') | float(default=0)) if points_sensor else 0 -%}
                    {%- set points_label = (state_attr(points_sensor, 'unit_of_measurement') if points_sensor else None) or 'Points' -%}
                    {%- set points_icon = (state_attr(points_sensor, 'icon') if points_sensor else None) or 'mdi:star-circle' -%}
                    {%- set points_multiplier = (state_attr(points_sensor, 'points_multiplier') | float(default=1)) if points_sensor else 1 -%}
                    {%- set all_time_completed = (state_attr(all_time_sensor, 'chore_stat_approved_all_time') | int(default=0)) if all_time_sensor else 0 -%}
                    {%- set highest_badge = ((states(highest_badge_entity) if highest_badge_entity else 'None') or 'None') -%}
                    {%- set highest_badge_icon = (state_attr(highest_badge_entity, 'icon') if highest_badge_entity else None) or 'mdi:medal-outline' -%}
                    {%- set highest_badge_display = ui.get('none', 'err-none') if highest_badge in ['None', 'unknown', 'Unknown', 'unavailable'] else highest_badge -%}
                    {%- set points_multiplier_text = ('%.2f' | format(points_multiplier)) | regex_replace('\.?0+$', '') -%}
                    {%- set points_value = points_value | round(2) -%}
                    {%- set points_earned_all_time_value = points_earned_all_time_value | round(2) -%}
                    {%- if pref_points_precision == 'adaptive' -%}
                      {%- set points_display = ((points_value | int) | string) if points_value == (points_value | int) else (('%.1f' | format(points_value)) if points_value == (points_value | round(1)) else ('%.2f' | format(points_value))) -%}
                      {%- set points_earned_all_time_display = ((points_earned_all_time_value | int) | string) if points_earned_all_time_value == (points_earned_all_time_value | int) else (('%.1f' | format(points_earned_all_time_value)) if points_earned_all_time_value == (points_earned_all_time_value | round(1)) else ('%.2f' | format(points_earned_all_time_value))) -%}
                    {%- elif pref_points_precision == 'fixed_1' -%}
                      {%- set points_display = '%.1f' | format(points_value) -%}
                      {%- set points_earned_all_time_display = '%.1f' | format(points_earned_all_time_value) -%}
                    {%- elif pref_points_precision == 'fixed_2' -%}
                      {%- set points_display = '%.2f' | format(points_value) -%}
                      {%- set points_earned_all_time_display = '%.2f' | format(points_earned_all_time_value) -%}
                    {%- else -%}
                      {%- set points_display = (points_value | round(0) | int) | string -%}
                      {%- set points_earned_all_time_display = (points_earned_all_time_value | round(0) | int) | string -%}
                    {%- endif -%}
                    {%- set safe_name = (name | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;')) -%}
                    {%- set rank_status = (highest_badge_attrs.get('badge_status', 'active') | string | lower) if highest_badge_attrs is mapping else 'active' -%}
                    {%- set rank_points_to_next = highest_badge_attrs.get('points_to_next_badge', 0) | int(default=0) if highest_badge_attrs is mapping else 0 -%}
                    {%- set rank_cycle_points = highest_badge_attrs.get('cycle_points', 0) | int(default=0) if highest_badge_attrs is mapping else 0 -%}
                    {%- set rank_maintenance_required = highest_badge_attrs.get('maintenance_points_required', 0) | int(default=0) if highest_badge_attrs is mapping else 0 -%}
                    {%- set rank_maintenance_remaining = highest_badge_attrs.get('maintenance_points_remaining', 0) | int(default=0) if highest_badge_attrs is mapping else 0 -%}
                    {%- set current_rank_eid = highest_badge_attrs.get('current_badge_eid') | default('', true) if highest_badge_attrs is mapping else '' -%}
                    {%- set highest_earned_rank_eid = highest_badge_attrs.get('highest_earned_badge_eid') | default('', true) if highest_badge_attrs is mapping else '' -%}
                    {%- set next_rank_eid = highest_badge_attrs.get('next_higher_badge_eid') | default('', true) if highest_badge_attrs is mapping else '' -%}
                    {%- set maintenance_rank_eid = highest_earned_rank_eid if rank_status == 'demoted' and highest_earned_rank_eid not in ['', 'None', 'unknown', 'unavailable', none] else current_rank_eid -%}
                    {%- set has_any_rank = current_rank_eid not in ['', 'None', 'unknown', 'unavailable', none] -%}

                    {%- set ns = namespace(earned_badges_html='', earned_badges_count=0) -%}
                    {%- for badge in badge_list -%}
                      {%- if badge is mapping -%}
                        {%- set badge_earned_raw = badge.get('earned', false) -%}
                        {%- set badge_earned = badge_earned_raw if badge_earned_raw is boolean else (badge_earned_raw | string | lower) == 'true' -%}
                        {%- if badge_earned -%}
                          {%- set badge_entity = badge.get('eid') -%}
                          {%- set badge_name_raw = ((badge.get('name') or state_attr(badge_entity, 'friendly_name') or ui.get('badge', 'err-badge')) | string | trim) -%}
                          {%- set badge_name = badge_name_raw[8:] if badge_name_raw[:8] == 'Badge - ' else badge_name_raw -%}
                          {%- set badge_name_safe = badge_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                          {%- set badge_icon = state_attr(badge_entity, 'icon') | default('mdi:medal-outline', true) -%}
                          {%- set badge_earned_count = badge.get('earned_count', 0) | int(default=0) -%}
                          {%- set badge_count_badge = "<div style='position:absolute;right:-6px;bottom:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--primary-color);border:2px solid var(--card-background-color);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--text-primary-color, #fff);line-height:1;'>x" ~ badge_earned_count|string ~ "</div>" if badge_earned_count > 0 else "<div style='position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:999px;background:var(--primary-color);border:2px solid var(--card-background-color);box-sizing:border-box;display:flex;align-items:center;justify-content:center;'><ha-icon icon='mdi:check-bold' style='width:11px;height:11px;--mdc-icon-size:11px;color:var(--text-primary-color, #fff);display:block;'></ha-icon></div>" -%}
                          {%- set ns.earned_badges_count = ns.earned_badges_count + 1 -%}
                          {%- set ns.earned_badges_html = ns.earned_badges_html ~ "<div style='width:62px;min-width:62px;flex:0 0 auto;text-align:center;'><div style='position:relative;width:46px;height:46px;margin:0 auto;border-radius:50%;background:var(--card-background-color);box-shadow:0 2px 5px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ badge_icon ~ "' style='width:24px;height:24px;--mdc-icon-size:24px;color:var(--primary-color);display:block;'></ha-icon>" ~ badge_count_badge ~ "</div><div style='margin-top:6px;font-size:9px;line-height:1.15;color:var(--secondary-text-color);white-space:normal;overflow-wrap:anywhere;'>" ~ badge_name_safe ~ "</div></div>" -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}

                    {%- set earned_badges_section = "<div style='margin-top:16px;font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--secondary-text-color);'>" ~ ui.get('all_earned_badges', 'err-all_earned_badges') ~ "</div><div style='margin-top:8px;display:flex;gap:12px;overflow-x:auto;padding:12px 6px;border-radius:14px;background:linear-gradient(180deg, color-mix(in srgb, var(--primary-color) 6%, var(--card-background-color)), color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color)));border-bottom:4px solid color-mix(in srgb, var(--primary-color) 35%, var(--divider-color));scrollbar-width:none;'>" ~ ns.earned_badges_html ~ "</div>" if ns.earned_badges_count > 0 else '' -%}

                    {%- set compact_row_base = "display:grid;grid-template-columns:18px minmax(0,max-content) minmax(0,1fr);align-items:center;column-gap:8px;padding:5px 0;" -%}
                    {%- set compact_section_base = "margin-top:12px;padding-top:10px;border-top:1px solid var(--divider-color);" -%}
                    {%- set compact_row_icon_wrap = "width:18px;height:18px;display:flex;align-items:center;justify-content:center;align-self:center;" -%}
                    {%- set compact_header_row = "display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;column-gap:8px;width:100%;margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:0.35px;text-transform:uppercase;color:var(--secondary-text-color);" -%}
                    {%- set compact_header_icon_wrap = "width:18px;height:18px;display:flex;align-items:center;justify-content:center;" -%}

                    {%- set rank_rows_html = '' -%}
                    {%- if next_rank_eid not in ['', 'None', 'unknown', 'unavailable', none] and states(next_rank_eid) not in ['unknown', 'unavailable'] -%}
                      {%- set next_rank_attrs = states[next_rank_eid].attributes | default({}, true) -%}
                      {%- set next_rank_target = next_rank_attrs.get('target') if next_rank_attrs.get('target') is mapping else {} -%}
                      {%- set next_rank_threshold = (next_rank_target.threshold_value | float(default=0)) if next_rank_target is mapping and next_rank_target else (next_rank_attrs.get('threshold_value', 0) | float(default=0)) -%}
                      {%- if next_rank_threshold > 0 -%}
                        {%- set next_rank_to_unlock = rank_points_to_next if has_any_rank else (((next_rank_threshold - points_earned_all_time_value) | float(default=0) | round(0, 'ceil')) | int) -%}
                        {%- if next_rank_to_unlock < 0 -%}{%- set next_rank_to_unlock = 0 -%}{%- endif -%}
                        {%- set next_rank_progress = next_rank_threshold - next_rank_to_unlock -%}
                        {%- if next_rank_progress < 0 -%}{%- set next_rank_progress = 0 -%}{%- endif -%}
                        {%- set next_rank_pct = (next_rank_progress / next_rank_threshold * 100) | round(0) | int -%}
                        {%- if next_rank_pct > 100 -%}{%- set next_rank_pct = 100 -%}{%- endif -%}
                        {%- set next_rank_color = 'var(--success-color)' if next_rank_pct >= 100 else 'var(--primary-color)' -%}
                        {%- set next_rank_name_raw = ((next_rank_attrs.get('badge_name') or next_rank_attrs.get('friendly_name') or ui.get('ranks', 'err-ranks')) | string | trim) -%}
                        {%- set next_rank_name = next_rank_name_raw[8:] if next_rank_name_raw[:8] == 'Badge - ' else next_rank_name_raw -%}
                        {%- set next_rank_name_safe = next_rank_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                        {%- set next_rank_icon = (next_rank_attrs.get('icon') or 'mdi:medal-outline') | string -%}
                        {%- set rank_rows_html = rank_rows_html ~ "<div style='margin-top:8px;'><div style='display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;'><span style='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary-text-color);'>" ~ next_rank_name_safe ~ "</span><span style='font-size:12px;white-space:nowrap;color:" ~ next_rank_color ~ ";'>" ~ ((next_rank_progress | round(2)) | string | regex_replace('\.?0+$', '')) ~ ' / ' ~ ((next_rank_threshold | round(2)) | string | regex_replace('\.?0+$', '')) ~ "</span></div><div style='margin-top:4px;height:8px;border-radius:999px;background:var(--divider-color);overflow:hidden;'><div style='width:" ~ next_rank_pct|string ~ "%;height:100%;background:" ~ next_rank_color ~ ";border-radius:999px;'></div></div></div>" -%}
                      {%- endif -%}
                    {%- endif -%}

                    {%- if maintenance_rank_eid not in ['', 'None', 'unknown', 'unavailable', none] and states(maintenance_rank_eid) not in ['unknown', 'unavailable'] and rank_maintenance_required > 0 and rank_maintenance_remaining > 0 -%}
                      {%- set maintenance_rank_attrs = states[maintenance_rank_eid].attributes | default({}, true) -%}
                      {%- set maintenance_rank_name_raw = ((maintenance_rank_attrs.get('badge_name') or maintenance_rank_attrs.get('friendly_name') or ui.get('maintenance', 'err-maintenance')) | string | trim) -%}
                      {%- set maintenance_rank_name = maintenance_rank_name_raw[8:] if maintenance_rank_name_raw[:8] == 'Badge - ' else maintenance_rank_name_raw -%}
                      {%- set maintenance_rank_name_safe = maintenance_rank_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                      {%- set maintenance_rank_icon = (maintenance_rank_attrs.get('icon') or 'mdi:shield-sync') | string -%}
                      {%- set maintenance_rank_pct = (rank_cycle_points / rank_maintenance_required * 100) | round(0) | int -%}
                      {%- if maintenance_rank_pct > 100 -%}{%- set maintenance_rank_pct = 100 -%}{%- endif -%}
                      {%- if maintenance_rank_pct < 0 -%}{%- set maintenance_rank_pct = 0 -%}{%- endif -%}
                      {%- set maintenance_rank_color = 'var(--warning-color)' if rank_status in ['grace', 'demoted'] else ('var(--success-color)' if rank_maintenance_remaining <= 0 else 'var(--primary-color)') -%}
                      {%- set maint_pill = (ui.get(rank_status, rank_status) | string | upper) if rank_status in ['grace', 'demoted'] else '' -%}
                      {%- set rank_rows_html = rank_rows_html ~ "<div style='margin-top:10px;padding:10px;border-radius:12px;background:color-mix(in srgb, " ~ maintenance_rank_color ~ " 8%, var(--card-background-color));border:1px solid color-mix(in srgb, " ~ maintenance_rank_color ~ " 25%, var(--divider-color));'><div style='display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;'><span style='min-width:0;display:flex;align-items:center;gap:6px;color:var(--primary-text-color);'><ha-icon icon='" ~ ('mdi:shield-alert' if maint_pill else 'mdi:shield-sync') ~ "' style='width:17px;height:17px;--mdc-icon-size:17px;color:" ~ maintenance_rank_color ~ ";display:block;flex:0 0 auto;'></ha-icon><span style='overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" ~ ui.get('maintenance', 'err-maintenance') ~ ' · ' ~ maintenance_rank_name_safe ~ "</span>" ~ ("<span style='flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:0.6px;padding:2px 8px;border-radius:999px;color:" ~ maintenance_rank_color ~ ";border:1px solid " ~ maintenance_rank_color ~ ";'>" ~ maint_pill ~ "</span>" if maint_pill else '') ~ "</span><span style='font-size:12px;white-space:nowrap;color:" ~ maintenance_rank_color ~ ";'>" ~ ((rank_cycle_points | round(2)) | string | regex_replace('\.?0+$', '')) ~ ' / ' ~ ((rank_maintenance_required | round(2)) | string | regex_replace('\.?0+$', '')) ~ "</span></div><div style='margin-top:6px;height:8px;border-radius:999px;background:var(--divider-color);overflow:hidden;'><div style='width:" ~ maintenance_rank_pct|string ~ "%;height:100%;background:" ~ maintenance_rank_color ~ ";border-radius:999px;'></div></div><div style='margin-top:5px;font-size:11px;color:var(--secondary-text-color);'>" ~ rank_maintenance_remaining|string ~ ' ' ~ ui.get('to_go', 'to go') ~ "</div></div>" -%}
                    {%- endif -%}

                    {%- set rank_progress_section = "<div style='margin-top:16px;font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--secondary-text-color);'>" ~ ui.get('ranks', 'err-ranks') ~ "</div>" ~ rank_rows_html if rank_rows_html | length > 0 else '' -%}

                    {%- set quest_ns = namespace(rows_html='', count=0) -%}
                    {%- for badge in badge_list -%}
                      {%- if badge is mapping and quest_ns.count < 3 -%}
                        {%- set quest_eid = badge.get('eid') -%}
                        {%- set quest_type = (badge.get('badge_type') | string | lower) -%}
                        {%- if quest_type in ['periodic', 'daily', 'special_occasion'] and quest_eid not in ['', 'None', 'unknown', 'unavailable', none] and states(quest_eid) not in ['unknown', 'unavailable'] -%}
                          {%- set quest_attrs = states[quest_eid].attributes | default({}, true) -%}
                          {%- set quest_status = ((quest_attrs.get('status') or badge.get('status') or 'in_progress') | string | lower) -%}
                          {%- set quest_progress = states(quest_eid) | float(default=0) -%}
                          {%- set quest_pct = 0 if quest_progress < 0 else (100 if quest_progress > 100 else (quest_progress | round(0) | int)) -%}
                          {%- set quest_start = ((quest_attrs.get('start_date') or ((quest_attrs.get('reset_schedule') if quest_attrs.get('reset_schedule') is mapping else {}).get('start_date')) or '') | string | regex_replace('T.*$', '')) -%}
                          {%- set quest_end = ((quest_attrs.get('end_date') or ((quest_attrs.get('reset_schedule') if quest_attrs.get('reset_schedule') is mapping else {}).get('end_date')) or '') | string | regex_replace('T.*$', '')) -%}
                          {%- set quest_today = now().strftime('%Y-%m-%d') -%}
                          {%- set quest_window_active = false -%}
                          {%- if quest_start | length > 0 and quest_end | length > 0 -%}
                            {%- set quest_window_active = quest_today >= quest_start and quest_today <= quest_end -%}
                          {%- elif quest_start | length > 0 -%}
                            {%- set quest_window_active = quest_today >= quest_start -%}
                          {%- elif quest_end | length > 0 -%}
                            {%- set quest_window_active = quest_today <= quest_end -%}
                          {%- endif -%}
                          {%- set quest_has_window = quest_start | length > 0 or quest_end | length > 0 -%}
                          {%- set quest_is_active = quest_window_active if quest_has_window else (quest_status in ['in_progress', 'active'] or (quest_progress > 0 and quest_progress <= 100)) -%}
                          {%- if quest_is_active and (quest_window_active or quest_status not in ['locked', 'inactive']) -%}
                            {%- set quest_name_raw = ((quest_attrs.get('badge_name') or badge.get('name') or state_attr(quest_eid, 'friendly_name') or ui.get('goals_heading', 'Goals')) | string | trim) -%}
                            {%- set quest_name = quest_name_raw[8:] if quest_name_raw[:8] == 'Badge - ' else quest_name_raw -%}
                            {%- set quest_name_safe = quest_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                            {%- set quest_icon = (quest_attrs.get('icon') or 'mdi:calendar-refresh-outline') | string -%}
                            {%- set quest_color = 'var(--success-color)' if quest_pct >= 100 else 'var(--primary-color)' -%}
                            {%- set quest_ns.count = quest_ns.count + 1 -%}
                            {%- set quest_ns.rows_html = quest_ns.rows_html ~ "<div style='margin-top:8px;'><div style='display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;'><span style='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary-text-color);'>" ~ quest_name_safe ~ "</span><span style='font-size:12px;white-space:nowrap;color:" ~ quest_color ~ ";'>" ~ quest_pct|string ~ '%' ~ "</span></div><div style='margin-top:4px;height:8px;border-radius:999px;background:var(--divider-color);overflow:hidden;'><div style='width:" ~ quest_pct|string ~ "%;height:100%;background:" ~ quest_color ~ ";border-radius:999px;'></div></div></div>" -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set quest_progress_section = "<div style='margin-top:16px;font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--secondary-text-color);'>" ~ ui.get('goals_heading', 'Goals') ~ "</div>" ~ quest_ns.rows_html if quest_ns.rows_html | length > 0 else '' -%}

                    {#-- ACHIEVEMENTS: given by an approver, shown as gold-framed badges (newest first) --#}
                    {%- set ach_ns = namespace(items=[]) -%}
                    {%- for achievement in achievement_list -%}
                      {%- if achievement is mapping -%}
                        {%- set ach_eid = achievement.get('eid') -%}
                        {%- if ach_eid not in ['', 'None', 'unknown', 'unavailable', none] and states(ach_eid) not in ['unknown', 'unavailable'] -%}
                          {%- set ach_attrs = states[ach_eid].attributes | default({}, true) -%}
                          {%- set ach_count = ach_attrs.get('award_count', 0) | int(default=0) -%}
                          {%- if ach_count > 0 -%}
                            {%- set ach_ns.items = ach_ns.items + [{'name': ((ach_attrs.get('achievement_name') or achievement.get('name') or '') | string | trim), 'icon': ((ach_attrs.get('icon') or 'mdi:trophy') | string), 'count': ach_count, 'last': ((ach_attrs.get('last_awarded') or '') | string)}] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set ach_tiles = namespace(v='') -%}
                    {%- for ach in (ach_ns.items | sort(attribute='last', reverse=true))[:6] -%}
                      {%- set ach_icon_html = ("<ha-icon icon='" ~ ach.icon ~ "' style='--mdc-icon-size:26px;width:26px;height:26px;color:#d4a017;'></ha-icon>") if ach.icon[:4] == 'mdi:' else "<span style='font-size:24px;line-height:1;'>🏆</span>" -%}
                      {%- set ach_pill = ("<div style='position:absolute;top:-4px;right:2px;padding:1px 6px;border-radius:999px;background:#d4a017;color:#fff;font-size:10px;font-weight:800;line-height:1.3;'>×" ~ ach.count ~ "</div>") if ach.count > 1 else '' -%}
                      {%- set ach_tiles.v = ach_tiles.v ~ "<div style='position:relative;width:64px;text-align:center;'><div style='width:48px;height:48px;margin:0 auto 3px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--secondary-background-color);border:3px solid #d4a017;box-shadow:0 0 0 3px rgba(246,211,101,0.3);'>" ~ ach_icon_html ~ "</div>" ~ ach_pill ~ "<div style='font-size:10.5px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;'>" ~ (ach.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;')) ~ "</div></div>" -%}
                    {%- endfor -%}
                    {%- set achievement_progress_section = ("<div style='margin-top:16px;font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--secondary-text-color);'>" ~ ui.get('achievements', 'err-achievements') ~ "</div><div style='display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;'>" ~ ach_tiles.v ~ "</div>") if ach_tiles.v | length > 0 else '' -%}

                    {%- set bonus_ns = namespace(rows_html='', count=0, total_points=0, total_applied=0) -%}
                    {%- for bonus in bonus_list | sort(attribute='applied', reverse=true) -%}
                      {%- if bonus is mapping -%}
                        {%- set bonus_applied = bonus.get('applied', 0) | int(default=0) -%}
                        {%- set bonus_points = bonus.get('points', 0) | int(default=0) -%}
                        {%- if bonus_applied > 0 -%}
                          {%- set bonus_ns.total_applied = bonus_ns.total_applied + bonus_applied -%}
                          {%- set bonus_ns.total_points = bonus_ns.total_points + (bonus_points * bonus_applied) -%}
                        {%- endif -%}
                        {%- if bonus_applied > 0 and bonus_ns.count < 2 -%}
                          {%- set bonus_name = ((bonus.get('name') or ui.get('bonus', 'err-bonus')) | string | trim) -%}
                          {%- set bonus_name_safe = bonus_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                          {%- set bonus_ns.count = bonus_ns.count + 1 -%}
                          {%- set bonus_button_eid = bonus.get('eid') if bonus is mapping else none -%}
                          {%- set bonus_icon = (state_attr(bonus_button_eid, 'icon') if bonus_button_eid else none) | default('mdi:gift', true) -%}
                          {%- set bonus_icon_html = "<ha-icon icon='" ~ bonus_icon ~ "' style='width:15px;height:15px;color:var(--success-color);transform:translateY(-4px);'></ha-icon>" if bonus_icon[:4] == 'mdi:' else "<span style='font-size:13px;line-height:1;color:var(--success-color);transform:translateY(-2px);'>✨</span>" -%}
                          {%- set bonus_ns.rows_html = bonus_ns.rows_html ~ "<div style='display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;'><span style='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary-text-color);'>" ~ bonus_name_safe ~ "</span><b style='color:var(--secondary-text-color);'>x" ~ bonus_applied|string ~ "</b></div>" -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}

                    {%- set penalty_ns = namespace(rows_html='', count=0, total_points=0, total_applied=0) -%}
                    {%- for penalty in penalty_list | sort(attribute='applied', reverse=true) -%}
                      {%- if penalty is mapping -%}
                        {%- set penalty_applied = penalty.get('applied', 0) | int(default=0) -%}
                        {%- set penalty_points = penalty.get('points', 0) | int(default=0) -%}
                        {%- if penalty_applied > 0 -%}
                          {%- set penalty_ns.total_applied = penalty_ns.total_applied + penalty_applied -%}
                          {%- set penalty_ns.total_points = penalty_ns.total_points + (penalty_points * penalty_applied) -%}
                        {%- endif -%}
                        {%- if penalty_applied > 0 and penalty_ns.count < 2 -%}
                          {%- set penalty_name = ((penalty.get('name') or ui.get('penalty', 'err-penalty')) | string | trim) -%}
                          {%- set penalty_name_safe = penalty_name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                          {%- set penalty_ns.count = penalty_ns.count + 1 -%}
                          {%- set penalty_icon = (penalty.get('icon') or 'mdi:alert-octagon-outline') | string -%}
                          {%- set penalty_ns.rows_html = penalty_ns.rows_html ~ "<div style='display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;'><span style='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary-text-color);'>" ~ penalty_name_safe ~ "</span><b style='color:var(--secondary-text-color);'>x" ~ penalty_applied|string ~ "</b></div>" -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}

                    {%- set bonus_card_html = "<div style='padding:10px;border-radius:14px;background:color-mix(in srgb, var(--success-color) 8%, var(--card-background-color));overflow:hidden;'><div style='display:flex;justify-content:space-between;align-items:baseline;gap:6px;'><span style='font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--success-color);'>" ~ ui.get('bonus', 'err-bonus') ~ "</span><span style='font-size:13px;font-weight:800;color:var(--success-color);'>+" ~ ((bonus_ns.total_points | abs | round(0) | int) | string) ~ "</span></div>" ~ (bonus_ns.rows_html if bonus_ns.rows_html | length > 0 else "<div style='margin-top:4px;font-size:12px;color:var(--secondary-text-color);opacity:0.8;'>" ~ ui.get('none', 'err-none') ~ "</div>") ~ "</div>" -%}
                    {%- set penalty_card_html = "<div style='padding:10px;border-radius:14px;background:color-mix(in srgb, var(--error-color) 7%, var(--card-background-color));overflow:hidden;'><div style='display:flex;justify-content:space-between;align-items:baseline;gap:6px;'><span style='font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--error-color);'>" ~ ui.get('penalty', 'err-penalty') ~ "</span><span style='font-size:13px;font-weight:800;color:var(--error-color);'>-" ~ ((penalty_ns.total_points | abs | round(0) | int) | string) ~ "</span></div>" ~ (penalty_ns.rows_html if penalty_ns.rows_html | length > 0 else "<div style='margin-top:4px;font-size:12px;color:var(--secondary-text-color);opacity:0.8;'>" ~ ui.get('none', 'err-none') ~ "</div>") ~ "</div>" -%}
                    {%- set adjustment_section = "<div style='margin-top:16px;display:grid;grid-template-columns:" ~ ('minmax(0,1fr)' if effective_hide_penalties else 'repeat(2,minmax(0,1fr))') ~ ";gap:10px;align-items:stretch;'>" ~ bonus_card_html ~ ('' if effective_hide_penalties else penalty_card_html) ~ "</div>" -%}

                    {%- set highest_badge_line = "<div style='margin-top:10px;display:inline-block;max-width:100%;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ ui.get('highest_rank', 'err-highest_rank') ~ ": " ~ (highest_badge_display | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;')) ~ "</div>" if highest_badge_display != ui.get('none', 'err-none') else '' -%}
                    {%- set content_html = "<div style='width:100%;box-sizing:border-box;'><div style='padding:16px 16px 56px;border-radius:14px;background:linear-gradient(135deg, var(--primary-color), color-mix(in srgb, var(--primary-color) 55%, #1a237e));color:#fff;'><div style='padding-right:40px;font-size:14px;font-weight:700;opacity:0.92;'>" ~ safe_name ~ "'s " ~ ui.get('showcase', 'err-showcase') ~ "</div><div style='margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;'><div style='min-width:0;'><div style='display:flex;align-items:center;gap:8px;font-size:40px;font-weight:800;line-height:1;'><ha-icon icon='" ~ points_icon ~ "' style='width:32px;height:32px;--mdc-icon-size:32px;color:#fff;display:block;flex:0 0 auto;'></ha-icon><span>" ~ points_earned_all_time_display ~ "</span></div><div style='margin-top:4px;font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;opacity:0.85;'>" ~ ui.get('total_earned', 'err-total_earned') ~ "</div></div><div style='width:68px;height:68px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);box-sizing:border-box;display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ highest_badge_icon ~ "' style='width:36px;height:36px;--mdc-icon-size:36px;color:#fff;display:block;'></ha-icon></div></div>" ~ highest_badge_line ~ "</div><div style='margin:-36px 10px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative;'><div style='padding:12px 8px;border-radius:14px;background:var(--card-background-color);box-shadow:0 2px 8px rgba(0,0,0,.12);text-align:center;'><div style='font-size:20px;font-weight:800;line-height:1.1;color:" ~ 'var(--primary-text-color)' ~ ";'>" ~ all_time_completed|string ~ "</div><div style='margin-top:3px;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;color:var(--secondary-text-color);line-height:1.2;'>" ~ ui.get('chores_completed', 'err-chores_completed') ~ "</div></div><div style='padding:12px 8px;border-radius:14px;background:var(--card-background-color);box-shadow:0 2px 8px rgba(0,0,0,.12);text-align:center;'><div style='font-size:20px;font-weight:800;line-height:1.1;color:" ~ ('var(--warning-color)' if points_multiplier > 1 else 'var(--primary-text-color)') ~ ";'>" ~ 'x' ~ points_multiplier_text ~ "</div><div style='margin-top:3px;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;color:var(--secondary-text-color);line-height:1.2;'>" ~ ui.get('multiplier', 'err-multiplier') ~ "</div></div></div>" ~ earned_badges_section ~ ('' if effective_hide_overviews else rank_progress_section ~ quest_progress_section ~ achievement_progress_section ~ adjustment_section) ~ "</div>" -%}

                    {%- if gamification_enabled -%}
                      {{
                        {
                          'type': 'custom:button-card',
                          'entity': points_sensor if points_sensor else all_time_sensor,
                          'show_name': false,
                          'show_icon': false,
                          'tap_action': {'action': 'none'},
                          'hold_action': {'action': 'none'},
                          'custom_fields': {
                            'content': content_html,
                            'gear': {
                              'card': {
                                'type': 'custom:button-card',
                                'icon': 'mdi:cog-outline',
                                'show_name': false,
                                'show_icon': true,
                                'tap_action': ({
                                  'action': 'call-service',
                                  'service': 'choreops.manage_ui_control',
                                  'data': {
                                    'config_entry_id': integration_entry_id,
                                    'user_id': dashboard_helper_user_id,
                                    'ui_control_action': 'remove',
                                    'key': ui_control_key_settings_open
                                  }
                                } if settings_open and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                  'action': 'call-service',
                                  'service': 'choreops.manage_ui_control',
                                  'data': {
                                    'config_entry_id': integration_entry_id,
                                    'user_id': dashboard_helper_user_id,
                                    'ui_control_action': 'update',
                                    'key': ui_control_key_settings_open,
                                    'value': true
                                  }
                                } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                  'action': 'none'
                                }),
                                'hold_action': {'action': 'none'},
                                'styles': {
                                  'card': [
                                    {'width': '30px'},
                                    {'height': '30px'},
                                    {'border-radius': '50%'},
                                    {'background': 'rgba(255,255,255,0.22)'},
                                    {'border': '1px solid rgba(255,255,255,0.6)'},
                                    {'box-shadow': 'none'}
                                  ],
                                  'icon': [
                                    {'width': '16px'},
                                    {'color': '#ffffff'}
                                  ]
                                }
                              }
                            },
                            'settings': ({
                              'card': {
                                'type': 'vertical-stack',
                                'cards': [
                                  {
                                    'type': 'custom:button-card',
                                    'name': ui.get('configure', 'err-configure'),
                                    'icon': 'mdi:tune-variant',
                                    'show_name': true,
                                    'show_icon': true,
                                    'tap_action': {'action': 'none'},
                                    'styles': {
                                      'card': [
                                        {'background': 'var(--secondary-background-color)'},
                                        {'box-shadow': 'none'},
                                        {'border': '1px solid var(--divider-color)'},
                                        {'border-radius': '12px 12px 0 0'},
                                        {'padding': '8px 12px 6px 12px'}
                                      ],
                                      'grid': [
                                        {'grid-template-areas': '"i n"'},
                                        {'grid-template-columns': 'min-content 1fr'},
                                        {'column-gap': '6px'},
                                        {'align-items': 'center'}
                                      ],
                                      'icon': [
                                        {'width': '16px'},
                                        {'color': 'var(--primary-color)'}
                                      ],
                                      'name': [
                                        {'justify-self': 'start'},
                                        {'font-size': '12px'},
                                        {'font-weight': '700'},
                                        {'text-transform': 'uppercase'},
                                        {'letter-spacing': '0.6px'},
                                        {'color': 'var(--primary-text-color)'}
                                      ]
                                    }
                                  },
                                  {
                                    'type': 'grid',
                                    'columns': 2,
                                    'square': false,
                                    'cards': [
                                      {
                                        'type': 'custom:button-card',
                                        'name': ui.get('show_penalties', 'Show Penalties') if effective_hide_penalties else ui.get('hide_penalties', 'Hide Penalties'),
                                        'icon': 'mdi:alert-octagon-outline' if effective_hide_penalties else 'mdi:alert-octagon',
                                        'show_name': true,
                                        'show_icon': true,
                                        'tap_action': ({
                                          'action': 'call-service',
                                          'service': 'choreops.manage_ui_control',
                                          'data': {
                                            'config_entry_id': integration_entry_id,
                                            'user_id': dashboard_helper_user_id,
                                            'ui_control_action': 'remove',
                                            'key': ui_control_key_hide_penalties
                                          }
                                        } if (not effective_hide_penalties) == pref_hide_penalties and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                          'action': 'call-service',
                                          'service': 'choreops.manage_ui_control',
                                          'data': {
                                            'config_entry_id': integration_entry_id,
                                            'user_id': dashboard_helper_user_id,
                                            'ui_control_action': 'update',
                                            'key': ui_control_key_hide_penalties,
                                            'value': (not effective_hide_penalties)
                                          }
                                        } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                          'action': 'none'
                                        }),
                                        'styles': {
                                          'card': [
                                            {'background': ('color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))') if effective_hide_penalties else 'var(--card-background-color)'},
                                            {'box-shadow': 'none'},
                                            {'border': '1px solid var(--primary-color)' if effective_hide_penalties else '1px solid var(--divider-color)'},
                                            {'border-radius': '0 0 0 12px'},
                                            {'padding': '10px 8px'}
                                          ],
                                          'grid': [
                                            {'grid-template-areas': '"i" "n"'},
                                            {'grid-template-columns': '1fr'},
                                            {'row-gap': '4px'}
                                          ],
                                          'icon': [
                                            {'width': '18px'},
                                            {'color': 'var(--primary-color)'}
                                          ],
                                          'name': [
                                            {'font-size': '12px'},
                                            {'font-weight': '700'},
                                            {'color': 'var(--primary-text-color)'},
                                            {'white-space': 'normal'},
                                            {'line-height': '1.2'}
                                          ]
                                        }
                                      },
                                      {
                                        'type': 'custom:button-card',
                                        'name': ui.get('show_overviews', 'Show Overviews') if effective_hide_overviews else ui.get('hide_overviews', 'Hide Overviews'),
                                        'icon': 'mdi:view-dashboard-outline' if effective_hide_overviews else 'mdi:view-dashboard',
                                        'show_name': true,
                                        'show_icon': true,
                                        'tap_action': ({
                                          'action': 'call-service',
                                          'service': 'choreops.manage_ui_control',
                                          'data': {
                                            'config_entry_id': integration_entry_id,
                                            'user_id': dashboard_helper_user_id,
                                            'ui_control_action': 'remove',
                                            'key': ui_control_key_hide_overviews
                                          }
                                        } if (not effective_hide_overviews) == pref_hide_overviews and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                          'action': 'call-service',
                                          'service': 'choreops.manage_ui_control',
                                          'data': {
                                            'config_entry_id': integration_entry_id,
                                            'user_id': dashboard_helper_user_id,
                                            'ui_control_action': 'update',
                                            'key': ui_control_key_hide_overviews,
                                            'value': (not effective_hide_overviews)
                                          }
                                        } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                          'action': 'none'
                                        }),
                                        'styles': {
                                          'card': [
                                            {'background': ('color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))') if effective_hide_overviews else 'var(--card-background-color)'},
                                            {'box-shadow': 'none'},
                                            {'border': '1px solid var(--primary-color)' if effective_hide_overviews else '1px solid var(--divider-color)'},
                                            {'border-radius': '0 0 12px 0'},
                                            {'padding': '10px 8px'}
                                          ],
                                          'grid': [
                                            {'grid-template-areas': '"i" "n"'},
                                            {'grid-template-columns': '1fr'},
                                            {'row-gap': '4px'}
                                          ],
                                          'icon': [
                                            {'width': '18px'},
                                            {'color': 'var(--primary-color)'}
                                          ],
                                          'name': [
                                            {'font-size': '12px'},
                                            {'font-weight': '700'},
                                            {'color': 'var(--primary-text-color)'},
                                            {'white-space': 'normal'},
                                            {'line-height': '1.2'}
                                          ]
                                        }
                                      }
                                    ]
                                  }
                                ]
                              }
                            } if settings_open else '')
                          },
                          'styles': {
                            'card': [
                              {'background': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--card-background-color))') if pref_show_header_background else 'transparent'},
                              {'box-shadow': 'none'},
                              {'border': '1px solid color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--divider-color))' if pref_show_header_thin_border else 'none'},
                              {'border-radius': '16px'},
                              {'padding': '16px'},
                              {'overflow': 'hidden'},
                              {'position': 'relative'},
                              {'aspect-ratio': 'auto'},
                              {'height': 'auto'},
                              {'min-height': 'unset'}
                            ],
                            'grid': [
                              {'grid-template-areas': '"content" "settings"' if settings_open else '"content"'},
                              {'grid-template-columns': '1fr'},
                              {'row-gap': '0px'},
                              {'align-items': 'start'}
                            ],
                            'custom_fields': {
                              'content': [{'width': '100%'}, {'text-align': 'left'}, {'align-self': 'stretch'}],
                              'gear': [
                                {'position': 'absolute'},
                                {'top': '26px'},
                                {'right': '26px'},
                                {'z-index': '2'}
                              ],
                              'settings': [{'width': '100%'}, {'margin-top': '10px' if settings_open else '0px'}]
                            }
                          }
                        }
                      }},
                    {%- endif -%}
                  {%- endif -%}


        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== REWARDS CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- 1. User Configuration --#}

                  << template_snippets.user_override_helper >>

                  {%- set pref_column_count = 1 -%}

                  {%- set pref_use_label_grouping = false -%}

                  {%- set pref_exclude_label_list = [] -%}  {#-- Example: ['junk_label', 'skip_this'] --#}

                  {%- set pref_label_display_order = [] -%}  {#-- Example: ['Toys', 'Snacks', 'Activities'] --#}

                  {%- set pref_sort_rewards = 'default' -%}  {#-- Options: 'default', 'name_asc', 'name_desc', 'cost_asc', 'cost_desc' --#}

                  {%- set pref_show_reward_description = true -%}

                  {%- set pref_default_header_collapsed = false -%}

                  {%- set pref_claim_accent = '#a957fa' -%}  {#-- Accent color for requested reward state and actions. --#}

                  {%- set pref_pool_accent = '#8b5cf6' -%}  {#-- Accent color for family pool rewards that are still being filled. --#}

                  {%- set pref_primary_tint_mix_pct = 14 -%}  {#-- Percent of var(--primary-color) mixed into the main Rewards header background when fill is enabled. Allowed: 0-100. --#}

                  {%- set pref_show_header_background = true -%}  {#-- Set to false to remove the main Rewards header background fill and leave it transparent. Allowed: true, false. --#}

                  {%- set pref_show_header_thin_border = true -%}  {#-- Set to false to remove the thin outer border line. Accent borders are unaffected. Allowed: true, false. --#}


                  {#-- Type coercion for preferences --#}
                  {%- set pref_column_count = pref_column_count | int(default=1) -%}
                  {%- set pref_use_label_grouping = (pref_use_label_grouping | default('false') | string | lower) == 'true' -%}
                  {%- set pref_exclude_label_list = pref_exclude_label_list if pref_exclude_label_list is iterable and pref_exclude_label_list is not string else [] -%}
                  {%- set pref_label_display_order = pref_label_display_order if pref_label_display_order is iterable and pref_label_display_order is not string else [] -%}
                  {%- set pref_show_reward_description = (pref_show_reward_description | default('true') | string | lower) == 'true' -%}
                  {%- set pref_default_header_collapsed = (pref_default_header_collapsed | default('false') | string | lower) == 'true' -%}
                  {%- set pref_claim_accent = pref_claim_accent | default('#a957fa', true) | string -%}
                  {%- set pref_pool_accent = pref_pool_accent | default('#8b5cf6', true) | string -%}
                  {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
                  {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
                  {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
                  {%- if pref_primary_tint_mix_pct < 0 -%}
                    {%- set pref_primary_tint_mix_pct = 0 -%}
                  {%- elif pref_primary_tint_mix_pct > 100 -%}
                    {%- set pref_primary_tint_mix_pct = 100 -%}
                  {%- endif -%}

                  {#-- 2. Dynamic Lookups & Validations --#}

                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  {%- if not skip_render -%}

                    {#-- 3. Initialize Variables --#}

                  {%- set ns = namespace(
                    all_labels=[],
                    label_order=[],
                    label_groups=[],
                    temp_label_rewards=[],
                    sorted_groups=[],
                    temp_list=[],
                    filtered_rewards=[],
                    group_cards=[]
                  ) -%}

                    {#-- 4. Collect Data --#}
                    {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') or {} -%}
                    {%- set points_sensor = core_sensors.get('points_eid') -%}
                    {%- set translation_sensor = (state_attr(dashboard_helper, 'dashboard_helpers') or {}).get('translation_sensor_eid') -%}
                    {%- set ui = state_attr(translation_sensor, 'ui_translations') if translation_sensor else {} -%}
                    {%- set points_label = (state_attr(points_sensor, 'unit_of_measurement') if points_sensor else None) or 'Points' -%}
                    {%- set points_icon = (state_attr(points_sensor, 'icon') if points_sensor else None) or 'mdi:star-circle' -%}
                    {%- set gamification_enabled = state_attr(dashboard_helper, 'gamification_enabled') | default(false, true) -%}
                    {%- set reward_list = state_attr(dashboard_helper, 'rewards') | default([], true) -%}
                    {%- set current_points = (states(points_sensor) | int(default=0)) if points_sensor else 0 -%}
                    {%- set ui_control = state_attr(dashboard_helper, 'ui_control') | default({}, true) -%}
                    {%- set ui_control_key_root = 'gamification/rewards' -%}
                    {%- set ui_control_key_header_collapsed = ui_control_key_root ~ '/header_collapse' -%}
                    {%- set ui_root = namespace(current=ui_control if ui_control is mapping else {}) -%}
                    {%- for segment in ui_control_key_root.split('/') -%}
                      {%- if ui_root.current is mapping -%}
                        {%- set ui_root.current = ui_root.current.get(segment, {}) -%}
                      {%- else -%}
                        {%- set ui_root.current = {} -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set header_collapsed = ui_root.current.get('header_collapse', pref_default_header_collapsed) if ui_root.current is mapping else pref_default_header_collapsed -%}
                    {%- set header_collapsed = header_collapsed | default(pref_default_header_collapsed, true) -%}
                    {%- set integration_entry_id = state_attr(dashboard_helper, 'integration_entry_id') -%}
                    {%- set dashboard_helper_user_id = state_attr(dashboard_helper, 'user_id') -%}

                    {#-- Apply label exclusion filter (works regardless of grouping setting) --#}
                    {%- if pref_exclude_label_list | length > 0 -%}
                      {%- for reward in reward_list -%}
                        {%- set reward_labels = reward.labels | default([], true) if reward is mapping else [] -%}
                        {%- set has_excluded = reward_labels | select('in', pref_exclude_label_list) | list | length > 0 -%}
                        {%- if not has_excluded -%}
                          {%- set ns.filtered_rewards = ns.filtered_rewards + [reward] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set reward_list = ns.filtered_rewards -%}
                    {%- endif -%}

                    {#-- 5. Build Display Groups --#}
                    {%- if pref_use_label_grouping and reward_list | length > 0 -%}
                      {%- for reward in reward_list -%}
                        {%- set reward_labels = reward.labels | default([], true) if reward is mapping else [] -%}
                        {%- if reward_labels | length == 0 -%}
                          {%- set ns.all_labels = ns.all_labels + ['-No Label-'] -%}
                        {%- else -%}
                          {%- set ns.all_labels = ns.all_labels + reward_labels -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set ns.all_labels = ns.all_labels | unique | list | sort -%}

                      {%- if pref_label_display_order | length > 0 -%}
                        {%- set ns.label_order = pref_label_display_order -%}
                        {%- set remaining = ns.all_labels | reject('in', pref_label_display_order) | reject('eq', '-No Label-') | list -%}
                        {%- set ns.label_order = ns.label_order + remaining -%}
                        {%- if '-No Label-' in ns.all_labels and '-No Label-' not in pref_label_display_order -%}
                          {%- set ns.label_order = ns.label_order + ['-No Label-'] -%}
                        {%- endif -%}
                      {%- else -%}
                        {%- set ns.label_order = ns.all_labels | reject('eq', '-No Label-') | list -%}
                        {%- if '-No Label-' in ns.all_labels -%}
                          {%- set ns.label_order = ns.label_order + ['-No Label-'] -%}
                        {%- endif -%}
                      {%- endif -%}

                      {%- set ns.label_order = ns.label_order | reject('in', pref_exclude_label_list) | list -%}

                      {%- for label in ns.label_order -%}
                        {%- set ns.temp_label_rewards = [] -%}
                        {%- for reward in reward_list -%}
                          {%- set reward_labels = reward.labels | default([], true) if reward is mapping else [] -%}
                          {%- set reward_label_check = reward_labels if reward_labels | length > 0 else ['-No Label-'] -%}
                          {%- if label in reward_label_check -%}
                            {%- set ns.temp_label_rewards = ns.temp_label_rewards + [reward] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- if ns.temp_label_rewards | length > 0 -%}
                          {%- set ns.label_groups = ns.label_groups + [{'name': label, 'rewards': ns.temp_label_rewards, 'icon': 'mdi:gift'}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}

                    {%- if ns.label_groups | length == 0 and reward_list | length > 0 -%}
                      {%- set ns.label_groups = [{'name': ui.get('rewards', 'err-rewards'), 'rewards': reward_list, 'icon': 'mdi:gift'}] -%}
                    {%- endif -%}

                    {#-- Apply sorting to each group (ported from gamification rewards card) --#}
                    {%- if pref_sort_rewards != 'default' -%}
                      {%- set ns.sorted_groups = [] -%}
                      {%- for group in ns.label_groups -%}
                        {%- if pref_sort_rewards in ['name_asc', 'name_desc'] -%}
                          {%- set ns.temp_list = [] -%}
                          {%- for reward in group.rewards -%}
                            {%- set reward_name = (reward.name | default('zzz') | lower) if reward is mapping else 'zzz' -%}
                            {%- set ns.temp_list = ns.temp_list + [[reward_name, reward]] -%}
                          {%- endfor -%}
                          {%- set sorted_list = ns.temp_list | sort -%}
                          {%- if pref_sort_rewards == 'name_desc' -%}
                            {%- set sorted_list = sorted_list | reverse | list -%}
                          {%- endif -%}
                          {%- set sorted_rewards = sorted_list | map('last') | list -%}
                          {%- set ns.sorted_groups = ns.sorted_groups + [{'name': group.name, 'rewards': sorted_rewards, 'icon': group.icon}] -%}
                        {%- elif pref_sort_rewards in ['cost_asc', 'cost_desc'] -%}
                          {%- set ns.temp_list = [] -%}
                          {%- for reward in group.rewards -%}
                            {%- set reward_cost = (reward.cost | float(default=999999)) if reward is mapping else 999999 -%}
                            {%- set ns.temp_list = ns.temp_list + [[reward_cost, reward]] -%}
                          {%- endfor -%}
                          {%- set sorted_list = ns.temp_list | sort -%}
                          {%- if pref_sort_rewards == 'cost_desc' -%}
                            {%- set sorted_list = sorted_list | reverse | list -%}
                          {%- endif -%}
                          {%- set sorted_rewards = sorted_list | map('last') | list -%}
                          {%- set ns.sorted_groups = ns.sorted_groups + [{'name': group.name, 'rewards': sorted_rewards, 'icon': group.icon}] -%}
                        {%- else -%}
                          {%- set ns.sorted_groups = ns.sorted_groups + [group] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set ns.label_groups = ns.sorted_groups -%}
                    {%- endif -%}

                    {#-- 6. Render --#}
                    {%- set can_save = integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] -%}
                    {%- set saved_filter = (ui_root.current.get('filter', 'all') if ui_root.current is mapping else 'all') | string -%}
                    {%- if gamification_enabled -%}
                      {#-- 6a. Pre-pass: how many rewards are in each state --#}
                      {%- set cnt = namespace(all=0, available=0, requested=0, locked=0, approved=0) -%}
                      {%- for group in ns.label_groups -%}
                        {%- for reward in group.rewards -%}
                          {%- set st0 = states(reward.eid) if reward is mapping else '' -%}
                          {%- set cnt.all = cnt.all + 1 -%}
                          {%- if st0 == 'available' -%}{%- set cnt.available = cnt.available + 1 -%}
                          {%- elif st0 == 'requested' -%}{%- set cnt.requested = cnt.requested + 1 -%}
                          {%- elif st0 == 'locked' -%}{%- set cnt.locked = cnt.locked + 1 -%}
                          {%- elif st0 == 'approved' -%}{%- set cnt.approved = cnt.approved + 1 -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endfor -%}
                      {%- set kinds = [] -%}
                      {%- if cnt.available > 0 -%}{%- set kinds = kinds + ['available'] -%}{%- endif -%}
                      {%- if cnt.requested > 0 -%}{%- set kinds = kinds + ['requested'] -%}{%- endif -%}
                      {%- if cnt.locked > 0 -%}{%- set kinds = kinds + ['locked'] -%}{%- endif -%}
                      {%- if cnt.approved > 0 -%}{%- set kinds = kinds + ['approved'] -%}{%- endif -%}
                      {%- set active_filter = saved_filter if saved_filter in kinds else 'all' -%}

                      {{
                        {
                          'type': 'custom:button-card',
                          'name': ui.get('rewards', 'err-rewards'),
                          'icon': 'mdi:gift-outline',
                          'show_name': true,
                          'show_icon': true,
                          'show_label': false,
                          'tap_action': ({
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {
                              'config_entry_id': integration_entry_id,
                              'user_id': dashboard_helper_user_id,
                              'ui_control_action': 'remove',
                              'key': ui_control_key_header_collapsed
                            }
                          } if header_collapsed and can_save else {
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {
                              'config_entry_id': integration_entry_id,
                              'user_id': dashboard_helper_user_id,
                              'ui_control_action': 'update',
                              'key': ui_control_key_header_collapsed,
                              'value': true
                            }
                          } if can_save else {
                            'action': 'none'
                          }),
                          'hold_action': {'action': 'none'},
                          'custom_fields': {
                            'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                          },
                          'styles': {
                            'card': [
                              {'background': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--card-background-color))') if header_collapsed else 'transparent'},
                              {'box-shadow': 'none'},
                              {'border': '1px solid var(--divider-color)' if header_collapsed else 'none'},
                              {'border-left': '3px solid var(--primary-color)'},
                              {'border-bottom': '3px solid var(--primary-color)'},
                              {'border-radius': '12px'},
                              {'padding': '10px 12px'},
                              {'min-height': 'unset'},
                              {'margin-top': '5px'},
                              {'margin-bottom': '0px'}
                            ],
                            'grid': [
                              {'grid-template-areas': '"i n toggle"'},
                              {'grid-template-columns': 'min-content 1fr min-content'},
                              {'column-gap': '5px'},
                              {'align-items': 'center'}
                            ],
                            'icon': [
                              {'width': '18px'},
                              {'transform': 'translateY(-2px)'},
                              {'color': 'var(--primary-color)'}
                            ],
                            'name': [
                              {'justify-self': 'start'},
                              {'font-size': '14px'},
                              {'font-weight': '700'},
                              {'text-transform': 'uppercase'},
                              {'letter-spacing': '0.4px'},
                              {'color': 'var(--primary-text-color)'}
                            ],
                            'custom_fields': {
                              'toggle': [
                                {'justify-self': 'end'},
                                {'align-self': 'center'}
                              ]
                            }
                          }
                        }
                      }},

                      {%- if not header_collapsed -%}
                        {%- if ns.label_groups | length == 0 -%}
                          {{
                            {
                              'type': 'custom:button-card',
                              'name': ui.get('no_rewards', 'err-no_rewards'),
                              'icon': 'mdi:gift-off-outline',
                              'show_name': true,
                              'show_icon': true,
                              'tap_action': {'action': 'none'},
                              'styles': {
                                'card': [
                                  {'background': 'var(--secondary-background-color)'},
                                  {'box-shadow': 'none'},
                                  {'border': '1px solid var(--divider-color)'},
                                  {'border-radius': '12px'},
                                  {'padding': '10px 12px'}
                                ],
                                'grid': [
                                  {'grid-template-areas': '"i n"'},
                                  {'grid-template-columns': 'min-content 1fr'},
                                  {'gap': '8px'},
                                  {'align-items': 'center'}
                                ],
                                'icon': [
                                  {'width': '18px'},
                                  {'color': 'var(--secondary-text-color)'}
                                ],
                                'name': [
                                  {'justify-self': 'start'},
                                  {'font-size': '13px'},
                                  {'font-weight': '600'},
                                  {'color': 'var(--secondary-text-color)'}
                                ]
                              }
                            }
                          }},
                        {%- else -%}

                          {#-- 6b. Summary strip --#}
                          {%- set sum_pts = ('%g' | format(current_points | round(2))) -%}
                          {%- set sum_parts = [] -%}
                          {%- if cnt.available > 0 -%}{%- set sum_parts = sum_parts + ["<b style='color:var(--primary-color);'>" ~ cnt.available ~ "</b> " ~ ui.get('available', 'available') | lower] -%}{%- endif -%}
                          {%- if cnt.requested > 0 -%}{%- set sum_parts = sum_parts + ["<b style='color:" ~ pref_claim_accent ~ ";'>" ~ cnt.requested ~ "</b> " ~ ui.get('requested', 'requested') | lower] -%}{%- endif -%}
                          {%- if cnt.locked > 0 -%}{%- set sum_parts = sum_parts + ["<b>" ~ cnt.locked ~ "</b> " ~ ui.get('locked', 'locked') | lower] -%}{%- endif -%}
                          {%- set summary = "<div style='display:flex;align-items:center;justify-content:space-between;gap:10px;'><div style='display:flex;align-items:center;gap:8px;'><ha-icon icon='" ~ points_icon ~ "' style='width:26px;height:26px;--mdc-icon-size:26px;color:var(--primary-color);'></ha-icon><div style='text-align:left;'><div style='font-size:20px;font-weight:800;line-height:1.1;color:var(--primary-text-color);'>" ~ sum_pts ~ "</div><div style='font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--secondary-text-color);'>" ~ points_label ~ "</div></div></div><div style='font-size:12px;color:var(--secondary-text-color);text-align:right;line-height:1.5;'>" ~ (sum_parts | join(' &nbsp;•&nbsp; ')) ~ "</div></div>" -%}
                          {{
                            {
                              'type': 'custom:button-card',
                              'show_name': false,
                              'show_icon': false,
                              'tap_action': {'action': 'none'},
                              'styles': {
                                'card': [{'padding': '10px 12px'}, {'border-radius': '16px'}, {'box-shadow': 'none'}],
                                'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                                'custom_fields': {'content': [{'width': '100%'}, {'justify-self': 'stretch'}]}
                              },
                              'custom_fields': {'content': summary}
                            }
                          }},

                          {#-- 6c. Filter chips (only when there is more than one kind of reward) --#}
                          {%- if kinds | length > 1 -%}
                            {%- set chips = namespace(v=[]) -%}
                            {%- for g in ['all'] + kinds -%}
                              {%- set is_sel = (g == active_filter) -%}
                              {%- set gcount = cnt.all if g == 'all' else (cnt.available if g == 'available' else (cnt.requested if g == 'requested' else (cnt.locked if g == 'locked' else cnt.approved))) -%}
                              {%- set glabel = ui.get('all', 'All') if g == 'all' else (ui.get('available', 'Available') if g == 'available' else ui.get(g, g | title)) -%}
                              {%- set chips.v = chips.v + [{
                                'type': 'custom:button-card',
                                'name': glabel ~ ' ' ~ gcount,
                                'show_icon': false,
                                'tap_action': ({
                                  'action': 'call-service',
                                  'service': 'choreops.manage_ui_control',
                                  'data': ({'config_entry_id': integration_entry_id, 'user_id': dashboard_helper_user_id, 'ui_control_action': 'remove', 'key': ui_control_key_root ~ '/filter'} if g == 'all' else {'config_entry_id': integration_entry_id, 'user_id': dashboard_helper_user_id, 'ui_control_action': 'update', 'key': ui_control_key_root ~ '/filter', 'value': g})
                                } if can_save else {'action': 'none'}),
                                'styles': {
                                  'card': [
                                    {'border-radius': '999px'},
                                    {'padding': '7px 2px'},
                                    {'box-shadow': 'none'},
                                    {'border': ('2px solid var(--primary-color)' if is_sel else '1px solid var(--divider-color)')},
                                    {'background': ('color-mix(in srgb, var(--primary-color) 22%, var(--card-background-color))' if is_sel else 'transparent')}
                                  ],
                                  'name': [
                                    {'font-size': '12px'},
                                    {'font-weight': ('800' if is_sel else '600')},
                                    {'color': ('var(--primary-text-color)' if is_sel else 'var(--secondary-text-color)')}
                                  ]
                                }
                              }] -%}
                            {%- endfor -%}
                            {{
                              {
                                'type': 'grid',
                                'columns': [chips.v | length, 3] | min,
                                'square': false,
                                'cards': chips.v
                              }
                            }},
                          {%- endif -%}

                          {#-- 6d. Reward groups and tiles --#}
                          {%- for group in ns.label_groups -%}
                            {%- set ns.group_cards = [] -%}
                            {%- set show_group_chip = (ns.label_groups | length > 1) or (group.name != ui.get('rewards', 'err-rewards')) -%}

                            {#-- sort keys: family pool rewards first, then everything by star cost (cheapest first) --#}
                            {%- set keys = namespace(v=[]) -%}
                            {%- for reward in group.rewards -%}
                              {%- set k_eid = reward.eid if reward is mapping else '' -%}
                              {%- set k_state = states(k_eid) -%}
                              {%- if active_filter == 'all' or k_state == active_filter -%}
                                {%- set k_cost = (reward.cost | float(default=0)) if reward is mapping else 0 -%}
                                {%- if state_attr(k_eid, 'pooled') | default(false, true) -%}
                                  {%- set k_have = state_attr(k_eid, 'pool_total') | float(default=0) -%}
                                {%- else -%}
                                  {%- set k_have = current_points | float(default=0) -%}
                                {%- endif -%}
                                {%- set k_pct = ([(k_have / k_cost * 100) if k_cost > 0 else 100, 100] | min) -%}
                                {%- set k_rank = 0 if k_state == 'requested' else (1 if k_state == 'available' else (2 if k_state == 'locked' else 3)) -%}
                                {%- if pref_sort_rewards == 'default' -%}
                                  {%- set k_pool = state_attr(k_eid, 'pooled') | default(false, true) -%}
                                  {%- set keys.v = keys.v + [[0 if k_pool else 1, k_cost, (reward.name | default('') | lower) if reward is mapping else '', loop.index0]] -%}
                                {%- else -%}
                                  {%- set keys.v = keys.v + [[0, 0, '', loop.index0]] -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}

                            {%- if keys.v | length > 0 and show_group_chip -%}
                              {{
                                {
                                  'type': 'custom:button-card',
                                  'name': group.name,
                                  'icon': group.icon,
                                  'show_name': true,
                                  'show_icon': true,
                                  'tap_action': {'action': 'none'},
                                  'styles': {
                                    'card': [
                                      {'background': 'var(--secondary-background-color)'},
                                      {'box-shadow': 'none'},
                                      {'border': '2px solid var(--divider-color)'},
                                      {'border-radius': '6px'},
                                      {'padding': '6px 16px'},
                                      {'min-height': 'unset'},
                                      {'margin': '0px 0px 0px 0px'}
                                    ],
                                    'grid': [
                                      {'grid-template-areas': '"i n"'},
                                      {'grid-template-columns': 'min-content 1fr'},
                                      {'gap': '0px'},
                                      {'align-items': 'center'}
                                    ],
                                    'icon': [
                                      {'width': '18px'},
                                      {'color': 'var(--primary-color)'}
                                    ],
                                    'name': [
                                      {'justify-self': 'right'},
                                      {'font-size': '12px'},
                                      {'font-weight': '800'},
                                      {'text-transform': 'uppercase'},
                                      {'letter-spacing': '0.9px'},
                                      {'color': 'var(--primary-text-color)'}
                                    ]
                                  }
                                }
                              }},
                            {%- endif -%}

                            {%- for k in keys.v | sort -%}
                              {%- set reward = group.rewards[k[3]] -%}
                              {%- set reward_name = reward.name if reward is mapping else 'Unknown' -%}
                              {%- set reward_cost = (reward.cost | float(default=0)) if reward is mapping else 0 -%}
                              {%- set reward_sensor_eid = reward.eid if reward is mapping else '' -%}
                              {%- set reward_icon = state_attr(reward_sensor_eid, 'icon') | default('mdi:gift', true) -%}
                              {%- set rname = reward_name | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                              {%- set rdesc = (state_attr(reward_sensor_eid, 'description') | default('', true)) | string | trim | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                              {%- set claim_button_eid = state_attr(reward_sensor_eid, 'claim_button_eid') | default('', true) -%}
                              {%- set approve_button_eid = state_attr(reward_sensor_eid, 'approve_button_eid') | default('', true) -%}
                              {%- set disapprove_button_eid = state_attr(reward_sensor_eid, 'disapprove_button_eid') | default('', true) -%}
                              {%- set claimed_month = (state_attr(reward_sensor_eid, 'claimed_month') | int(default=0)) -%}
                              {%- set claimed_all = (state_attr(reward_sensor_eid, 'claimed_all_time') | int(default=0)) -%}
                              {%- set last_claimed = state_attr(reward_sensor_eid, 'last_claimed') | default('', true) -%}
                              {%- set last_text = (as_timestamp(last_claimed) | timestamp_custom('%b %d')) if last_claimed not in ['', 'unknown', 'unavailable', none] else '' -%}

                              {%- set reward_state = states(reward_sensor_eid) -%}
                              {%- set state_map = {
                                'locked': ui.get('locked', 'err-locked'),
                                'available': ui.get('available', 'err-available'),
                                'requested': ui.get('requested', 'err-requested'),
                                'approved': ui.get('approved', 'err-approved')
                              } -%}
                              {%- set reward_state_display = state_map.get(reward_state, reward_state) -%}

                              {%- set primary_button_eid = '' -%}
                              {%- set primary_button_icon = 'mdi:arrow-right' -%}
                              {%- set secondary_button_eid = '' -%}
                              {%- set primary_button_is_locked = false -%}
                              {%- if reward_state == 'requested' -%}
                                {%- set primary_button_eid = approve_button_eid or claim_button_eid -%}
                                {%- set primary_button_icon = 'mdi:check-bold' -%}
                                {%- set secondary_button_eid = disapprove_button_eid -%}
                              {%- elif reward_state == 'available' -%}
                                {%- set primary_button_eid = claim_button_eid -%}
                              {%- elif reward_state == 'locked' -%}
                                {%- set primary_button_icon = 'mdi:lock-outline' -%}
                                {%- set primary_button_is_locked = true -%}
                              {%- endif -%}
                              {%- set has_primary = primary_button_eid not in ['', none] or primary_button_is_locked -%}
                              {%- set has_secondary = secondary_button_eid not in ['', none] -%}

                              {%- set accent = (
                                pref_claim_accent if reward_state == 'requested' else
                                'var(--primary-color)' if reward_state == 'available' else
                                'var(--success-color)' if reward_state == 'approved' else
                                'var(--secondary-text-color)'
                              ) -%}
                              {%- set is_pool = state_attr(reward_sensor_eid, 'pooled') | default(false, true) -%}
                              {%- if is_pool -%}
                                {%- set have = state_attr(reward_sensor_eid, 'pool_total') | float(default=0) -%}
                              {%- else -%}
                                {%- set have = current_points | float(default=0) -%}
                              {%- endif -%}
                              {%- set pct = ([(have / reward_cost * 100) if reward_cost > 0 else 100, 100] | min) | round(0) | int -%}
                              {%- if reward_state == 'approved' -%}{%- set pct = 100 -%}{%- endif -%}
                              {%- set to_go = [reward_cost - have, 0] | max -%}

                              {%- set bar_color = 'var(--success-color)' if pct >= 100 else accent -%}
                              {%- if is_pool -%}
                                {%- set pool_mine = state_attr(reward_sensor_eid, 'pool_my_contribution') | float(default=0) -%}
                                {%- set bar_label = ui.get('family_pool', 'Family pool') -%}
                                {%- set bar_value = ('%g' | format(have | round(2))) ~ ' / ' ~ ('%g' | format(reward_cost | round(2))) -%}
                                {%- set bar_note = ui.get('you', 'You') ~ ': <b>' ~ ('%g' | format(pool_mine | round(2))) ~ '</b>' ~ (' &nbsp;•&nbsp; ' ~ ('%g' | format(to_go | round(2))) ~ ' ' ~ ui.get('to_go', 'to go') if to_go > 0 else '') -%}
                              {%- else -%}
                                {%- set bar_label = ui.get('your_points', 'Your points') -%}
                                {%- set bar_value = ('%g' | format(have | round(2))) ~ ' / ' ~ ('%g' | format(reward_cost | round(2))) -%}
                                {%- if reward_state == 'locked' -%}
                                  {%- set bar_note = "<span style='font-weight:800;color:var(--primary-text-color);'>" ~ ui.get('need', 'Need') ~ ' ' ~ ('%g' | format(to_go | round(2))) ~ ' ' ~ points_label ~ ' ' ~ ui.get('more', 'more') ~ "</span>" -%}
                                {%- elif reward_state == 'requested' -%}
                                  {%- set bar_note = ui.get('waiting_for_approval', 'Waiting for approval') -%}
                                {%- elif reward_state == 'approved' -%}
                                  {%- set bar_note = '✓ ' ~ ui.get('approved', 'Approved') -%}
                                {%- else -%}
                                  {%- set bar_note = "<span style='font-weight:800;color:var(--success-color);'>✓ " ~ ui.get('you_can_claim', 'You can claim this') ~ "</span>" -%}
                                {%- endif -%}
                              {%- endif -%}

                              {%- set foot_bits = [] -%}
                              {%- if claimed_all > 0 -%}
                                {%- set foot_bits = foot_bits + ['🕒 ' ~ last_text] if last_text | length > 0 else foot_bits -%}
                                {%- set foot_bits = foot_bits + [claimed_month ~ ' ' ~ ui.get('this_month', 'this month')] + [claimed_all ~ ' ' ~ ui.get('total', 'total')] -%}
                              {%- endif -%}

                              {#-- Fill row: the card background fills to show progress; green when claimable, pool accent while a family pool is filling --#}
                              {%- set row_col = pref_claim_accent if reward_state == 'requested' else ('var(--success-color)' if (reward_state == 'approved' or pct >= 100) else (pref_pool_accent if is_pool else 'var(--primary-color)')) -%}
                              {%- set fill_pct = 100 if reward_state in ['requested', 'approved'] else pct -%}
                              {%- set status_html = (bar_label ~ " <b style='color:var(--primary-text-color);'>" ~ bar_value ~ "</b> &nbsp;&bull;&nbsp; " ~ bar_note) if is_pool else bar_note -%}
                              {%- set sub_bits = [] -%}
                              {%- if pref_show_reward_description and rdesc | length > 0 -%}{%- set sub_bits = sub_bits + [rdesc] -%}{%- endif -%}
                              {%- if foot_bits | length > 0 -%}{%- set sub_bits = sub_bits + [foot_bits | join(' &nbsp;&bull;&nbsp; ')] -%}{%- endif -%}
                              {%- set tile = "<div style='flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb, " ~ row_col ~ " 22%, transparent);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ reward_icon ~ "' style='width:22px;height:22px;--mdc-icon-size:22px;color:" ~ row_col ~ ";display:block;'></ha-icon></div>" -%}
                              {%- set cost_pill = "<div style='flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:14px;font-weight:800;color:var(--primary-text-color);'><ha-icon icon='" ~ points_icon ~ "' style='width:14px;height:14px;--mdc-icon-size:14px;color:var(--warning-color, #ffc107);display:block;'></ha-icon>" ~ ('%g' | format(reward_cost | round(2))) ~ "</div>" -%}
                              {%- set content_html = "<div style='display:flex;align-items:center;gap:10px;width:100%;text-align:left;'>" ~ tile
                                  ~ "<div style='flex:1;min-width:0;'><div style='font-size:15px;line-height:1.2;font-weight:800;color:var(--primary-text-color);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;'>" ~ rname ~ "</div>"
                                  ~ "<div style='font-size:12px;line-height:1.3;color:var(--secondary-text-color);'>" ~ status_html ~ "</div>"
                                  ~ ("<div style='font-size:11px;line-height:1.3;color:var(--secondary-text-color);opacity:0.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;'>" ~ (sub_bits | join(' &nbsp;&bull;&nbsp; ')) ~ "</div>" if sub_bits | length > 0 else '')
                                  ~ "</div>" ~ cost_pill ~ "</div>" -%}

                              {%- set btn_fields = {} -%}
                              {%- if has_secondary -%}
                                {%- set btn_fields = btn_fields | combine({'btn_secondary': {'card': {
                                  'type': 'custom:button-card',
                                  'show_name': false,
                                  'show_icon': true,
                                  'icon': 'mdi:undo-variant',
                                  'styles': {
                                    'card': [
                                      {'width': '34px'},
                                      {'height': '34px'},
                                      {'border-radius': '50%'},
                                      {'background-color': 'transparent'},
                                      {'border': '1px solid ' ~ pref_claim_accent},
                                      {'box-shadow': 'none'}
                                    ],
                                    'icon': [
                                      {'width': '18px'},
                                      {'color': pref_claim_accent}
                                    ]
                                  },
                                  'tap_action': {'action': 'call-service', 'service': 'button.press', 'target': {'entity_id': secondary_button_eid}}
                                }}}) -%}
                              {%- endif -%}
                              {%- if has_primary -%}
                                {%- set btn_fields = btn_fields | combine({'btn_primary': {'card': {
                                  'type': 'custom:button-card',
                                  'show_name': false,
                                  'show_icon': true,
                                  'icon': primary_button_icon,
                                  'styles': {
                                    'card': [
                                      {'width': '34px'},
                                      {'height': '34px'},
                                      {'border-radius': '50%'},
                                      {'background-color': 'transparent' if primary_button_is_locked else ('color-mix(in srgb, ' ~ pref_claim_accent ~ ' 14%, var(--card-background-color))' if reward_state == 'requested' else 'transparent')},
                                      {'border': '1px solid var(--disabled-text-color)' if primary_button_is_locked else ('2px solid ' ~ pref_claim_accent if reward_state == 'requested' else '2px solid ' ~ row_col)},
                                      {'box-shadow': 'none'}
                                    ],
                                    'icon': [
                                      {'width': '18px'},
                                      {'color': 'var(--disabled-text-color)' if primary_button_is_locked else row_col}
                                    ]
                                  },
                                  'tap_action': ({'action': 'call-service', 'service': 'button.press', 'target': {'entity_id': primary_button_eid}} if primary_button_eid not in ['', none] and not primary_button_is_locked else {'action': 'none'})
                                }}}) -%}
                              {%- endif -%}
                              {%- set btn_fields = btn_fields | combine({'content': "<div style='width:100%;white-space:normal;'>" ~ content_html ~ "</div>"}) -%}

                              {%- if has_secondary -%}
                              {%- set areas = '"content btn_secondary btn_primary"' -%}
                              {%- set cols = '1fr 34px 34px' -%}
                              {%- elif has_primary -%}
                              {%- set areas = '"content btn_primary"' -%}
                              {%- set cols = '1fr 34px' -%}
                              {%- else -%}
                              {%- set areas = '"content"' -%}
                              {%- set cols = '1fr' -%}
                              {%- endif -%}
                              {%- set ns.group_cards = ns.group_cards + [{
                                'type': 'custom:button-card',
                                'entity': reward_sensor_eid,
                                'show_name': false,
                                'show_icon': false,
                                'show_state': false,
                                'show_label': false,
                                'custom_fields': btn_fields,
                                'tap_action': {'action': 'more-info'},
                                'hold_action': {'action': 'none'},
                                'styles': {
                                  'card': [
                                    {'background': 'linear-gradient(90deg, color-mix(in srgb, ' ~ row_col ~ ' 34%, var(--card-background-color)) 0%, color-mix(in srgb, ' ~ row_col ~ ' 13%, var(--card-background-color)) ' ~ fill_pct ~ '%, var(--card-background-color) ' ~ fill_pct ~ '%)'},
                                    {'box-shadow': 'none'},
                                    {'border': '1px solid ' ~ (pref_claim_accent if reward_state == 'requested' else ('var(--success-color)' if reward_state == 'approved' else 'var(--divider-color)'))},
                                    {'border-radius': '16px'},
                                    {'padding': '10px 12px'},
                                    {'overflow': 'hidden'}
                                  ],
                                  'grid': [
                                    {'grid-template-areas': areas},
                                    {'grid-template-columns': cols},
                                    {'column-gap': '8px'},
                                    {'align-items': 'center'}
                                  ],
                                  'custom_fields': {
                                    'content': [{'width': '100%'}, {'justify-self': 'stretch'}, {'align-self': 'center'}],
                                    'btn_primary': [{'width': '34px'}, {'height': '34px'}, {'align-self': 'center'}, {'justify-self': 'end'}],
                                    'btn_secondary': [{'width': '34px'}, {'height': '34px'}, {'align-self': 'center'}, {'justify-self': 'end'}]
                                  }
                                }
                              }] -%}
                            {%- endfor -%}

                            {%- if ns.group_cards | length > 0 -%}
                              {{
                                {
                                  'type': 'grid',
                                  'columns': pref_column_count if pref_column_count > 0 else 1,
                                  'square': false,
                                  'cards': ns.group_cards
                                }
                              }},
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}

    - type: grid
      column_span: 1
      cards:
        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== CUMULATIVE BADGES CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- 1. User Configuration --#}

                  << template_snippets.user_override_helper >>

                  {%- set pref_show_next_higher_badge = true -%}
                  {%- set pref_show_next_lower_badge = true -%}
                  {%- set pref_default_header_collapsed = false -%}
                  {%- set pref_primary_tint_mix_pct = 14 -%}  {#-- Percent of var(--primary-color) mixed into the main Cumulative header background when fill is enabled. Allowed: 0-100. --#}
                  {%- set pref_show_header_background = true -%}  {#-- Set to false to remove the main Cumulative header background fill and leave it transparent. Allowed: true, false. --#}
                  {%- set pref_show_header_thin_border = true -%}  {#-- Set to false to remove the thin outer border line. Accent borders are unaffected. Allowed: true, false. --#}


                  {#-- 2. Dynamic Lookups & Validations --#}

                  {%- set pref_show_next_higher_badge = (pref_show_next_higher_badge | default('true') | string | lower) == 'true' -%}
                  {%- set pref_show_next_lower_badge = (pref_show_next_lower_badge | default('true') | string | lower) == 'true' -%}
                  {%- set pref_default_header_collapsed = (pref_default_header_collapsed | default('false') | string | lower) == 'true' -%}
                  {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
                  {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
                  {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
                  {%- if pref_primary_tint_mix_pct < 0 -%}
                    {%- set pref_primary_tint_mix_pct = 0 -%}
                  {%- elif pref_primary_tint_mix_pct > 100 -%}
                    {%- set pref_primary_tint_mix_pct = 100 -%}
                  {%- endif -%}

                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  {%- if not skip_render -%}

                    {#-- 3. Initialize --#}
                    {%- macro format_points(value, mode='fixed_0') -%}
                      {%- set numeric = value | float(default=0) | round(2) -%}
                      {%- if mode == 'adaptive' -%}
                        {{- numeric | string | regex_replace('\.?0+$', '') -}}
                      {%- elif mode == 'fixed_1' -%}
                        {{- '%.1f' | format(numeric) -}}
                      {%- elif mode == 'fixed_2' -%}
                        {{- '%.2f' | format(numeric) -}}
                      {%- else -%}
                        {{- '%.0f' | format(numeric) -}}
                      {%- endif -%}
                    {%- endmacro -%}
                    {%- set ns = namespace(
                      badges=[],
                      points_earned_all_time=0,
                      points_label='Points',
                      m_frequency='',
                      m_status='active',
                      m_cycle_pts=0,
                      m_end_date='',
                      m_grace_end='',
                      m_remaining=0,
                      m_required=0,
                      m_last_awarded='',
                      m_award_count=0,
                      points_to_next=0,
                      current_badge_eid='',
                      highest_earned_badge_eid='',
                      next_higher_badge_eid='',
                      next_lower_badge_eid='',
                      has_earned_any=false
                    ) -%}

                    {#-- 4. Collect Data --#}
                    {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') or {} -%}
                    {%- set dashboard_helpers = state_attr(dashboard_helper, 'dashboard_helpers') or {} -%}
                    {%- set dashboard_config = state_attr(dashboard_helper, 'dashboard_config') or {} -%}
                    {%- set points_sensor = core_sensors.get('points_eid') -%}
                    {%- set badges_sensor = core_sensors.get('badges_eid') -%}
                    {%- set pref_points_precision = dashboard_config.get('points_precision', 'fixed_0') if dashboard_config is mapping else 'fixed_0' -%}
                    {%- set pref_points_precision = pref_points_precision | default('fixed_0') | string | lower -%}
                    {%- if pref_points_precision not in ['fixed_0', 'adaptive', 'fixed_1', 'fixed_2'] -%}
                      {%- set pref_points_precision = 'fixed_0' -%}
                    {%- endif -%}
                    {%- set translation_sensor = dashboard_helpers.get('translation_sensor_eid') -%}
                    {%- set ui = state_attr(translation_sensor, 'ui_translations') if translation_sensor else {} -%}
                    {%- set gamification_enabled = state_attr(dashboard_helper, 'gamification_enabled') | default(false, true) -%}
                    {%- set ns.points_earned_all_time = (state_attr(points_sensor, 'point_stat_points_earned_all_time') | float(default=0)) if points_sensor else 0 -%}
                    {%- set ns.points_label = (state_attr(points_sensor, 'unit_of_measurement') if points_sensor else None) or 'Points' -%}
                    {%- set points_icon = (state_attr(points_sensor, 'icon') if points_sensor else None) or 'mdi:star-circle' -%}
                    {%- set ui_control = state_attr(dashboard_helper, 'ui_control') | default({}, true) -%}
                    {%- set ui_control_key_root = 'gamification/cumulative' -%}
                    {%- set ui_control_key_header_collapsed = ui_control_key_root ~ '/header_collapse' -%}
                    {%- set ui_control_key_settings_open = ui_control_key_root ~ '/settings_open' -%}
                    {%- set ui_control_key_show_next_higher_badge = ui_control_key_root ~ '/show_next_higher_badge' -%}
                    {%- set ui_control_key_show_next_lower_badge = ui_control_key_root ~ '/show_next_lower_badge' -%}
                    {%- set ui_root = namespace(current=ui_control if ui_control is mapping else {}) -%}
                    {%- for segment in ui_control_key_root.split('/') -%}
                      {%- if ui_root.current is mapping -%}
                        {%- set ui_root.current = ui_root.current.get(segment, {}) -%}
                      {%- else -%}
                        {%- set ui_root.current = {} -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set header_collapsed = ui_root.current.get('header_collapse', pref_default_header_collapsed) if ui_root.current is mapping else pref_default_header_collapsed -%}
                    {%- set header_collapsed = header_collapsed | default(pref_default_header_collapsed, true) -%}
                    {%- set settings_open = ui_root.current.get('settings_open', false) if ui_root.current is mapping else false -%}
                    {%- set settings_open = (settings_open | string | lower) == 'true' -%}
                    {%- set effective_show_next_higher_badge = ui_root.current.get('show_next_higher_badge', pref_show_next_higher_badge) if ui_root.current is mapping else pref_show_next_higher_badge -%}
                    {%- set effective_show_next_higher_badge = (effective_show_next_higher_badge | string | lower) == 'true' -%}
                    {%- set effective_show_next_lower_badge = ui_root.current.get('show_next_lower_badge', pref_show_next_lower_badge) if ui_root.current is mapping else pref_show_next_lower_badge -%}
                    {%- set effective_show_next_lower_badge = (effective_show_next_lower_badge | string | lower) == 'true' -%}
                    {%- set integration_entry_id = state_attr(dashboard_helper, 'integration_entry_id') -%}
                    {%- set dashboard_helper_user_id = state_attr(dashboard_helper, 'user_id') -%}

                    {%- if badges_sensor -%}
                      {%- set hb_attrs = states[badges_sensor].attributes | default({}, true) -%}
                      {%- set hb_reset_schedule = hb_attrs.get('reset_schedule') if hb_attrs.get('reset_schedule') is mapping else {} -%}
                      {%- set ns.points_to_next = hb_attrs.get('points_to_next_badge', 0) | int(default=0) -%}
                      {%- set ns.m_status = hb_attrs.get('badge_status', 'active') | default('active') -%}
                      {%- set ns.m_frequency = ((hb_attrs.get('recurring_frequency') or hb_reset_schedule.get('recurring_frequency') or '') | string | lower) -%}
                      {%- set ns.m_cycle_pts = hb_attrs.get('cycle_points', 0) | int(default=0) -%}
                      {%- set ns.m_end_date = (hb_attrs.get('maintenance_end_date') | default('', true) | string | regex_replace('T.*$', '')) -%}
                      {%- set ns.m_grace_end = (hb_attrs.get('maintenance_grace_end_date') | default('', true) | string | regex_replace('T.*$', '')) -%}
                      {%- set ns.m_required = hb_attrs.get('maintenance_points_required', 0) | int(default=0) -%}
                      {%- set ns.m_remaining = hb_attrs.get('maintenance_points_remaining', 0) | int(default=0) -%}
                      {%- set ns.m_last_awarded = hb_attrs.get('last_awarded_date') | default('', true) -%}
                      {%- set ns.m_award_count = hb_attrs.get('award_count', 0) | int(default=0) -%}
                      {%- set ns.current_badge_eid = hb_attrs.get('current_badge_eid') | default('', true) -%}
                      {%- set ns.highest_earned_badge_eid = hb_attrs.get('highest_earned_badge_eid') | default('', true) -%}
                      {%- set ns.next_higher_badge_eid = hb_attrs.get('next_higher_badge_eid') | default('', true) -%}
                      {%- set ns.next_lower_badge_eid = hb_attrs.get('next_lower_badge_eid') | default('', true) -%}
                      {%- set ns.has_earned_any = ns.current_badge_eid not in ['', 'None', 'unknown', 'unavailable', none] -%}

                      {%- set middle_badge_eid = ns.current_badge_eid -%}
                      {%- if ns.m_status == 'demoted' and ns.highest_earned_badge_eid not in ['', 'None', 'unknown', 'unavailable', none] -%}
                        {%- set middle_badge_eid = ns.highest_earned_badge_eid -%}
                      {%- endif -%}
                      {%- if ns.next_lower_badge_eid == middle_badge_eid -%}
                        {%- set ns.next_lower_badge_eid = '' -%}
                      {%- endif -%}

                      {#-- Full rank ladder: every cumulative badge assigned to this user, sorted by threshold below --#}
                      {%- set ladder = namespace(eids=[], entries=[]) -%}
                      {%- for lb in (state_attr(dashboard_helper, 'badges') or []) -%}
                        {%- if lb is mapping and lb.get('badge_type') == 'cumulative' and lb.get('eid') not in ['', 'None', none] and lb.get('eid') not in ladder.eids -%}
                          {%- set lb_role = 'current' if lb.get('eid') == middle_badge_eid else ('next_higher' if lb.get('eid') == ns.next_higher_badge_eid else 'ladder') -%}
                          {%- set ladder.eids = ladder.eids + [lb.get('eid')] -%}
                          {%- set ladder.entries = ladder.entries + [{'eid': lb.get('eid'), 'role': lb_role, 'earned': lb_role != 'next_higher'}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if middle_badge_eid not in ladder.eids -%}
                        {%- set ladder.entries = ladder.entries + [{'eid': middle_badge_eid, 'role': 'current', 'earned': true}] -%}
                      {%- endif -%}
                      {%- if ns.next_higher_badge_eid not in ladder.eids -%}
                        {%- set ladder.entries = ladder.entries + [{'eid': ns.next_higher_badge_eid, 'role': 'next_higher', 'earned': false}] -%}
                      {%- endif -%}
                      {%- set badge_entries = ladder.entries -%}

                      {%- for entry in badge_entries -%}
                        {%- set badge_eid = entry.eid -%}
                        {%- if badge_eid not in ['', 'None', 'unknown', 'unavailable', none] and states(badge_eid) not in ['unknown', 'unavailable'] -%}
                          {%- set badge_attrs = states[badge_eid].attributes | default({}, true) -%}
                          {%- set target_data = badge_attrs.get('target') if badge_attrs.get('target') is mapping else {} -%}
                          {%- set threshold_val = 0 -%}
                          {%- set maintenance_points = 0 -%}
                          {%- if target_data is mapping -%}
                            {%- set threshold_val = target_data.threshold_value | float(default=0) -%}
                            {%- set maintenance_points = target_data.maintenance_rules | int(default=0) -%}
                          {%- else -%}
                            {%- set threshold_val = badge_attrs.get('threshold_value', 0) | float(default=0) -%}
                          {%- endif -%}

                          {%- set awards_data = badge_attrs.get('awards') if badge_attrs.get('awards') is mapping else {} -%}
                          {%- set award_points_attr = badge_attrs.get('award_points', 0) | float(default=0) -%}
                          {%- set points_multiplier_attr = badge_attrs.get('points_multiplier', 0) | float(default=0) -%}
                          {%- set award_points = awards_data.get('award_points', award_points_attr) | float(default=award_points_attr) -%}
                          {%- set points_multiplier = awards_data.get('points_multiplier', points_multiplier_attr) | float(default=points_multiplier_attr) -%}
                          {%- set award_rewards = awards_data.get('rewards') if awards_data.get('rewards') is iterable and awards_data.get('rewards') is not string else [] -%}
                          {%- set award_bonuses = awards_data.get('bonuses') if awards_data.get('bonuses') is iterable and awards_data.get('bonuses') is not string else [] -%}
                          {%- set award_penalties = awards_data.get('penalties') if awards_data.get('penalties') is iterable and awards_data.get('penalties') is not string else [] -%}

                          {%- set raw_earned = badge_attrs.get('assignees_earned') -%}
                          {%- set earned_list = [] -%}
                          {%- if raw_earned is string -%}
                            {%- set earned_list = [raw_earned] -%}
                          {%- elif raw_earned is iterable and raw_earned is not string and raw_earned is not none -%}
                            {%- set earned_list = raw_earned -%}
                          {%- endif -%}

                          {%- set badge_info = {
                            'entity_id': badge_eid,
                            'name': ((badge_attrs.get('badge_name') or badge_attrs.get('friendly_name') or '') | string) | regex_replace('^Badge - ', ''),
                            'icon': badge_attrs.get('icon') | default('mdi:medal-outline', true),
                            'description': (badge_attrs.get('description') or '') | string,
                            'last_awarded': (badge_attrs.get('last_awarded_date') or '') | string,
                            'threshold': threshold_val | int,
                            'award_points': award_points,
                            'points_multiplier': points_multiplier,
                            'award_rewards': award_rewards,
                            'award_bonuses': award_bonuses,
                            'award_penalties': award_penalties,
                            'assignees_earned': earned_list,
                            'maintenance': maintenance_points,
                            'role': entry.role,
                            'earned': entry.earned
                          } -%}
                          {%- set ns.badges = ns.badges + [badge_info] -%}
                        {%- endif -%}
                      {%- endfor -%}

                      {#-- Classify the rest of the ladder relative to the current rank, ordered by threshold --#}
                      {%- set cur_thr = namespace(v=-1) -%}
                      {%- for cb in ns.badges -%}
                        {%- if cb.role == 'current' -%}
                          {%- set cur_thr.v = cb.threshold -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set sorted_badges = namespace(items=[]) -%}
                      {%- for sb in ns.badges | sort(attribute='threshold') -%}
                        {%- if sb.role == 'ladder' -%}
                          {%- set sb_lower = sb.threshold < cur_thr.v -%}
                          {%- set sorted_badges.items = sorted_badges.items + [sb | combine({'role': 'earned' if sb_lower else 'future', 'earned': sb_lower})] -%}
                        {%- else -%}
                          {%- set sorted_badges.items = sorted_badges.items + [sb] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set ns.badges = sorted_badges.items -%}
                    {%- endif -%}

                    {#-- 5. Render --#}
                    {%- if gamification_enabled -%}
                      {{
                        {
                          'type': 'custom:button-card',
                          'name': ui.get('ranks', 'err-ranks'),
                          'icon': 'mdi:medal-outline',
                          'show_name': true,
                          'show_icon': true,
                          'tap_action': ({
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {
                              'config_entry_id': integration_entry_id,
                              'user_id': dashboard_helper_user_id,
                              'ui_control_action': 'remove',
                              'key': ui_control_key_header_collapsed
                            }
                          } if header_collapsed and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {
                              'config_entry_id': integration_entry_id,
                              'user_id': dashboard_helper_user_id,
                              'ui_control_action': 'update',
                              'key': ui_control_key_header_collapsed,
                              'value': true
                            }
                          } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                            'action': 'none'
                          }),
                          'hold_action': {'action': 'none'},
                          'custom_fields': {
                            'gear': {
                              'card': {
                                'type': 'custom:button-card',
                                'icon': 'mdi:cog-outline',
                                'show_name': false,
                                'show_icon': true,
                                'tap_action': ({
                                  'action': 'call-service',
                                  'service': 'choreops.manage_ui_control',
                                  'data': {
                                    'config_entry_id': integration_entry_id,
                                    'user_id': dashboard_helper_user_id,
                                    'ui_control_action': 'remove',
                                    'key': ui_control_key_settings_open
                                  }
                                } if settings_open and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                  'action': 'call-service',
                                  'service': 'choreops.manage_ui_control',
                                  'data': {
                                    'config_entry_id': integration_entry_id,
                                    'user_id': dashboard_helper_user_id,
                                    'ui_control_action': 'update',
                                    'key': ui_control_key_settings_open,
                                    'value': true
                                  }
                                } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                  'action': 'none'
                                }),
                                'hold_action': {'action': 'none'},
                                'styles': {
                                  'card': [
                                    {'width': '30px'},
                                    {'height': '30px'},
                                    {'border-radius': '50%'},
                                    {'background': ('color-mix(in srgb, var(--primary-color) 12%, var(--card-background-color))') if settings_open else 'transparent'},
                                    {'border': '1px solid var(--divider-color)'},
                                    {'box-shadow': 'none'}
                                  ],
                                  'icon': [
                                    {'width': '16px'},
                                    {'color': 'var(--primary-color)'}
                                  ]
                                }
                              }
                            },
                            'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                          },
                          'styles': {
                            'card': [
                              {'background': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--card-background-color))') if header_collapsed else 'transparent'},
                              {'box-shadow': 'none'},
                              {'border': '1px solid var(--divider-color)' if header_collapsed else 'none'},
                              {'border-left': '3px solid var(--primary-color)'},
                              {'border-bottom': '3px solid var(--primary-color)'},
                              {'border-radius': '12px'},
                              {'padding': '10px 12px'},
                              {'min-height': 'unset'},
                              {'margin-top': '5px'},
                              {'margin-bottom': '0px'}
                            ],
                            'grid': [
                              {'grid-template-areas': '"i n gear toggle"'},
                              {'grid-template-columns': 'min-content 1fr min-content min-content'},
                              {'column-gap': '5px'},
                              {'align-items': 'center'}
                            ],
                            'icon': [
                              {'width': '18px'},
                              {'transform': 'translateY(-2px)'},
                              {'color': 'var(--primary-color)'}
                            ],
                            'name': [
                              {'justify-self': 'start'},
                              {'font-size': '14px'},
                              {'font-weight': '700'},
                              {'text-transform': 'uppercase'},
                              {'letter-spacing': '0.4px'},
                              {'color': 'var(--primary-text-color)'}
                            ],
                            'custom_fields': {
                              'gear': [
                                {'justify-self': 'end'},
                                {'align-self': 'center'},
                                {'display': 'none' if header_collapsed else 'block'}
                              ],
                              'toggle': [
                                {'justify-self': 'end'},
                                {'align-self': 'center'}
                              ]
                            }
                          }
                        }
                      }},

                      {%- if not header_collapsed -%}
                        {%- if settings_open -%}
                          {{
                            {
                              'type': 'vertical-stack',
                              'cards': [
                                {
                                  'type': 'custom:button-card',
                                  'name': ui.get('configure', 'err-configure'),
                                  'icon': 'mdi:tune-variant',
                                  'show_name': true,
                                  'show_icon': true,
                                  'tap_action': {'action': 'none'},
                                  'styles': {
                                    'card': [
                                      {'background': 'var(--secondary-background-color)'},
                                      {'box-shadow': 'none'},
                                      {'border': '1px solid var(--divider-color)'},
                                      {'border-radius': '12px 12px 0 0'},
                                      {'padding': '8px 12px 6px 12px'}
                                    ],
                                    'grid': [
                                      {'grid-template-areas': '"i n"'},
                                      {'grid-template-columns': 'min-content 1fr'},
                                      {'column-gap': '6px'},
                                      {'align-items': 'center'}
                                    ],
                                    'icon': [
                                      {'width': '16px'},
                                      {'color': 'var(--primary-color)'}
                                    ],
                                    'name': [
                                      {'justify-self': 'start'},
                                      {'font-size': '12px'},
                                      {'font-weight': '700'},
                                      {'text-transform': 'uppercase'},
                                      {'letter-spacing': '0.6px'},
                                      {'color': 'var(--primary-text-color)'}
                                    ]
                                  }
                                },
                                {
                                  'type': 'grid',
                                  'columns': 2,
                                  'square': false,
                                  'cards': [
                                    {
                                      'type': 'custom:button-card',
                                      'name': ui.get('hide_next_higher_badge', 'err-hide_next_higher_badge') if effective_show_next_higher_badge else ui.get('show_next_higher_badge', 'err-show_next_higher_badge'),
                                      'icon': 'mdi:arrow-up-bold-circle' if effective_show_next_higher_badge else 'mdi:arrow-up-bold-circle-outline',
                                      'show_name': true,
                                      'show_icon': true,
                                      'tap_action': ({
                                        'action': 'call-service',
                                        'service': 'choreops.manage_ui_control',
                                        'data': {
                                          'config_entry_id': integration_entry_id,
                                          'user_id': dashboard_helper_user_id,
                                          'ui_control_action': 'remove',
                                          'key': ui_control_key_show_next_higher_badge
                                        }
                                      } if (not effective_show_next_higher_badge) == pref_show_next_higher_badge and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                        'action': 'call-service',
                                        'service': 'choreops.manage_ui_control',
                                        'data': {
                                          'config_entry_id': integration_entry_id,
                                          'user_id': dashboard_helper_user_id,
                                          'ui_control_action': 'update',
                                          'key': ui_control_key_show_next_higher_badge,
                                          'value': (not effective_show_next_higher_badge)
                                        }
                                      } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                        'action': 'none'
                                      }),
                                      'styles': {
                                        'card': [
                                          {'background': ('color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))') if effective_show_next_higher_badge else 'var(--card-background-color)'},
                                          {'box-shadow': 'none'},
                                          {'border': '1px solid var(--primary-color)' if effective_show_next_higher_badge else '1px solid var(--divider-color)'},
                                          {'border-radius': '0 0 0 12px'},
                                          {'padding': '10px 8px'}
                                        ],
                                        'grid': [
                                          {'grid-template-areas': '"i" "n"'},
                                          {'grid-template-columns': '1fr'},
                                          {'row-gap': '4px'}
                                        ],
                                        'icon': [
                                          {'width': '18px'},
                                          {'color': 'var(--primary-color)'}
                                        ],
                                        'name': [
                                          {'font-size': '12px'},
                                          {'font-weight': '700'},
                                          {'color': 'var(--primary-text-color)'},
                                          {'white-space': 'normal'},
                                          {'line-height': '1.2'}
                                        ]
                                      }
                                    },
                                    {
                                      'type': 'custom:button-card',
                                      'name': ui.get('hide_next_lower_badge', 'err-hide_next_lower_badge') if effective_show_next_lower_badge else ui.get('show_next_lower_badge', 'err-show_next_lower_badge'),
                                      'icon': 'mdi:arrow-down-bold-circle' if effective_show_next_lower_badge else 'mdi:arrow-down-bold-circle-outline',
                                      'show_name': true,
                                      'show_icon': true,
                                      'tap_action': ({
                                        'action': 'call-service',
                                        'service': 'choreops.manage_ui_control',
                                        'data': {
                                          'config_entry_id': integration_entry_id,
                                          'user_id': dashboard_helper_user_id,
                                          'ui_control_action': 'remove',
                                          'key': ui_control_key_show_next_lower_badge
                                        }
                                      } if (not effective_show_next_lower_badge) == pref_show_next_lower_badge and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                        'action': 'call-service',
                                        'service': 'choreops.manage_ui_control',
                                        'data': {
                                          'config_entry_id': integration_entry_id,
                                          'user_id': dashboard_helper_user_id,
                                          'ui_control_action': 'update',
                                          'key': ui_control_key_show_next_lower_badge,
                                          'value': (not effective_show_next_lower_badge)
                                        }
                                      } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                                        'action': 'none'
                                      }),
                                      'styles': {
                                        'card': [
                                          {'background': ('color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))') if effective_show_next_lower_badge else 'var(--card-background-color)'},
                                          {'box-shadow': 'none'},
                                          {'border': '1px solid var(--primary-color)' if effective_show_next_lower_badge else '1px solid var(--divider-color)'},
                                          {'border-radius': '0 0 12px 0'},
                                          {'padding': '10px 8px'}
                                        ],
                                        'grid': [
                                          {'grid-template-areas': '"i" "n"'},
                                          {'grid-template-columns': '1fr'},
                                          {'row-gap': '4px'}
                                        ],
                                        'icon': [
                                          {'width': '18px'},
                                          {'color': 'var(--primary-color)'}
                                        ],
                                        'name': [
                                          {'font-size': '12px'},
                                          {'font-weight': '700'},
                                          {'color': 'var(--primary-text-color)'},
                                          {'white-space': 'normal'},
                                          {'line-height': '1.2'}
                                        ]
                                      }
                                    }
                                  ]
                                }
                              ]
                            }
                          }},
                        {%- endif -%}
                        {%- if ns.badges | length == 0 -%}
                          {{
                            {
                              'type': 'custom:button-card',
                              'name': ui.get('no_badges_found', 'err-no_badges_found'),
                              'label': ui.get('cumulative_badge_setup_prompt', 'err-cumulative_badge_setup_prompt'),
                              'icon': 'mdi:medal-outline',
                              'show_name': true,
                              'show_icon': true,
                              'show_label': true,
                              'tap_action': {'action': 'none'},
                              'styles': {
                                'card': [
                                  {'background': 'var(--secondary-background-color)'},
                                  {'box-shadow': 'none'},
                                  {'border': '1px solid var(--divider-color)'},
                                  {'border-radius': '12px'},
                                  {'padding': '10px 12px'}
                                ],
                                'grid': [
                                  {'grid-template-areas': '"i n" "i l"'},
                                  {'grid-template-columns': 'min-content 1fr'},
                                  {'gap': '8px'},
                                  {'align-items': 'center'}
                                ],
                                'icon': [
                                  {'width': '18px'},
                                  {'color': 'var(--secondary-text-color)'}
                                ],
                                'name': [
                                  {'justify-self': 'start'},
                                  {'font-size': '13px'},
                                  {'font-weight': '600'},
                                  {'color': 'var(--secondary-text-color)'}
                                ],
                                'label': [
                                  {'justify-self': 'start'},
                                  {'font-size': '11px'},
                                  {'line-height': '1.3'},
                                  {'color': 'var(--secondary-text-color)'},
                                  {'white-space': 'normal'}
                                ]
                              }
                            }
                          }},
                        {%- else -%}
                          {#-- Ladder layout: tracker + fill-bar rows (current, next) + slim earned/locked rows --#}
                          {%- set n_b = ns.badges | length -%}
                          {%- set cur_accent = 'var(--warning-color)' if ns.m_status == 'grace' else ('var(--error-color)' if ns.m_status == 'demoted' else 'var(--success-color)') -%}
                          {%- set tr = namespace(ci=-1, has_next=false, nxt_name='', nxt_pct=0, nxt_to_go=0, nodes='') -%}
                          {%- for badge in ns.badges -%}
                            {%- if badge.role == 'current' -%}
                              {%- set tr.ci = loop.index0 -%}
                            {%- endif -%}
                            {%- if badge.role == 'next_higher' and not tr.has_next -%}
                              {%- set tr.has_next = true -%}
                              {%- set tr.nxt_name = badge.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                              {%- if badge.threshold > 0 -%}
                                {%- set tg = ns.points_to_next if ns.has_earned_any else (((badge.threshold - ns.points_earned_all_time) | float(default=0) | round(0, 'ceil')) | int) -%}
                                {%- set tr.nxt_to_go = [tg, 0] | max -%}
                                {%- set tr.nxt_pct = [((([badge.threshold - tr.nxt_to_go, 0] | max) / badge.threshold) * 100) | round(0) | int, 100] | min -%}
                              {%- endif -%}
                            {%- endif -%}
                            {%- set nrole = badge.role -%}
                            {%- set ncol = cur_accent if nrole == 'current' else ('var(--primary-color)' if nrole == 'next_higher' else ('var(--success-color)' if nrole == 'earned' else 'var(--secondary-text-color)')) -%}
                            {%- set nsz = 34 if nrole == 'current' else 26 -%}
                            {%- set nname = badge.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                            {%- set tr.nodes = tr.nodes
                                ~ "<div style='position:relative;z-index:1;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;'>"
                                ~ "<div style='height:34px;display:flex;align-items:center;justify-content:center;'>"
                                ~ "<div style='width:" ~ nsz ~ "px;height:" ~ nsz ~ "px;box-sizing:border-box;border-radius:50%;border:3px solid " ~ ncol ~ ";background:" ~ ("color-mix(in srgb, " ~ ncol ~ " 20%, var(--card-background-color))" if nrole == 'current' else "var(--card-background-color)") ~ ";display:flex;align-items:center;justify-content:center;opacity:" ~ ('0.6' if nrole == 'future' else '1') ~ ";'>"
                                ~ "<ha-icon icon='" ~ badge.icon ~ "' style='width:" ~ ('18' if nrole == 'current' else '14') ~ "px;height:" ~ ('18' if nrole == 'current' else '14') ~ "px;--mdc-icon-size:" ~ ('18' if nrole == 'current' else '14') ~ "px;color:" ~ ncol ~ ";display:block;'></ha-icon></div></div>"
                                ~ "<div style='max-width:100%;margin-top:4px;font-size:11px;font-weight:800;color:" ~ ('var(--primary-text-color)' if nrole == 'current' else 'var(--secondary-text-color)') ~ ";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ nname ~ "</div>"
                                ~ "<div style='font-size:10px;color:var(--secondary-text-color);opacity:0.8;'>" ~ (format_points(badge.threshold, pref_points_precision) | trim) ~ "</div></div>" -%}
                          {%- endfor -%}
                          {%- set trk_frac = 0 if tr.ci < 0 else ([((tr.ci + ((tr.nxt_pct / 100) if tr.has_next else 0)) / ([n_b - 1, 1] | max)), 1] | min) -%}
                          {%- set trk_caption = ("<div style='text-align:center;margin-top:2px;font-size:11px;color:var(--secondary-text-color);'><b style='color:var(--primary-color);'>" ~ (format_points(tr.nxt_to_go, pref_points_precision) | trim) ~ ' ' ~ ns.points_label ~ ' ' ~ ui.get('to_go', 'to go') ~ "</b> &rarr; <b style='color:var(--primary-text-color);'>" ~ tr.nxt_name ~ "</b></div>") if tr.has_next and tr.nxt_to_go > 0 else '' -%}
                          {%- set trk_html = "<div style='box-sizing:border-box;width:100%;border-radius:16px;border:1px solid var(--divider-color);background:var(--card-background-color);padding:8px 8px 8px;'>"
                              ~ "<div style='position:relative;display:flex;'>"
                              ~ "<div style='position:absolute;left:calc(50% / " ~ n_b ~ ");right:calc(50% / " ~ n_b ~ ");top:15px;height:3px;border-radius:4px;background:var(--divider-color);'></div>"
                              ~ "<div style='position:absolute;left:calc(50% / " ~ n_b ~ ");width:calc((100% - 100% / " ~ n_b ~ ") * " ~ ('%.3f' | format(trk_frac)) ~ ");top:15px;height:3px;border-radius:4px;background:var(--success-color);'></div>"
                              ~ tr.nodes ~ "</div>" ~ trk_caption ~ "</div>" -%}
                          {%- set row_styles = {
                            'card': [
                              {'padding': '0'},
                              {'background': 'none'},
                              {'border': 'none'},
                              {'box-shadow': 'none'},
                              {'border-radius': '16px'}
                            ],
                            'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                            'custom_fields': {'content': [{'width': '100%'}, {'justify-self': 'stretch'}]}
                          } -%}
                          {{
                            {
                              'type': 'custom:button-card',
                              'show_name': false,
                              'show_icon': false,
                              'show_state': false,
                              'tap_action': {'action': 'none'},
                              'custom_fields': {'content': trk_html},
                              'styles': row_styles
                            }
                          }},

                          {%- set rows = namespace(cur=[], nxt=[], earned=[], locked=[]) -%}
                          {%- for badge in ns.badges -%}
                            {%- set is_current = badge.role == 'current' -%}
                            {%- set is_target = badge.role == 'next_higher' -%}
                            {%- set req_pts = ns.m_required if ns.m_required > 0 else badge.maintenance -%}
                            {%- set bname = badge.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                            {%- set bdesc = badge.description | trim | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}

                            {#-- colors and labels --#}
                            {%- if is_current -%}
                              {%- set accent = 'var(--warning-color)' if ns.m_status == 'grace' else ('var(--error-color)' if ns.m_status == 'demoted' else 'var(--success-color)') -%}
                              {%- set role_label = ui.get('current_rank', 'Your rank') -%}
                              {%- set pill_text = ui.get('grace_period', 'Grace period') if ns.m_status == 'grace' else (ui.get('demoted', 'Demoted') if ns.m_status == 'demoted' else ui.get('active', 'Active')) -%}
                            {%- elif is_target -%}
                              {%- set accent = 'var(--primary-color)' -%}
                              {%- set role_label = ui.get('next_rank', 'Next rank') -%}
                              {%- set pill_text = '🔒 ' ~ ui.get('future_goal', 'Locked') -%}
                            {%- else -%}
                              {%- set accent = 'var(--secondary-text-color)' -%}
                              {%- set role_label = ui.get('previous_rank', 'Previous rank') -%}
                              {%- set pill_text = '✓ ' ~ ui.get('earned', 'Earned') -%}
                            {%- endif -%}

                            {#-- progress numbers --#}
                            {%- set pct = 100 -%}
                            {%- set prog_label = '' -%}
                            {%- set prog_value = '' -%}
                            {%- set prog_note = '' -%}
                            {%- set prog_color = accent -%}
                            {%- set show_bar = false -%}
                            {%- if is_current and req_pts > 0 -%}
                              {%- set pct = [[(ns.m_cycle_pts / req_pts * 100) | round(0) | int, 0] | max, 100] | min -%}
                              {%- set show_bar = true -%}
                              {%- set prog_color = 'var(--warning-color)' if ns.m_status in ['grace', 'demoted'] else ('var(--success-color)' if ns.m_remaining <= 0 else 'var(--primary-color)') -%}
                              {%- set prog_label = ui.get('maintenance', 'Maintenance') -%}
                              {%- set prog_value = (format_points(ns.m_cycle_pts, pref_points_precision) | trim) ~ ' / ' ~ (format_points(req_pts, pref_points_precision) | trim) -%}
                              {%- set due_short = (as_timestamp(ns.m_end_date ~ 'T12:00:00') | timestamp_custom('%b %d')) if ns.m_end_date not in ['', none] else '' -%}
                              {%- set grace_short = (as_timestamp(ns.m_grace_end ~ 'T12:00:00') | timestamp_custom('%b %d')) if ns.m_grace_end not in ['', none] else '' -%}
                              {%- set by_date = grace_short if (ns.m_status == 'grace' and grace_short | length > 0) else due_short -%}
                              {%- if ns.m_remaining <= 0 -%}
                                {%- set prog_note = "<span style='color:var(--success-color);font-weight:800;'>✓ " ~ ui.get('maintenance_met', 'Maintenance met') ~ "</span>" -%}
                              {%- else -%}
                                {%- set prog_note = "<span style='color:" ~ prog_color ~ ";font-weight:800;'>" ~ ui.get('need', 'Need') ~ ' ' ~ (format_points(ns.m_remaining, pref_points_precision) | trim) ~ ' ' ~ ns.points_label ~ "</span>" ~ ((" <span style='opacity:0.75;'>" ~ (ui.get('grace_period', 'Grace') if ns.m_status == 'grace' else ui.get('by', 'by')) ~ ' ' ~ by_date ~ "</span>") if by_date | length > 0 else '') -%}
                              {%- endif -%}
                              {%- if ns.m_frequency not in ['', 'none'] -%}
                                {%- set prog_note = prog_note ~ " <span style='opacity:0.75;'>• ↻ " ~ ui.get(ns.m_frequency, ns.m_frequency | replace('_', ' ') | title) ~ "</span>" -%}
                              {%- endif -%}
                              {%- if ns.m_status == 'demoted' -%}
                                {%- set cur_mult = (state_attr(points_sensor, 'points_multiplier') | float(default=0)) if points_sensor else 0 -%}
                                {%- if cur_mult > 0 -%}
                                  {%- set prog_note = prog_note ~ " <span style='color:var(--error-color);font-weight:700;'>• ×" ~ ('%g' | format(cur_mult | round(2))) ~ ' ' ~ ui.get('multiplier', 'multiplier') ~ "</span>" -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- elif is_target and badge.threshold > 0 -%}
                              {%- set to_go = ns.points_to_next if ns.has_earned_any else (((badge.threshold - ns.points_earned_all_time) | float(default=0) | round(0, 'ceil')) | int) -%}
                              {%- set to_go = [to_go, 0] | max -%}
                              {%- set have = [badge.threshold - to_go, 0] | max -%}
                              {%- set pct = [((have / badge.threshold) * 100) | round(0) | int, 100] | min -%}
                              {%- set show_bar = true -%}
                              {%- set prog_label = ui.get('to_unlock', 'To unlock') -%}
                              {%- set prog_value = (format_points(have, pref_points_precision) | trim) ~ ' / ' ~ (format_points(badge.threshold, pref_points_precision) | trim) -%}
                              {%- set prog_note = "<span style='font-weight:800;color:var(--primary-color);'>" ~ (format_points(to_go, pref_points_precision) | trim) ~ ' ' ~ ns.points_label ~ ' ' ~ ui.get('to_go', 'to go') ~ "</span>" -%}
                            {%- endif -%}

                            {#-- award pills --#}
                            {%- set pill_style = "display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb, var(--primary-color) 12%, transparent);font-size:11px;font-weight:700;color:var(--primary-text-color);margin:0 6px 4px 0;" -%}
                            {%- set pills = namespace(v='') -%}
                            {%- set mult_pill = ("<span style='" ~ pill_style ~ "margin:0 0 0 6px;'>⚡ ×" ~ ('%g' | format(badge.points_multiplier | float(default=0) | round(2))) ~ "</span>") if badge.points_multiplier | float(default=0) > 0 else '' -%}
                            {%- if badge.award_points | float(default=0) > 0 -%}
                              {%- set pills.v = pills.v ~ "<span style='" ~ pill_style ~ "'>+" ~ ('%g' | format(badge.award_points | float(default=0) | round(2))) ~ " <ha-icon icon='" ~ points_icon ~ "' style='width:12px;height:12px;--mdc-icon-size:12px;color:var(--primary-color);'></ha-icon></span>" -%}
                            {%- endif -%}
                            {%- if badge.award_bonuses | length > 0 -%}
                              {%- set pills.v = pills.v ~ "<span style='" ~ pill_style ~ "'>✨ " ~ ui.get('bonus', 'Bonus') ~ (' ×' ~ (badge.award_bonuses | length) if badge.award_bonuses | length > 1 else '') ~ "</span>" -%}
                            {%- endif -%}
                            {%- if badge.award_rewards | length > 0 -%}
                              {%- set pills.v = pills.v ~ "<span style='" ~ pill_style ~ "'>🎁 " ~ ui.get('reward', 'Reward') ~ (' ×' ~ (badge.award_rewards | length) if badge.award_rewards | length > 1 else '') ~ "</span>" -%}
                            {%- endif -%}

                            {#-- footer --#}
                            {%- set last_earned = (ns.m_last_awarded if is_current and ns.m_last_awarded else badge.last_awarded) | string | regex_replace('T.*$', '') -%}
                            {%- set foot = [] -%}
                            {%- if badge.earned and last_earned | length > 0 -%}
                              {%- set foot = foot + ['🕒 ' ~ last_earned] -%}
                            {%- endif -%}
                            {%- if is_current -%}
                              {%- set foot = foot + ['🥇 ' ~ ns.m_award_count] -%}
                            {%- endif -%}


                            {%- set row_html = '' -%}
                            {%- if is_current or is_target -%}
                              {%- set fill_col = prog_color if show_bar else accent -%}
                              {%- set fill_pct = pct if show_bar else 100 -%}
                              {%- set chip_label = pill_text if is_current else ui.get('next_rank', 'Next rank') -%}
                              {%- set sub_html = '' -%}
                              {%- if show_bar -%}
                                {%- set sub_html = (("<span>" ~ prog_label ~ " <b style='color:var(--primary-text-color);'>" ~ prog_value ~ "</b></span> &nbsp;&bull;&nbsp; ") if is_current else ("<b style='color:var(--primary-text-color);'>" ~ prog_value ~ "</b> &nbsp;&bull;&nbsp; ")) ~ prog_note -%}
                              {%- endif -%}
                              {%- set tile = "<div style='flex:0 0 auto;width:" ~ ('36px' if is_current else '30px') ~ ";height:" ~ ('36px' if is_current else '30px') ~ ";border-radius:12px;background:color-mix(in srgb, " ~ accent ~ " 22%, transparent);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ badge.icon ~ "' style='width:" ~ ('22' if is_current else '18') ~ "px;height:" ~ ('22' if is_current else '18') ~ "px;--mdc-icon-size:" ~ ('22' if is_current else '18') ~ "px;color:" ~ accent ~ ";display:block;'></ha-icon></div>" -%}
                              {%- set chip = "<span style='flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:" ~ accent ~ ";color:#fff;'>" ~ chip_label ~ "</span>" -%}
                              {%- set cost_pill = "<div style='flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:14px;font-weight:800;color:var(--primary-text-color);'><ha-icon icon='" ~ points_icon ~ "' style='width:14px;height:14px;--mdc-icon-size:14px;color:var(--warning-color, #ffc107);display:block;'></ha-icon>" ~ (format_points(badge.threshold, pref_points_precision) | trim) ~ "</div>" -%}
                              {%- set pill_row = ("<div style='margin-top:3px;text-align:left;'>" ~ pills.v ~ "</div>") if pills.v | length > 0 else '' -%}
                              {%- set foot_row = ("<div style='margin-top:2px;font-size:10px;font-weight:600;color:var(--secondary-text-color);text-align:left;'>" ~ (foot | join(' &nbsp;•&nbsp; ')) ~ "</div>") if foot | length > 0 else '' -%}
                              {%- set desc_row = ("<div style='margin-top:2px;display:flex;align-items:center;font-size:11px;line-height:1.3;color:var(--secondary-text-color);'><span style='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" ~ bdesc ~ "</span>" ~ mult_pill ~ "</div>") if (bdesc | length > 0 or mult_pill | length > 0) else '' -%}
                              {%- set row_html = "<div style='position:relative;overflow:hidden;box-sizing:border-box;width:100%;border-radius:16px;border:" ~ (('1px solid ' ~ accent) if is_current else '1px solid var(--divider-color)') ~ ";background:linear-gradient(90deg, color-mix(in srgb, " ~ fill_col ~ " 34%, var(--card-background-color)) 0%, color-mix(in srgb, " ~ fill_col ~ " 13%, var(--card-background-color)) " ~ fill_pct ~ "%, var(--card-background-color) " ~ fill_pct ~ "%);padding:" ~ ('9px 12px' if is_current else '6px 10px') ~ ";text-align:left;'>"
                                  ~ "<div style='display:flex;align-items:center;gap:10px;'>" ~ tile
                                  ~ "<div style='flex:1;min-width:0;'><div style='display:flex;align-items:center;gap:6px;'><span style='font-size:" ~ ('18px' if is_current else '15px') ~ ";line-height:1.2;font-weight:800;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ bname ~ "</span>" ~ chip ~ "</div>"
                                  ~ (("<div style='font-size:12px;line-height:1.3;color:var(--secondary-text-color);'>" ~ sub_html ~ "</div>") if sub_html | length > 0 else '')
                                  ~ desc_row ~ pill_row ~ foot_row
                                  ~ "</div>" ~ cost_pill ~ "</div></div>" -%}
                            {%- else -%}
                              {%- set slim_col = 'var(--success-color)' if badge.role == 'earned' else 'var(--secondary-text-color)' -%}
                              {%- set slim_right = ('✓ ' ~ ui.get('earned', 'Earned') ~ ((' ' ~ last_earned) if last_earned | length > 0 else '')) if badge.role == 'earned' else ('🔒 ' ~ (format_points(badge.threshold, pref_points_precision) | trim) ~ ' ' ~ ns.points_label) -%}
                              {%- set row_html = "<div style='display:flex;align-items:center;gap:10px;box-sizing:border-box;width:100%;padding:5px 10px;border-radius:12px;background:var(--card-background-color);border:1px solid var(--divider-color);opacity:" ~ ('1' if badge.role == 'earned' else '0.8') ~ ";text-align:left;'>"
                                  ~ "<ha-icon icon='" ~ badge.icon ~ "' style='flex:0 0 auto;width:20px;height:20px;--mdc-icon-size:20px;color:" ~ slim_col ~ ";display:block;'></ha-icon>"
                                  ~ "<span style='min-width:0;font-size:14px;font-weight:800;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ bname ~ "</span>"
                                  ~ "<span style='margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--secondary-text-color);'>" ~ slim_right ~ "</span></div>" -%}
                            {%- endif -%}
                            {%- set item = {'eid': badge.entity_id, 'html': row_html} -%}
                            {%- if is_current -%}
                              {%- set rows.cur = rows.cur + [item] -%}
                            {%- elif is_target -%}
                              {%- set rows.nxt = rows.nxt + [item] -%}
                            {%- elif badge.role == 'earned' -%}
                              {%- set rows.earned = rows.earned + [item] -%}
                            {%- else -%}
                              {%- set rows.locked = rows.locked + [item] -%}
                            {%- endif -%}
                          {%- endfor -%}

                          {%- set head_style = "font-size:11px;font-weight:800;letter-spacing:0.7px;text-transform:uppercase;color:var(--secondary-text-color);margin:2px 0 4px 2px;text-align:left;" -%}
                          {%- set emit = namespace(items=[]) -%}
                          {%- for it in rows.cur -%}
                            {%- set emit.items = emit.items + [{'eid': it.eid, 'html': it.html, 'head': ''}] -%}
                          {%- endfor -%}
                          {%- if effective_show_next_higher_badge -%}
                            {%- for it in rows.nxt -%}
                              {%- set emit.items = emit.items + [{'eid': it.eid, 'html': it.html, 'head': ''}] -%}
                            {%- endfor -%}
                          {%- endif -%}
                          {%- if effective_show_next_lower_badge -%}
                            {%- for it in (rows.earned | reverse | list) -%}
                              {%- set emit.items = emit.items + [{'eid': it.eid, 'html': it.html, 'head': ("<div style='" ~ head_style ~ "'>" ~ ui.get('earned', 'Earned') ~ "</div>") if loop.first else ''}] -%}
                            {%- endfor -%}
                          {%- endif -%}
                          {%- if effective_show_next_higher_badge -%}
                            {%- for it in rows.locked -%}
                              {%- set emit.items = emit.items + [{'eid': it.eid, 'html': it.html, 'head': ("<div style='" ~ head_style ~ "'>" ~ ui.get('future_goal', 'Locked') ~ "</div>") if loop.first else ''}] -%}
                            {%- endfor -%}
                          {%- endif -%}
                          {%- for it in emit.items -%}
                            {{
                              {
                                'type': 'custom:button-card',
                                'entity': it.eid,
                                'show_name': false,
                                'show_icon': false,
                                'show_state': false,
                                'tap_action': {'action': 'more-info'},
                                'custom_fields': {'content': "<div style='width:100%;'>" ~ it.head ~ it.html ~ "</div>"},
                                'styles': row_styles
                              }
                            }},
                          {%- endfor -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}

        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== PERIODIC BADGES CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- 1. User Configuration --#}

                  << template_snippets.user_override_helper >>

                  {%- set pref_default_header_collapsed = false -%}
                  {%- set pref_primary_tint_mix_pct = 14 -%}  {#-- Percent of var(--primary-color) mixed into the main Periodic header background when fill is enabled. Allowed: 0-100. --#}
                  {%- set pref_show_header_background = true -%}  {#-- Set to false to remove the main Periodic header background fill and leave it transparent. Allowed: true, false. --#}
                  {%- set pref_show_header_thin_border = true -%}  {#-- Set to false to remove the thin outer border line. Accent borders are unaffected. Allowed: true, false. --#}
                  {%- set pref_urgent_days = 3 -%}  {#-- Quests ending within this many days get an orange border and a countdown badge. Allowed: 0-30. --#}


                  {#-- 2. Dynamic Lookups & Validations --#}

                  {%- set pref_default_header_collapsed = (pref_default_header_collapsed | default('false') | string | lower) == 'true' -%}
                  {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
                  {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
                  {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
                  {%- set pref_urgent_days = [[pref_urgent_days | int(default=3), 0] | max, 30] | min -%}
                  {%- if pref_primary_tint_mix_pct < 0 -%}
                    {%- set pref_primary_tint_mix_pct = 0 -%}
                  {%- elif pref_primary_tint_mix_pct > 100 -%}
                    {%- set pref_primary_tint_mix_pct = 100 -%}
                  {%- endif -%}

                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  {%- if not skip_render -%}

                    {#-- 1. Data --#}
                    {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') or {} -%}
                    {%- set dashboard_helpers = state_attr(dashboard_helper, 'dashboard_helpers') or {} -%}
                    {%- set points_sensor = core_sensors.get('points_eid') -%}
                    {%- set points_icon = (state_attr(points_sensor, 'icon') if points_sensor else None) or 'mdi:star-circle' -%}
                    {%- set translation_sensor = dashboard_helpers.get('translation_sensor_eid') -%}
                    {%- set ui = state_attr(translation_sensor, 'ui_translations') if translation_sensor else {} -%}
                    {%- set gamification_enabled = state_attr(dashboard_helper, 'gamification_enabled') | default(false, true) -%}
                    {%- set ui_control = state_attr(dashboard_helper, 'ui_control') | default({}, true) -%}
                    {%- set key_root = 'gamification/periodic' -%}
                    {%- set ui_root = namespace(current=ui_control if ui_control is mapping else {}) -%}
                    {%- for segment in key_root.split('/') -%}
                      {%- set ui_root.current = ui_root.current.get(segment, {}) if ui_root.current is mapping else {} -%}
                    {%- endfor -%}
                    {%- set header_collapsed = (ui_root.current.get('header_collapse', pref_default_header_collapsed) if ui_root.current is mapping else pref_default_header_collapsed) in [true, 'true', 'True'] -%}
                    {%- set integration_entry_id = state_attr(dashboard_helper, 'integration_entry_id') -%}
                    {%- set dashboard_helper_user_id = state_attr(dashboard_helper, 'user_id') -%}
                    {%- set can_save = integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] -%}
                    {%- set badge_list = state_attr(dashboard_helper, 'badges') | default([], true) -%}
                    {%- set current_date = now().strftime('%Y-%m-%d') -%}

                    {%- set ns = namespace(badges=[]) -%}
                    {%- for badge in badge_list -%}
                      {%- if badge is mapping and badge.get('eid') not in ['', 'None', 'unknown', 'unavailable', none] and (badge.get('badge_type') | string | lower) in ['periodic', 'daily', 'special_occasion'] -%}
                        {%- set be = badge.get('eid') -%}
                        {%- set ba = states[be].attributes | default({}, true) -%}
                        {%- set btype = (badge.get('badge_type') | string | lower) -%}
                        {%- set rs = ba.get('reset_schedule') if ba.get('reset_schedule') is mapping else {} -%}
                        {%- set freq = (ba.get('recurring_frequency') or rs.get('recurring_frequency') or '') | string | lower -%}
                        {%- set status = (ba.get('status') or badge.get('status') or 'in_progress') | string | lower -%}
                        {%- set progress = states(be) | float(default=0) -%}
                        {%- set progress = 0 if progress < 0 else (100 if progress > 100 else progress) -%}
                        {%- set grp = 'special' if btype == 'special_occasion' else ('daily' if (btype == 'daily' or freq == 'daily') else ('longer' if freq in ['biweekly', 'quarterly', 'yearly', 'semiannual', 'semi_annual', 'annual', 'custom'] else (freq if freq not in ['', 'none'] else 'other'))) -%}
                        {%- set rank = 2 if status in ['earned', 'completed'] else (1 if progress <= 0 else 0) -%}
                        {%- set awards = ba.get('awards') if ba.get('awards') is mapping else {} -%}
                        {%- set b_end = ((ba.get('end_date') or rs.get('end_date') or '') | string) | regex_replace('T.*$', '') -%}
                        {%- set b_start = ((ba.get('start_date') or rs.get('start_date') or '') | string) | regex_replace('T.*$', '') -%}
                        {%- set b_days_left = (((as_timestamp(b_end ~ 'T12:00:00') - as_timestamp(current_date ~ 'T12:00:00')) / 86400) | round(0) | int) if b_end | length > 0 else 999 -%}
                        {%- set b_starts_future = b_start | length > 0 and b_start > current_date -%}
                        {%- set ns.badges = ns.badges + [{
                          'eid': be,
                          'name': (ba.get('badge_name') or badge.get('name') or state_attr(be, 'friendly_name') or '') | string,
                          'icon': (ba.get('icon') or 'mdi:medal-outline') | string,
                          'description': (ba.get('description') or '') | string,
                          'status': status,
                          'progress': progress,
                          'group': grp,
                          'rank': rank,
                          'award_count': ba.get('award_count', 0) | int(default=0),
                          'last_awarded': ((ba.get('last_awarded_date') or '') | string) | regex_replace('T.*$', ''),
                          'start': ((ba.get('start_date') or rs.get('start_date') or '') | string) | regex_replace('T.*$', ''),
                          'end': ((ba.get('end_date') or rs.get('end_date') or '') | string) | regex_replace('T.*$', ''),
                          'days_left': b_days_left,
                          'days_done': (ba.get('days_done') if ba.get('days_done') is iterable and ba.get('days_done') is not string else []),
                          'day_based': ((ba.get('target_type') or '') | string | lower).startswith(('days_', 'streak_')),
                          'starts_future': b_starts_future,
                          'points': awards.get('award_points', 0) | float(default=0),
                          'mult': awards.get('points_multiplier', 0) | float(default=0),
                          'rewards': (awards.get('rewards') if awards.get('rewards') is iterable and awards.get('rewards') is not string else []) | length,
                          'bonuses': (awards.get('bonuses') if awards.get('bonuses') is iterable and awards.get('bonuses') is not string else []) | length,
                          'penalties': (awards.get('penalties') if awards.get('penalties') is iterable and awards.get('penalties') is not string else [])
                        }] -%}
                      {%- endif -%}
                    {%- endfor -%}

                    {#-- 2. Groups, filter, sort (in progress by progress high-to-low, not started, then earned last) --#}
                    {%- set grp_order = ['daily', 'weekly', 'monthly', 'longer', 'other', 'special'] -%}
                    {%- set present = ns.badges | map(attribute='group') | unique | list -%}
                    {%- set groups = (grp_order | select('in', present) | list) + (present | reject('in', grp_order) | list) -%}
                    {%- set earned_n = ns.badges | selectattr('rank', 'eq', 2) | list | length -%}
                    {%- set active_n = ns.badges | selectattr('rank', 'eq', 0) | list | length -%}
                    {%- set todo_n = ns.badges | selectattr('rank', 'eq', 1) | list | length -%}

                    {#-- 3. Render --#}
                    {%- if gamification_enabled -%}
                      {{
                        {
                          'type': 'custom:button-card',
                          'name': ui.get('goals_heading', 'Goals'),
                          'icon': 'mdi:calendar-refresh-outline',
                          'show_name': true,
                          'show_icon': true,
                          'tap_action': ({
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {'config_entry_id': integration_entry_id, 'user_id': dashboard_helper_user_id, 'ui_control_action': 'remove', 'key': key_root ~ '/header_collapse'}
                          } if header_collapsed and can_save else {
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {'config_entry_id': integration_entry_id, 'user_id': dashboard_helper_user_id, 'ui_control_action': 'update', 'key': key_root ~ '/header_collapse', 'value': true}
                          } if can_save else {'action': 'none'}),
                          'hold_action': {'action': 'none'},
                          'custom_fields': {
                            'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                          },
                          'styles': {
                            'card': [
                              {'background': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct | string ~ '%, var(--card-background-color))') if header_collapsed else 'transparent'},
                              {'box-shadow': 'none'},
                              {'border': '1px solid var(--divider-color)' if header_collapsed else 'none'},
                              {'border-left': '3px solid var(--primary-color)'},
                              {'border-bottom': '3px solid var(--primary-color)'},
                              {'border-radius': '12px'},
                              {'padding': '10px 12px'},
                              {'min-height': 'unset'},
                              {'margin-top': '5px'},
                              {'margin-bottom': '0px'}
                            ],
                            'grid': [
                              {'grid-template-areas': '"i n toggle"'},
                              {'grid-template-columns': 'min-content 1fr min-content'},
                              {'column-gap': '5px'},
                              {'align-items': 'center'}
                            ],
                            'icon': [{'width': '18px'}, {'transform': 'translateY(-2px)'}, {'color': 'var(--primary-color)'}],
                            'name': [
                              {'justify-self': 'start'}, {'font-size': '14px'}, {'font-weight': '700'},
                              {'text-transform': 'uppercase'}, {'letter-spacing': '0.4px'}, {'color': 'var(--primary-text-color)'}
                            ],
                            'custom_fields': {'toggle': [{'justify-self': 'end'}, {'align-self': 'center'}]}
                          }
                        }
                      }},

                      {%- if not header_collapsed -%}
                        {%- if ns.badges | length == 0 -%}
                          {{
                            {
                              'type': 'custom:button-card',
                              'name': ui.get('no_goals_yet', 'No goals yet'),
                              'label': ui.get('periodic_badge_setup_prompt', ''),
                              'icon': 'mdi:medal-outline',
                              'show_name': true, 'show_icon': true, 'show_label': true,
                              'tap_action': {'action': 'none'},
                              'styles': {
                                'card': [{'background': 'var(--secondary-background-color)'}, {'box-shadow': 'none'}, {'border': '1px solid var(--divider-color)'}, {'border-radius': '12px'}, {'padding': '10px 12px'}],
                                'grid': [{'grid-template-areas': '"i n" "i l"'}, {'grid-template-columns': 'min-content 1fr'}, {'gap': '8px'}, {'align-items': 'center'}],
                                'icon': [{'width': '18px'}, {'color': 'var(--secondary-text-color)'}],
                                'name': [{'justify-self': 'start'}, {'font-size': '13px'}, {'font-weight': '600'}, {'color': 'var(--secondary-text-color)'}],
                                'label': [{'justify-self': 'start'}, {'font-size': '11px'}, {'color': 'var(--secondary-text-color)'}, {'white-space': 'normal'}]
                              }
                            }
                          }},
                        {%- else -%}

                          {#-- summary strip --#}
                          {%- set summary = "<div style='display:flex;gap:8px;'>"
                              ~ "<div style='flex:1;padding:8px 4px;border-radius:12px;background:rgba(34,197,94,0.14);border:1px solid rgba(34,197,94,0.45);text-align:center;'><div style='font-size:18px;font-weight:800;color:var(--success-color);'>" ~ earned_n ~ "</div><div style='font-size:10px;font-weight:800;letter-spacing:0.5px;color:var(--secondary-text-color);'>" ~ ui.get('earned', 'EARNED') | upper ~ "</div></div>"
                              ~ "<div style='flex:1;padding:8px 4px;border-radius:12px;background:color-mix(in srgb, var(--primary-color) 14%, transparent);border:1px solid var(--primary-color);text-align:center;'><div style='font-size:18px;font-weight:800;color:var(--primary-color);'>" ~ active_n ~ "</div><div style='font-size:10px;font-weight:800;letter-spacing:0.5px;color:var(--secondary-text-color);'>" ~ ui.get('in_progress', 'IN PROGRESS') | upper ~ "</div></div>"
                              ~ "<div style='flex:1;padding:8px 4px;border-radius:12px;background:rgba(127,127,127,0.12);border:1px solid rgba(127,127,127,0.35);text-align:center;'><div style='font-size:18px;font-weight:800;color:var(--secondary-text-color);'>" ~ todo_n ~ "</div><div style='font-size:10px;font-weight:800;letter-spacing:0.5px;color:var(--secondary-text-color);'>NOT STARTED</div></div>"
                              ~ "</div>" -%}
                          {{
                            {
                              'type': 'custom:button-card',
                              'show_name': false,
                              'show_icon': false,
                              'tap_action': {'action': 'none'},
                              'styles': {
                                'card': [{'padding': '10px 12px'}, {'border-radius': '16px'}, {'box-shadow': 'none'}],
                                'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                                'custom_fields': {'content': [{'width': '100%'}, {'justify-self': 'stretch'}]}
                              },
                              'custom_fields': {'content': summary}
                            }
                          }},

                          {#-- Quest list: groups by cadence, ending-soon quests get an orange edge + countdown, earned quests shrink to slim rows --#}
                          {%- set row_styles = {
                            'card': [
                              {'padding': '0'},
                              {'background': 'none'},
                              {'border': 'none'},
                              {'box-shadow': 'none'},
                              {'border-radius': '16px'}
                            ],
                            'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                            'custom_fields': {'content': [{'width': '100%'}, {'justify-self': 'stretch'}]}
                          } -%}
                          {%- set head_style = "font-size:11px;font-weight:800;letter-spacing:0.7px;text-transform:uppercase;color:var(--secondary-text-color);" -%}
                          {%- set emit = namespace(items=[]) -%}
                          {#-- daily cards stack (ring above, text below) when their own column is narrow --#}
                          {%- set dstyle = "<style>@container (max-width:170px){.dc{flex-direction:column !important;align-items:center !important;text-align:center !important;gap:6px !important;}.dt{width:100% !important;margin-top:6px !important;}.dd{display:none !important;}.dx{justify-content:center !important;}}</style>" -%}
                          {%- for g in groups -%}
                            {%- set glabel = ui.get('special_occasion', 'Special') if g == 'special' else ('Longer' if g == 'longer' else ui.get(g, g | replace('_', ' ') | title)) -%}
                            {%- set gstat = namespace(total=0, done=0, keys=[], earned=[]) -%}
                            {%- for b in ns.badges -%}
                              {%- if b.group == g -%}
                                {%- set gstat.total = gstat.total + 1 -%}
                                {%- set b_urgent = b.rank != 2 and not b.starts_future and b.days_left >= 0 and b.days_left <= pref_urgent_days -%}
                                {%- if b.rank == 2 -%}
                                  {%- set gstat.done = gstat.done + 1 -%}
                                  {%- set gstat.earned = gstat.earned + [loop.index0] -%}
                                {%- else -%}
                                  {%- set gstat.keys = gstat.keys + [[0 if b_urgent else 1, b.days_left if b_urgent else 0, b.rank, 100 - b.progress, b.name | lower, loop.index0]] -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {%- set ghead = namespace(v="<div style='display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 6px;text-align:left;'><span style='" ~ head_style ~ "'>" ~ glabel ~ "</span><span style='font-size:11px;font-weight:700;color:var(--secondary-text-color);'>" ~ gstat.done ~ ' / ' ~ gstat.total ~ ' ' ~ ui.get('done', 'done') ~ "</span></div>") -%}
                            {%- set dgrid = namespace(cells=[]) -%}

                            {%- for k in gstat.keys | sort -%}
                              {%- set b = ns.badges[k[5]] -%}
                              {%- set is_urgent = k[0] == 0 -%}
                              {%- set started = b.rank == 0 -%}
                              {%- set row_col = 'var(--primary-color)' if started else 'var(--secondary-text-color)' -%}
                              {%- set pct = b.progress | round(0) | int -%}
                              {%- set bname = b.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                              {%- set bdesc = b.description | trim | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}

                              {#-- countdown badge (ending soon) --#}
                              {%- set badge_txt = '' -%}
                              {%- if is_urgent -%}
                                {%- set badge_txt = ui.get('ends_today', 'Ends today') if b.days_left == 0 else ((b.days_left ~ ' ' ~ ui.get('days_left', 'days left')) if b.days_left > 1 else ui.get('one_day_left', '1 day left')) -%}
                              {%- endif -%}
                              {%- set badge_html = ("<span style='flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warning-color);color:#000;'>" ~ badge_txt ~ "</span>") if badge_txt | length > 0 else '' -%}

                              {#-- one info row: percent, awards, if-missed, earned count, time left --#}
                              {%- set bits = [] -%}
                              {%- if started -%}
                                {%- set bits = bits + ["<b style='color:var(--primary-color);'>" ~ pct ~ "%</b>"] -%}
                              {%- endif -%}
                              {%- if b.mult > 0 -%}
                                {%- set bits = bits + ['⚡×' ~ ('%g' | format(b.mult | round(2)))] -%}
                              {%- endif -%}
                              {%- if b.rewards > 0 -%}
                                {%- set bits = bits + ['🎁 ' ~ ui.get('reward', 'Reward') ~ (' ×' ~ b.rewards if b.rewards > 1 else '')] -%}
                              {%- endif -%}
                              {%- if b.bonuses > 0 -%}
                                {%- set bits = bits + ['✨ ' ~ ui.get('bonus', 'Bonus') ~ (' ×' ~ b.bonuses if b.bonuses > 1 else '')] -%}
                              {%- endif -%}
                              {%- set missed = namespace(v=[]) -%}
                              {%- for pn in b.penalties -%}
                                {%- if pn is mapping and (pn.get('name') or '') | string | trim | length > 0 -%}
                                  {%- set missed.v = missed.v + [pn.get('name') | string | trim | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;')] -%}
                                {%- endif -%}
                              {%- endfor -%}
                              {%- if missed.v | length == 0 and b.penalties | length > 0 -%}
                                {%- set missed.v = [ui.get('penalty', 'Penalty')] -%}
                              {%- endif -%}
                              {%- if b.end | length > 0 and missed.v | length > 0 -%}
                                {%- set bits = bits + ["<span style='color:var(--error-color);'>⏳ " ~ (missed.v | join(' • ')) ~ "</span>"] -%}
                              {%- endif -%}
                              {%- if b.award_count > 0 -%}
                                {%- set bits = bits + ['🥇 ' ~ b.award_count] -%}
                              {%- endif -%}
                              {%- if b.starts_future -%}
                                {%- set bits = bits + ['📅 ' ~ ui.get('starts', 'starts') ~ ' ' ~ (as_timestamp(b.start ~ 'T12:00:00') | timestamp_custom('%b %d'))] -%}
                              {%- elif not is_urgent and b.end | length > 0 -%}
                                {%- if b.days_left > 3 and b.days_left < 999 -%}
                                  {%- set bits = bits + ['📅 ' ~ b.days_left ~ ' ' ~ ui.get('days_left', 'days left')] -%}
                                {%- else -%}
                                  {%- set bits = bits + ['📅 ' ~ b.end] -%}
                                {%- endif -%}
                              {%- endif -%}

                              {%- set tile = "<div style='flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb, " ~ row_col ~ " 22%, transparent);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ b.icon ~ "' style='width:22px;height:22px;--mdc-icon-size:22px;color:" ~ row_col ~ ";display:block;'></ha-icon></div>" -%}
                              {%- set reward_pill = ("<div style='flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:14px;font-weight:800;color:var(--primary-text-color);'><ha-icon icon='" ~ points_icon ~ "' style='width:14px;height:14px;--mdc-icon-size:14px;color:var(--warning-color, #ffc107);display:block;'></ha-icon>+" ~ ('%g' | format(b.points | round(2))) ~ "</div>") if b.points > 0 else '' -%}
                              {#-- day-by-day strip: done / missed / today / still ahead --#}
                              {%- set day_strip = '' -%}
                              {%- if b.start | length > 0 and b.end | length > 0 and not b.starts_future -%}
                                {%- set start_ts = as_timestamp(b.start ~ 'T12:00:00') -%}
                                {%- set n_days = (((as_timestamp(b.end ~ 'T12:00:00') - start_ts) / 86400) | round(0) | int) + 1 -%}
                                {%- if n_days >= 2 and n_days <= 42 -%}
                                  {%- set dcount = namespace(done=0, cells='') -%}
                                  {%- for i in range(n_days) -%}
                                    {%- set d_ts = start_ts + (i * 86400) -%}
                                    {%- set d_iso = d_ts | timestamp_custom('%Y-%m-%d') -%}
                                    {%- set d_done = d_iso in b.days_done -%}
                                    {%- set d_today = d_iso == current_date -%}
                                    {%- set d_past = d_iso < current_date -%}
                                    {%- if d_done -%}
                                      {%- set dcount.done = dcount.done + 1 -%}
                                      {%- set c_bg = 'color-mix(in srgb, var(--success-color) 22%, var(--card-background-color))' -%}
                                      {%- set c_bd = '1px solid color-mix(in srgb, var(--success-color) 55%, transparent)' -%}
                                      {%- set c_fg = 'var(--success-color)' -%}
                                      {%- set c_mark = '✓' -%}
                                    {%- elif d_today -%}
                                      {%- set c_bg = 'transparent' -%}
                                      {%- set c_bd = '2px dashed var(--primary-color)' -%}
                                      {%- set c_fg = 'var(--primary-color)' -%}
                                      {%- set c_mark = '•' -%}
                                    {%- elif d_past and b.day_based -%}
                                      {%- set c_bg = 'color-mix(in srgb, var(--error-color) 18%, var(--card-background-color))' -%}
                                      {%- set c_bd = '1px solid color-mix(in srgb, var(--error-color) 45%, transparent)' -%}
                                      {%- set c_fg = 'var(--error-color)' -%}
                                      {%- set c_mark = '✗' -%}
                                    {%- else -%}
                                      {%- set c_bg = 'var(--secondary-background-color)' -%}
                                      {%- set c_bd = '1px solid transparent' -%}
                                      {%- set c_fg = 'var(--secondary-text-color)' -%}
                                      {%- set c_mark = '' -%}
                                    {%- endif -%}
                                    {%- if n_days <= 7 -%}
                                      {%- set dcount.cells = dcount.cells ~ "<div style='text-align:center;'><div style='font-size:10px;font-weight:700;opacity:.6;text-transform:uppercase;margin-bottom:3px;'>" ~ (d_ts | timestamp_custom('%a')) ~ "</div><div style='height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:" ~ c_bg ~ ";border:" ~ c_bd ~ ";color:" ~ c_fg ~ ";'>" ~ c_mark ~ "</div></div>" -%}
                                    {%- else -%}
                                      {%- set dcount.cells = dcount.cells ~ "<div title='" ~ d_iso ~ "' style='width:18px;height:18px;border-radius:5px;box-sizing:border-box;background:" ~ c_bg ~ ";border:" ~ c_bd ~ ";'></div>" -%}
                                    {%- endif -%}
                                  {%- endfor -%}
                                  {%- set strip_note = "<div style='margin-top:8px;font-size:12px;color:var(--secondary-text-color);'><b style='color:var(--primary-text-color);'>" ~ dcount.done ~ (' of ' ~ n_days if b.day_based else '') ~ "</b> " ~ ('days done' if b.day_based else ('day active' if dcount.done == 1 else 'days active')) ~ "</div>" -%}
                                  {%- if n_days <= 7 -%}
                                    {%- set day_strip = "<div style='margin-top:10px;display:grid;grid-template-columns:repeat(" ~ n_days ~ ",1fr);gap:6px;'>" ~ dcount.cells ~ "</div>" ~ strip_note -%}
                                  {%- else -%}
                                    {%- set day_strip = "<div style='margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;'>" ~ dcount.cells ~ "</div>" ~ strip_note -%}
                                  {%- endif -%}
                                {%- endif -%}
                              {%- endif -%}
                              {%- set sub_txt = bdesc if bdesc | length > 0 else ui.get('complete_to_earn', 'Complete to earn') -%}
                              {%- set row_html = "<div style='position:relative;overflow:hidden;box-sizing:border-box;width:100%;border-radius:16px;border:" ~ ('1px solid var(--warning-color)' if is_urgent else '1px solid var(--divider-color)') ~ ";background:linear-gradient(90deg, color-mix(in srgb, " ~ row_col ~ " 34%, var(--card-background-color)) 0%, color-mix(in srgb, " ~ row_col ~ " 13%, var(--card-background-color)) " ~ pct ~ "%, var(--card-background-color) " ~ pct ~ "%);padding:12px;text-align:left;'>"
                                  ~ "<div style='display:flex;align-items:center;gap:10px;'>" ~ tile
                                  ~ "<div style='flex:1;min-width:0;'><div style='display:flex;align-items:center;gap:6px;flex-wrap:wrap;'><span style='font-size:15px;line-height:1.2;font-weight:800;color:var(--primary-text-color);'>" ~ bname ~ "</span>" ~ badge_html ~ "</div>"
                                  ~ "<div style='font-size:12px;line-height:1.3;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ sub_txt ~ "</div>"
                                  ~ ("<div style='margin-top:3px;font-size:11px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ (bits | join(' &nbsp;·&nbsp; ')) ~ "</div>" if bits | length > 0 else '')
                                  ~ "</div>" ~ reward_pill ~ "</div>" ~ day_strip ~ "</div>" -%}
                              {%- if g == 'daily' -%}
                                {#-- daily goals: compact two-column card with the progress ring on the left --#}
                                {%- set ring_col = 'var(--warning-color)' if is_urgent else row_col -%}
                                {%- set ring_html = "<div style='position:relative;flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:conic-gradient(" ~ ring_col ~ " " ~ pct ~ "%, color-mix(in srgb, var(--secondary-text-color) 25%, transparent) 0);display:flex;align-items:center;justify-content:center;'>"
                                    ~ "<div style='width:39px;height:39px;border-radius:50%;background:var(--card-background-color);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ b.icon ~ "' style='width:20px;height:20px;--mdc-icon-size:20px;color:" ~ ring_col ~ ";display:block;'></ha-icon></div>"
                                    ~ "<span style='position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;line-height:1.3;padding:0 6px;border-radius:999px;background:var(--secondary-background-color);border:1px solid var(--divider-color);color:var(--primary-text-color);'>" ~ pct ~ "%</span></div>" -%}
                                {%- set reward_chip = ("<span style='display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,0.25);color:var(--primary-text-color);'><ha-icon icon='" ~ points_icon ~ "' style='width:11px;height:11px;--mdc-icon-size:11px;color:var(--warning-color, #ffc107);display:block;'></ha-icon>+" ~ ('%g' | format(b.points | round(2))) ~ "</span>") if b.points > 0 else '' -%}
                                {%- set daily_html = "<div style='container-type:inline-size;width:100%;'>" ~ dstyle ~ "<div class='dc' style='display:flex;align-items:center;gap:10px;box-sizing:border-box;width:100%;padding:10px 10px 12px;border-radius:14px;text-align:left;border:" ~ ('1px solid var(--warning-color)' if is_urgent else '1px solid var(--divider-color)') ~ ";background:var(--card-background-color);'>" ~ ring_html
                                    ~ "<div class='dt' style='flex:1;min-width:0;'><div style='font-size:13px;line-height:1.2;font-weight:800;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ bname ~ "</div>"
                                    ~ "<div class='dd' style='font-size:11px;line-height:1.3;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ sub_txt ~ "</div>"
                                    ~ ("<div class='dx' style='display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px;white-space:nowrap;'>" ~ badge_html ~ reward_chip ~ "</div>" if (badge_html | length > 0 or reward_chip | length > 0) else '')
                                    ~ "</div></div></div>" -%}
                                {%- set dgrid.cells = dgrid.cells + [{'eid': b.eid, 'html': daily_html}] -%}
                              {%- else -%}
                                {%- set emit.items = emit.items + [{'eid': b.eid, 'html': row_html, 'head': ghead.v}] -%}
                                {%- set ghead.v = '' -%}
                              {%- endif -%}
                            {%- endfor -%}

                            {%- for idx in gstat.earned -%}
                              {%- set b = ns.badges[idx] -%}
                              {%- set bname = b.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                              {%- set slim_html = "<div style='display:flex;align-items:center;gap:10px;box-sizing:border-box;width:100%;padding:8px 12px;border-radius:14px;background:var(--card-background-color);border:1px solid var(--divider-color);text-align:left;'>"
                                  ~ "<ha-icon icon='" ~ b.icon ~ "' style='flex:0 0 auto;width:20px;height:20px;--mdc-icon-size:20px;color:var(--success-color);display:block;'></ha-icon>"
                                  ~ "<span style='min-width:0;font-size:14px;font-weight:800;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ bname ~ "</span>"
                                  ~ "<span style='margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--secondary-text-color);'>✓ " ~ (b.last_awarded if b.last_awarded | length > 0 else ui.get('earned', 'Earned')) ~ "</span></div>" -%}
                              {%- if g == 'daily' -%}
                                {%- set e_ring = "<div style='position:relative;flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:var(--success-color);display:flex;align-items:center;justify-content:center;'>"
                                    ~ "<div style='width:39px;height:39px;border-radius:50%;background:var(--card-background-color);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ b.icon ~ "' style='width:20px;height:20px;--mdc-icon-size:20px;color:var(--success-color);display:block;'></ha-icon></div>"
                                    ~ "<span style='position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;line-height:1.3;padding:0 6px;border-radius:999px;background:var(--secondary-background-color);border:1px solid var(--success-color);color:var(--success-color);'>✓</span></div>" -%}
                                {%- set e_desc = b.description | trim | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                                {%- set e_html = "<div style='container-type:inline-size;width:100%;'>" ~ dstyle ~ "<div class='dc' style='display:flex;align-items:center;gap:10px;box-sizing:border-box;width:100%;padding:10px 10px 12px;border-radius:14px;text-align:left;border:1px solid color-mix(in srgb, var(--success-color) 45%, transparent);background:color-mix(in srgb, var(--success-color) 10%, var(--card-background-color));'>" ~ e_ring
                                    ~ "<div class='dt' style='flex:1;min-width:0;'><div style='font-size:13px;line-height:1.2;font-weight:800;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ bname ~ "</div>"
                                    ~ "<div class='dd' style='font-size:11px;line-height:1.3;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ (e_desc if e_desc | length > 0 else ui.get('earned', 'Earned')) ~ "</div>"
                                    ~ "<div class='dx' style='display:flex;margin-top:4px;white-space:nowrap;'><span style='font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;background:rgba(34,197,94,0.18);color:var(--success-color);'>✓ " ~ (b.last_awarded if b.last_awarded | length > 0 else ui.get('earned', 'Earned')) ~ "</span></div>"
                                    ~ "</div></div></div>" -%}
                                {%- set dgrid.cells = dgrid.cells + [{'eid': b.eid, 'html': e_html}] -%}
                              {%- else -%}
                                {%- set emit.items = emit.items + [{'eid': b.eid, 'html': slim_html, 'head': ghead.v}] -%}
                                {%- set ghead.v = '' -%}
                              {%- endif -%}
                            {%- endfor -%}

                            {%- if dgrid.cells | length > 0 -%}
                              {%- set emit.items = emit.items + [{'eid': '', 'html': '', 'head': ghead.v, 'cells': dgrid.cells}] -%}
                              {%- set ghead.v = '' -%}
                            {%- endif -%}
                          {%- endfor -%}

                          {%- for it in emit.items -%}
                            {%- if it.get('cells') -%}
                              {%- if it.head | length > 0 -%}
                                {{
                                  {
                                    'type': 'custom:button-card',
                                    'show_name': false,
                                    'show_icon': false,
                                    'show_state': false,
                                    'tap_action': {'action': 'none'},
                                    'custom_fields': {'content': "<div style='width:100%;'>" ~ it.head ~ "</div>"},
                                    'styles': row_styles
                                  }
                                }},
                              {%- endif -%}
                              {%- set gc = namespace(l=[]) -%}
                              {%- for c in it.cells -%}
                                {%- set gc.l = gc.l + [{
                                  'type': 'custom:button-card',
                                  'entity': c.eid,
                                  'show_name': false,
                                  'show_icon': false,
                                  'show_state': false,
                                  'tap_action': {'action': 'more-info'},
                                  'custom_fields': {'content': "<div style='width:100%;'>" ~ c.html ~ "</div>"},
                                  'styles': row_styles
                                }] -%}
                              {%- endfor -%}
                              {{
                                {
                                  'type': 'grid',
                                  'columns': 2,
                                  'square': false,
                                  'cards': gc.l
                                }
                              }},
                            {%- else -%}
                              {{
                                {
                                  'type': 'custom:button-card',
                                  'entity': it.eid,
                                  'show_name': false,
                                  'show_icon': false,
                                  'show_state': false,
                                  'tap_action': {'action': 'more-info'},
                                  'custom_fields': {'content': "<div style='width:100%;'>" ~ it.head ~ it.html ~ "</div>"},
                                  'styles': row_styles
                                }
                              }},
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}

        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== ACHIEVEMENTS CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- 1. User Configuration --#}

                  << template_snippets.user_override_helper >>

                  {%- set pref_default_header_collapsed = false -%}
                  {%- set pref_primary_tint_mix_pct = 14 -%}  {#-- Percent of var(--primary-color) mixed into the main Achievements header background when fill is enabled. Allowed: 0-100. --#}
                  {%- set pref_show_header_background = true -%}  {#-- Set to false to remove the main Achievements header background fill and leave it transparent. Allowed: true, false. --#}
                  {%- set pref_show_header_thin_border = true -%}  {#-- Set to false to remove the thin outer border line. Accent borders are unaffected. Allowed: true, false. --#}


                  {#-- 2. Dynamic Lookups & Validations --#}

                  {%- set pref_default_header_collapsed = (pref_default_header_collapsed | default('false') | string | lower) == 'true' -%}
                  {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
                  {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
                  {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
                  {%- if pref_primary_tint_mix_pct < 0 -%}
                    {%- set pref_primary_tint_mix_pct = 0 -%}
                  {%- elif pref_primary_tint_mix_pct > 100 -%}
                    {%- set pref_primary_tint_mix_pct = 100 -%}
                  {%- endif -%}

                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  {%- if not skip_render -%}

                    {#-- 3. Initialize --#}
                    {%- set ns = namespace(
                      achievements=[]
                    ) -%}

                    {#-- 4. Collect Data --#}
                    {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') or {} -%}
                    {%- set points_sensor = core_sensors.get('points_eid') -%}
                    {%- set points_icon = (state_attr(points_sensor, 'icon') if points_sensor else None) or 'mdi:star-circle' -%}
                    {%- set translation_sensor = (state_attr(dashboard_helper, 'dashboard_helpers') or {}).get('translation_sensor_eid') -%}
                    {%- set ui = state_attr(translation_sensor, 'ui_translations') if translation_sensor else {} -%}
                    {%- set gamification_enabled = state_attr(dashboard_helper, 'gamification_enabled') | default(false, true) -%}
                    {%- set ui_control = state_attr(dashboard_helper, 'ui_control') | default({}, true) -%}
                    {%- set ui_control_key_root = 'gamification/achievements' -%}
                    {%- set ui_control_key_header_collapsed = ui_control_key_root ~ '/header_collapse' -%}
                    {%- set ui_root = namespace(current=ui_control if ui_control is mapping else {}) -%}
                    {%- for segment in ui_control_key_root.split('/') -%}
                      {%- if ui_root.current is mapping -%}
                        {%- set ui_root.current = ui_root.current.get(segment, {}) -%}
                      {%- else -%}
                        {%- set ui_root.current = {} -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set header_collapsed = ui_root.current.get('header_collapse', pref_default_header_collapsed) if ui_root.current is mapping else pref_default_header_collapsed -%}
                    {%- set header_collapsed = header_collapsed | default(pref_default_header_collapsed, true) -%}
                    {%- set integration_entry_id = state_attr(dashboard_helper, 'integration_entry_id') -%}
                    {%- set dashboard_helper_user_id = state_attr(dashboard_helper, 'user_id') -%}
                    {#-- 5. Render --#}
                    {%- if gamification_enabled -%}
                      {{
                        {
                          'type': 'custom:button-card',
                          'name': ui.get('family_goals_heading', 'Family Goals'),
                          'icon': 'mdi:trophy',
                          'show_name': true,
                          'show_icon': true,
                          'tap_action': ({
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {
                              'config_entry_id': integration_entry_id,
                              'user_id': dashboard_helper_user_id,
                              'ui_control_action': 'remove',
                              'key': ui_control_key_header_collapsed
                            }
                          } if header_collapsed and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {
                              'config_entry_id': integration_entry_id,
                              'user_id': dashboard_helper_user_id,
                              'ui_control_action': 'update',
                              'key': ui_control_key_header_collapsed,
                              'value': true
                            }
                          } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                            'action': 'none'
                          }),
                          'hold_action': {'action': 'none'},
                          'custom_fields': {
                            'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                          },
                          'styles': {
                            'card': [
                              {'background': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--card-background-color))') if header_collapsed else 'transparent'},
                              {'box-shadow': 'none'},
                              {'border': '1px solid var(--divider-color)' if header_collapsed else 'none'},
                              {'border-left': '3px solid var(--primary-color)'},
                              {'border-bottom': '3px solid var(--primary-color)'},
                              {'border-radius': '12px'},
                              {'padding': '10px 12px'},
                              {'min-height': 'unset'},
                              {'margin-top': '5px'},
                              {'margin-bottom': '0px'}
                            ],
                            'grid': [
                              {'grid-template-areas': '"i n toggle"'},
                              {'grid-template-columns': 'min-content 1fr min-content'},
                              {'column-gap': '5px'},
                              {'align-items': 'center'}
                            ],
                            'icon': [
                              {'width': '18px'},
                              {'transform': 'translateY(-2px)'},
                              {'color': 'var(--primary-color)'}
                            ],
                            'name': [
                              {'justify-self': 'start'},
                              {'font-size': '14px'},
                              {'font-weight': '700'},
                              {'text-transform': 'uppercase'},
                              {'letter-spacing': '0.4px'},
                              {'color': 'var(--primary-text-color)'}
                            ],
                            'custom_fields': {
                              'toggle': [
                                {'justify-self': 'end'},
                                {'align-self': 'center'}
                              ]
                            }
                          }
                        }
                      }},

                      {%- if not header_collapsed -%}
                        {#-- FAMILY GOALS: sits under the header and hides when it is collapsed --#}
                        {%- set family_sensors = integration_entities('choreops')
                            | select('search', '^sensor\\.')
                            | list
                            | expand
                            | selectattr('attributes.family_contributions', 'defined')
                            | map(attribute='entity_id')
                            | list -%}
                        {#-- Goals that track people (day streaks, everyone-contributes) go first, then the scoreboards --#}
                        {%- set fsort = namespace(top=[], rest=[]) -%}
                        {%- for fe0 in family_sensors -%}
                          {%- if (state_attr(fe0, 'type') or '') | string | lower in ['family_caught_up_days', 'family_active_days', 'family_everyone_contributes'] -%}
                            {%- set fsort.top = fsort.top + [fe0] -%}
                          {%- else -%}
                            {%- set fsort.rest = fsort.rest + [fe0] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- for fe in fsort.top + fsort.rest -%}
                          {%- if states(fe) not in ['unknown', 'unavailable'] -%}
                            {%- set fname = state_attr(fe, 'achievement_name') | default('Family Goal', true) | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                            {%- set fdesc = state_attr(fe, 'description') | default('', true) | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                            {%- set ficon = state_attr(fe, 'icon') or 'mdi:trophy' -%}
                            {%- set ftype = (state_attr(fe, 'type') or '') | string | lower -%}
                            {#-- Day-streak goals count shared days, so they show a level track and no per-person rows --#}
                            {%- set fstreak = ftype in ['family_caught_up_days', 'family_active_days'] -%}
                            {%- set fgrid = fstreak or ftype == 'family_everyone_contributes' -%}
                            {%- set funit = ' days' if fstreak else '' -%}
                            {#-- Time left: only goals that run on the calendar day have a known end (midnight) --#}
                            {%- set secs_left = 86400 - (now().hour * 3600 + now().minute * 60 + now().second) -%}
                            {%- set hrs_left = (secs_left // 3600) | int -%}
                            {%- set mins_left = ((secs_left % 3600) // 60) | int -%}
                            {%- set time_txt = ((hrs_left ~ 'h ' ~ mins_left ~ 'm left') if hrs_left > 0 else (mins_left ~ 'm left')) if ftype in ['family_caught_up_days', 'family_active_days', 'family_chores_in_day'] else '' -%}
                            {%- set time_col = 'var(--warning-color)' if hrs_left < 3 else 'var(--secondary-text-color)' -%}
                            {%- set time_html = ("<div style='display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:10px;font-weight:800;color:" ~ time_col ~ ";white-space:nowrap;'><ha-icon icon='mdi:clock-outline' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" ~ time_txt ~ "</div>") if time_txt else '' -%}
                            {%- set flevels = (state_attr(fe, 'family_levels') or []) | map('float', 0) | list -%}
                            {%- set frewards = (state_attr(fe, 'family_level_rewards') or []) | map('float', 0) | list -%}
                            {%- set flevel = state_attr(fe, 'family_level') | int(0) -%}
                            {%- set fcount = flevels | length -%}
                            {%- set fnext = state_attr(fe, 'family_next_target') | float(0) -%}
                            {%- set ftarget = (fnext if fnext > 0 else (state_attr(fe, 'target_value') | float(0))) | round(0) | int -%}
                            {%- set freward = state_attr(fe, 'family_next_reward') | float(0) | round(0) | int -%}
                            {%- set fmult = state_attr(fe, 'family_top_multiplier') | float(1) -%}
                            {%- set ftotal = state_attr(fe, 'family_total') | float(0) | round(0) | int -%}
                            {#-- A goal that reset for a new period keeps its reached levels but starts a new total, so only call it done while the total is still at the last level --#}
                            {%- set fraw_done = fcount > 0 and flevel >= fcount -%}
                            {%- set fdone = fraw_done and ftotal >= ((flevels | last) | float(0)) -%}
                            {%- set elevel = (fcount - 1) if (fraw_done and not fdone) else flevel -%}
                            {#-- Day-streak goals follow the CURRENT streak: when it breaks, the levels shown start over --#}
                            {%- set scnt = namespace(v=0) -%}
                            {%- if fstreak -%}
                              {%- for lv0 in flevels -%}
                                {%- if lv0 <= ftotal -%}
                                  {%- set scnt.v = scnt.v + 1 -%}
                                {%- endif -%}
                              {%- endfor -%}
                            {%- endif -%}
                            {%- set streak_reset = fstreak and flevel > scnt.v -%}
                            {%- set fdone = ((scnt.v >= fcount and fcount > 0) if fstreak else fdone) -%}
                            {%- set elevel = (scnt.v if fstreak else elevel) -%}
                            {%- set ftarget = (((flevels[elevel] if elevel < fcount else (flevels | last)) | round(0) | int) if (fstreak and fcount > 0) else ftarget) -%}
                            {%- set freward = (((frewards[elevel] | round(0) | int) if elevel < (frewards | length) else 0) if (fstreak and fcount > 0) else freward) -%}
                            {%- set fshares = state_attr(fe, 'family_level_contributions') or state_attr(fe, 'family_contributions') or {} -%}
                            {%- set wtarget = ((flevels | last) if (fdone and fcount > 0) else ftarget) | float(1) | round(0) | int -%}
                            {%- set pidx = (elevel - 1) if not fdone else (fcount - 2) -%}
                            {%- set fprev = ((flevels[pidx] | round(0) | int) if (fcount > 1 and pidx >= 0) else 0) -%}
                            {%- set wspan = [wtarget - fprev, 1] | max -%}
                            {%- set winto = [[ftotal - fprev, 0] | max, wspan] | min -%}
                            {%- set bpct = 100 if fdone else (((winto / wspan) * 100) | round(1)) -%}
                            {%- set togo = [ftarget - ftotal, 0] | max -%}
                            {%- set ftop = (fshares.values() | map('float', 0) | list | max) if fshares else 0 -%}
                            {%- set ntop = (fshares.values() | map('float', 0) | select('equalto', ftop) | list | length) if fshares else 0 -%}
                            {%- set accent = 'var(--success-color)' if fdone else '#8b5cf6' -%}
                            {%- set accent2 = '#86efac' if fdone else '#ec4899' -%}
                            {%- set fbanner = "<div style='font-size:10px;font-weight:800;letter-spacing:0.6px;color:var(--warning-color);margin-bottom:3px;'>" ~ ('STREAK RESET · LEVELS RESET' if streak_reset else 'NEW PERIOD · LEVELS RESET') ~ "</div>" if ((fraw_done and not fdone and not fstreak) or streak_reset) else '' -%}
                            {%- set lvl_txt = ('Level ' ~ (elevel + 1) ~ ' of ' ~ fcount) if (fcount > 1 and not fdone) else ('✓ All ' ~ fcount ~ ' levels' if (fdone and fcount > 1) else '') -%}
                            {%- set sub = '🎉 All levels complete' if fdone else ('<b style="color:' ~ accent ~ ';">' ~ togo ~ (' day' if (funit and togo == 1) else funit) ~ ' to go</b>' ~ (' · +' ~ freward ~ ' ⭐ each' if freward > 0 else '')) -%}
                            {%- set mult_html = ("<div style='font-size:11px;font-weight:700;color:var(--warning-color);line-height:1.35;'>🏆 Top contributor ×" ~ ('%g' | format(fmult)) ~ "</div>") if (fmult > 1 and not fdone) else '' -%}
                            {%- set tile = "<div style='width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg," ~ accent ~ "," ~ accent2 ~ ");display:flex;align-items:center;justify-content:center;flex:0 0 auto;'><ha-icon icon='" ~ ficon ~ "' style='width:22px;height:22px;--mdc-icon-size:22px;color:#fff;display:block;'></ha-icon></div>" -%}

                            {%- set frecord = state_attr(fe, 'family_record') | float(0) | round(0) | int -%}
                            {%- set frecord_day = state_attr(fe, 'family_record_day') or '' -%}
                            {%- set frecord_top = state_attr(fe, 'family_record_top') or [] -%}
                            {%- set rec_html = ("<div style='text-align:center;font-size:11px;color:var(--secondary-text-color);margin:6px 0 2px 0;'>🏆 Record: <b style='color:var(--primary-text-color);'>" ~ frecord ~ funit ~ "</b>" ~ ((" · " ~ (frecord_top | join(', '))) if frecord_top else '') ~ ((" · " ~ frecord_day) if frecord_day else '') ~ "</div>") if frecord > 0 else '' -%}

                            {%- if fgrid -%}
                              {#-- Who is in: a check for everyone who has done their part, the count for the rest --#}
                              {%- set cchips = namespace(v='') -%}
                              {%- if ftype == 'family_everyone_contributes' -%}
                                {%- for pname, pts in fshares.items() | sort(attribute='1', reverse=true) -%}
                                  {%- set p = pts | float(0) | round(0) | int -%}
                                  {%- set p_ok = p >= wtarget -%}
                                  {%- set pname_safe = pname | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                                  {%- set cchips.v = cchips.v ~ "<div style='display:flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:11px;font-weight:700;color:var(--primary-text-color);'><span style='width:20px;height:20px;border-radius:50%;background:" ~ ('var(--success-color)' if p_ok else 'var(--divider-color)') ~ ";display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;'>" ~ ("<ha-icon icon='mdi:check-bold' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon>" if p_ok else p) ~ "</span>" ~ pname_safe ~ "<span style='opacity:0.6;font-weight:600;'>" ~ p ~ "/" ~ wtarget ~ "</span></div>" -%}
                                {%- endfor -%}
                              {%- elif ftype == 'family_caught_up_days' -%}
                                {%- set cstat = state_attr(fe, 'family_caught_up_today') or {} -%}
                                {%- for pname, ptxt in cstat.items() -%}
                                  {%- set p_ok = (ptxt | string).startswith('0 still') -%}
                                  {%- set pname_safe = pname | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                                  {%- set cchips.v = cchips.v ~ "<div style='display:flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:11px;font-weight:700;color:var(--primary-text-color);'><span style='width:20px;height:20px;border-radius:50%;background:" ~ ('var(--success-color)' if p_ok else 'var(--divider-color)') ~ ";display:flex;align-items:center;justify-content:center;color:#fff;'><ha-icon icon='" ~ ('mdi:check-bold' if p_ok else 'mdi:close') ~ "' style='width:12px;height:12px;--mdc-icon-size:12px;display:block;'></ha-icon></span>" ~ pname_safe ~ "</div>" -%}
                                {%- endfor -%}
                              {%- endif -%}
                              {#-- Level track: one node per level, green line fills as levels are reached --#}
                              {%- set nodes = namespace(v='') -%}
                              {#-- Show at most 5 levels; the window slides so the current level sits in the middle with 2 before and 2 after --#}
                              {%- set wcnt = [fcount, 5] | min -%}
                              {%- set cidx = (fcount - 1) if fdone else elevel -%}
                              {%- set wstart = [[cidx - 2, 0] | max, fcount - wcnt] | min -%}
                              {%- if fcount > 1 -%}
                                {%- for lv in flevels -%}
                                  {%- if loop.index0 >= wstart and loop.index0 < wstart + wcnt -%}
                                  {%- set n_reached = fdone or loop.index <= elevel -%}
                                  {%- set n_cur = (not fdone) and loop.index == elevel + 1 -%}
                                  {%- set n_col = 'var(--success-color)' if n_reached else ('#8b5cf6' if n_cur else 'var(--divider-color)') -%}
                                  {%- set n_rw = (frewards[loop.index0] | round(0) | int) if loop.index0 < (frewards | length) else 0 -%}
                                  {%- set nodes.v = nodes.v ~ "<div style='position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;'><div style='width:34px;height:34px;border-radius:50%;border:3px solid " ~ n_col ~ ";background:var(--card-background-color);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ ('mdi:check' if n_reached else 'mdi:star') ~ "' style='width:17px;height:17px;--mdc-icon-size:17px;color:" ~ n_col ~ ";display:block;'></ha-icon></div><div style='font-size:11px;font-weight:800;margin-top:4px;color:" ~ ('var(--primary-text-color)' if n_cur else 'var(--secondary-text-color)') ~ ";'>" ~ (lv | round(0) | int) ~ funit ~ "</div>" ~ ("<div style='font-size:10px;color:var(--secondary-text-color);'>+" ~ n_rw ~ " ⭐</div>" if n_rw > 0 else '') ~ "</div>" -%}
                                  {%- endif -%}
                                {%- endfor -%}
                              {%- endif -%}
                              {%- set tfrac = 1 if fdone else (0 if elevel == 0 else ([([elevel - wstart - 1 + bpct / 100, 0] | max) / ([wcnt - 1, 1] | max), 1] | min)) -%}
                              {%- set tinset = 'calc(100% / ' ~ (wcnt * 2) ~ ')' -%}
                              {%- set fui_v = "<div style='text-align:left;padding:14px 10px;border-radius:18px;margin:2px 0 4px 0;background:linear-gradient(135deg," ~ accent ~ "18," ~ accent2 ~ "10);border:1px solid " ~ accent ~ "66;'>"
                                ~ "<div style='display:flex;align-items:center;gap:10px;padding:0 4px;margin-bottom:12px;'>" ~ tile
                                ~ "<div style='flex:1;min-width:0;'>" ~ fbanner ~ "<div style='font-size:16px;font-weight:800;line-height:1.15;color:var(--primary-text-color);'>" ~ fname ~ "</div><div style='font-size:12px;color:var(--secondary-text-color);line-height:1.3;'>" ~ (fdesc if fdesc else sub) ~ "</div></div>"
                                ~ "<div style='text-align:right;flex:0 0 auto;'><div style='font-size:20px;font-weight:800;line-height:1;color:var(--primary-text-color);'>" ~ ftotal ~ "</div><div style='font-size:10px;opacity:0.65;margin-top:2px;'>/ " ~ wtarget ~ funit ~ "</div>" ~ time_html ~ "</div></div>"
                                ~ (("<div style='position:relative;display:flex;margin-bottom:8px;'><div style='position:absolute;left:" ~ tinset ~ ";right:" ~ tinset ~ ";top:15px;height:4px;border-radius:4px;background:var(--divider-color);'></div><div style='position:absolute;left:" ~ tinset ~ ";width:calc((100% - 2 * " ~ tinset ~ ") * " ~ ('%.3f' | format(tfrac)) ~ ");top:15px;height:4px;border-radius:4px;background:var(--success-color);'></div>" ~ nodes.v ~ "</div>") if fcount > 1 else ("<div style='height:14px;border-radius:999px;background:var(--divider-color);overflow:hidden;margin:0 4px 8px 4px;'><div style='width:" ~ bpct ~ "%;height:100%;border-radius:999px;background:linear-gradient(90deg," ~ accent ~ "," ~ accent2 ~ ");'></div></div>"))
                                ~ ("<div style='text-align:center;font-size:12px;color:var(--secondary-text-color);'>" ~ sub ~ "</div>" if fdesc else '')
                                ~ (("<div style='text-align:center;'>" ~ mult_html ~ "</div>") if mult_html else '')
                                ~ rec_html
                                ~ ("<div style='display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px;'>" ~ cchips.v ~ "</div>" if cchips.v else '')
                                ~ "</div>" -%}
                            {%- else -%}
                              {#-- Scoreboard: goal fill row on top, one fill row per contributor underneath --#}
                              {%- set rows = namespace(v='') -%}
                              {%- for pname, pts in fshares.items() | sort(attribute='1', reverse=true) -%}
                                {%- set p = pts | float(0) | round(0) | int -%}
                                {%- set ppct = ([((p / ftop) * 100) | round(0) | int, 100] | min) if ftop > 0 else 0 -%}
                                {%- set lead = (p > 0 and (pts | float(0)) == ftop and ntop == 1) -%}
                                {%- set pcol = 'var(--warning-color)' if lead else 'var(--primary-color)' -%}
                                {%- set pname_safe = pname | string | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                                {%- set rows.v = rows.v ~ "<div style='position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--divider-color);'>"
                                  ~ "<div style='position:absolute;left:0;top:0;bottom:0;width:" ~ ppct ~ "%;background:linear-gradient(90deg,color-mix(in srgb," ~ pcol ~ " 34%,transparent),color-mix(in srgb," ~ pcol ~ " 10%,transparent));'></div>"
                                  ~ "<div style='position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px;'><div style='width:20px;height:20px;border-radius:50%;background:" ~ pcol ~ ";color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;'>" ~ (pname_safe[:1] | upper) ~ "</div>"
                                  ~ "<span style='flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--primary-text-color);'>" ~ pname_safe ~ (' 🏆' if lead else '') ~ "</span><b style='font-size:12px;color:var(--primary-text-color);'>" ~ p ~ "</b></div></div>" -%}
                              {%- endfor -%}
                              {%- set fui_v = "<div style='text-align:left;padding:10px;border-radius:18px;margin:2px 0 4px 0;background:linear-gradient(135deg," ~ accent ~ "18," ~ accent2 ~ "10);border:1px solid " ~ accent ~ "66;'>"
                                ~ "<div style='position:relative;overflow:hidden;border-radius:16px;margin-bottom:6px;border:1px solid " ~ accent ~ "88;'>"
                                ~ "<div style='position:absolute;left:0;top:0;bottom:0;width:" ~ bpct ~ "%;background:linear-gradient(90deg," ~ accent ~ "77," ~ accent2 ~ "33);'></div>"
                                ~ "<div style='position:relative;display:flex;align-items:center;gap:12px;padding:12px;'>" ~ tile
                                ~ "<div style='flex:1;min-width:0;'>" ~ fbanner ~ "<div style='font-size:15px;font-weight:700;line-height:1.2;color:var(--primary-text-color);'>" ~ fname ~ "</div>" ~ ("<div style='font-size:11px;color:var(--secondary-text-color);line-height:1.35;'>" ~ fdesc ~ "</div>" if fdesc else '') ~ "<div style='font-size:11px;color:var(--secondary-text-color);line-height:1.35;'>" ~ ((lvl_txt ~ ' · ') if lvl_txt else '') ~ sub ~ "</div>" ~ mult_html ~ "</div>"
                                ~ "<div style='flex:0 0 auto;text-align:right;'><div style='display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,0.25);font-size:13px;font-weight:800;color:var(--primary-text-color);white-space:nowrap;'>" ~ ftotal ~ "<span style='opacity:0.6;font-weight:600;'>/" ~ wtarget ~ "</span></div><br>" ~ time_html ~ "</div></div></div>"
                                ~ rec_html ~ "<div style='display:grid;grid-template-columns:1fr 1fr;gap:4px;'>" ~ rows.v ~ "</div></div>" -%}
                            {%- endif -%}

                            {{
                              {
                                'type': 'custom:button-card',
                                'show_name': false,
                                'show_icon': false,
                                'tap_action': {'action': 'none'},
                                'hold_action': {'action': 'none'},
                                'custom_fields': {'content': fui_v},
                                'styles': {
                                  'card': [
                                    {'background': 'transparent'},
                                    {'box-shadow': 'none'},
                                    {'border': 'none'},
                                    {'padding': '0px'},
                                    {'min-height': 'unset'}
                                  ],
                                  'grid': [
                                    {'grid-template-areas': '"content"'},
                                    {'grid-template-columns': '1fr'}
                                  ],
                                  'custom_fields': {
                                    'content': [{'width': '100%'}]
                                  }
                                }
                              }
                            }},
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
        - type: grid
          square: false
          columns: 1
          grid_options:
            columns: full
          cards:
            - type: custom:auto-entities
              show_empty: false
              card:
                square: false
                type: grid
                columns: 1
              card_param: cards
              filter:
                template: |-
                  {#-- ===== RECENT ACTIVITY CARD ===== --#}

                  << template_snippets.meta_stamp >>


                  {#-- 1. User Configuration --#}

                  << template_snippets.user_override_helper >>

                  {%- set pref_default_header_collapsed = false -%}  {#-- Allowed: true, false --#}
                  {%- set pref_primary_tint_mix_pct = 14 -%}  {#-- 0-100: percent of var(--primary-color) mixed into the header background. --#}
                  {%- set pref_activity_count = 5 -%}  {#-- How many recent events to show. Allowed: 1-5. --#}

                  {#-- 2. Dynamic Lookups & Validations --#}

                  {%- set pref_activity_count = [[pref_activity_count | int(default=5), 1] | max, 5] | min -%}
                  << template_snippets.user_setup >>

                  << template_snippets.user_validation >>

                  {%- if not skip_render -%}

                    {#-- 3. Collect Data --#}
                    {%- set items = (state_attr(dashboard_helper, 'recent_activity') or [])[:pref_activity_count] -%}
                    {%- set dashboard_helpers = state_attr(dashboard_helper, 'dashboard_helpers') or {} -%}
                    {%- set translation_sensor = dashboard_helpers.get('translation_sensor_eid') -%}
                    {%- set ui = (state_attr(translation_sensor, 'ui_translations') if translation_sensor else {}) or {} -%}
                    {%- set icons = {'chores': 'mdi:check-circle-outline', 'rewards': 'mdi:gift-outline', 'bonuses': 'mdi:plus-circle-outline', 'penalties': 'mdi:alert-circle-outline', 'badges': 'mdi:medal-outline', 'achievements': 'mdi:trophy-outline', 'challenges': 'mdi:flag-checkered', 'manual': 'mdi:pencil-circle-outline'} -%}

                    {#-- 4. Build Display --#}
                    {%- if items | length > 0 -%}
                      {%- set key_root = 'gamification/points_history' -%}
                      {%- set ui_control = state_attr(dashboard_helper, 'ui_control') | default({}, true) -%}
                      {%- set ui_root = namespace(current=ui_control if ui_control is mapping else {}) -%}
                      {%- for segment in key_root.split('/') -%}
                        {%- set ui_root.current = ui_root.current.get(segment, {}) if ui_root.current is mapping else {} -%}
                      {%- endfor -%}
                      {%- set header_collapsed = (ui_root.current.get('header_collapse', pref_default_header_collapsed) if ui_root.current is mapping else pref_default_header_collapsed) in [true, 'true', 'True'] -%}
                      {%- set integration_entry_id = state_attr(dashboard_helper, 'integration_entry_id') -%}
                      {%- set dashboard_helper_user_id = state_attr(dashboard_helper, 'user_id') -%}
                      {%- set can_save = integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] -%}
                      {{
                        {
                          'type': 'custom:button-card',
                          'name': ui.get('points_history', 'Points history'),
                          'icon': 'mdi:history',
                          'show_name': true,
                          'show_icon': true,
                          'tap_action': ({
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {'config_entry_id': integration_entry_id, 'user_id': dashboard_helper_user_id, 'ui_control_action': 'remove', 'key': key_root ~ '/header_collapse'}
                          } if header_collapsed and can_save else {
                            'action': 'call-service',
                            'service': 'choreops.manage_ui_control',
                            'data': {'config_entry_id': integration_entry_id, 'user_id': dashboard_helper_user_id, 'ui_control_action': 'update', 'key': key_root ~ '/header_collapse', 'value': true}
                          } if can_save else {'action': 'none'}),
                          'hold_action': {'action': 'none'},
                          'custom_fields': {
                            'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                          },
                          'styles': {
                            'card': [
                              {'background': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct | string ~ '%, var(--card-background-color))') if header_collapsed else 'transparent'},
                              {'box-shadow': 'none'},
                              {'border': '1px solid var(--divider-color)' if header_collapsed else 'none'},
                              {'border-left': '3px solid var(--primary-color)'},
                              {'border-bottom': '3px solid var(--primary-color)'},
                              {'border-radius': '12px'},
                              {'padding': '10px 12px'},
                              {'min-height': 'unset'},
                              {'margin-top': '5px'},
                              {'margin-bottom': '0px'}
                            ],
                            'grid': [
                              {'grid-template-areas': '"i n toggle"'},
                              {'grid-template-columns': 'min-content 1fr min-content'},
                              {'column-gap': '5px'},
                              {'align-items': 'center'}
                            ],
                            'icon': [{'width': '18px'}, {'transform': 'translateY(-2px)'}, {'color': 'var(--primary-color)'}],
                            'name': [
                              {'justify-self': 'start'}, {'font-size': '14px'}, {'font-weight': '700'},
                              {'text-transform': 'uppercase'}, {'letter-spacing': '0.4px'}, {'color': 'var(--primary-text-color)'}
                            ],
                            'custom_fields': {'toggle': [{'justify-self': 'end'}, {'align-self': 'center'}]}
                          }
                        }
                      }},
                      {%- if not header_collapsed -%}
                      {%- set rows = namespace(v='') -%}
                      {%- set tag_colors = {'chores': 'var(--success-color)', 'bonuses': 'var(--success-color)', 'penalties': 'var(--error-color)', 'rewards': 'var(--primary-color)', 'badges': 'var(--warning-color)', 'achievements': 'var(--warning-color)', 'challenges': 'var(--warning-color)', 'manual': 'var(--secondary-text-color)'} -%}
                      {%- for it in items -%}
                        {%- set amt = it.get('amount', 0) | float(0) -%}
                        {%- set when = (as_datetime(it.get('timestamp')) | as_local) if it.get('timestamp') else none -%}
                        {%- set days = (now().date() - when.date()).days if when else -1 -%}
                        {%- set when_txt = ('' if when is none else (('Today ' ~ when.strftime('%-I:%M %p')) if days == 0 else (('Yesterday ' ~ when.strftime('%-I:%M %p')) if days == 1 else (when.strftime('%a') if days < 7 else when.strftime('%b %-d'))))) -%}
                        {%- set raw_nm = ((it.get('item_name') or it.get('source_label') or 'Activity') | string) -%}
                        {%- set level_txt = (raw_nm.split(' - Level ')[1].split(' ')[0]) if ' - Level ' in raw_nm else '' -%}
                        {%- set nm = (raw_nm.split(' - Level ')[0]) | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') -%}
                        {%- set lbl = ((it.get('source_label') or '') | string | upper) ~ (' · LEVEL ' ~ level_txt if level_txt else '') -%}
                        {%- set src = it.get('source', '') -%}
                        {%- set tcol = tag_colors.get(src, 'var(--secondary-text-color)') -%}
                        {%- set col = 'var(--success-color)' if amt >= 0 else 'var(--error-color)' -%}
                        {%- set bal_after = it.get('balance_after') -%}
                        {%- set bal_txt = ("<div style='font-size:10px;font-weight:500;opacity:.55;'>→ " ~ ('{:,.0f}'.format(bal_after | float(0))) ~ "</div>") if bal_after is not none else '' -%}
                        {%- set rows.v = rows.v ~ "<div style='display:flex;align-items:center;gap:10px;padding:8px 0;" ~ ('' if loop.first else 'border-top:1px solid var(--divider-color);') ~ "'><div style='width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:" ~ tcol ~ ";background:color-mix(in srgb, " ~ tcol ~ " 16%, var(--card-background-color));'><ha-icon icon='" ~ icons.get(src, 'mdi:circle-outline') ~ "' style='width:20px;height:20px;--mdc-icon-size:20px;display:block;'></ha-icon></div><div style='flex:1;min-width:0;'><div style='font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" ~ nm ~ "</div><div style='font-size:11px;opacity:.8;'><span style='font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:5px;color:" ~ tcol ~ ";background:color-mix(in srgb, " ~ tcol ~ " 16%, var(--card-background-color));'>" ~ lbl ~ "</span><span style='opacity:.65;'>" ~ when_txt ~ "</span></div></div><div style='text-align:right;font-size:13px;font-weight:800;color:" ~ col ~ ";white-space:nowrap;'>" ~ (('+' if amt > 0 else '') ~ ('%g' | format(amt | round(2)))) ~ bal_txt ~ "</div></div>" -%}
                      {%- endfor -%}
                      {%- set ps = state_attr(dashboard_helper, 'points_summary') or {} -%}
                      {%- set today_amt = ps.get('today', 0) | float(0) -%}
                      {%- set week_amt = ps.get('week', 0) | float(0) -%}
                      {%- set chip_css = "font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--secondary-background-color);white-space:nowrap;" -%}
                      {%- set summary = "<div style='display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;'>"
                        ~ "<span style='" ~ chip_css ~ "color:" ~ ('var(--success-color)' if today_amt > 0 else ('var(--error-color)' if today_amt < 0 else 'inherit')) ~ ";'>" ~ ui.get('today', 'Today') ~ " " ~ ('+' if today_amt > 0 else '') ~ '{:,.0f}'.format(today_amt) ~ "</span>"
                        ~ "<span style='" ~ chip_css ~ "'>" ~ ui.get('this_week', 'This week') ~ " " ~ ('+' if week_amt > 0 else '') ~ '{:,.0f}'.format(week_amt) ~ "</span>"
                        ~ "<span style='" ~ chip_css ~ "'>" ~ ui.get('balance', 'Balance') ~ " " ~ '{:,.0f}'.format(ps.get('balance', 0) | float(0)) ~ "</span>"
                        ~ "</div>" -%}
                      {%- set html = "<div style='width:100%;text-align:left;'>" ~ summary ~ rows.v ~ "</div>" -%}
                      {{
                        {
                          'type': 'custom:button-card',
                          'show_name': false,
                          'show_icon': false,
                          'tap_action': {'action': 'none'},
                          'hold_action': {'action': 'none'},
                          'custom_fields': {'content': html},
                          'styles': {
                            'card': [
                              {'padding': '12px'},
                              {'border-radius': '16px'},
                              {'box-shadow': 'none'},
                              {'border': '1px solid var(--divider-color)'},
                              {'background': 'var(--card-background-color)'}
                            ],
                            'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                            'custom_fields': {'content': [{'width': '100%'}]}
                          }
                        }
                      }},
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
