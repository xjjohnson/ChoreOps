type: grid
square: false
columns: 1
grid_options:
  columns: full
cards:
  - type: custom:auto-entities
    card:
      square: false
      type: grid
      columns: 1
    card_param: cards
    filter:
      template: |-
        {%- set override_dashboard_helper = '' -%}
        {%- set use_override_dashboard_helper = override_dashboard_helper != '' -%}
        {%- if use_override_dashboard_helper -%}
          {%- set dashboard_helper = override_dashboard_helper -%}
        {%- endif -%}
        {%- set pref_show_next_higher_badge = true -%}
        {%- set pref_show_next_lower_badge = true -%}
        {%- set pref_default_header_collapsed = false -%}
        {%- set pref_primary_tint_mix_pct = 14 -%}
        {%- set pref_show_header_background = true -%}
        {%- set pref_show_header_thin_border = true -%}
        {%- set pref_show_next_higher_badge = (pref_show_next_higher_badge | default('true') | string | lower) == 'true' -%}
        {%- set pref_show_next_lower_badge = (pref_show_next_lower_badge | default('true') | string | lower) == 'true' -%}
        {%- set pref_default_header_collapsed = (pref_default_header_collapsed | default('false') | string | lower) == 'true' -%}
        {%- set pref_primary_tint_mix_pct = pref_primary_tint_mix_pct | int(default=14) -%}
        {%- set pref_show_header_background = (pref_show_header_background | default('true') | string | lower) == 'true' -%}
        {%- set pref_show_header_thin_border = (pref_show_header_thin_border | default('true') | string | lower) == 'true' -%}
        {%- if pref_primary_tint_mix_pct < 0 -%}
          {%- set pref_primary_tint_mix_pct = 0 -%}
        {%- elif pref_primary_tint_mix_pct > 100 -%}
          {%- set pref_primary_tint_mix_pct = 100 -%}
        {%- endif -%}
        {%- set fallback_name = 'Dad' -%}
        {%- set name = fallback_name -%}
        {%- set user_id = '503f6b0b-b26b-40ad-8dcd-e1af4c0b4375' -%}
        {%- set entry_id = '01KZESQQXYB3BWHZ45CZQTDGHE' -%}
        {%- set lookup_key = entry_id ~ ':' ~ user_id -%}
        {%- if not (use_override_dashboard_helper | default(false, true)) -%}
          {%- set dashboard_helper = integration_entities('choreops')
              | select('search', '^sensor\\.')
              | list
              | expand
              | selectattr('attributes.purpose', 'defined')
              | selectattr('attributes.purpose', 'eq', 'purpose_dashboard_helper')
              | selectattr('attributes.dashboard_lookup_key', 'eq', lookup_key)
              | map(attribute='entity_id')
              | first
              | default("err-dashboard_helper_missing", true) -%}
        {%- endif -%}
        {%- set resolved_name = (state_attr(dashboard_helper, 'user_name') if dashboard_helper not in ['err-dashboard_helper_missing', '', None] else '') | default('', true) -%}
        {%- if resolved_name != '' -%}
          {%- set name = resolved_name -%}
        {%- endif -%}
        {%- if name == '' -%}
          {{
            {
              'type': 'markdown',
              'content': "⚠️ **Dashboard Not Configured**\n\nNo user context is available for this card.\n\nReload ChoreOps and regenerate dashboards if this persists."
            }
          }},
          {%- set skip_render = true -%}
        {%- elif states(dashboard_helper) in ['unknown', 'unavailable'] -%}
          {{
            {
              'type': 'markdown',
              'content': "⚠️ **Dashboard Configuration Error**\n\nCannot find: `" ~ dashboard_helper ~ "`\n\nThe dashboard helper is unavailable for this user."
            }
          }},
          {%- set skip_render = true -%}
        {%- else -%}
          {%- set skip_render = false -%}
        {%- endif -%}
        {%- if not skip_render -%}
          {%- macro format_points(value, mode='fixed_0') -%}
            {%- set numeric = value | float(default=0) | round(2) -%}
            {%- if mode == 'adaptive' -%}
              {{- numeric | string | regex_replace('\.?0+$', '') -}}
            {%- elif mode == 'fixed_1' -%}
              {{- '%.1f' | format(numeric) -}}
            {%- elif mode == 'fixed_2' -%}
              {{- '%.2f' | format(numeric) -}}
            {%- else -%}
              {{- '%.0f' | format(numeric) -}}
            {%- endif -%}
          {%- endmacro -%}
          {%- set ns = namespace(
            badges=[],
            points_earned_all_time=0,
            points_label='Points',
            m_frequency='',
            m_status='active',
            m_cycle_pts=0,
            m_end_date='',
            m_grace_end='',
            m_remaining=0,
            m_required=0,
            m_last_awarded='',
            m_award_count=0,
            points_to_next=0,
            current_badge_eid='',
            highest_earned_badge_eid='',
            next_higher_badge_eid='',
            next_lower_badge_eid='',
            has_earned_any=false
          ) -%}
          {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') or {} -%}
          {%- set dashboard_helpers = state_attr(dashboard_helper, 'dashboard_helpers') or {} -%}
          {%- set dashboard_config = state_attr(dashboard_helper, 'dashboard_config') or {} -%}
          {%- set points_sensor = core_sensors.get('points_eid') -%}
          {%- set badges_sensor = core_sensors.get('badges_eid') -%}
          {%- set pref_points_precision = dashboard_config.get('points_precision', 'fixed_0') if dashboard_config is mapping else 'fixed_0' -%}
          {%- set pref_points_precision = pref_points_precision | default('fixed_0') | string | lower -%}
          {%- if pref_points_precision not in ['fixed_0', 'adaptive', 'fixed_1', 'fixed_2'] -%}
            {%- set pref_points_precision = 'fixed_0' -%}
          {%- endif -%}
          {%- set translation_sensor = dashboard_helpers.get('translation_sensor_eid') -%}
          {%- set ui = state_attr(translation_sensor, 'ui_translations') if translation_sensor else {} -%}
          {%- set gamification_enabled = state_attr(dashboard_helper, 'gamification_enabled') | default(false, true) -%}
          {%- set ns.points_earned_all_time = (state_attr(points_sensor, 'point_stat_points_earned_all_time') | float(default=0)) if points_sensor else 0 -%}
          {%- set ns.points_label = (state_attr(points_sensor, 'unit_of_measurement') if points_sensor else None) or 'Points' -%}
          {%- set points_icon = (state_attr(points_sensor, 'icon') if points_sensor else None) or 'mdi:star-circle' -%}
          {%- set ui_control = state_attr(dashboard_helper, 'ui_control') | default({}, true) -%}
          {%- set ui_control_key_root = 'gamification/cumulative' -%}
          {%- set ui_control_key_header_collapsed = ui_control_key_root ~ '/header_collapse' -%}
          {%- set ui_control_key_settings_open = ui_control_key_root ~ '/settings_open' -%}
          {%- set ui_control_key_show_next_higher_badge = ui_control_key_root ~ '/show_next_higher_badge' -%}
          {%- set ui_control_key_show_next_lower_badge = ui_control_key_root ~ '/show_next_lower_badge' -%}
          {%- set ui_root = namespace(current=ui_control if ui_control is mapping else {}) -%}
          {%- for segment in ui_control_key_root.split('/') -%}
            {%- if ui_root.current is mapping -%}
              {%- set ui_root.current = ui_root.current.get(segment, {}) -%}
            {%- else -%}
              {%- set ui_root.current = {} -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set header_collapsed = ui_root.current.get('header_collapse', pref_default_header_collapsed) if ui_root.current is mapping else pref_default_header_collapsed -%}
          {%- set header_collapsed = header_collapsed | default(pref_default_header_collapsed, true) -%}
          {%- set settings_open = ui_root.current.get('settings_open', false) if ui_root.current is mapping else false -%}
          {%- set settings_open = (settings_open | string | lower) == 'true' -%}
          {%- set effective_show_next_higher_badge = ui_root.current.get('show_next_higher_badge', pref_show_next_higher_badge) if ui_root.current is mapping else pref_show_next_higher_badge -%}
          {%- set effective_show_next_higher_badge = (effective_show_next_higher_badge | string | lower) == 'true' -%}
          {%- set effective_show_next_lower_badge = ui_root.current.get('show_next_lower_badge', pref_show_next_lower_badge) if ui_root.current is mapping else pref_show_next_lower_badge -%}
          {%- set effective_show_next_lower_badge = (effective_show_next_lower_badge | string | lower) == 'true' -%}
          {%- set integration_entry_id = state_attr(dashboard_helper, 'integration_entry_id') -%}
          {%- set dashboard_helper_user_id = state_attr(dashboard_helper, 'user_id') -%}
          {%- if badges_sensor -%}
            {%- set hb_attrs = states[badges_sensor].attributes | default({}, true) -%}
            {%- set hb_reset_schedule = hb_attrs.get('reset_schedule') if hb_attrs.get('reset_schedule') is mapping else {} -%}
            {%- set ns.points_to_next = hb_attrs.get('points_to_next_badge', 0) | int(default=0) -%}
            {%- set ns.m_status = hb_attrs.get('badge_status', 'active') | default('active') -%}
            {%- set ns.m_frequency = ((hb_attrs.get('recurring_frequency') or hb_reset_schedule.get('recurring_frequency') or '') | string | lower) -%}
            {%- set ns.m_cycle_pts = hb_attrs.get('cycle_points', 0) | int(default=0) -%}
            {%- set ns.m_end_date = (hb_attrs.get('maintenance_end_date') | default('', true) | string | regex_replace('T.*$', '')) -%}
            {%- set ns.m_grace_end = (hb_attrs.get('maintenance_grace_end_date') | default('', true) | string | regex_replace('T.*$', '')) -%}
            {%- set ns.m_required = hb_attrs.get('maintenance_points_required', 0) | int(default=0) -%}
            {%- set ns.m_remaining = hb_attrs.get('maintenance_points_remaining', 0) | int(default=0) -%}
            {%- set ns.m_last_awarded = hb_attrs.get('last_awarded_date') | default('', true) -%}
            {%- set ns.m_award_count = hb_attrs.get('award_count', 0) | int(default=0) -%}
            {%- set ns.current_badge_eid = hb_attrs.get('current_badge_eid') | default('', true) -%}
            {%- set ns.highest_earned_badge_eid = hb_attrs.get('highest_earned_badge_eid') | default('', true) -%}
            {%- set ns.next_higher_badge_eid = hb_attrs.get('next_higher_badge_eid') | default('', true) -%}
            {%- set ns.next_lower_badge_eid = hb_attrs.get('next_lower_badge_eid') | default('', true) -%}
            {%- set ns.has_earned_any = ns.current_badge_eid not in ['', 'None', 'unknown', 'unavailable', none] -%}
            {%- set middle_badge_eid = ns.current_badge_eid -%}
            {%- if ns.m_status == 'demoted' and ns.highest_earned_badge_eid not in ['', 'None', 'unknown', 'unavailable', none] -%}
              {%- set middle_badge_eid = ns.highest_earned_badge_eid -%}
            {%- endif -%}
            {%- if ns.next_lower_badge_eid == middle_badge_eid -%}
              {%- set ns.next_lower_badge_eid = '' -%}
            {%- endif -%}
            {%- set badge_entries = [
              {'eid': middle_badge_eid, 'role': 'current', 'earned': true}
            ] -%}
            {%- if effective_show_next_higher_badge -%}
              {%- set badge_entries = [
                {'eid': ns.next_higher_badge_eid, 'role': 'next_higher', 'earned': false}
              ] + badge_entries -%}
            {%- endif -%}
            {%- if effective_show_next_lower_badge -%}
              {%- set badge_entries = badge_entries + [
                {'eid': ns.next_lower_badge_eid, 'role': 'next_lower', 'earned': true}
              ] -%}
            {%- endif -%}
            {%- for entry in badge_entries -%}
              {%- set badge_eid = entry.eid -%}
              {%- if badge_eid not in ['', 'None', 'unknown', 'unavailable', none] and states(badge_eid) not in ['unknown', 'unavailable'] -%}
                {%- set badge_attrs = states[badge_eid].attributes | default({}, true) -%}
                {%- set target_data = badge_attrs.get('target') if badge_attrs.get('target') is mapping else {} -%}
                {%- set threshold_val = 0 -%}
                {%- set maintenance_points = 0 -%}
                {%- if target_data is mapping -%}
                  {%- set threshold_val = target_data.threshold_value | float(default=0) -%}
                  {%- set maintenance_points = target_data.maintenance_rules | int(default=0) -%}
                {%- else -%}
                  {%- set threshold_val = badge_attrs.get('threshold_value', 0) | float(default=0) -%}
                {%- endif -%}
                {%- set awards_data = badge_attrs.get('awards') if badge_attrs.get('awards') is mapping else {} -%}
                {%- set award_points_attr = badge_attrs.get('award_points', 0) | float(default=0) -%}
                {%- set points_multiplier_attr = badge_attrs.get('points_multiplier', 0) | float(default=0) -%}
                {%- set award_points = awards_data.get('award_points', award_points_attr) | float(default=award_points_attr) -%}
                {%- set points_multiplier = awards_data.get('points_multiplier', points_multiplier_attr) | float(default=points_multiplier_attr) -%}
                {%- set award_rewards = awards_data.get('rewards') if awards_data.get('rewards') is iterable and awards_data.get('rewards') is not string else [] -%}
                {%- set award_bonuses = awards_data.get('bonuses') if awards_data.get('bonuses') is iterable and awards_data.get('bonuses') is not string else [] -%}
                {%- set award_penalties = awards_data.get('penalties') if awards_data.get('penalties') is iterable and awards_data.get('penalties') is not string else [] -%}
                {%- set raw_earned = badge_attrs.get('assignees_earned') -%}
                {%- set earned_list = [] -%}
                {%- if raw_earned is string -%}
                  {%- set earned_list = [raw_earned] -%}
                {%- elif raw_earned is iterable and raw_earned is not string and raw_earned is not none -%}
                  {%- set earned_list = raw_earned -%}
                {%- endif -%}
                {%- set badge_info = {
                  'entity_id': badge_eid,
                  'name': ((badge_attrs.get('badge_name') or badge_attrs.get('friendly_name') or '') | string) | regex_replace('^Badge - ', ''),
                  'icon': badge_attrs.get('icon') | default('mdi:medal-outline', true),
                  'description': (badge_attrs.get('description') or '') | string,
                  'last_awarded': (badge_attrs.get('last_awarded_date') or '') | string,
                  'threshold': threshold_val | int,
                  'award_points': award_points,
                  'points_multiplier': points_multiplier,
                  'award_rewards': award_rewards,
                  'award_bonuses': award_bonuses,
                  'award_penalties': award_penalties,
                  'assignees_earned': earned_list,
                  'maintenance': maintenance_points,
                  'role': entry.role,
                  'earned': entry.earned
                } -%}
                {%- set ns.badges = ns.badges + [badge_info] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {%- if gamification_enabled -%}
            {{
              {
                'type': 'custom:button-card',
                'name': ui.get('ranks', 'err-ranks'),
                'icon': 'mdi:medal-outline',
                'show_name': true,
                'show_icon': true,
                'tap_action': ({
                  'action': 'call-service',
                  'service': 'choreops.manage_ui_control',
                  'data': {
                    'config_entry_id': integration_entry_id,
                    'user_id': dashboard_helper_user_id,
                    'ui_control_action': 'remove',
                    'key': ui_control_key_header_collapsed
                  }
                } if header_collapsed and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                  'action': 'call-service',
                  'service': 'choreops.manage_ui_control',
                  'data': {
                    'config_entry_id': integration_entry_id,
                    'user_id': dashboard_helper_user_id,
                    'ui_control_action': 'update',
                    'key': ui_control_key_header_collapsed,
                    'value': true
                  }
                } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                  'action': 'none'
                }),
                'hold_action': {'action': 'none'},
                'custom_fields': {
                  'gear': {
                    'card': {
                      'type': 'custom:button-card',
                      'icon': 'mdi:cog-outline',
                      'show_name': false,
                      'show_icon': true,
                      'tap_action': ({
                        'action': 'call-service',
                        'service': 'choreops.manage_ui_control',
                        'data': {
                          'config_entry_id': integration_entry_id,
                          'user_id': dashboard_helper_user_id,
                          'ui_control_action': 'remove',
                          'key': ui_control_key_settings_open
                        }
                      } if settings_open and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                        'action': 'call-service',
                        'service': 'choreops.manage_ui_control',
                        'data': {
                          'config_entry_id': integration_entry_id,
                          'user_id': dashboard_helper_user_id,
                          'ui_control_action': 'update',
                          'key': ui_control_key_settings_open,
                          'value': true
                        }
                      } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                        'action': 'none'
                      }),
                      'hold_action': {'action': 'none'},
                      'styles': {
                        'card': [
                          {'width': '30px'},
                          {'height': '30px'},
                          {'border-radius': '50%'},
                          {'background': ('color-mix(in srgb, var(--primary-color) 12%, var(--card-background-color))') if settings_open else 'transparent'},
                          {'border': '1px solid var(--divider-color)'},
                          {'box-shadow': 'none'}
                        ],
                        'icon': [
                          {'width': '16px'},
                          {'color': 'var(--primary-color)'}
                        ]
                      }
                    }
                  },
                  'toggle': "<ha-icon icon='" ~ ('mdi:chevron-down' if header_collapsed else 'mdi:chevron-up') ~ "' style='width:18px;height:18px;color: var(--primary-color);'></ha-icon>"
                },
                'styles': {
                  'card': [
                    {'background': ('color-mix(in srgb, var(--primary-color) ' ~ pref_primary_tint_mix_pct|string ~ '%, var(--card-background-color))') if header_collapsed else 'transparent'},
                    {'box-shadow': 'none'},
                    {'border': '1px solid var(--divider-color)' if header_collapsed else 'none'},
                    {'border-left': '3px solid var(--primary-color)'},
                    {'border-bottom': '3px solid var(--primary-color)'},
                    {'border-radius': '10px'},
                    {'padding': '10px 12px'},
                    {'min-height': 'unset'},
                    {'margin-top': '5px'},
                    {'margin-bottom': '0px'}
                  ],
                  'grid': [
                    {'grid-template-areas': '"i n gear toggle"'},
                    {'grid-template-columns': 'min-content 1fr min-content min-content'},
                    {'column-gap': '5px'},
                    {'align-items': 'center'}
                  ],
                  'icon': [
                    {'width': '18px'},
                    {'transform': 'translateY(-2px)'},
                    {'color': 'var(--primary-color)'}
                  ],
                  'name': [
                    {'justify-self': 'start'},
                    {'font-size': '14px'},
                    {'font-weight': '700'},
                    {'text-transform': 'uppercase'},
                    {'letter-spacing': '0.4px'},
                    {'color': 'var(--primary-text-color)'}
                  ],
                  'custom_fields': {
                    'gear': [
                      {'justify-self': 'end'},
                      {'align-self': 'center'},
                      {'display': 'none' if header_collapsed else 'block'}
                    ],
                    'toggle': [
                      {'justify-self': 'end'},
                      {'align-self': 'center'}
                    ]
                  }
                }
              }
            }},
            {%- if not header_collapsed -%}
              {%- if settings_open -%}
                {{
                  {
                    'type': 'vertical-stack',
                    'cards': [
                      {
                        'type': 'custom:button-card',
                        'name': ui.get('configure', 'err-configure'),
                        'icon': 'mdi:tune-variant',
                        'show_name': true,
                        'show_icon': true,
                        'tap_action': {'action': 'none'},
                        'styles': {
                          'card': [
                            {'background': 'var(--secondary-background-color)'},
                            {'box-shadow': 'none'},
                            {'border': '1px solid var(--divider-color)'},
                            {'border-radius': '12px 12px 0 0'},
                            {'padding': '8px 12px 6px 12px'}
                          ],
                          'grid': [
                            {'grid-template-areas': '"i n"'},
                            {'grid-template-columns': 'min-content 1fr'},
                            {'column-gap': '6px'},
                            {'align-items': 'center'}
                          ],
                          'icon': [
                            {'width': '16px'},
                            {'color': 'var(--primary-color)'}
                          ],
                          'name': [
                            {'justify-self': 'start'},
                            {'font-size': '12px'},
                            {'font-weight': '700'},
                            {'text-transform': 'uppercase'},
                            {'letter-spacing': '0.6px'},
                            {'color': 'var(--primary-text-color)'}
                          ]
                        }
                      },
                      {
                        'type': 'grid',
                        'columns': 2,
                        'square': false,
                        'cards': [
                          {
                            'type': 'custom:button-card',
                            'name': ui.get('hide_next_higher_badge', 'err-hide_next_higher_badge') if effective_show_next_higher_badge else ui.get('show_next_higher_badge', 'err-show_next_higher_badge'),
                            'icon': 'mdi:arrow-up-bold-circle' if effective_show_next_higher_badge else 'mdi:arrow-up-bold-circle-outline',
                            'show_name': true,
                            'show_icon': true,
                            'tap_action': ({
                              'action': 'call-service',
                              'service': 'choreops.manage_ui_control',
                              'data': {
                                'config_entry_id': integration_entry_id,
                                'user_id': dashboard_helper_user_id,
                                'ui_control_action': 'remove',
                                'key': ui_control_key_show_next_higher_badge
                              }
                            } if (not effective_show_next_higher_badge) == pref_show_next_higher_badge and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                              'action': 'call-service',
                              'service': 'choreops.manage_ui_control',
                              'data': {
                                'config_entry_id': integration_entry_id,
                                'user_id': dashboard_helper_user_id,
                                'ui_control_action': 'update',
                                'key': ui_control_key_show_next_higher_badge,
                                'value': (not effective_show_next_higher_badge)
                              }
                            } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                              'action': 'none'
                            }),
                            'styles': {
                              'card': [
                                {'background': ('color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))') if effective_show_next_higher_badge else 'var(--card-background-color)'},
                                {'box-shadow': 'none'},
                                {'border': '1px solid var(--primary-color)' if effective_show_next_higher_badge else '1px solid var(--divider-color)'},
                                {'border-radius': '0 0 0 12px'},
                                {'padding': '10px 8px'}
                              ],
                              'grid': [
                                {'grid-template-areas': '"i" "n"'},
                                {'grid-template-columns': '1fr'},
                                {'row-gap': '4px'}
                              ],
                              'icon': [
                                {'width': '18px'},
                                {'color': 'var(--primary-color)'}
                              ],
                              'name': [
                                {'font-size': '12px'},
                                {'font-weight': '700'},
                                {'color': 'var(--primary-text-color)'},
                                {'white-space': 'normal'},
                                {'line-height': '1.2'}
                              ]
                            }
                          },
                          {
                            'type': 'custom:button-card',
                            'name': ui.get('hide_next_lower_badge', 'err-hide_next_lower_badge') if effective_show_next_lower_badge else ui.get('show_next_lower_badge', 'err-show_next_lower_badge'),
                            'icon': 'mdi:arrow-down-bold-circle' if effective_show_next_lower_badge else 'mdi:arrow-down-bold-circle-outline',
                            'show_name': true,
                            'show_icon': true,
                            'tap_action': ({
                              'action': 'call-service',
                              'service': 'choreops.manage_ui_control',
                              'data': {
                                'config_entry_id': integration_entry_id,
                                'user_id': dashboard_helper_user_id,
                                'ui_control_action': 'remove',
                                'key': ui_control_key_show_next_lower_badge
                              }
                            } if (not effective_show_next_lower_badge) == pref_show_next_lower_badge and integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                              'action': 'call-service',
                              'service': 'choreops.manage_ui_control',
                              'data': {
                                'config_entry_id': integration_entry_id,
                                'user_id': dashboard_helper_user_id,
                                'ui_control_action': 'update',
                                'key': ui_control_key_show_next_lower_badge,
                                'value': (not effective_show_next_lower_badge)
                              }
                            } if integration_entry_id not in ['', none] and dashboard_helper_user_id not in ['', none] else {
                              'action': 'none'
                            }),
                            'styles': {
                              'card': [
                                {'background': ('color-mix(in srgb, var(--primary-color) 14%, var(--card-background-color))') if effective_show_next_lower_badge else 'var(--card-background-color)'},
                                {'box-shadow': 'none'},
                                {'border': '1px solid var(--primary-color)' if effective_show_next_lower_badge else '1px solid var(--divider-color)'},
                                {'border-radius': '0 0 12px 0'},
                                {'padding': '10px 8px'}
                              ],
                              'grid': [
                                {'grid-template-areas': '"i" "n"'},
                                {'grid-template-columns': '1fr'},
                                {'row-gap': '4px'}
                              ],
                              'icon': [
                                {'width': '18px'},
                                {'color': 'var(--primary-color)'}
                              ],
                              'name': [
                                {'font-size': '12px'},
                                {'font-weight': '700'},
                                {'color': 'var(--primary-text-color)'},
                                {'white-space': 'normal'},
                                {'line-height': '1.2'}
                              ]
                            }
                          }
                        ]
                      }
                    ]
                  }
                }},
              {%- endif -%}
              {%- if ns.badges | length == 0 -%}
                {{
                  {
                    'type': 'custom:button-card',
                    'name': ui.get('no_badges_found', 'err-no_badges_found'),
                    'label': ui.get('cumulative_badge_setup_prompt', 'err-cumulative_badge_setup_prompt'),
                    'icon': 'mdi:medal-outline',
                    'show_name': true,
                    'show_icon': true,
                    'show_label': true,
                    'tap_action': {'action': 'none'},
                    'styles': {
                      'card': [
                        {'background': 'var(--secondary-background-color)'},
                        {'box-shadow': 'none'},
                        {'border': '1px solid var(--divider-color)'},
                        {'border-radius': '12px'},
                        {'padding': '10px 12px'}
                      ],
                      'grid': [
                        {'grid-template-areas': '"i n" "i l"'},
                        {'grid-template-columns': 'min-content 1fr'},
                        {'gap': '8px'},
                        {'align-items': 'center'}
                      ],
                      'icon': [
                        {'width': '18px'},
                        {'color': 'var(--secondary-text-color)'}
                      ],
                      'name': [
                        {'justify-self': 'start'},
                        {'font-size': '13px'},
                        {'font-weight': '600'},
                        {'color': 'var(--secondary-text-color)'}
                      ],
                      'label': [
                        {'justify-self': 'start'},
                        {'font-size': '11px'},
                        {'line-height': '1.3'},
                        {'color': 'var(--secondary-text-color)'},
                        {'white-space': 'normal'}
                      ]
                    }
                  }
                }},
              {%- else -%}
                {%- for badge in ns.badges -%}
                  {%- set is_current = badge.role == 'current' -%}
                  {%- set is_target = badge.role == 'next_higher' -%}
                  {%- set req_pts = ns.m_required if ns.m_required > 0 else badge.maintenance -%}
                  {%- set bname = badge.name | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                  {%- set bdesc = badge.description | trim | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') | replace('"', '&quot;') | replace("'", '&#39;') -%}
                  {%- if is_current -%}
                    {%- set accent = 'var(--warning-color)' if ns.m_status == 'grace' else ('var(--error-color)' if ns.m_status == 'demoted' else 'var(--success-color)') -%}
                    {%- set role_label = ui.get('current_rank', 'Your rank') -%}
                    {%- set pill_text = ui.get('grace_period', 'Grace period') if ns.m_status == 'grace' else (ui.get('demoted', 'Demoted') if ns.m_status == 'demoted' else ui.get('active', 'Active')) -%}
                  {%- elif is_target -%}
                    {%- set accent = 'var(--primary-color)' -%}
                    {%- set role_label = ui.get('next_rank', 'Next rank') -%}
                    {%- set pill_text = '🔒 ' ~ ui.get('future_goal', 'Locked') -%}
                  {%- else -%}
                    {%- set accent = 'var(--secondary-text-color)' -%}
                    {%- set role_label = ui.get('previous_rank', 'Previous rank') -%}
                    {%- set pill_text = '✓ ' ~ ui.get('earned', 'Earned') -%}
                  {%- endif -%}
                  {%- set pct = 100 -%}
                  {%- set prog_label = '' -%}
                  {%- set prog_value = '' -%}
                  {%- set prog_note = '' -%}
                  {%- set prog_color = accent -%}
                  {%- set show_bar = false -%}
                  {%- if is_current and req_pts > 0 -%}
                    {%- set pct = [[(ns.m_cycle_pts / req_pts * 100) | round(0) | int, 0] | max, 100] | min -%}
                    {%- set show_bar = true -%}
                    {%- set prog_color = 'var(--warning-color)' if ns.m_status in ['grace', 'demoted'] else ('var(--success-color)' if ns.m_remaining <= 0 else 'var(--primary-color)') -%}
                    {%- set prog_label = ui.get('maintenance', 'Maintenance') -%}
                    {%- set prog_value = (format_points(ns.m_cycle_pts, pref_points_precision) | trim) ~ ' / ' ~ (format_points(req_pts, pref_points_precision) | trim) -%}
                    {%- set due_short = (as_timestamp(ns.m_end_date ~ 'T12:00:00') | timestamp_custom('%b %d')) if ns.m_end_date not in ['', none] else '' -%}
                    {%- set grace_short = (as_timestamp(ns.m_grace_end ~ 'T12:00:00') | timestamp_custom('%b %d')) if ns.m_grace_end not in ['', none] else '' -%}
                    {%- set by_date = grace_short if (ns.m_status == 'grace' and grace_short | length > 0) else due_short -%}
                    {%- if ns.m_remaining <= 0 -%}
                      {%- set prog_note = "<span style='color:var(--success-color);font-weight:800;'>✓ " ~ ui.get('maintenance_met', 'Maintenance met') ~ "</span>" -%}
                    {%- else -%}
                      {%- set prog_note = "<span style='color:" ~ prog_color ~ ";font-weight:800;'>" ~ ui.get('need', 'Need') ~ ' ' ~ (format_points(ns.m_remaining, pref_points_precision) | trim) ~ ' ' ~ ns.points_label ~ "</span>" ~ ((" <span style='opacity:0.75;'>" ~ (ui.get('grace_period', 'Grace') if ns.m_status == 'grace' else ui.get('by', 'by')) ~ ' ' ~ by_date ~ "</span>") if by_date | length > 0 else '') -%}
                    {%- endif -%}
                    {%- if ns.m_frequency not in ['', 'none'] -%}
                      {%- set prog_note = prog_note ~ " <span style='opacity:0.75;'>• ↻ " ~ ui.get(ns.m_frequency, ns.m_frequency | replace('_', ' ') | title) ~ "</span>" -%}
                    {%- endif -%}
                    {%- if ns.m_status == 'demoted' -%}
                      {%- set cur_mult = (state_attr(points_sensor, 'points_multiplier') | float(default=0)) if points_sensor else 0 -%}
                      {%- if cur_mult > 0 -%}
                        {%- set prog_note = prog_note ~ " <span style='color:var(--error-color);font-weight:700;'>• ×" ~ ('%g' | format(cur_mult | round(2))) ~ ' ' ~ ui.get('multiplier', 'multiplier') ~ "</span>" -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- elif is_target and badge.threshold > 0 -%}
                    {%- set to_go = ns.points_to_next if ns.has_earned_any else (((badge.threshold - ns.points_earned_all_time) | float(default=0) | round(0, 'ceil')) | int) -%}
                    {%- set to_go = [to_go, 0] | max -%}
                    {%- set have = [badge.threshold - to_go, 0] | max -%}
                    {%- set pct = [((have / badge.threshold) * 100) | round(0) | int, 100] | min -%}
                    {%- set show_bar = true -%}
                    {%- set prog_label = ui.get('to_unlock', 'To unlock') -%}
                    {%- set prog_value = (format_points(have, pref_points_precision) | trim) ~ ' / ' ~ (format_points(badge.threshold, pref_points_precision) | trim) -%}
                    {%- set prog_note = "<span style='font-weight:800;color:var(--primary-color);'>" ~ (format_points(to_go, pref_points_precision) | trim) ~ ' ' ~ ns.points_label ~ ' ' ~ ui.get('to_go', 'to go') ~ "</span>" -%}
                  {%- endif -%}
                  {%- set pill_style = "display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb, var(--primary-color) 12%, transparent);font-size:11px;font-weight:700;color:var(--primary-text-color);margin:0 6px 4px 0;" -%}
                  {%- set pills = namespace(v='') -%}
                  {%- if badge.points_multiplier | float(default=0) > 0 -%}
                    {%- set pills.v = pills.v ~ "<span style='" ~ pill_style ~ "'>⚡ ×" ~ ('%g' | format(badge.points_multiplier | float(default=0) | round(2))) ~ "</span>" -%}
                  {%- endif -%}
                  {%- if badge.award_points | float(default=0) > 0 -%}
                    {%- set pills.v = pills.v ~ "<span style='" ~ pill_style ~ "'>+" ~ ('%g' | format(badge.award_points | float(default=0) | round(2))) ~ " <ha-icon icon='" ~ points_icon ~ "' style='width:12px;height:12px;--mdc-icon-size:12px;color:var(--primary-color);'></ha-icon></span>" -%}
                  {%- endif -%}
                  {%- if badge.award_bonuses | length > 0 -%}
                    {%- set pills.v = pills.v ~ "<span style='" ~ pill_style ~ "'>✨ " ~ ui.get('bonus', 'Bonus') ~ (' ×' ~ (badge.award_bonuses | length) if badge.award_bonuses | length > 1 else '') ~ "</span>" -%}
                  {%- endif -%}
                  {%- if badge.award_rewards | length > 0 -%}
                    {%- set pills.v = pills.v ~ "<span style='" ~ pill_style ~ "'>🎁 " ~ ui.get('reward', 'Reward') ~ (' ×' ~ (badge.award_rewards | length) if badge.award_rewards | length > 1 else '') ~ "</span>" -%}
                  {%- endif -%}
                  {%- set last_earned = (ns.m_last_awarded if is_current and ns.m_last_awarded else badge.last_awarded) | string | regex_replace('T.*$', '') -%}
                  {%- set foot = [] -%}
                  {%- if badge.earned and last_earned | length > 0 -%}
                    {%- set foot = foot + ['🕒 ' ~ last_earned] -%}
                  {%- endif -%}
                  {%- if is_current -%}
                    {%- set foot = foot + ['🥇 ' ~ ns.m_award_count] -%}
                  {%- endif -%}
                  {%- set ring_inner = "<div style='width:40px;height:40px;border-radius:50%;background:var(--card-background-color);display:flex;align-items:center;justify-content:center;'><ha-icon icon='" ~ badge.icon ~ "' style='width:24px;height:24px;--mdc-icon-size:24px;color:" ~ accent ~ ";'></ha-icon></div>" -%}
                  {%- set ring = "<div style='flex:0 0 auto;width:" ~ ('58px' if is_current else '50px') ~ ";height:" ~ ('58px' if is_current else '50px') ~ ";border-radius:50%;background:conic-gradient(" ~ (prog_color if show_bar else accent) ~ " " ~ pct ~ "%, var(--divider-color) 0);display:flex;align-items:center;justify-content:center;'>" ~ ring_inner ~ "</div>" -%}
                  {%- set top = "<div style='display:flex;align-items:center;gap:12px;'>" ~ ring
                      ~ "<div style='flex:1;min-width:0;text-align:left;'>"
                      ~ "<div style='font-size:10px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:" ~ accent ~ ";'>" ~ role_label ~ "</div>"
                      ~ "<div style='display:flex;justify-content:space-between;align-items:center;gap:8px;'><span style='font-size:" ~ ('18px' if is_current else '15px') ~ ";font-weight:800;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" ~ bname ~ "</span><span style='flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:0.6px;padding:2px 8px;border-radius:999px;color:" ~ accent ~ ";border:1px solid " ~ accent ~ ";'>" ~ (pill_text | upper) ~ "</span></div>"
                      ~ "<div style='margin-top:2px;font-size:11px;color:var(--secondary-text-color);'>🎯 " ~ ui.get('threshold', 'Threshold') ~ ": " ~ (format_points(badge.threshold, pref_points_precision) | trim) ~ ' ' ~ ns.points_label ~ "</div>"
                      ~ "</div></div>" -%}
                  {%- set desc_row = ("<div style='margin-top:8px;font-size:11px;line-height:1.3;color:var(--secondary-text-color);text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;'>" ~ bdesc ~ "</div>") if bdesc | length > 0 else '' -%}
                  {%- set bar = ("<div style='margin-top:10px;'><div style='display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;color:var(--secondary-text-color);'><span>" ~ prog_label ~ "</span><span style='color:var(--primary-text-color);'>" ~ prog_value ~ "</span></div><div style='margin-top:4px;display:flex;align-items:center;gap:8px;'><div style='flex:1;height:10px;background:var(--divider-color);border-radius:999px;overflow:hidden;'><div style='width:" ~ pct ~ "%;min-width:" ~ ('10px' if pct > 0 else '0') ~ ";height:100%;background:" ~ prog_color ~ ";border-radius:999px;'></div></div><span style='font-size:11px;font-weight:700;color:var(--secondary-text-color);'>" ~ pct ~ "%</span></div><div style='margin-top:4px;font-size:12px;text-align:left;'>" ~ prog_note ~ "</div></div>") if show_bar else '' -%}
                  {%- set pill_row = ("<div style='margin-top:8px;text-align:left;'>" ~ pills.v ~ "</div>") if pills.v | length > 0 else '' -%}
                  {%- set foot_row = ("<div style='margin-top:2px;font-size:10px;font-weight:600;color:var(--secondary-text-color);text-align:left;'>" ~ (foot | join(' &nbsp;•&nbsp; ')) ~ "</div>") if foot | length > 0 else '' -%}
                  {{
                    {
                      'type': 'custom:button-card',
                      'entity': badge.entity_id,
                      'show_name': false,
                      'show_icon': false,
                      'show_state': false,
                      'tap_action': {'action': 'more-info'},
                      'custom_fields': {'content': "<div style='width:100%;'>" ~ top ~ desc_row ~ bar ~ pill_row ~ foot_row ~ "</div>"},
                      'styles': {
                        'card': [
                          {'padding': '14px 16px'},
                          {'border-radius': '16px'},
                          {'background-color': 'var(--card-background-color)'},
                          {'border': ('1px solid ' ~ accent) if is_current else '1px solid var(--divider-color)'},
                          {'border-left': '4px solid ' ~ accent},
                          {'opacity': '1.0' if badge.earned else '0.85'},
                          {'box-shadow': '0 2px 6px rgba(0,0,0,0.08)' if is_current else 'none'}
                        ],
                        'grid': [{'grid-template-areas': '"content"'}, {'grid-template-columns': '1fr'}],
                        'custom_fields': {'content': [{'width': '100%'}, {'justify-self': 'stretch'}]}
                      }
                    }
                  }},
                {%- endfor -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
